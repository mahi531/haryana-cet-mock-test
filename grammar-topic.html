<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174b7e"><title>Tense | HSSC Mock Test Wala</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4eee8;color:#252525;font-family:Georgia,"Noto Serif Devanagari","Mangal",serif;line-height:1.7}
header{background:#fff;border-bottom:4px double #222;padding:18px 14px;text-align:center}header h1{font-size:25px;letter-spacing:1px;margin:0}header p{font:13px Arial,sans-serif;margin:4px 0 0;color:#555}
nav{max-width:850px;margin:12px auto;padding:0 12px;display:flex;flex-wrap:wrap;gap:8px}nav a,.btn{font: bold 13px Arial,sans-serif;text-decoration:none;color:#173f67;background:#fff;border:1px solid #aeb8c2;padding:8px 12px;border-radius:5px;cursor:pointer}
main{max-width:850px;margin:0 auto 40px;padding:0 12px}
.sheet{background:#fff;margin:14px 0;padding:25px 30px;border:1px solid #ddd;box-shadow:0 3px 14px #0000000a}
.chapter{display:flex;align-items:center;gap:12px;border-bottom:5px double #222;padding-bottom:8px;margin-bottom:18px}
.chapter .num{background:#222;color:#fff;padding:2px 12px;font-size:22px;font-weight:bold}
.chapter h2{font-size:22px;text-transform:uppercase;margin:0;line-height:1.3}
h3{font-size:17px;margin:18px 0 8px;text-decoration:underline;text-underline-offset:4px}
.lead{font-size:16px;font-weight:bold;margin:12px 0}
.arrow{margin:8px 0;padding-left:4px;font-size:15px}
.en{font-family:Georgia,serif;font-size:15px;font-weight:bold;color:#182f49}
.hi{font-size:14px;color:#3e3e3e}
.formula{background:#f7f8fa;border-left:3px solid #607d9a;padding:10px 14px;margin:8px 0;font-family:Arial,sans-serif;font-size:14px}
.formula div{padding:4px 0;border-bottom:1px dotted #ccc}.formula div:last-child{border:0}
.example{margin:9px 0;padding:8px 12px;border-bottom:1px dotted #bbb}
.tip{margin:12px 0;padding:9px 12px;background:#fff9e9;border-left:3px solid #c28c24;font-size:14px}
.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toc a{padding:9px;background:#f7f8fa;border:1px solid #d9dfe5;color:#183d62;text-decoration:none;font-size:14px;border-radius:4px}
.practice-head{text-align:center;border-top:2px solid #222;border-bottom:2px solid #222;padding:10px;margin-bottom:14px}
.qcard{padding:16px 0;border-bottom:1px solid #bbb}.qtitle{font-weight:bold;font-size:16px;color:#173f67}
.fullq{font-size:15px;background:#fafafa;padding:10px;margin:8px 0;border:1px solid #e1e1e1}
.part{display:inline}.part sup{font-size:11px;font-weight:bold;color:#173f67}
.ask{font-weight:bold;margin:10px 0 5px}
.option{display:block;padding:8px 10px;border:1px solid #ddd;margin:6px 0;border-radius:4px;font-size:14px;background:#fff}
.option input{margin-right:8px}.option:has(input:checked){background:#edf4fa;border-color:#6385a5}
.explain{display:none;margin-top:12px;padding:12px;border:1px solid #c9d4df;background:#f7fafc;font-size:14px}
.explain.show{display:block}.right{color:#176b45;font-weight:bold}.wrong{color:#a52d2d;font-weight:bold}
.small{font:12px Arial,sans-serif;color:#666}.score{position:sticky;bottom:0;background:#fff;border:1px solid #aaa;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:600px){.sheet{padding:19px 16px}.chapter h2{font-size:18px}.toc{grid-template-columns:1fr}header h1{font-size:21px}}
@media print{body{background:white}.sheet{box-shadow:none;border:0;page-break-after:always;margin:0}.score,nav{display:none}.explain{display:block}}
</style></head><body>
<header><h1 id="topicTitle">CHAPTER 2 — TENSE</h1><p>हिंदी में समझें • English Examples • Rules • Practice</p></header>
<nav><a href="english-grammar.html">← सभी Grammar Topics</a><a href="vocabulary.html">Vocabulary & Grammar</a><button class="btn" onclick="window.print()">Print / Save PDF</button></nav>
<main id="app"><section class="sheet">सामग्री लोड हो रही है…</section></main>
<script>
(async()=>{
const app=document.getElementById('app'),topic=new URLSearchParams(location.search).get('topic')||'tense';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sheet=(n,title,body)=>`<section class="sheet"><div class="chapter"><span class="num">${n}</span><h2>${esc(title)}</h2></div>${body}</section>`;
try{
 const res=await fetch(topic+'.json?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('JSON file नहीं मिली');
 const d=await res.json();document.getElementById('topicTitle').textContent='CHAPTER 2 — '+d.topic_name.toUpperCase();document.title=d.topic_name+' | HSSC Mock Test Wala';
 let out='';
 const ov=d.overview||{};
 let intro=`<p class="lead">${esc(ov.definition_hi||'Tense किसी कार्य के समय एवं अवस्था को व्यक्त करता है।')}</p>
 <div class="arrow">➤ Tense के तीन मुख्य भाग हैं — <b>Present, Past और Future</b>।</div>
 <div class="arrow">➤ प्रत्येक के चार उप-विभाजन हैं — <b>Indefinite, Continuous, Perfect और Perfect Continuous</b>।</div>
 <h3>तीन मुख्य प्रकार</h3><div class="toc"><a href="#present">➤ PRESENT</a><a href="#past">➤ PAST</a><a href="#future">➤ FUTURE</a></div>
 <div class="tip"><b>ध्यान दें:</b> ${esc(ov.important_note_hi||'Formula और confusing pairs पर विशेष ध्यान दें।')}</div>
 <h3>CONFUSING PAIRS</h3>${(ov.confusing_pairs||[]).map(x=>`<div class="arrow">➤ ${esc(x[0])} और ${esc(x[1])}</div>`).join('')}`;
 out+=sheet('02','TENSE — परिचय',intro);
 if(d.teaching_notes){d.teaching_notes.forEach((s,i)=>{out+=sheet('0'+(i+1),s.heading,(s.arrows||[]).map(a=>`<div class="arrow">${esc(a)}</div>`).join(''))})}
 const rules=d.rules||[];
 const family=r=>r.id.startsWith('present')?'present':r.id.startsWith('simple_past')||r.id.startsWith('past')?'past':'future';
 const familyNames={present:'PRESENT TENSE',past:'PAST TENSE',future:'FUTURE TENSE'};
 let seen={present:false,past:false,future:false};
 rules.forEach((r,i)=>{
  const fam=family(r);let body=`<p class="lead">➤ ${esc(r.use_hi||'')}</p>`;
  if(r.forms){body+='<h3>Sentence Structure / Formula</h3><div class="formula">'+Object.entries(r.forms).map(([k,v])=>`<div><b>${esc(k.replace('_',' ').toUpperCase())}:</b> ${esc(v)}</div>`).join('')+'</div>'}
  if(r.notes_hi?.length){body+='<h3>महत्वपूर्ण नियम</h3>'+r.notes_hi.map(n=>`<div class="arrow">➤ ${esc(n)}</div>`).join('')}
  if(r.examples?.length){body+='<h3>Examples को समझिए</h3>'+r.examples.map((e,j)=>`<div class="example"><div class="en">➤ ${esc(e[0])}</div>${e[1]?`<div class="hi">अर्थ: ${esc(e[1])}</div>`:''}</div>`).join('')}
  const title=r.title;
  if(!seen[fam]){body=`<div class="tip"><b>${familyNames[fam]}</b> — नीचे इस भाग के सभी Tenses को उदाहरण सहित समझें।</div>`+body;seen[fam]=true}
  out+=`<div id="${r.id}">${sheet(String(i+1).padStart(2,'0'),title,body)}</div>`;
 });
 (d.special_rules||[]).forEach((r,i)=>{
  let body=(r.items||[]).map(x=>`<div class="arrow">➤ ${esc(x)}</div>`).join('');
  if(r.examples?.length)body+='<h3>Examples</h3>'+r.examples.map(e=>`<div class="example"><div class="en">➤ ${esc(e[0])}</div><div class="hi">${esc(e[1]||'')}</div></div>`).join('');
  out+=sheet('S'+(i+1),r.title,body);
 });
 if(d.quick_revision?.length){out+=sheet('REV','QUICK REVISION',d.quick_revision.map(x=>`<div class="arrow">➤ <b>${esc(x.tense)}</b> — ${esc(x.core)} <span class="hi">(${esc(x.signal)})</span></div>`).join(''))}
 const qs=d.practice?.questions||[];
 if(qs.length){
  let qbody=`<div class="practice-head"><b>EXERCISE — SPOTTING THE ERROR</b><br>${esc(d.practice.instructions_hi||'प्रत्येक वाक्य में त्रुटि वाला भाग चुनें।')}<br><span class="small">कुल प्रश्न: ${qs.length}</span></div>`;
  qbody+=qs.map((q,i)=>{
    const parts=(q.parts||[]).slice(0,3);
    const full=parts.map((x,j)=>`<span class="part"><sup>(${ 'abc'[j] })</sup> ${esc(x)}</span>`).join(' ');
    const options=parts.map((x,j)=>`<label class="option"><input type="radio" name="q${i}" value="${'abc'[j]}"><b>(${ 'ABC'[j] })</b> ${esc(x)}</label>`).join('')+
      `<label class="option"><input type="radio" name="q${i}" value="d"><b>(D)</b> No error — कोई गलती नहीं</label>`;
    return `<div class="qcard" data-answer="${esc(q.answer)}" data-exp="${esc(q.explanation_hi||'')}"><div class="qtitle">प्रश्न ${esc(q.number||i+1)}.</div><div class="fullq">${full}.</div><div class="ask">वाक्य के किस भाग में गलती है?</div>${options}<button class="btn reveal" type="button">उत्तर और विस्तृत व्याख्या देखें</button><div class="explain" aria-live="polite"></div></div>`;
  }).join('');
  qbody+=`<div class="score"><b id="score">अभी तक सही: 0</b><button class="btn" id="reset">Practice दोबारा करें</button></div>`;
  out+=sheet('P','PRACTICE QUESTIONS',qbody);
 }
 app.innerHTML=out;
 let score=0,done=new Set();
 document.querySelectorAll('.reveal').forEach(btn=>btn.addEventListener('click',()=>{
  const card=btn.closest('.qcard'),sel=card.querySelector('input:checked'),box=card.querySelector('.explain');
  if(!sel){box.innerHTML='<span class="wrong">पहले A, B, C या D में से कोई विकल्प चुनें।</span>';box.classList.add('show');return}
  const key=card.dataset.answer,ok=sel.value===key,n=card.querySelector('.qtitle').textContent;
  if(!done.has(n)){done.add(n);if(ok)score++}
  const correct=key==='d'?'D — No error':`(${key.toUpperCase()})`;
  box.innerHTML=`<div class="${ok?'right':'wrong'}">${ok?'✓ आपका उत्तर सही है':'✗ आपका उत्तर गलत है'}</div><p><b>सही उत्तर:</b> ${correct}</p><p><b>व्याख्या:</b> ${esc(card.dataset.exp)}</p>`;
  box.classList.add('show');document.getElementById('score').textContent=`सही उत्तर: ${score} / ${done.size} हल किए गए`;
 }));
 document.getElementById('reset')?.addEventListener('click',()=>{document.querySelectorAll('.qcard input').forEach(x=>x.checked=false);document.querySelectorAll('.explain').forEach(x=>{x.classList.remove('show');x.innerHTML=''});score=0;done.clear();document.getElementById('score').textContent='अभी तक सही: 0'});
}catch(e){app.innerHTML=`<section class="sheet"><h2>सामग्री नहीं खुली</h2><p>${esc(e.message)}</p><p>जाँचें कि ${esc(topic)}.json इसी folder में है।</p></section>`}
})();
</script></main></body></html>
