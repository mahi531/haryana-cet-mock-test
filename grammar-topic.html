<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1769e0"><title>Tense | HSSC Mock Test Wala</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,"Noto Sans Devanagari",sans-serif}header{background:linear-gradient(120deg,#153d70,#1684c7);color:white;padding:22px 15px;text-align:center}header h1{margin:0 0 6px}main{max-width:900px;margin:18px auto;padding:0 13px 40px}.btn{display:inline-block;text-decoration:none;border:0;border-radius:9px;padding:10px 13px;margin:4px;background:#e5edf9;color:#174477;font-weight:bold}.card{background:white;border:1px solid #dce4ef;border-radius:13px;padding:16px;margin:13px 0;line-height:1.65}.card h2{color:#174477;margin:0 0 9px;font-size:20px}.card h3{margin:14px 0 6px}.formula{background:#f1f6ff;padding:10px;border-radius:9px;white-space:pre-wrap}.example{padding:7px 0;border-bottom:1px dashed #ddd}.q{border-top:1px solid #e5e7eb;padding:13px 0}.opt{display:block;padding:8px;margin:6px 0;background:#f6f8fb;border-radius:8px}.opt input{margin-right:8px}.feedback{font-weight:bold;margin-top:7px}.muted{color:#64748b;font-size:13px}
</style></head><body><header><h1 id="topicTitle">English Grammar</h1><div>नियम • Formula • उदाहरण • Practice</div></header><main><a class="btn" href="english-grammar.html">← सभी Grammar Topics</a><a class="btn" href="vocabulary.html">Vocabulary & Grammar</a><div id="content"><div class="card">सामग्री लोड हो रही है…</div></div></main>
<script>
(async()=>{const root=document.getElementById('content');const id=new URLSearchParams(location.search).get('topic')||'tense';try{const res=await fetch(id+'.json?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('JSON file नहीं मिली');const d=await res.json();document.title=d.topic_name+' | HSSC Mock Test Wala';document.getElementById('topicTitle').textContent=d.topic_name;
let out=`<section class="card"><h2>${esc(d.topic_name)}</h2><p>${esc(d.overview?.definition_hi||'')}</p><p><b>मुख्य प्रकार:</b> ${esc((d.overview?.main_types||[]).join(' • '))}</p><p><b>उप-विभाजन:</b> ${esc((d.overview?.sub_types||[]).join(' • '))}</p><p class="muted">इस पेज पर दिए गए नियम और प्रश्न आपकी उपलब्ध कराई गई सामग्री पर आधारित हैं।</p></section>`;
if(d.quick_revision?.length){out+='<section class="card"><h2>Quick Revision</h2>'+d.quick_revision.map(x=>`<p><b>${esc(x.tense)}</b> — ${esc(x.core)}<br><span class="muted">${esc(x.signal)}</span></p>`).join('')+'</section>'}
for(const r of d.rules||[]){out+=`<section class="card"><h2>${esc(r.title)}</h2><p>${esc(r.use_hi||'')}</p>${r.forms?'<h3>Formula</h3><div class="formula">'+Object.entries(r.forms).map(([k,v])=>esc(k.toUpperCase()+': '+v)).join('\n')+'</div>':''}${r.notes_hi?.length?'<h3>ध्यान दें</h3><ul>'+r.notes_hi.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${r.examples?.length?'<h3>Examples</h3>'+r.examples.map(e=>`<div class="example"><b>${esc(e[0])}</b><br>${esc(e[1]||'')}</div>`).join(''):''}</section>`}
for(const s of d.special_rules||[]){out+=`<section class="card"><h2>${esc(s.title)}</h2>${s.items?.length?'<ul>'+s.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${s.examples?.length?s.examples.map(e=>`<p><b>${esc(e[0])}</b><br>${esc(e[1])}</p>`).join(''):''}</section>`}
const qs=d.practice?.questions||[];if(qs.length){out+=`<section class="card"><h2>Practice Test (${qs.length} प्रश्न)</h2><p>${esc(d.practice.instructions_hi||'सही विकल्प चुनें।')}</p><div id="quiz">${qs.map((q,i)=>`<div class="q" data-answer="${esc(q.answer)}" data-explain="${esc(q.explanation_hi||'')}"><b>Q${q.number||i+1}.</b><br>${q.parts.map((p,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${'abcd'[j]}">(${ 'abcd'[j] }) ${esc(p)}</label>`).join('')}<button class="btn check">उत्तर जाँचें</button><div class="feedback"></div></div>`).join('')}</div><h3 id="score"></h3></section>`}
root.innerHTML=out;document.querySelectorAll('.check').forEach(b=>b.addEventListener('click',()=>{const q=b.closest('.q'),chosen=q.querySelector('input:checked'),f=q.querySelector('.feedback');if(!chosen){f.textContent='पहले विकल्प चुनें।';f.style.color='#a16207';return}const ok=chosen.value===q.dataset.answer;f.textContent=(ok?'सही उत्तर! ':'गलत। सही विकल्प: '+q.dataset.answer.toUpperCase()+'. ')+(q.dataset.explain||'');f.style.color=ok?'#15803d':'#b91c1c'}));
}catch(e){root.innerHTML='<section class="card"><h2>सामग्री लोड नहीं हुई</h2><p>'+esc(e.message)+'</p><p>जाँचें कि tense.json इसी फ़ोल्डर में अपलोड है और नाम बिल्कुल tense.json है।</p></section>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
})();
</script></body></html>
