<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b68">
<title>चरखी दादरी जिला — GK Quiz (Updated 2026) | HSSC Mock Test Wala</title>
<style>
:root{--blue:#173b68;--blue2:#245a94;--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--green:#16834a;--red:#c73535;--line:#dbe3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Devanagari",sans-serif;color:var(--ink);line-height:1.6}
.wrap{max-width:850px;margin:18px auto;padding:10px}
.hero{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;padding:22px 16px;text-align:center;border-radius:15px;margin-bottom:15px}
.hero h1{font-size:24px;margin:0 0 5px}
.hero p{margin:0;font-size:14px;opacity:.92}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 0}
.pill{background:#ffffff20;border:1px solid #ffffff40;border-radius:20px;padding:5px 10px;font-size:12px}
.toolbar{display:flex;align-items:center;gap:12px;background:#fff;padding:12px;border:1px solid var(--line);border-radius:12px;margin:12px 0}
#counter{font-weight:700;color:var(--blue);white-space:nowrap}
.small{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#e7edf5;border-radius:20px;overflow:hidden;flex:1;min-width:80px}
.bar{height:100%;width:0;background:#26966a;transition:width .2s}
.question{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #152b4810}
.qtop{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.qtext{font-size:19px;font-weight:700;margin:12px 0}
.option{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:8px 0;padding:12px;border-radius:11px;font-size:16px;cursor:pointer;line-height:1.5}
.option .letter{flex:0 0 27px;height:27px;border-radius:50%;background:#edf2f8;display:grid;place-items:center;font-weight:700;color:#25496d}
.option.correct{border:2px solid var(--green);background:#eaf8ef}
.option.wrong{border:2px solid var(--red);background:#fff0f0}
.option:disabled{cursor:default;opacity:1}
.feedback{margin-top:13px;padding:14px;border-radius:12px;background:#edf3fa;border-left:4px solid var(--blue)}
.feedback.good{background:#eaf8ef;border-color:var(--green)}
.feedback.bad{background:#fff0f0;border-color:var(--red)}
.feedback strong{display:block;margin-bottom:5px;font-size:16px}
.facts-box{margin-top:12px;padding:10px 12px;background:#ffffffb8;border:1px solid #d5e0ec;border-radius:10px}
.facts-title{font-weight:700;color:var(--blue);font-size:14.5px;margin-bottom:6px}
.facts-list{margin:0;padding-left:18px;font-size:14px;color:#1e293b}
.facts-list li{margin-bottom:5px;line-height:1.55}
.facts-list li:last-child{margin-bottom:0}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:650}
.btn-light{background:#eaf0f7;color:#183654}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.result{background:#fff;border:1px solid var(--line);border-radius:14px;text-align:center;padding:20px;margin-top:14px}
.score{font-size:40px;font-weight:800;color:var(--blue)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:520px){
  .wrap{padding:10px}
  .hero h1{font-size:21px}
  .qtext{font-size:17px}
  .question{padding:13px}
  .actions button{flex:1;padding:11px 8px}
  .facts-list{font-size:13.5px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>चरखी दादरी जिला — विस्तृत GK Quiz</h1>
    <p>HSSC CET • Group C • Group D • अपडेटेड हरियाणा सामान्य ज्ञान (2026)</p>
    <div class="stats">
      <span class="pill">76 प्रश्न</span>

      <span class="pill">Exam-Oriented Facts</span>

  </header>

  <section class="toolbar">
    <div>
      <b id="counter">प्रश्न 1 / 76</b>

    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <button class="btn-light" id="restart">रीस्टार्ट</button>
  </section>

  <section class="question" id="quiz">
    <div class="qtop">

      <span id="qno">प्रश्न 1</span>
    </div>
    <div class="qtext" id="question"></div>
    <div id="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="actions">
      <button class="btn-light" id="prev">पिछला प्रश्न</button>
      <button id="next">अगला प्रश्न</button>
    </div>
  </section>

  <section class="result hidden" id="result">
    <h2>आपका परिणाम</h2>
    <div class="score" id="score"></div>
    <p id="summary"></p>
    <button id="review">प्रश्नों की समीक्षा करें</button>
  </section>

  <div class="footer">HSSC Mock Test Wala • चरखी दादरी जिला GK (2026 Updated)</div>
</main>

let pos = 0, answers = {};
const $ = id => document.getElementById(id);

function render() {
  const q = QUESTIONS[pos], chosen = answers[pos];
  $('counter').textContent = `प्रश्न ${pos + 1} / ${QUESTIONS.length}`;
  $('qno').textContent = `प्रश्न ${pos + 1}`;
  $('question').textContent = q.q;
  $('options').innerHTML = '';

  q.opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'option';
    b.disabled = chosen !== undefined;
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = 'ABCD'[i];
    const txt = document.createElement('span');
    txt.textContent = opt;
    b.append(letter, txt);

    if (chosen !== undefined) {
      if (i === q.a) b.classList.add('correct');
      else if (i === chosen) b.classList.add('wrong');
    }
    b.onclick = () => {
      if (answers[pos] !== undefined) return;
      answers[pos] = i;
      render();
    };
    $('options').appendChild(b);
  });

  const fb = $('feedback');
  if (chosen !== undefined) {
    fb.className = 'feedback ' + (chosen === q.a ? 'good' : 'bad');
    fb.innerHTML = '';

    const status = document.createElement('strong');
    status.textContent = chosen === q.a ? '✓ बिल्कुल सही उत्तर!' : '✗ आपका उत्तर गलत है';

    const ansDiv = document.createElement('div');
    ansDiv.innerHTML = '<b>सही उत्तर: </b>';
    const ansSpan = document.createElement('span');
    ansSpan.textContent = q.opts[q.a];
    ansDiv.appendChild(ansSpan);

    const expDiv = document.createElement('div');
    expDiv.style.marginTop = '7px';
    expDiv.innerHTML = '<b>व्याख्या: </b>';
    const expSpan = document.createElement('span');
    expSpan.textContent = q.exp;
    expDiv.appendChild(expSpan);

    fb.append(status, ansDiv, expDiv);

    if (Array.isArray(q.facts) && q.facts.length > 0) {
      const box = document.createElement('div');
      box.className = 'facts-box';

      const title = document.createElement('div');
      title.className = 'facts-title';
      title.textContent = '📌 परीक्षा उपयोगी अतिरिक्त तथ्य (Updated 2026):';

      const ul = document.createElement('ul');
      ul.className = 'facts-list';
      q.facts.forEach(fact => {
        const li = document.createElement('li');
        li.textContent = fact;
        ul.appendChild(li);
      });

      box.append(title, ul);
      fb.appendChild(box);
    }
  } else {
    fb.className = 'feedback hidden';
    fb.textContent = '';
  }

  $('prev').disabled = pos === 0;
  $('next').textContent = pos === QUESTIONS.length - 1 ? 'परिणाम देखें' : 'अगला प्रश्न';

  const done = Object.keys(answers).length;
  $('answered').textContent = `हल किए: ${done} / ${QUESTIONS.length}`;
  $('bar').style.width = (done / QUESTIONS.length * 100) + '%';
  $('quiz').classList.remove('hidden');
  $('result').classList.add('hidden');
}

function showResult() {
  const done = Object.keys(answers).length;
  const right = QUESTIONS.filter((q, i) => answers[i] === q.a).length;
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('score').textContent = `${right} / ${QUESTIONS.length}`;
  $('summary').textContent = `हल किए: ${done}, सही: ${right}, गलत: ${done - right}, छोड़े: ${QUESTIONS.length - done}। प्रतिशत: ${(right / QUESTIONS.length * 100).toFixed(1)}%`;
}

$('prev').onclick = () => { if (pos > 0) { pos--; render(); window.scrollTo(0, 0); } };
$('next').onclick = () => { if (pos < QUESTIONS.length - 1) { pos++; render(); window.scrollTo(0, 0); } else showResult(); };
$('restart').onclick = () => { answers = {}; pos = 0; render(); window.scrollTo(0, 0); };
$('review').onclick = () => { pos = 0; render(); window.scrollTo(0, 0); };

render();
</script>
