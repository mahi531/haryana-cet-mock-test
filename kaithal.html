<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>कैथल जिला GK Quiz (Updated 2026) | HSSC Mock Test Wala</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#142238;--muted:#637083;--blue:#174a82;--line:#dce4ee;--green:#16834a;--red:#c33434}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.58}
.wrap{max-width:850px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#12345a,#2872a8);color:#fff;border-radius:18px;padding:22px 18px;margin:4px 0 14px;text-align:center}
.hero h1{margin:0 0 6px;font-size:25px}
.hero p{margin:0;color:#e6f1ff;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.pill{background:#ffffff20;border:1px solid #ffffff45;padding:6px 10px;border-radius:20px;font-size:12.5px}
.toolbar,.panel,.question{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.progress{height:8px;background:#e6edf5;border-radius:10px;overflow:hidden;flex:1;min-width:120px}
.bar{height:100%;background:#26966a;width:0;transition:width .2s}
.small{font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}
.btn-light{background:#eaf0f7;color:#183654}
button:disabled{opacity:.45;cursor:not-allowed}
.question{padding:17px;box-shadow:0 2px 8px #12345a10}
.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.qtext{font-size:18.5px;font-weight:700;margin:12px 0}
.option{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:8px 0;padding:12px;border-radius:11px;font-weight:500;font-size:15.5px}
.option .letter{flex:0 0 27px;height:27px;border-radius:50%;background:#edf2f8;display:grid;place-items:center;font-weight:700;color:#25496d}
.option.correct{border:2px solid var(--green);background:#eaf8ef}
.option.wrong{border:2px solid var(--red);background:#fff0f0}
.option:disabled{cursor:default;opacity:1}
.feedback{margin-top:13px;padding:14px;border-radius:12px;background:#edf3fa;border-left:4px solid var(--blue)}
.feedback.good{background:#eaf8ef;border-color:var(--green)}
.feedback.bad{background:#fff0f0;border-color:var(--red)}
.feedback strong{display:block;margin-bottom:5px;font-size:16px}
.facts-box{margin-top:12px;padding:11px 13px;background:#ffffffc7;border:1px solid #d5e0ec;border-radius:10px}
.facts-title{font-weight:700;color:var(--blue);font-size:14.5px;margin-bottom:6px}
.facts-list{margin:0;padding-left:18px;font-size:14px;color:#1e293b}
.facts-list li{margin-bottom:5px;line-height:1.55}
.facts-list li:last-child{margin-bottom:0}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.actions button{flex:1}
.hidden{display:none!important}
.result{text-align:center;padding:20px}
.score{font-size:40px;font-weight:800;color:var(--blue)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:520px){
  .wrap{padding:10px}
  .hero h1{font-size:21px}
  .qtext{font-size:17px}
  .question{padding:13px}
  .facts-list{font-size:13.5px}
}
</style>
</head>

<main class="wrap">
  <header class="hero">
    <h1>कैथल जिला — विस्तृत GK Quiz</h1>

    <div class="stats">
      <span class="pill" id="totalPill">72 यूनिक प्रश्न</span>
      <span class="pill">2026 अपडेटेड डेटा</span>

    </div>

    <div>
      <b id="counter">प्रश्न 1 / 72</b>
      <div class="small" id="answered">हल किए: 0</div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <button class="btn-light" id="restart">रीस्टार्ट</button>

  <div class="footer">HSSC Mock Test Wala • कैथल जिला GK (2026 Updated)</div>
</main>

<script>
const QUESTIONS = [
  {"q":"कैथल जिले की स्थापना किस तिथि को और किस जिले से अलग करके की गई थी?","opts":["15 जुलाई 1997","1 नवंबर 1989","23 जनवरी 1973","1 नवंबर 1966"],"a":1,"exp":"कैथल जिले की स्थापना 1 नवंबर 1989 को करनाल (व कुरुक्षेत्र के कुछ भाग) से अलग करके की गई थी।","facts":["1 नवंबर 1989 को हरियाणा में एक साथ 4 नए जिले बने थे: कैथल, पानीपत, रेवाड़ी और यमुनानगर (शॉर्ट ट्रिक: कृपा/KRPY)।","उस समय हरियाणा के मुख्यमंत्री चौधरी देवीलाल थे।","वर्तमान (2026) में हरियाणा में कुल 23 जिले हैं; 22 दिसंबर 2025 को 'हांसी' राज्य का 23वाँ (नवीनतम) जिला अधिसूचित किया गया।","कैथल प्रशासनिक रूप से करनाल मंडल (Division) और करनाल पुलिस रेंज के अंतर्गत आता है।","कैथल के वाहन पंजीकरण कोड HR-08 (कैथल), HR-09 (गुहला) और HR-83 (कलायत) हैं।"]},
  {"q":"पुराणों एवं महाभारत की मान्यता के अनुसार कैथल शहर की स्थापना किसके द्वारा की गई थी?","opts":["राजा युधिष्ठिर","राजा परीक्षित","राजा हर्षवर्धन","राजा जनमेजय"],"a":0,"exp":"पौराणिक मान्यता के अनुसार महाभारत युग में पांडवों के ज्येष्ठ भ्राता राजा युधिष्ठिर ने (तथा एक अन्य मत में महर्षि कपिल मुनि ने) कैथल की स्थापना की थी।","facts":["कैथल को महाभारत काल में पांडवों द्वारा स्थापित 48 कोस कुरुक्षेत्र भूमि के प्रमुख प्राचीन नगरों में गिना जाता है।","ऐतिहासिक कैथल नगर को प्राचीन काल में 'सात तालाबों और आठ द्वारों' से घिरा हुआ नगर माना जाता था।","कैथल को भगवान हनुमान की जन्मस्थली (वानरों की भूमि) भी माना जाता है।","यहीं भगवान हनुमान की माता अंजनी को समर्पित प्रसिद्ध 'अंजनी का टीला' स्थित है।","कैथल शहर का पिन कोड 136027 है।"]},
  {"q":"महर्षि पाणिनि के ग्रंथ 'अष्टाध्यायी' में कैथल का प्राचीन नाम क्या वर्णित है?","opts":["जयंतीपुरी","अग्रोदका","कपिस्थल","इसुकार"],"a":2,"exp":"कैथल का प्राचीन नाम 'कपिस्थल' था, जिसका वर्णन महर्षि पाणिनि की अष्टाध्यायी में मिलता है।","facts":["'कपिस्थल' का शाब्दिक अर्थ 'वानरों (बंदरों) का निवास स्थान' होता है; इसी से अपभ्रंश होकर 'कैथल' नाम पड़ा।","अन्य विकल्पों में 'जयंतीपुरी' जींद का, 'अग्रोदका' अग्रोहा (हिसार) का और 'इसुकार' हिसार का प्राचीन नाम था।","कपिस्थल को भगवान हनुमान की जन्मस्थली और महर्षि कपिल मुनि से जुड़े होने के कारण 'कपिल नगरी' भी कहा जाता है।","चीनी यात्री ह्वेनसांग और फाह्यान ने कुरुक्षेत्र के साथ-साथ कैथल क्षेत्र की भी यात्रा की थी।","HSSC की परीक्षाओं में कैथल का प्राचीन नाम 'कपिस्थल' बार-बार पूछा जाता है।"]},
  {"q":"नवग्रह कुंडों की उपस्थिति के कारण हरियाणा के किस जिले को 'छोटी काशी' कहा जाता है?","opts":["भिवानी","कुरुक्षेत्र","जींद","कैथल"],"a":3,"exp":"नवग्रह कुंडों के स्नान और धार्मिक महत्व के कारण कैथल को 'हरियाणा की छोटी काशी' कहा जाता है।","facts":["ध्यान दें: 'नवग्रह कुंडों' के कारण 'कैथल' को छोटी काशी कहा जाता है, जबकि 'मंदिरों की अधिकता' के कारण 'भिवानी' को हरियाणा की छोटी काशी कहते हैं।","कैथल के अन्य प्रमुख उपनाम: 'गुरुद्वारों का शहर', 'वानरों की भूमि' और 'कपिल नगरी'।","महाभारत काल में भगवान श्रीकृष्ण ने युधिष्ठिर के हाथों नवग्रह यज्ञ करवाकर कैथल में नवग्रह कुंडों का निर्माण करवाया था।","ये नौ कुंड नौ ग्रहों—सूर्य, चंद्र, मंगल, बुध, बृहस्पति, शुक्र, शनि, राहु और केतु—को समर्पित हैं।","कुरुक्षेत्र को 'धर्मनगरी' और बेरी (झज्जर) को 'मंदिरों का गाँव' कहा जाता है।"]},
  {"q":"कैथल जिले का कुल क्षेत्रफल कितना है?","opts":["1,834 वर्ग किमी","2,317 वर्ग किमी","2,702 वर्ग किमी","2,538 वर्ग किमी"],"a":1,"exp":"आधिकारिक जिला रिकॉर्ड के अनुसार कैथल जिले का क्षेत्रफल 2,317 वर्ग किलोमीटर है।","facts":["हरियाणा का कुल क्षेत्रफल 44,212 वर्ग किमी है; कैथल इसका लगभग 5.24% हिस्सा कवर करता है।","वर्तमान (2026) में क्षेत्रफल के अनुसार हरियाणा का सबसे बड़ा जिला सिरसा (4,277 वर्ग किमी) और सबसे छोटा फरीदाबाद (741 वर्ग किमी) है।","कैथल हरियाणा के उत्तर-मध्य भाग में उपजाऊ जलोढ़ मैदानी क्षेत्र में स्थित है।","घग्घर नदी कैथल जिले के उत्तरी (गुहला-चीका) क्षेत्र से होकर गुजरती है।","कैथल में लगभग 278 राजस्व गाँव (ग्राम पंचायतें) स्थित हैं।"]},
  {"q":"भौगोलिक स्थिति के अनुसार कैथल जिले के उत्तर-पश्चिम में किस राज्य की सीमा लगती है?","opts":["पंजाब","हिमाचल प्रदेश","उत्तर प्रदेश","राजस्थान"],"a":0,"exp":"कैथल जिले के उत्तर-पश्चिमी भाग (गुहला-चीका क्षेत्र) की सीमा पंजाब राज्य (पटियाला व संगरूर जिलों) से लगती है।","facts":["कैथल की भौगोलिक सीमाएँ: उत्तर-पश्चिम में पंजाब, उत्तर-पूर्व में कुरुक्षेत्र, पूर्व में करनाल और दक्षिण में जींद जिला।","हरियाणा के कुल 7 जिले पंजाब के साथ सीमा साझा करते हैं: पंचकूला, अंबाला, कुरुक्षेत्र, कैथल, जींद, फतेहाबाद और सिरसा।","कैथल जिला केवल एक राज्य (पंजाब) के साथ अंतरराज्यीय सीमा साझा करता है।","हरियाणा के 3 जिले—रोहतक, चरखी दादरी और 23वाँ जिला हांसी—किसी अन्य राज्य की सीमा को नहीं छूते।","कैथल से होकर राष्ट्रीय राजमार्ग NH-152 (पूर्व NH-65), NH-152D (ट्रांस-हरियाणा एक्सप्रेसवे) और NH-52 गुजरते हैं।"]},
  {"q":"2011 की जनगणना के अनुसार कैथल जिले की कुल जनसंख्या और लिंगानुपात क्रमशः कितना था?","opts":["13,34,152 और 871","9,42,011 और 902","10,72,861 और 881","9,58,405 और 862"],"a":2,"exp":"2011 की जनगणना के अनुसार कैथल जिले की जनसंख्या 10,72,861 (अंतिम सारणी में 10,74,304) और लिंगानुपात 881 महिलाएँ प्रति 1,000 पुरुष था।","facts":["2011 की जनगणना के अनुसार कैथल जिले की साक्षरता दर 69.15% (जिला पोर्टल: 69.2%) थी (पुरुष: 77.98%, महिला: 59.24%)।","2011 में कैथल का जनसंख्या घनत्व 464 व्यक्ति प्रति वर्ग किमी और दशकीय वृद्धि दर (2001–2011) 13.55% थी।","जिले की लगभग 78% आबादी ग्रामीण क्षेत्रों में और 22% आबादी शहरी क्षेत्रों में निवास करती है।","2011 में संपूर्ण हरियाणा का औसत लिंगानुपात 879 और औसत साक्षरता दर 75.55% थी।","कैथल जिले के चौशाला गाँव ने प्रदेश में 'घूंघट प्रथा' के विरोध में ऐतिहासिक सामाजिक पहल की थी।"]},
  {"q":"कैथल जिले में कुल कितने उपमंडल, कितनी तहसीलें और कितनी उप-तहसीलें हैं?","opts":["2 उपमंडल, 3 तहसीलें, 2 उप-तहसीलें","4 उपमंडल, 5 तहसीलें, 1 उप-तहसील","5 उपमंडल, 6 तहसीलें, 2 उप-तहसीलें","3 उपमंडल, 4 तहसीलें, 3 उप-तहसीलें"],"a":3,"exp":"जिला प्रशासन के अनुसार कैथल में 3 उपमंडल (कैथल, गुहला, कलायत), 4 तहसीलें (कैथल, पूंडरी, कलायत, गुहला) और 3 उप-तहसीलें (राजौंद, सीवन, ढांड) हैं।","facts":["कैथल जिले में कुल 7 विकास खंड (Blocks) हैं: कैथल, गुहला, कलायत, पूंडरी, राजौंद, सीवन और ढांड।","कैथल प्रशासनिक रूप से 'करनाल मंडल' (करनाल, पानीपत और कैथल—3 जिले) का हिस्सा है, जिसे फरवरी 2017 में नया मंडल बनाया गया था।","पुलिस प्रशासन में कैथल 'करनाल पुलिस रेंज' के अंतर्गत आता है।","वर्तमान (2026) में हरियाणा में 23 जिले (23वाँ—हांसी), 6 प्रशासनिक मंडल, 5 पुलिस रेंज, 5 पुलिस कमिश्नरेट और 24 पुलिस जिले हैं।","शहरी स्थानीय निकायों में 'नगर परिषद कैथल' तथा चीका, कलायत, पूंडरी, राजौंद और सीवन में नगरपालिका समितियाँ कार्यरत हैं।"]},
  {"q":"निम्नलिखित में से कौन-सा विकल्प कैथल जिले की तीन उप-तहसीलों को दर्शाता है?","opts":["पिल्लूखेड़ा, अलेवा, उचाना","राजौंद, सीवन, ढांड","साहा, शहजादपुर, मुलाना","भट्टू कलां, भूना, जाखल"],"a":1,"exp":"राजौंद, सीवन और ढांड—ये तीनों कैथल जिले की उप-तहसीलें और विकास खंड (Blocks) हैं।","facts":["अन्य विकल्पों में पिल्लूखेड़ा व अलेवा जींद में, साहा व मुलाना अंबाला में और भट्टू कलां व भूना फतेहाबाद जिले में हैं।","ढांड क्षेत्र के फरल गाँव में प्रसिद्ध 'फल्गु का तीर्थ मेला' लगता है।","सीवन क्षेत्र में ऐतिहासिक पुरातात्विक स्थल 'थेह पोलर' स्थित है।","कैथल जिले के प्रमुख नगरों में कैथल, चीका (गुहला), पूंडरी और कलायत शामिल हैं।","उप-तहसील स्तर पर राजस्व कार्यों का संचालन नायब तहसीलदार करता है।"]},
  {"q":"कैथल जिले में कुल कितनी विधानसभा सीटें हैं और इनमें से कौन-सी अनुसूचित जाति (SC) के लिए आरक्षित है?","opts":["4 सीटें — गुहला (SC)","3 सीटें — कैथल (SC)","5 सीटें — कलायत (SC)","6 सीटें — पूंडरी (SC)"],"a":0,"exp":"कैथल जिले में कुल 4 विधानसभा सीटें हैं—गुहला SC (15), कलायत (16), कैथल (17) और पूंडरी (18)।","facts":["गुहला (चीका) कैथल जिले की एकमात्र अनुसूचित जाति (SC) आरक्षित विधानसभा सीट है।","कैथल जिले की चारों विधानसभा सीटें 'कुरुक्षेत्र लोकसभा निर्वाचन क्षेत्र' के अंतर्गत आती हैं।","2024 के 15वें हरियाणा विधानसभा चुनाव में कैथल की 4 सीटों में से 3 कांग्रेस (कैथल, गुहला, कलायत) और 1 भाजपा (पूंडरी) ने जीती।","हरियाणा विधानसभा में कुल 90 सीटें हैं, जिनमें 17 अनुसूचित जाति (SC) के लिए आरक्षित हैं।","2026 में हांसी जिला बनने के बाद सर्वाधिक विधानसभा सीटें (6-6) फरीदाबाद व सोनीपत में और सबसे कम (2-2) पंचकूला, चरखी दादरी व हांसी में हैं।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'कैथल' विधानसभा सीट से कौन निर्वाचित हुए?","opts":["लीला राम","रणदीप सिंह सुरजेवाला","आदित्य सुरजेवाला","कैलाश भगत"],"a":2,"exp":"2024 के 15वें हरियाणा विधानसभा चुनाव में कैथल सीट से कांग्रेस (INC) के युवा नेता आदित्य सुरजेवाला निर्वाचित हुए।","facts":["आदित्य सुरजेवाला ने भाजपा के निवर्तमान विधायक लीला राम गुर्जर को 8,124 मतों से पराजित किया।","वे कांग्रेस के वरिष्ठ नेता व राज्यसभा सांसद रणदीप सिंह सुरजेवाला के पुत्र हैं और 2024 विधानसभा के सबसे युवा विधायकों में शामिल हैं।","2019 के चुनाव में भाजपा के लीला राम और 2014 व 2009 में कांग्रेस के रणदीप सुरजेवाला कैथल से विधायक रहे थे।","2024 में हरियाणा में भाजपा ने 48 सीटें जीतकर लगातार तीसरी बार सरकार बनाई और कांग्रेस ने 37 सीटें जीतीं।","15वीं हरियाणा विधानसभा के अध्यक्ष हरविन्द्र कल्याण (घरौंडा) और उपाध्यक्ष डॉ. कृष्ण लाल मिड्ढा (जींद) हैं।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'पूंडरी' सीट से कौन निर्वाचित हुए?","opts":["रणधीर सिंह गोलन","दिनेश कौशिक","सुल्तान सिंह जड़ौला","सतपाल जांबा"],"a":3,"exp":"2024 के हरियाणा विधानसभा चुनाव में पूंडरी सीट से भाजपा के सतपाल जांबा निर्वाचित हुए।","facts":["सतपाल जांबा ने निर्दलीय उम्मीदवार सतबीर भाणा और कांग्रेस के सुल्तान सिंह जड़ौला को पराजित किया।","पूंडरी सीट पर लंबे समय तक निर्दलीय विधायकों (जैसे 2019 में रणधीर सिंह गोलन, 2014 में दिनेश कौशिक) के जीतने की परंपरा रही थी, जिसे 2024 में भाजपा ने तोड़ा।","2024 में कैथल जिले की 4 विधानसभा सीटों में से केवल पूंडरी सीट पर ही भाजपा को जीत मिली।","पूंडरी में प्राचीन 'पुंडरीक सरोवर' और विशाल 'गीता मंदिर' स्थित हैं।","मतदान 5 अक्टूबर 2024 को और मतगणना 8 अक्टूबर 2024 को संपन्न हुई थी।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'कलायत' और 'गुहला (SC)' सीटों से कौन निर्वाचित हुए?","opts":["कमलेश ढांडा और ईश्वर सिंह","विकास सहारण और देवेंद्र हंस","जय प्रकाश और कुलवंत बाजीगर","आदित्य सुरजेवाला और सतपाल जांबा"],"a":1,"exp":"2024 के विधानसभा चुनाव में कलायत से कांग्रेस के विकास सहारण और गुहला (SC) से कांग्रेस के देवेंद्र हंस निर्वाचित हुए।","facts":["कलायत सीट पर विकास सहारण (INC) ने भाजपा की पूर्व महिला एवं बाल विकास मंत्री कमलेश ढांडा को पराजित किया।","गुहला (SC) सीट पर देवेंद्र हंस (INC) ने भाजपा के कुलवंत बाजीगर को 22,880 मतों से हराया।","कलायत सीट से पूर्व में हिसार के वर्तमान सांसद जय प्रकाश (2014 में निर्दलीय) भी विधायक रह चुके हैं।","कैथल जिले के चारों विधानसभा क्षेत्र 'कुरुक्षेत्र लोकसभा क्षेत्र' का हिस्सा हैं।","2024 के लोकसभा चुनाव में कुरुक्षेत्र सीट से भाजपा के नवीन जिंदल सांसद निर्वाचित हुए।"]},
  {"q":"कैथल जिला किस लोकसभा निर्वाचन क्षेत्र के अंतर्गत आता है और 2024 में यहाँ से कौन सांसद निर्वाचित हुए?","opts":["कुरुक्षेत्र — नवीन जिंदल","करनाल — मनोहर लाल","अंबाला — वरुण चौधरी","सिरसा — कुमारी सैलजा"],"a":0,"exp":"कैथल जिले की चारों विधानसभा सीटें 'कुरुक्षेत्र लोकसभा क्षेत्र' में आती हैं और 2024 में भाजपा के नवीन जिंदल यहाँ से सांसद निर्वाचित हुए।","facts":["कुरुक्षेत्र लोकसभा क्षेत्र में कुल 9 विधानसभा सीटें हैं: कैथल की 4 (गुहला, कलायत, कैथल, पूंडरी), कुरुक्षेत्र की 4 (लाडवा, शाहाबाद, थानेसर, पिहोवा) और यमुनानगर की 1 (रादौर)।","2024 लोकसभा चुनाव में नवीन जिंदल ने आम आदमी पार्टी (इंडिया गठबंधन) के डॉ. सुशील गुप्ता को पराजित किया।","इससे पहले 2019 में हरियाणा के वर्तमान मुख्यमंत्री नायब सिंह सैनी कुरुक्षेत्र से सांसद निर्वाचित हुए थे।","2024 लोकसभा चुनाव में हरियाणा की कुल 10 सीटों में से 5 भाजपा और 5 कांग्रेस ने जीतीं।","हरियाणा से राज्यसभा की कुल 5 सीटें हैं।"]},
  {"q":"दिल्ली सल्तनत की पहली महिला शासिका 'रजिया सुल्तान' की हत्या 13 अक्टूबर 1240 को कहाँ हुई थी, जहाँ उनका मकबरा भी स्थित है?","opts":["पानीपत","हांसी","कैथल","करनाल"],"a":2,"exp":"सुल्तान इल्तुतमिश की पुत्री रजिया सुल्तान और उनके पति अल्तूनिया की हत्या 13 अक्टूबर 1240 को कैथल के निकट हुई थी और वहीं दोनों के मकबरे स्थित हैं।","facts":["रजिया सुल्तान (शासनकाल: 1236–1240 ई.) दिल्ली सल्तनत व मध्यकालीन भारत की पहली और एकमात्र मुस्लिम महिला शासिका थीं।","उनका विवाह भटिंडा के इक्तादार मलिक इख्तियारुद्दीन अल्तूनिया से हुआ था; दिल्ली पर पुनः अधिकार करने लौटते समय कैथल में विद्रोहियों ने उनकी हत्या कर दी।","मान्यता है कि मुगल सम्राट अकबर ने कैथल में रजिया सुल्तान की कब्र का जीर्णोद्धार/घेरा बनवाया था।","कैथल में रजिया सुल्तान का मकबरा और अल्तूनिया का मकबरा—दोनों ऐतिहासिक स्मारक स्थित हैं।","HSSC व SSC परीक्षाओं में 'रजिया सुल्तान का मकबरा कहाँ है' (कैथल) सर्वाधिक पूछे जाने वाले प्रश्नों में से एक है।"]},
  {"q":"वर्ष 1530 ईस्वी में मुगल बादशाह बाबर के विरुद्ध कैथल परगने से ऐतिहासिक विद्रोह का नेतृत्व किसने किया था?","opts":["गुलाब सिंह","भाई उदय सिंह","हसन खान मेवाती","मोहन सिंह मंडार"],"a":3,"exp":"वर्ष 1530 ईस्वी में कैथल परगने के राजपूत सरदार मोहन सिंह मंडार ने मुगल बादशाह बाबर के विरुद्ध प्रबल विद्रोह का नेतृत्व किया था।","facts":["बाबर ने इस विद्रोह को दबाने के लिए अपने सेनापति अली कुली हमदानी के नेतृत्व में 3,000 घुड़सवारों की सेना भेजी थी, जिसे मोहन सिंह मंडार ने पहले संघर्ष में पराजित कर दिया था।","बाद में बाबर ने एक और बड़ी सेना भेजकर इस विद्रोह का दमन किया और मोहन सिंह मंडार के गाँव को नष्ट करवा दिया।","हरियाणा में बाबर के विरुद्ध अन्य प्रमुख प्रतिरोधकर्ता: हसन खान मेवाती (खानवा का युद्ध, 1527) और हिसार के हामिद खान।","1526 में पानीपत के प्रथम युद्ध में इब्राहिम लोदी को हराकर बाबर ने भारत में मुगल साम्राज्य की नींव रखी थी।","HSSC परीक्षाओं में '1530 में बाबर के खिलाफ विद्रोह किसने किया' (मोहन सिंह मंडार, कैथल) बार-बार पूछा जाता है।"]},
  {"q":"ऐतिहासिक 'कैथल रियासत' की स्थापना किसके द्वारा की गई थी?","opts":["भाई उदय सिंह","भाई गुरबख्श सिंह","राजा गजपत सिंह","गुलाब सिंह"],"a":1,"exp":"कैथल रियासत की स्थापना 18वीं शताब्दी में भाई गुरबख्श सिंह द्वारा की गई थी।","facts":["भाई गुरबख्श सिंह के उत्तराधिकारी भाई देसा सिंह ने 1767 में अफगानों (अहमद शाह अब्दाली के सूबेदार) से कैथल को छीनकर स्वतंत्र रियासत को सुदृढ़ किया।","सिख गुरु हर राय जी ने भाई परिवार (भाई भगतु के वंशज) को विशेष सम्मान व आशीर्वाद दिया था, इसलिए कैथल के शासकों को 'भाई' की उपाधि से जाना जाता था।","भाई देसा सिंह के पुत्र भाई लाल सिंह ने बाद में अंग्रेजों के साथ संधि कर उनका संरक्षण स्वीकार किया।","कैथल रियासत के अंतिम और सबसे प्रसिद्ध शासक 'भाई उदय सिंह' थे (शासनकाल: 1818 से 1843 ई.)।","कैथल शहर में आज भी ऐतिहासिक 'भाई उदय सिंह का किला' (बिदक्यार झील के किनारे) स्थित है।"]},
  {"q":"कैथल रियासत के अंतिम शासक कौन थे जिनका निधन 14 मई 1843 को हुआ था और जिनके नाम पर कैथल का ऐतिहासिक किला प्रसिद्ध है?","opts":["भाई उदय सिंह","भाई लाल सिंह","भाई देसा सिंह","प्रताप सिंह"],"a":0,"exp":"भाई उदय सिंह (शासनकाल: 1818 ई. से 1843 ई.) कैथल रियासत के अंतिम शासक थे, जिनका निसंतान निधन 14 मई 1843 को हुआ।","facts":["भाई उदय सिंह को कला, साहित्य और संस्कृति का महान संरक्षक माना जाता था; प्रसिद्ध हिंदी कवि 'भाई संतोख सिंह' उनके दरबारी कवि थे।","1843 में उनके निसंतान निधन के बाद ब्रिटिश ईस्ट इंडिया कंपनी ने 'हड़प नीति' (लैप्स) के तहत कैथल रियासत को अपने राज्य में मिलाने का प्रयास किया।","इसके विरोध में 1843 में प्रसिद्ध 'कैथल का विद्रोह' भड़क उठा।","कैथल शहर के बिदक्यार झील के किनारे स्थित 'भाई उदय सिंह का किला' जिले की प्रमुख विरासत है।","कैथल जिले में ही गुहला क्षेत्र में ऐतिहासिक 'अरनौली का किला' भी स्थित है।"]},
  {"q":"वर्ष 1843 ईस्वी के ऐतिहासिक 'कैथल विद्रोह' का नेतृत्व किसने किया था?","opts":["मोहन सिंह मंडार","प्रताप सिंह व फूल सिंह","गुलाब सिंह, साहिब कौर व सूरज कौर","जोध सिंह व अजीत सिंह"],"a":2,"exp":"1843 ईस्वी में अंग्रेजों द्वारा कैथल रियासत हड़पे जाने के विरोध में गुलाब सिंह, रानी साहिब कौर और रानी सूरज कौर ने कैथल विद्रोह का नेतृत्व किया था।","facts":["भाई उदय सिंह की माता 'माई साहिब कौर' और पत्नी 'रानी सूरज कौर' ने अपने सेनापति गुलाब सिंह के साथ मिलकर अंग्रेजों के विरुद्ध कड़ा संघर्ष किया।","अंग्रेजों ने पटियाला व जींद रियासतों की मदद से इस विद्रोह को दबाकर कैथल पर अधिकार कर लिया।","हरियाणा के अन्य प्रमुख रियासती विद्रोह: जींद विद्रोह (1814, प्रताप सिंह), छछरौली विद्रोह (1818, जोध सिंह), रानियां विद्रोह (1818, जाबित खान) और लाडवा विद्रोह (1845, अजीत सिंह)।","1843 में ही ब्रिटिश सेना ने करनाल से स्थानांतरित कर 'अंबाला छावनी' की स्थापना की थी।","HSSC परीक्षाओं में 'कैथल विद्रोह कब व किसके नेतृत्व में हुआ' (1843 — गुलाब सिंह व साहिब कौर) अत्यंत महत्वपूर्ण प्रश्न है।"]},
  {"q":"कैथल जिले में स्थित प्राचीन हड़प्पा कालीन स्थल 'बालू का टिब्बा' (Balu Mound) किस फसल के प्राचीनतम साक्ष्य के लिए प्रसिद्ध है?","opts":["चाय और कॉफी","जूट और रबर","मक्का और तंबाकू","लहसुन और विविध अनाज"],"a":3,"exp":"कैथल जिले के कलायत क्षेत्र में स्थित प्राचीन हड़प्पा स्थल 'बालू का टिब्बा' से भारत में 'लहसुन' (Garlic) का प्राचीनतम पुरातात्विक साक्ष्य मिला है।","facts":["बालू (Balu) का उत्खनन कुरुक्षेत्र विश्वविद्यालय के पुरातत्वविदों (डॉ. यू.वी. सिंह व डॉ. सूरजभान) द्वारा 1978–79 से किया गया था।","यहाँ पूर्व-हड़प्पा, परिपक्व हड़प्पा और उत्तर-हड़प्पा—तीनों चरणों के प्रमाण, कच्ची ईंटों की किलेबंदी और गेहूँ, जौ, चावल व लहसुन के अवशेष मिले हैं।","कैथल जिले का दूसरा प्रसिद्ध पुरातात्विक स्थल 'थेह पोलर' (सीवन क्षेत्र) है, जहाँ से महाभारत व कुषाण कालीन अवशेष मिले हैं।","अन्य जिलों के प्रमुख हड़प्पा स्थल: राखीगढ़ी (हांसी), बनावली, कुणाल व भिरडाना (फतेहाबाद), सीसवाल (हिसार) और मिताथल (भिवानी)।","हरियाणा में सर्वाधिक चावल की किस्मों की खेती के लिए भी कैथल जिला प्रसिद्ध है।"]},
  {"q":"कैथल जिले के सीवन क्षेत्र में स्थित प्रसिद्ध पुरातात्विक स्थल कौन-सा है?","opts":["अग्रोहा टीला","थेह पोलर","खोखराकोट","नौरंगाबाद"],"a":1,"exp":"प्राचीन पुरातात्विक स्थल 'थेह पोलर' (Theh Polar) कैथल जिले के सीवन (Siwan) क्षेत्र में प्राचीन सरस्वती नदी के किनारे स्थित है।","facts":["थेह पोलर से चित्रित धूसर मृद्भांड (PGW — महाभारत काल), कुषाण कालीन (वासुदेव व कनिष्क) सिक्के, यौधेय सिक्के और गुप्तकालीन मुहरें प्राप्त हुई हैं।","मान्यता है कि इस प्राचीन बस्ती का संबंध महाभारत काल से रहा है और यहाँ से भगवान शिव व अन्य देवी-देवताओं की प्राचीन प्रतिमाएँ भी मिली हैं।","अन्य विकल्पों में अग्रोहा टीला हिसार में, खोखराकोट रोहतक में और नौरंगाबाद भिवानी जिले में स्थित हैं।","थेह पोलर भारतीय पुरातत्व सर्वेक्षण (ASI) द्वारा संरक्षित ऐतिहासिक स्थल है।","कैथल के कलायत क्षेत्र में दूसरा प्रमुख प्राचीन टीला 'बालू का टिब्बा' स्थित है।"]},
  {"q":"गुप्तोत्तर काल (7वीं–8वीं शताब्दी) का प्रसिद्ध 'प्राचीन ईंटों का मंदिर' कैथल जिले के किस कस्बे में स्थित है?","opts":["कलायत","पूंडरी","गुहला","राजौंद"],"a":0,"exp":"बिना किसी गारे/चूने के तराशी गई ईंटों से निर्मित प्रसिद्ध 'प्राचीन ईंटों का मंदिर' कैथल जिले के 'कलायत' कस्बे में स्थित है।","facts":["कलायत में नागर/गुर्जर-प्रतिहार स्थापत्य शैली में निर्मित यह ईंटों का मंदिर हरियाणा के सबसे प्राचीन सुरक्षित हिंदू मंदिरों में गिना जाता है।","मान्यता है कि इन मंदिरों का निर्माण प्राचीन राजा शालिवाहन द्वारा करवाया गया था; इनमें से दो मंदिर आज भी संरक्षित अवस्था में हैं।","कलायत में ही सांख्य दर्शन के प्रणेता 'कपिल मुनि का आश्रम व मंदिर' (कपिल मुनि तीर्थ) स्थित है।","'कपिल आयतन' (कपिल मुनि का निवास) से ही अपभ्रंश होकर इस कस्बे का नाम 'कलायत' पड़ा।","कलायत वर्तमान में कैथल जिले का एक उपमंडल (HR-83), तहसील, ब्लॉक और विधानसभा क्षेत्र है।"]},
  {"q":"सांख्य दर्शन के प्रणेता 'कपिल मुनि का प्रसिद्ध आश्रम एवं मंदिर' कैथल जिले के किस स्थान पर स्थित है?","opts":["पूंडरी","फरल","कलायत","मुंदड़ी"],"a":2,"exp":"कपिल मुनि का प्रसिद्ध आश्रम, मंदिर और पवित्र सरोवर कैथल जिले के 'कलायत' में स्थित हैं।","facts":["इसी कारण कैथल को 'कपिल नगरी' भी कहा जाता है और 'कपिल आयतन' से कलायत नाम बना।", "यहीं पर प्राचीन ईंटों का मंदिर भी स्थित है, जो ASI द्वारा संरक्षित है।","ध्यान दें: कपिल मुनि के पिता महर्षि कर्दम की तपोस्थली 'हंसडहर तीर्थ' पड़ोसी जींद जिले के नरवाना क्षेत्र में स्थित है।","कपिल मुनि को भारतीय षड्दर्शनों में सबसे प्राचीन 'सांख्य दर्शन' का संस्थापक माना जाता है।","2024 के विधानसभा चुनाव में कलायत से कांग्रेस के विकास सहारण विधायक चुने गए।"]},
  {"q":"कैथल के किस ऐतिहासिक शिव मंदिर में महाभारत काल में अर्जुन ने भगवान शिव को प्रसन्न करने हेतु तपस्या कर 'पाशुपतास्त्र' प्राप्त किया था?","opts":["अम्बेश्वर मंदिर","खंडेश्वर मंदिर","भूतेश्वर मंदिर","ग्यारह रुद्री शिव मंदिर"],"a":3,"exp":"कैथल शहर में स्थित प्रसिद्ध 'ग्यारह रुद्री शिव मंदिर' में महाभारत काल में अर्जुन ने तपस्या कर भगवान शिव से अमोघ 'पाशुपतास्त्र' प्राप्त किया था।","facts":["मान्यता है कि महाभारत युद्ध में मारे गए वीरों की आत्मा की शांति के लिए भगवान श्रीकृष्ण ने यहाँ ग्यारह रुद्रों की स्थापना करवाई थी।","यह भव्य मंदिर अपनी प्राचीन वास्तुकला और आध्यात्मिक महत्व के लिए पूरे उत्तर भारत में प्रसिद्ध है।","कैथल शहर में ही 'अम्बेश्वर मंदिर' (अम्बकेश्वर महादेव मंदिर—जहाँ पातालेश्वर महादेव विराजमान हैं) भी अत्यंत प्राचीन शिवालय है।","कैथल के मटौर गाँव में प्रतिवर्ष प्रसिद्ध 'प्राचीन खंडेश्वर मेला' लगता है।","कैथल में नवग्रह कुंड, ग्यारह रुद्री मंदिर और हनुमान वाटिका प्रमुख धार्मिक आकर्षण हैं।"]},
  {"q":"कैथल जिले में भगवान हनुमान की माता को समर्पित 'अंजनी का टीला / मंदिर' और 'हनुमान वाटिका' कहाँ स्थित हैं?","opts":["कलायत","कैथल शहर","पूंडरी","गुहला"],"a":1,"exp":"भगवान हनुमान की माता अंजनी को समर्पित प्रसिद्ध 'अंजनी का टीला' और 'हनुमान वाटिका' कैथल शहर में स्थित हैं।","facts":["पौराणिक मान्यताओं के अनुसार कैथल (कपिस्थल) को भगवान हनुमान का जन्मस्थान माना जाता है।","हनुमान वाटिका (कैथल) में भगवान हनुमान की भव्य प्रतिमा और सुंदर उद्यान निर्मित हैं।","इसी मान्यता के कारण कैथल को 'वानरों की भूमि' उपनाम से भी जाना जाता है।","हरियाणा में अन्य प्रमुख हनुमान मंदिर: इमलोटा (चरखी दादरी), पंचमुखी हनुमान मंदिर (यमुनानगर) और हनुमान जोहड़ी (भिवानी)।","हनुमान जयंती के अवसर पर कैथल के अंजनी टीला व हनुमान वाटिका में विशेष धार्मिक उत्सव होता है।"]},
  {"q":"कैथल के किस पवित्र सरोवर के बारे में मान्यता है कि इसका जल सतयुग से लेकर आज तक कभी नहीं सूखा है?","opts":["पुंडरीक सरोवर","बिदक्यार झील","फल्गु तीर्थ सरोवर","नवग्रह कुंड"],"a":0,"exp":"कैथल जिले के पूंडरी कस्बे में स्थित 'पुंडरीक सरोवर' के बारे में लोकमान्यता है कि सतयुग से लेकर आज तक इसका जल कभी समाप्त नहीं हुआ है।","facts":["इसी सरोवर के नाम पर कस्बे का नाम 'पूंडरी' पड़ा; यहाँ विशाल चबूतरों के पास भव्य 'गीता मंदिर' और शिव मंदिर (जहाँ बाबा ठंडीपुरी की समाधि है) स्थित हैं।","कुरुक्षेत्र विकास बोर्ड (KDB) द्वारा वर्ष 1987 में पुंडरीक सरोवर में 'नागहृद कुंड' का निर्माण करवाया गया था।","यहाँ प्रतिवर्ष प्रसिद्ध 'पुंडरीक का मेला' (शुक्ल दशमी को) आयोजित होता है।","पूंडरी वर्तमान में कैथल जिले की एक तहसील, विकास खंड और विधानसभा क्षेत्र है।","2024 के विधानसभा चुनाव में पूंडरी से भाजपा के सतपाल जांबा विधायक निर्वाचित हुए।"]},
  {"q":"वामन पुराण में वर्णित 'वृद्ध केदार तीर्थ' (जो कालांतर में नाम बिगड़कर प्रसिद्ध झील बन गई) कैथल में किस नाम से जानी जाती है?","opts":["पुंडरीक झील","फल्गु झील","बिदक्यार झील","कोयल झील"],"a":2,"exp":"वामन पुराण में वर्णित पवित्र 'वृद्ध केदार तीर्थ' कालांतर में नाम अपभ्रंश होकर कैथल शहर की प्रसिद्ध 'बिदक्यार झील' के नाम से जाना जाने लगा।","facts":["बिदक्यार झील कैथल शहर के मध्य स्थित एक सुंदर ऐतिहासिक झील है, जिसके किनारे 'भाई उदय सिंह का किला' स्थित है।","कैथल में हरियाणा पर्यटन निगम का प्रसिद्ध 'कोयल' (Koel) रिसोर्ट व पर्यटन स्थल स्थित है।","अन्य जिलों की प्रसिद्ध झीलें: बड़खल व सूरजकुंड (फरीदाबाद), दमदमा व सुल्तानपुर (गुरुग्राम), भिंडावास (झज्जर), चिल्ली झील (फतेहाबाद) और ब्लू बर्ड झील (हिसार)।","वामन पुराण में हरियाणा के 7 पवित्र वनों और 48 कोस कुरुक्षेत्र के तीर्थों का विशद वर्णन है।","बिदक्यार झील को पर्यटन व नौकायन केंद्र के रूप में सुंदर रूप से विकसित किया गया है।"]},
  {"q":"कैथल जिले के किस गाँव में 'फल्गु का प्रसिद्ध तीर्थ मेला' सोमवती अमावस्या के दिन लगता है?","opts":["मुंदड़ी","बाबा लदाना","मटौर","फरल"],"a":3,"exp":"कैथल जिले के ढांड क्षेत्र के 'फरल' गाँव में सोमवती अमावस्या के दिन विश्व प्रसिद्ध 'फल्गु का तीर्थ मेला' आयोजित होता है।","facts":["महाभारत व पुराणों के अनुसार प्राचीन 'फलकीवन' इसी स्थान पर दृषद्वती नदी के तट पर था, जहाँ पांडवों के वंशज राजा अधिसीम ने वर्षों तक तपस्या की थी।","इसे 'मिश्र तीर्थ' भी कहा जाता है क्योंकि महर्षि वेदव्यास ने देवताओं के लिए यहाँ सभी तीर्थों को एकत्रित किया था।","पितृपक्ष (आश्विन माह) में पड़ने वाली सोमवती अमावस्या पर यहाँ लाखों श्रद्धालु पूर्वजों का पिंडदान व स्नान करने आते हैं (इसे बिहार के गया तीर्थ के समतुल्य माना जाता है)।","ध्यान दें: 'पांडु-पिंडारा' (जींद) में भी सोमवती अमावस्या पर पिंडदान मेला लगता है।","HSSC परीक्षाओं में 'फल्गु का मेला किस गाँव में लगता है' (फरल, कैथल) अत्यंत महत्वपूर्ण प्रश्न है।"]},
  {"q":"कैथल जिले के किस गाँव में भगवान राम के पुत्रों से जुड़ा प्रसिद्ध 'लव-कुश तीर्थ' स्थित है?","opts":["फरल","मुंदड़ी","पूंडरी","सीवन"],"a":1,"exp":"कैथल जिले के 'मुंदड़ी' (मुंदरी) गाँव में प्राचीन 'लव-कुश तीर्थ' स्थित है।","facts":["मुंदड़ी गाँव में ही हरियाणा का पहला और एकमात्र राजकीय संस्कृत विश्वविद्यालय—'महर्षि वाल्मीकि संस्कृत विश्वविद्यालय' (स्थापना: 2018)—स्थापित किया गया है।","मान्यता है कि इसी क्षेत्र में महर्षि वाल्मीकि का आश्रम था, जहाँ लव और कुश ने शिक्षा प्राप्त की थी।","हरियाणा में अन्य प्रमुख तीर्थ: पुंडरीक तीर्थ (पूंडरी), कपिल मुनि तीर्थ (कलायत) और फल्गु तीर्थ (फरल)।","मुंदड़ी गाँव कैथल शहर के निकट कैथल–करनाल मार्ग पर स्थित है।","यह तीर्थ भी 48 कोस कुरुक्षेत्र परिक्रमा के महत्वपूर्ण धार्मिक स्थलों में शामिल है।"]},
  {"q":"कैथल जिले के किस गाँव में प्रसिद्ध 'देहाती मेला' और 'बाबा लदाना तीर्थ स्थल' स्थित हैं?","opts":["बाबा लदाना","मटौर","फरल","तीतरम"],"a":0,"exp":"कैथल जिले के 'बाबा लदाना' गाँव में प्रसिद्ध 'देहाती मेला' (बाबा राजपुरी की स्मृति में) और बाबा लदाना तीर्थ स्थल स्थित हैं।","facts":["यह मेला प्रतिवर्ष दशहरे के समय बड़े उत्साह से आयोजित होता है, जिसमें ग्रामीण संस्कृति, कुश्ती दंगल और लोक संगीत का आयोजन होता है।","कैथल के अन्य प्रमुख मेले: फल्गु का मेला (फरल), पुंडरीक का मेला (पूंडरी), प्राचीन खंडेश्वर मेला (मटौर) और वामन द्वादशी मेला (कैथल)।","वामन द्वादशी का मेला कैथल के अलावा अंबाला शहर में भी प्रमुखता से आयोजित होता है।","अन्य विकल्पों में तीतरम गाँव में कैथल का 'जवाहर नवोदय विद्यालय' स्थित है।","HSSC परीक्षाओं में 'देहाती मेला कहाँ लगता है' (बाबा लदाना, कैथल) बार-बार पूछा जाता है।"]},
  {"q":"कैथल जिले का कौन-सा अनूठा गुरुद्वारा है जहाँ 'श्री गुरु ग्रंथ साहिब' और 'रामायण'—दोनों पवित्र ग्रंथ एक साथ पढ़े जाते हैं?","opts":["गुरुद्वारा नीम साहिब","गुरुद्वारा मंजी साहिब","टोपियों वाला गुरुद्वारा","धमतान साहिब गुरुद्वारा"],"a":2,"exp":"कैथल शहर में स्थित ऐतिहासिक 'टोपियों वाला गुरुद्वारा' हिंदू-सिख एकता का अद्वितीय प्रतीक है, जहाँ गुरु ग्रंथ साहिब और रामायण दोनों एक साथ पढ़े जाते हैं।","facts":["कैथल शहर को अनेक ऐतिहासिक गुरुद्वारों के कारण 'गुरुद्वारों का शहर' भी कहा जाता है।","कैथल के अन्य दो प्रसिद्ध गुरुद्वारे: 'गुरुद्वारा नीम साहिब' (प्रताप गेट / डोगरा गेट के पास, गुरु तेग बहादुर जी) और 'गुरुद्वारा मंजी साहिब' (कैथल)।","इसी प्रकार जींद के नरवाना में स्थित 'धमतान साहिब गुरुद्वारा' का मेला भी हिंदू-सिख एकता का बड़ा प्रतीक है।","हरियाणा सिख गुरुद्वारा प्रबंधन कमेटी (HSGMC) राज्य के ऐतिहासिक गुरुद्वारों का प्रबंधन करती है।","HSSC परीक्षाओं में 'टोपियों वाला गुरुद्वारा कहाँ स्थित है' (कैथल) सर्वाधिक लोकप्रिय प्रश्नों में से एक है।"]},
  {"q":"कैथल के प्रताप/डोगरा गेट के निकट स्थित 'गुरुद्वारा नीम साहिब' किस सिख गुरु को समर्पित है?","opts":["गुरु नानक देव जी","गुरु अर्जुन देव जी","गुरु हरकृष्ण जी","गुरु तेग बहादुर जी"],"a":3,"exp":"कैथल स्थित ऐतिहासिक 'गुरुद्वारा नीम साहिब' सिखों के नौवें गुरु श्री गुरु तेग बहादुर जी को समर्पित है।","facts":["मान्यता है कि दिल्ली जाते समय गुरु तेग बहादुर जी यहाँ एक नीम के पेड़ के नीचे ठहरे थे और उन्होंने नीम की पत्तियों से एक रोगी का उपचार किया था।","कैथल में ही स्थित 'गुरुद्वारा मंजी साहिब' छठे गुरु (गुरु हरगोबिंद जी) व नौवें/दसवें गुरु (गुरु तेग बहादुर व गुरु गोबिंद सिंह जी) की स्मृतियों से जुड़ा है।","ध्यान दें: हरियाणा में 'मंजी साहिब गुरुद्वारा' अंबाला (कैथ माजरी), कैथल, लाखन माजरा (रोहतक) और जींद—चारों स्थानों पर प्रसिद्ध हैं।","गुरु तेग बहादुर जी को 'हिंद की चादर' कहा जाता है (शहादत: 1675 ई., दिल्ली)।","कैथल में सिख समुदाय के ऐतिहासिक स्थलों की बहुतायत के कारण इसे 'गुरुद्वारों का शहर' कहा जाता है।"]},
  {"q":"कैथल जिले के गुहला-चीका में स्थित लगभग 960 वर्ष पुरानी प्रसिद्ध सूफी दरगाह कौन-सी है?","opts":["बाबा शाह कमाल की मजार","मीरा नौबहार पीर की मजार","शेख तैयब का मकबरा","हजरत गाबी साहिब दरगाह"],"a":1,"exp":"गुहला-चीका (कैथल) में स्थित 'मीरा नौबहार पीर की मजार' लगभग 960 वर्ष पुरानी मानी जाती है, जिन्हें 'बाबा मीरा का बड़ा पीर' भी कहा जाता है।","facts":["कैथल शहर में इसके अतिरिक्त 'बाबा शाह कमाल की मजार' और 'शेख तैयब का मकबरा' भी प्रमुख मध्यकालीन स्मारक हैं।","शेख तैयब का मकबरा (16वीं सदी, अकबर काल) अष्टकोणीय गुंबद व सुंदर नीली टाइलों के लिए प्रसिद्ध है और ASI द्वारा संरक्षित है।","अन्य जिलों के प्रसिद्ध मकबरे: शेख चिल्ली का मकबरा (थानेसर—हरियाणा का ताजमहल), इब्राहिम लोदी का मकबरा (पानीपत) और चालीस हाफिज का मकबरा (फतेहाबाद)।","कैथल में ही मध्यकालीन 'ब्रिक बावड़ी' (ईंटों की बावड़ी) भी एक दर्शनीय जल संरचना है।","गुहला-चीका कैथल जिले का प्रमुख उपमंडल (HR-09) व SC आरक्षित विधानसभा क्षेत्र है।"]},
  {"q":"ऐतिहासिक 'शेख तैयब का मकबरा', 'बाबा शाह कमाल की मजार' और 'ईंटों की बावड़ी' (ब्रिक बावड़ी) किस जिले में स्थित हैं?","opts":["कैथल","करनाल","पानीपत","हिसार"],"a":0,"exp":"शेख तैयब का मकबरा, बाबा शाह कमाल की मजार और ऐतिहासिक ईंटों की बावड़ी (ब्रिक बावड़ी)—ये तीनों कैथल जिले में स्थित हैं।","facts":["शेख तैयब मुगल सम्राट अकबर के समय के एक प्रसिद्ध सूफी संत थे, जिनका मकबरा कैथल शहर में स्थित है।","कैथल के अन्य प्रमुख ऐतिहासिक स्मारक: रजिया सुल्तान का मकबरा, अल्तूनिया का मकबरा, भाई उदय सिंह का किला और अरनौली का किला।","हरियाणा में अन्य प्रसिद्ध बावड़ियाँ: शाहजहाँ की बावड़ी (महम, रोहतक—ज्ञानी चोर की सुरंग), गौस अली शाह की बावड़ी (फर्रुखनगर) और पिनजौर की बावड़ियाँ।","ऐतिहासिक स्मारकों के संरक्षण का कार्य भारतीय पुरातत्व सर्वेक्षण (ASI) व हरियाणा पुरातत्व विभाग द्वारा किया जाता है।","कैथल शहर में 'हरियाणा शहीद स्मारक' और 'शहीद उधम सिंह पार्क' भी प्रमुख स्थल हैं।"]},
  {"q":"हरियाणा का प्रसिद्ध 'सरस्वती वन्यजीव अभयारण्य' (सोनसर जंगल) मुख्य रूप से किस जिले में स्थित है?","opts":["पंचकूला","यमुनानगर","कैथल","सिरसा"],"a":2,"exp":"सरस्वती वन्यजीव अभयारण्य (जिसे 'सोनसर जंगल' भी कहा जाता है) मुख्य रूप से कैथल जिले (कुछ भाग कुरुक्षेत्र में) में लगभग 4,452 हेक्टेयर क्षेत्र में फैला है।","facts":["इसे जुलाई 1988 में वन्यजीव अभयारण्य के रूप में अधिसूचित किया गया था और वर्ष 2007 में 'वन्यजीव संरक्षण आरक्षित क्षेत्र' (Conservation Reserve) घोषित किया गया।","यह अभयारण्य हिरणों (चित्तीदार हिरण, नीलगाय, हॉग डियर) और अनेक पक्षियों के लिए प्रसिद्ध है।","हरियाणा में कुल 2 वन्यजीव संरक्षण आरक्षित क्षेत्र हैं: सरस्वती (कैथल/कुरुक्षेत्र—2007) और बीर बाराबान (जींद—2007)।","हरियाणा का सबसे बड़ा वन्यजीव अभयारण्य अबूबशहर (सिरसा) और सबसे छोटा छिलछिला (कुरुक्षेत्र) है।","हरियाणा में कुल 2 राष्ट्रीय उद्यान हैं: सुल्तानपुर (गुरुग्राम) और कालेसर (यमुनानगर)।"]},
  {"q":"हरियाणा प्रदेश का प्रथम और एकमात्र राजकीय संस्कृत विश्वविद्यालय 'महर्षि वाल्मीकि संस्कृत विश्वविद्यालय' कहाँ स्थित है?","opts":["कलायत","पूंडरी","गुहला","मुंदड़ी (कैथल)"],"a":3,"exp":"हरियाणा का प्रथम एवं एकमात्र राजकीय संस्कृत विश्वविद्यालय 'महर्षि वाल्मीकि संस्कृत विश्वविद्यालय' (स्थापना: 2018) कैथल जिले के 'मुंदड़ी' गाँव में स्थित है।","facts":["इसकी स्थापना हरियाणा विधानमंडल अधिनियम 2018 के तहत संस्कृत भाषा, वेद, आयुर्वेद व भारतीय दर्शन के प्रचार-प्रसार हेतु की गई।","मुंदड़ी गाँव में ही भगवान राम के पुत्रों से जुड़ा प्राचीन 'लव-कुश तीर्थ' भी स्थित है।","कैथल जिले में प्रसिद्ध निजी विश्वविद्यालय 'एनआईआईएलएम (NIILM / नीलम) विश्वविद्यालय' (स्थापना: 2011) भी स्थित है।","कैथल जिले का 'जवाहर नवोदय विद्यालय' (JNV) 'तीतरम' (Titram) गाँव में स्थित है।","कैथल शहर में प्रसिद्ध 'आर.के.एस.डी. (RKSD) कॉलेज' उच्च शिक्षा का एक प्रमुख केंद्र है।"]},
  {"q":"हरियाणा प्रदेश में सर्वाधिक 'चावल की किस्मों' (धान की विविध किस्मों) का उत्पादन किस जिले में किया जाता है?","opts":["हिसार","कैथल","सिरसा","भिवानी"],"a":1,"exp":"उपजाऊ जलोढ़ मिट्टी और घग्घर-नहर सिंचाई के कारण कैथल जिला हरियाणा में सर्वाधिक चावल की किस्मों (बासमती व गैर-बासमती) के उत्पादन के लिए प्रसिद्ध है।","facts":["हरियाणा के करनाल, कैथल, कुरुक्षेत्र और जींद जिलों को संयुक्त रूप से 'हरियाणा का धान का कटोरा' कहा जाता है।","कैथल जिले के प्रमुख उद्योगों में चावल मिलें (राइस शैलर), कृषि उपकरण उद्योग और हथकरघा (हैंडलूम) उद्योग शामिल हैं।","अन्य फसलों में अग्रणी जिले: गेहूँ व कपास (सिरसा), गन्ना (यमुनानगर), सरसों व बाजरा (महेंद्रगढ़/भिवानी) और खुम्बी/मशरूम (सोनीपत)।","केंद्र सरकार की ODOP (एक जिला, एक उत्पाद) योजना के तहत कैथल जिले को 'दूध व डेयरी / चावल प्रसंस्करण' के लिए प्रोत्साहित किया गया है।","कैथल की नई अनाज मंडी उत्तर भारत की प्रमुख धान मंडियों में गिनी जाती है।"]},
  {"q":"कैथल जिले के किस गाँव ने हरियाणा प्रदेश में 'घूंघट प्रथा' के विरोध में अग्रणी सामाजिक पहल की थी?","opts":["चौशाला","मुंदड़ी","तीतरम","फरल"],"a":0,"exp":"कैथल जिले के कलायत क्षेत्र के 'चौशाला' गाँव ने प्रदेश में घूंघट प्रथा के विरुद्ध जागरूकता व सामाजिक सुधार की सराहनीय पहल की थी।","facts":["हरियाणा के गाँवों की अन्य प्रमुख सामाजिक पहलें: 'सेल्फी विद डॉटर' (बीबीपुर, जींद), 'प्रथम ग्राम सचिवालय' (हैबतपुर, जींद) और 'राष्ट्रगान से दिन की शुरुआत' (भनकपुर, फरीदाबाद)।","हरियाणा में 'बेटी बचाओ, बेटी पढ़ाओ' अभियान 22 जनवरी 2015 को पानीपत से शुरू हुआ था।","कैथल जिले के ही 'कौल' (Kaul) गाँव में CCS HAU (हिसार) का प्रमुख 'चावल अनुसंधान केंद्र' (Rice Research Station) और राजकीय कृषि महाविद्यालय स्थित हैं।","कैथल शहर में 'महाराजा सूरजमल जाट स्टेडियम' जिले का प्रमुख खेल स्टेडियम है।","सामाजिक सुधार और खेलों में कैथल की महिलाओं (ममता सौदा, मनीषा मौन आदि) ने देश-विदेश में नाम कमाया है।"]},
  {"q":"पेरिस 2024 पैरालंपिक में तीरंदाजी का ऐतिहासिक स्वर्ण पदक जीतने वाले 'हरविंदर सिंह' (पद्म श्री 2025) किस जिले से हैं?","opts":["कुरुक्षेत्र","रोहतक","कैथल","झज्जर"],"a":2,"exp":"भारत के महान पैरा-तीरंदाज हरविंदर सिंह (जन्म: 25 फरवरी 1991, अजीत नगर/गुहला क्षेत्र, कैथल) कैथल जिले से संबंधित हैं।","facts":["उन्होंने पेरिस 2024 पैरालंपिक में पुरुष एकल रिकर्व तीरंदाजी में 'स्वर्ण पदक' और टोक्यो 2020 पैरालंपिक में 'कांस्य पदक' जीतकर इतिहास रचा।","ये दोनों पदक भारत के लिए पैरालंपिक तीरंदाजी के इतिहास के पहले स्वर्ण और पहले कांस्य पदक थे।","भारत सरकार ने जनवरी 2025 में उन्हें देश के चौथे सर्वोच्च नागरिक सम्मान 'पद्म श्री' से सम्मानित किया (इससे पहले 2021 में उन्हें अर्जुन पुरस्कार मिला था)।","उन्होंने 2018 जकार्ता एशियाई पैरा खेलों में स्वर्ण पदक और 2022 हांगझू एशियाई पैरा खेलों में कांस्य पदक भी जीता था।","वे पंजाबी विश्वविद्यालय (पटियाला) से अर्थशास्त्र में पीएचडी (Ph.D.) शोधार्थी/विद्वान भी हैं।"]},
  {"q":"2010 दिल्ली राष्ट्रमंडल खेलों में मुक्केबाजी का स्वर्ण पदक जीतने वाले 'मनोज कुमार' (अर्जुन पुरस्कार: 2014) किस जिले से हैं?","opts":["भिवानी","हिसार","सोनीपत","कैथल"],"a":3,"exp":"अंतर्राष्ट्रीय भारतीय मुक्केबाज मनोज कुमार का जन्म 10 दिसंबर 1986 को कैथल जिले के 'राजौंद' गाँव में हुआ था।","facts":["मनोज कुमार ने 2010 नई दिल्ली राष्ट्रमंडल खेलों (64 किग्रा लाइट वेल्टरवेट) में स्वर्ण पदक और 2018 गोल्ड कोस्ट राष्ट्रमंडल खेलों (69 किग्रा) में कांस्य पदक जीता।","उन्होंने 2012 लंदन ओलंपिक और 2016 रियो ओलंपिक में भारत का प्रतिनिधित्व किया तथा वर्ष 2014 में उन्हें 'अर्जुन पुरस्कार' मिला।","कैथल जिले की ही प्रसिद्ध महिला मुक्केबाज 'मनीषा मौन' (मटौर/कैथल) ने 2022 महिला विश्व मुक्केबाजी चैंपियनशिप (इस्तांबुल) में कांस्य पदक जीता था।","कैथल के प्रसिद्ध वॉलीबॉल खिलाड़ी 'बलवंत सिंह सग्गू / बलवंत सहगल' (बल्लू, अर्जुन पुरस्कार विजेता) ने भारतीय वॉलीबॉल को नई ऊँचाइयों पर पहुँचाया।","कैथल शहर का प्रमुख खेल मैदान 'महाराजा सूरजमल जाट स्टेडियम' है।"]},
  {"q":"माउंट एवरेस्ट फतह करने वाली पर्वतारोही 'ममता सौदा' (पद्म श्री: 2014) का संबंध हरियाणा के किस जिले से है?","opts":["हिसार","कैथल","रेवाड़ी","फतेहाबाद"],"a":1,"exp":"प्रसिद्ध भारतीय पर्वतारोही ममता सौदा (जन्म: 1 नवंबर 1979) का संबंध कैथल जिले से है।","facts":["ममता सौदा ने 22 मई 2010 को विश्व की सबसे ऊँची चोटी माउंट एवरेस्ट पर तिरंगा फहराया था।","पर्वतारोहण के क्षेत्र में उनकी असाधारण उपलब्धियों के लिए भारत सरकार ने वर्ष 2014 में उन्हें 'पद्म श्री' से सम्मानित किया (तथा 2010 में तेनजिंग नोर्गे राष्ट्रीय साहसिक पुरस्कार मिला)।","वे वर्तमान में हरियाणा पुलिस में डीएसपी (DSP) के पद पर कार्यरत हैं।","हरियाणा की अन्य प्रसिद्ध महिला पर्वतारोही: संतोष यादव (रेवाड़ी), अनीता कुंडू व शिवांगी पाठक (हिसार) और मनीषा पायल (फतेहाबाद)।","कैथल से ही प्रसिद्ध गायिका 'मधु शर्मा' और प्रसिद्ध हरियाणवी कवि 'कँवल हरियाणवी' भी संबंधित हैं।"]},
  {"q":"कैथल जिले से संबंधित प्रसिद्ध हरियाणवी कवि 'कँवल हरियाणवी' और गायिका 'मधु शर्मा' के साथ कैथल की 2026 की प्रशासनिक स्थिति क्या है?","opts":["कैथल करनाल मंडल में है और 2026 में हरियाणा में 23 जिले हैं","कैथल अंबाला मंडल में है और हरियाणा में 22 जिले हैं","कैथल रोहतक मंडल में है और हरियाणा में 4 कमिश्नरेट हैं","कैथल हिसार मंडल में है और हरियाणा में 10 नगर निगम हैं"],"a":0,"exp":"कैथल जिला करनाल प्रशासनिक मंडल व करनाल पुलिस रेंज के अंतर्गत आता है, और 22 दिसंबर 2025 को हांसी 23वाँ जिला बनने के बाद 2026 में हरियाणा में कुल 23 जिले हैं।","facts":["कैथल जिला सार (2026): स्थापना 1 नवंबर 1989, क्षेत्रफल 2,317 वर्ग किमी, 3 उपमंडल, 4 तहसीलें, 3 उप-तहसीलें, 7 ब्लॉक, 278 गाँव और 4 विधानसभा सीटें।","कैथल के प्रमुख व्यक्तित्व: हरविंदर सिंह (पैरा-तीरंदाज, पद्म श्री 2025), ममता सौदा (पर्वतारोही, पद्म श्री 2014), मनोज कुमार व मनीषा मौन (बॉक्सर), बलवंत सिंह (वॉलीबॉल), कँवल हरियाणवी (कवि) और मधु शर्मा (गायिका)।","हरियाणा अपडेटेड सार (2026): 23 जिले (23वाँ—हांसी), 6 प्रशासनिक मंडल (हिसार व रोहतक मंडल में 5-5 जिले), 5 पुलिस रेंज, 5 पुलिस कमिश्नरेट (गुरुग्राम, फरीदाबाद, पंचकूला, सोनीपत, झज्जर) और 24 पुलिस जिले।","हरियाणा में कुल 11 नगर निगम, 90 विधानसभा सीटें (17 SC), 10 लोकसभा सीटें (2 SC: अंबाला व सिरसा) और 5 राज्यसभा सीटें हैं।","कैथल जिले से होकर नया ट्रांस-हरियाणा एक्सप्रेसवे (NH-152D) और NH-152 (पुराना NH-65) गुजरते हैं।"]},
  {"q":"महाभारत काल में भगवान श्रीकृष्ण ने किसके हाथों नवग्रह यज्ञ करवाकर कैथल में 'नवग्रह कुंडों' का निर्माण करवाया था?","opts":["अर्जुन","भीम","युधिष्ठिर","नकुल"],"a":2,"exp":"महाभारत के युद्ध के उपरांत भगवान श्रीकृष्ण ने धर्मराज युधिष्ठिर के हाथों नवग्रह यज्ञ करवाकर कैथल में नवग्रह कुंडों का निर्माण करवाया था।","facts":["इन नौ कुंडों के नाम हैं: सूर्य कुंड, चंद्र कुंड, मंगल कुंड, बुध कुंड, बृहस्पति कुंड, शुक्र कुंड, शनि कुंड, राहु कुंड और केतु कुंड।","नवग्रह कुंडों के विशेष धार्मिक महत्व के कारण ही कैथल को 'छोटी काशी' कहा जाता है।","जबकि मंदिरों की अधिकता के कारण भिवानी को भी हरियाणा की छोटी काशी कहा जाता है।","कैथल के ग्यारह रुद्री शिव मंदिर में अर्जुन ने तपस्या कर भगवान शिव से पाशुपतास्त्र प्राप्त किया था।","कुरुक्षेत्र विकास बोर्ड (KDB) द्वारा इन प्राचीन कुंडों के संरक्षण व सौंदर्यीकरण का कार्य किया जाता है।"]},
  {"q":"कैथल जिले के किस गाँव में स्थित 'प्राचीन खंडेश्वर मेला' और कैथल शहर का 'अम्बेश्वर (अम्बकेश्वर) मंदिर' प्रसिद्ध हैं?","opts":["फरल","मुंदड़ी","बाबा लदाना","मटौर"],"a":3,"exp":"कैथल जिले के कलायत क्षेत्र के 'मटौर' गाँव में प्रतिवर्ष प्रसिद्ध 'प्राचीन खंडेश्वर मेला' आयोजित होता है।","facts":["मटौर गाँव से ही अंतर्राष्ट्रीय महिला मुक्केबाज मनीषा मौन (विश्व चैंपियनशिप कांस्य पदक विजेता) भी जुड़ी रही हैं।","कैथल शहर में स्थित 'अम्बेश्वर (अम्बकेश्वर महादेव) मंदिर' में पातालेश्वर महादेव की प्राचीन प्रतिमा स्थापित है।","कैथल के अन्य प्रमुख मेले: फल्गु मेला (फरल), पुंडरीक मेला (पूंडरी), देहाती मेला (बाबा लदाना) और वामन द्वादशी मेला (कैथल)।","अंबाला शहर में भी भाद्रपद माह में प्रसिद्ध 'वामन द्वादशी मेला' आयोजित होता है।","HSSC की परीक्षाओं में कैथल के ग्रामीण मेलों व मंदिरों के नाम सीधे पूछे जाते हैं।"]},
  {"q":"हरियाणा पर्यटन निगम का प्रसिद्ध 'कोयल रिसोर्ट' (Koel Tourist Complex) किस जिले में स्थित है?","opts":["कुरुक्षेत्र","कैथल","करनाल","पानीपत"],"a":1,"exp":"हरियाणा पर्यटन निगम द्वारा संचालित प्रसिद्ध 'कोयल' (Koel) पर्यटन स्थल व रिसोर्ट कैथल शहर में स्थित है।","facts":["हरियाणा पर्यटन निगम (स्थापना: 1 सितंबर 1974) अपने पर्यटन स्थलों के नाम पक्षियों के नाम पर रखता है।","पड़ोसी जिलों के पक्षी-नाम पर्यटन स्थल: नीलकंठ/पैराकीट (कुरुक्षेत्र), कर्ण लेक/ओएसिस (करनाल), स्काईलार्क व ब्लू जे (पानीपत) और बुलबुल (जींद)।","कैथल में अन्य प्रमुख पर्यटन आकर्षण: बिदक्यार झील, भाई उदय सिंह का किला, पुंडरीक सरोवर (पूंडरी) और फल्गु तीर्थ (फरल)।","हरियाणा पर्यटन दिवस प्रतिवर्ष 1 सितंबर को मनाया जाता है।","हरियाणा का राज्य पक्षी 'काला तीतर' है।"]},
  {"q":"कैथल जिले के किस स्थान पर ऐतिहासिक 'अरनौली का किला' स्थित है?","opts":["अरनौली (गुहला)","पूंडरी","राजौंद","कलायत"],"a":0,"exp":"ऐतिहासिक 'अरनौली का किला' कैथल जिले के गुहला क्षेत्र के अरनौली गाँव में स्थित है।","facts":["अरनौली 18वीं शताब्दी में सिख सरदारों (फूलकियाँ व भाई वंश के समकालीन) की एक प्रमुख जागीर व गढ़ी रही है।","कैथल शहर में स्थित दूसरा बड़ा ऐतिहासिक किला 'भाई उदय सिंह का किला' है।","हरियाणा के अन्य प्रमुख ऐतिहासिक किले: असीगढ़ किला (हांसी), लोहारू किला (भिवानी), जींद का किला (1775, गजपत सिंह) और गोपालगिरी किला (गुरुग्राम)।","अरनौली गाँव पंजाब के पटियाला जिले की सीमा के अत्यंत निकट स्थित है।","गुहला क्षेत्र से ही घग्घर नदी हरियाणा में प्रवाहित होती है।"]},
  {"q":"कैथल शहर में स्थित 'नीलम विश्वविद्यालय' (NIILM University) की स्थापना किस वर्ष हुई थी?","opts":["2007","2018","2011","2014"],"a":2,"exp":"कैथल में स्थित निजी विश्वविद्यालय 'एनआईआईएलएम (NIILM / नीलम) विश्वविद्यालय' की स्थापना वर्ष 2011 में हरियाणा निजी विश्वविद्यालय अधिनियम के तहत हुई थी।","facts":["यह विश्वविद्यालय कैथल–अंबाला राष्ट्रीय राजमार्ग (NH-152) पर स्थित है।","जबकि कैथल के मुंदड़ी गाँव में स्थित राजकीय 'महर्षि वाल्मीकि संस्कृत विश्वविद्यालय' की स्थापना वर्ष 2018 में हुई थी।","कैथल जिले के तीतरम गाँव में 'जवाहर नवोदय विद्यालय' (JNV) और कौल गाँव में CCS HAU का 'कृषि महाविद्यालय व चावल शोध केंद्र' स्थित हैं।","हरियाणा का पहला विश्वविद्यालय 'कुरुक्षेत्र विश्वविद्यालय' (1956) कैथल के बिल्कुल निकट कुरुक्षेत्र में स्थित है।","हरियाणा का एकमात्र केंद्रीय विश्वविद्यालय जांट-पाली (महेंद्रगढ़, 2009) में स्थित है।"]},
  {"q":"कैथल जिले का 'जवाहर नवोदय विद्यालय' (JNV) किस गाँव में स्थित है?","opts":["मुंदड़ी","फरल","चौशाला","तीतरम"],"a":3,"exp":"कैथल जिले का जवाहर नवोदय विद्यालय (JNV) 'तीतरम' (Titram) गाँव में स्थित है।","facts":["तीतरम गाँव कैथल–हिसार मार्ग (NH-152 / NH-52) पर स्थित है और तीतरम मोड़ कैथल का प्रमुख राजमार्ग जंक्शन है।","यहीं के निकट से ट्रांस-हरियाणा एक्सप्रेसवे (NH-152D — इस्माइलाबाद से नारनौल) गुजरता है।","भारत के पहले दो जवाहर नवोदय विद्यालयों में से एक हरियाणा के झज्जर जिले के कलोई गाँव (1985–86) में खोला गया था।","अन्य पड़ोसी जिलों के JNV: खुंगा कोठी (जींद), निवारसी (कुरुक्षेत्र) और सागगा (करनाल)।","तीतरम गाँव कैथल तहसील के अंतर्गत आता है।"]},
  {"q":"कैथल के पुंडरीक सरोवर में वर्ष 1987 में कुरुक्षेत्र विकास बोर्ड (KDB) द्वारा किस प्रसिद्ध कुंड का निर्माण करवाया गया था?","opts":["सूर्य कुंड","नागहृद कुंड","व्यास कुंड","भीम कुंड"],"a":1,"exp":"कुरुक्षेत्र विकास बोर्ड (KDB) द्वारा वर्ष 1987 में पूंडरी स्थित पुंडरीक सरोवर में 'नागहृद कुंड' का निर्माण करवाया गया था।","facts":["पुंडरीक सरोवर के बारे में मान्यता है कि इसका जल सतयुग से लेकर आज तक कभी नहीं सूखा है।","पुंडरीक सरोवर के पास ही भव्य 'गीता मंदिर' और शिव मंदिर (जहाँ बाबा ठंडीपुरी की समाधि है) स्थित हैं।","कुरुक्षेत्र विकास बोर्ड (KDB) की स्थापना 1 अगस्त 1968 को गुलजारी लाल नंदा के प्रयासों से हुई थी (पदेन अध्यक्ष: हरियाणा के राज्यपाल)।","48 कोस कुरुक्षेत्र परिक्रमा क्षेत्र में कुरुक्षेत्र, कैथल, करनाल, जींद और पानीपत—इन 5 जिलों के 134 से अधिक प्राचीन तीर्थ शामिल हैं।","नागहृद कुंड के अलावा कैथल शहर के नवग्रह कुंड भी अत्यंत पूजनीय हैं।"]},
  {"q":"कैथल जिले में स्थित 'महाराजा सूरजमल जाट स्टेडियम' किस शहर में स्थित है?","opts":["कैथल","पूंडरी","गुहला","कलायत"],"a":0,"exp":"प्रसिद्ध 'महाराजा सूरजमल जाट स्टेडियम' कैथल शहर में स्थित है।","facts":["इस स्टेडियम में जिले के युवा एथलेटिक्स, कुश्ती, वॉलीबॉल, बॉक्सिंग और सैन्य भर्ती की तैयारी करते हैं।","कैथल ने देश को हरविंदर सिंह (पैरा-तीरंदाज, स्वर्ण पदक), मनोज कुमार व मनीषा मौन (बॉक्सिंग), बलवंत सिंह (वॉलीबॉल) और ममता सौदा (पर्वतारोहण) जैसे दिग्गज खिलाड़ी दिए हैं।","हरियाणा के अन्य प्रमुख स्टेडियम: अर्जुन व एकलव्य स्टेडियम (जींद), महावीर स्टेडियम (हिसार), भीम स्टेडियम (भिवानी) और महर्षि दयानंद स्टेडियम (झज्जर)।","हरियाणा का सर्वोच्च खेल पुरस्कार 'भीम पुरस्कार' है।","हरियाणा की खेल नीति में ओलंपिक व पैरालंपिक स्वर्ण विजेता को 6 करोड़, रजत पर 4 करोड़ और कांस्य पदक पर 2.5 करोड़ रुपये दिए जाते हैं।"]},
  {"q":"अंतर्राष्ट्रीय वॉलीबॉल खिलाड़ी 'बलवंत सिंह' (अर्जुन पुरस्कार विजेता) और महिला मुक्केबाज 'मनीषा मौन' किस जिले से संबंधित हैं?","opts":["भिवानी","रोहतक","कैथल","सोनीपत"],"a":2,"exp":"अर्जुन पुरस्कार विजेता दिग्गज वॉलीबॉल खिलाड़ी बलवंत सिंह (बलवंत सहगल/सग्गू) और अंतर्राष्ट्रीय महिला मुक्केबाज मनीषा मौन कैथल जिले से संबंधित हैं।","facts":["मनीषा मौन ने 2022 की महिला विश्व मुक्केबाजी चैंपियनशिप (इस्तांबुल, 57 किग्रा वर्ग) में कांस्य पदक जीता था।","कैथल के ही राजौंद गाँव के मुक्केबाज मनोज कुमार ने 2010 दिल्ली राष्ट्रमंडल खेलों में स्वर्ण पदक जीता था।","पेरिस 2024 पैरालंपिक में तीरंदाजी का ऐतिहासिक स्वर्ण पदक जीतने वाले हरविंदर सिंह भी कैथल के ही निवासी हैं।","ममता सौदा (पद्म श्री, 2014) कैथल की विश्व प्रसिद्ध पर्वतारोही हैं।","खेल उपलब्धियों में कैथल उत्तर हरियाणा के अग्रणी जिलों में गिना जाता है।"]},
  {"q":"कैथल के किस गाँव में स्थित 'चावल अनुसंधान केंद्र' (Rice Research Station) चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय (हिसार) का प्रमुख क्षेत्रीय केंद्र है?","opts":["फरल","तीतरम","मुंदड़ी","कौल"],"a":3,"exp":"कैथल जिले के 'कौल' (Kaul) गाँव में CCS HAU (हिसार) का प्रसिद्ध चावल अनुसंधान केंद्र (Rice Research Station) और कृषि महाविद्यालय स्थित हैं।","facts":["यह केंद्र हरियाणा व उत्तर भारत के लिए बासमती व गैर-बासमती धान की उन्नत, कम पानी लेने वाली और रोग-प्रतिरोधी किस्में विकसित करता है।","कैथल जिला हरियाणा में सर्वाधिक चावल की किस्मों के उत्पादन के लिए जाना जाता है।","कौल गाँव कैथल जिले के ढांड उप-तहसील व पूंडरी विधानसभा क्षेत्र के अंतर्गत आता है।","कौल में ही प्रसिद्ध 'बाबू अनंत राम जनता महाविद्यालय' भी स्थित है।","हरियाणा में कृषि शिक्षा का प्रमुख केंद्र CCS HAU हिसार (स्थापना: 2 फरवरी 1970) है।"]},
  {"q":"कैथल जिले के किस क्षेत्र में 18वीं शताब्दी के प्रसिद्ध हिंदी व ब्रजभाषा महाकवि 'भाई संतोख सिंह' (ग्रंथ: सूरज प्रकाश) को राज्याश्रय प्राप्त था?","opts":["सफीदों रियासत","कैथल रियासत","बल्लभगढ़ रियासत","लोहारू रियासत"],"a":1,"exp":"सिख इतिहास के महाकाव्य 'गुरप्रताप सूरज ग्रंथ' (सूरज प्रकाश) के रचयिता महाकवि भाई संतोख सिंह को कैथल के अंतिम शासक भाई उदय सिंह का राज्याश्रय प्राप्त था।","facts":["भाई संतोख सिंह ने कैथल में रहते हुए ही सिख गुरुओं के जीवन पर आधारित विशाल महाकाव्य 'सूरज प्रकाश' (1843 में पूर्ण) और 'नानक प्रकाश' की रचना की।","कैथल के शासक भाई उदय सिंह स्वयं साहित्य व कला के महान प्रेमी थे।","आधुनिक काल में कैथल से प्रसिद्ध हरियाणवी कवि 'कँवल हरियाणवी' और गायिका 'मधु शर्मा' ने साहित्य व संगीत में नाम कमाया।","हरियाणा साहित्य अकादमी का मुख्यालय पंचकूला में स्थित है।","हरियाणा का प्रथम राज्य कवि उदयभानु हंस को माना जाता है।"]},
  {"q":"कैथल जिले से होकर गुजरने वाला कौन-सा प्रमुख 6-लेन ग्रीनफील्ड एक्सप्रेसवे उत्तरी हरियाणा (अंबाला/इस्माइलाबाद) को दक्षिणी हरियाणा (नारनौल) से जोड़ता है?","opts":["NH-152D (ट्रांस-हरियाणा एक्सप्रेसवे)","NH-44 (जीटी रोड)","NH-48 (दिल्ली–जयपुर)","NH-19 (दिल्ली–मथुरा)"],"a":0,"exp":"227 किमी लंबा 6-लेन 'ट्रांस-हरियाणा एक्सप्रेसवे' (NH-152D) कुरुक्षेत्र (इस्माइलाबाद) से शुरू होकर कैथल, जींद, रोहतक, भिवानी, चरखी दादरी और महेंद्रगढ़ (नारनौल) तक जाता है।","facts":["यह एक्सप्रेसवे कैथल जिले (ढांड, तीतरम, राजौंद क्षेत्र) से होकर गुजरता है, जिससे कैथल से चंडीगढ़, दिल्ली और जयपुर की यात्रा का समय लगभग आधा रह गया है।","इसके अतिरिक्त कैथल से होकर राष्ट्रीय राजमार्ग NH-152 (पूर्व NH-65 — अंबाला–कैथल–नरवाना–हिसार) गुजरता है।","कैथल रेलवे स्टेशन उत्तर रेलवे (अंबाला मंडल) की कुरुक्षेत्र–नरवाना रेलवे लाइन पर स्थित है।","गुहला-चीका क्षेत्र से होकर हरियाणा और पंजाब को जोड़ने वाले प्रमुख राज्य मार्ग गुजरते हैं।","बेहतर सड़क नेटवर्क से कैथल की धान मंडियों और कृषि व्यापार को बड़ा लाभ मिला है।"]},
  {"q":"कैथल में स्थित 'सरस्वती वन्यजीव अभयारण्य' (सोनसर जंगल) को वन्यजीव अभयारण्य के रूप में पहली बार मान्यता कब दी गई थी?","opts":["नवंबर 1966","मई 1995","जुलाई 1988","अगस्त 2021"],"a":2,"exp":"कैथल (व कुरुक्षेत्र की सीमा पर) स्थित सरस्वती वन्यजीव अभयारण्य (4,452 हेक्टेयर) को जुलाई 1988 में वन्यजीव अभयारण्य के रूप में मान्यता दी गई थी।","facts":["बाद में वर्ष 2007 में इसे 'वन्यजीव संरक्षण आरक्षित क्षेत्र' (Conservation Reserve) घोषित किया गया।","यह अभयारण्य 'सोनसर जंगल' के नाम से भी प्रसिद्ध है और यहाँ बड़ी संख्या में हिरण (चित्तीदार हिरण, नीलगाय आदि) पाए जाते हैं।","हरियाणा का दूसरा संरक्षण आरक्षित क्षेत्र 'बीर बाराबान' (जींद—2007) है।","हरियाणा वन विभाग का मुख्यालय वन भवन, सेक्टर-6, पंचकूला में स्थित है।","हरियाणा में सर्वाधिक वन क्षेत्रफल पंचकूला में और सबसे कम वन प्रतिशत फतेहाबाद में है।"]},
  {"q":"कैथल जिले में 'बाबा ठंडीपुरी की समाधि' किस प्रसिद्ध धार्मिक स्थल के शिव मंदिर परिसर में स्थित है?","opts":["फल्गु तीर्थ","कपिल मुनि तीर्थ","ग्यारह रुद्री मंदिर","पुंडरीक सरोवर (पूंडरी)"],"a":3,"exp":"पूंडरी (कैथल) स्थित ऐतिहासिक पुंडरीक सरोवर के किनारे बने प्राचीन शिव मंदिर में संत 'बाबा ठंडीपुरी की समाधि' स्थित है।","facts":["पुंडरीक सरोवर के पास ही विशाल चबूतरों के निकट भव्य 'गीता मंदिर' भी बना हुआ है।","पुंडरीक सरोवर के बारे में मान्यता है कि सतयुग से लेकर आज तक इसका जल कभी नहीं सूखा है।","इसी सरोवर में 1987 में कुरुक्षेत्र विकास बोर्ड द्वारा 'नागहृद कुंड' का निर्माण करवाया गया था।","पूंडरी कस्बे का नाम ही ऋषि पुंडरीक और इस सरोवर के नाम पर पड़ा।","यहाँ प्रतिवर्ष 'पुंडरीक का मेला' आयोजित होता है।"]},
  {"q":"कैथल जिले में 'अल्तूनिया का मकबरा' किस शासिका के मकबरे के निकट स्थित है?","opts":["बेगम समरू","रजिया सुल्तान","रानी साहिब कौर","रानी सौंदराई"],"a":1,"exp":"भटिंडा के इक्तादार व रजिया सुल्तान के पति मलिक इख्तियारुद्दीन अल्तूनिया का मकबरा कैथल में रजिया सुल्तान के मकबरे के निकट स्थित है।","facts":["13 अक्टूबर 1240 को कैथल के निकट विद्रोहियों द्वारा रजिया सुल्तान और उनके पति अल्तूनिया—दोनों की हत्या कर दी गई थी।","रजिया सुल्तान गुलाम वंश के महान सुल्तान शम्सुद्दीन इल्तुतमिश की पुत्री थीं।","कैथल में स्थित अन्य प्रसिद्ध मकबरे व मजारें: शेख तैयब का मकबरा, बाबा शाह कमाल की मजार और मीरा नौबहार पीर की मजार (गुहला-चीका)।","दिल्ली सल्तनत में गुलाम वंश (1206–1290 ई.) की स्थापना कुतुबुद्दीन ऐबक ने की थी।","रजिया सुल्तान के बाद उनके भाई मुइजुद्दीन बहराम शाह दिल्ली के सुल्तान बने थे।"]},
  {"q":"कैथल शहर में प्रतिवर्ष भाद्रपद मास में कौन-सा प्रसिद्ध पारंपरिक मेला लगता है (जो अंबाला में भी प्रसिद्ध है)?","opts":["वामन द्वादशी का मेला","सूरजकुंड मेला","कार्तिक सांस्कृतिक मेला","बलदेव छठ मेला"],"a":0,"exp":"भगवान विष्णु के वामन अवतार की स्मृति में भाद्रपद शुक्ल द्वादशी को कैथल शहर में प्रसिद्ध 'वामन द्वादशी का मेला' आयोजित होता है।","facts":["वामन द्वादशी का मेला कैथल के साथ-साथ अंबाला शहर (नौरंग राय तालाब) में भी बड़ी धूमधाम से लगता है।","कैथल के अन्य प्रमुख मेले: फल्गु का मेला (फरल), देहाती मेला (बाबा लदाना), पुंडरीक मेला (पूंडरी) और प्राचीन खंडेश्वर मेला (मटौर)।","अन्य विकल्पों में सूरजकुंड मेला, कार्तिक सांस्कृतिक मेला और बलदेव छठ मेला फरीदाबाद जिले से संबंधित हैं।","भाद्रपद मास में ही हरियाणा में जन्माष्टमी, गुगा नवमी और हरतालिका तीज जैसे प्रमुख पर्व मनाए जाते हैं।","कैथल के मेलों में हरियाणवी व पंजाबी लोक संस्कृति की समृद्ध झलक देखने को मिलती है।"]},
  {"q":"कैथल जिले में 'गुहला-चीका' क्षेत्र से होकर कौन-सी प्रमुख मौसमी नदी हरियाणा में प्रवाहित होती है?","opts":["यमुना नदी","साहिबी नदी","घग्घर नदी","दोहान नदी"],"a":2,"exp":"हिमाचल प्रदेश के सोलन (डागशाई) से निकलने वाली मौसमी 'घग्घर नदी' पंचकूला, अंबाला व पंजाब होकर कैथल के गुहला-चीका क्षेत्र से गुजरती है।","facts":["घग्घर नदी आगे चलकर फतेहाबाद और सिरसा से बहती हुई राजस्थान के हनुमानगढ़ में विलुप्त हो जाती है।","कैथल के गुहला-चीका क्षेत्र में घग्घर नदी की उपजाऊ जलोढ़ मिट्टी धान (बासमती) व गेहूँ की बंपर पैदावार का प्रमुख आधार है।","मानसून के मौसम में घग्घर नदी में जलस्तर बढ़ने से गुहला-चीका क्षेत्र में अक्सर बाढ़ की स्थिति बनती है।","हरियाणा की एकमात्र बारहमासी नदी यमुना है, जो राज्य की पूर्वी सीमा बनाती है।","साहिबी और दोहान हरियाणा के दक्षिणी अपवाह तंत्र की मौसमी नदियाँ हैं।"]},
  {"q":"कैथल के किस गाँव में स्थित 'फलकीवन' (जहाँ राजा अधिसीम ने तप किया था) को 'मिश्र तीर्थ' भी कहा जाता है?","opts":["मुंदड़ी","पूंडरी","कलायत","फरल"],"a":3,"exp":"कैथल के 'फरल' गाँव में स्थित प्राचीन फलकीवन व फल्गु तीर्थ को 'मिश्र तीर्थ' कहा जाता है, जहाँ पांडवों के वंशज राजा अधिसीम ने वर्षों तक तप किया था।","facts":["मान्यता है कि महर्षि वेदव्यास ने देवताओं के लिए सभी प्रमुख तीर्थों को यहाँ एकत्रित (मिश्रित) किया था, इसलिए इसे 'मिश्र तीर्थ' कहते हैं।","पुराणों के अनुसार फलकीवन और फलकी तीर्थ प्राचीन 'दृषद्वती नदी' के तट पर स्थित थे।","यहाँ सोमवती अमावस्या के दिन विशाल 'फल्गु का मेला' लगता है।","फरल गाँव कैथल जिले की ढांड उप-तहसील और पूंडरी विधानसभा क्षेत्र के अंतर्गत आता है।","फरल का फल्गु तीर्थ पितृ तर्पण व पिंडदान के लिए पूरे उत्तर भारत में प्रसिद्ध है।"]},
  {"q":"प्रसिद्ध हरियाणवी फिल्म एवं रंगमंच व लोक गायन क्षेत्र से जुड़ी 'मधु शर्मा' तथा कवि 'कँवल हरियाणवी' किस जिले से हैं?","opts":["रोहतक","कैथल","जींद","हिसार"],"a":1,"exp":"प्रसिद्ध गायिका मधु शर्मा और चर्चित हरियाणवी कवि कँवल हरियाणवी का संबंध कैथल जिले से है।","facts":["कैथल जिले ने कला व साहित्य में मध्यकाल के महाकवि भाई संतोख सिंह (राज्याश्रित, कैथल रियासत) से लेकर आधुनिक काल के कँवल हरियाणवी तक महत्वपूर्ण योगदान दिया है।","अन्य जिलों के प्रसिद्ध साहित्यकार व गायक: पंडित जसराज (फतेहाबाद), महाबीर गुड्डू (जींद—पद्म श्री 2024), सोनू निगम (फरीदाबाद) और जोहराबाई अंबालेवाली (अंबाला)।","हरियाणा के प्रथम राज्य कवि उदयभानु हंस को माना जाता है।","हरियाणा कला परिषद का मुख्यालय कुरुक्षेत्र में और हरियाणा साहित्य अकादमी का मुख्यालय पंचकूला में स्थित है।","कैथल के लोकगीतों और संस्कृति में हरियाणवी बांगरू व पंजाबी बोली का सुंदर मेल दिखता है।"]},
  {"q":"कैथल में 'शहीद उधम सिंह पार्क' (माता गेट) और 'हरियाणा शहीद स्मारक' किस जिले की देशभक्ति विरासत का हिस्सा हैं?","opts":["कैथल","अंबाला","झज्जर","रेवाड़ी"],"a":0,"exp":"शहीद उधम सिंह पार्क (माता गेट) और हरियाणा शहीद स्मारक कैथल शहर के प्रमुख ऐतिहासिक व देशभक्ति स्थलों में शामिल हैं।","facts":["1843 के कैथल विद्रोह से लेकर 1857 की क्रांति और भारतीय स्वतंत्रता संग्राम में कैथल के वीरों ने महत्वपूर्ण बलिदान दिए।","जलियाँवाला बाग हत्याकांड (13 अप्रैल 1919) का बदला लेने वाले अमर क्रांतिकारी शहीद उधम सिंह का जन्म संगरूर (सुनाम, पंजाब) में हुआ था, जो कैथल से सटा क्षेत्र है।","हरियाणा का विशाल '1857 शहीद स्मारक' (War Memorial) अंबाला कैंट में बनाया गया है।","हरियाणा में 'शहीदों का शहर' झज्जर को और 'वीर भूमि' रेवाड़ी को कहा जाता है।","कैथल शहर के आठ ऐतिहासिक द्वारों में माता गेट, प्रताप गेट, डोगरा गेट, सीवन गेट, चांदना गेट और रेलवे गेट प्रमुख हैं।"]},
  {"q":"कैथल जिले के किस उपमंडल/तहसील क्षेत्र का वाहन पंजीकरण कोड 'HR-09' है?","opts":["कैथल","कलायत","गुहला (चीका)","पूंडरी"],"a":2,"exp":"कैथल जिले के गुहला (चीका) उपमंडल का वाहन पंजीकरण कोड HR-09 है।","facts":["कैथल जिले के अन्य वाहन कोड: कैथल मुख्यालय (HR-08) और कलायत उपमंडल (HR-83)।","हरियाणा में वाहन पंजीकरण कोड HR-01 (अंबाला) से प्रारंभ होते हैं और जिलों व उपमंडलों के अनुसार आवंटित हैं।","गुहला-चीका कैथल जिले की एकमात्र अनुसूचित जाति (SC) आरक्षित विधानसभा सीट (क्रमांक 15) भी है।","गुहला क्षेत्र में ही लगभग 960 वर्ष पुरानी 'मीरा नौबहार पीर की मजार' और 'अरनौली का किला' स्थित हैं।","गुहला-चीका पंजाब की सीमा से सटा हुआ कैथल का प्रमुख कृषि व व्यापारिक केंद्र है।"]},
  {"q":"1 नवंबर 1989 को कैथल के साथ हरियाणा के अन्य कौन-से तीन जिले अस्तित्व में आए थे?","opts":["हिसार, रोहतक और जींद","भिवानी, सोनीपत और कुरुक्षेत्र","फतेहाबाद, झज्जर और पंचकूला","पानीपत, रेवाड़ी और यमुनानगर"],"a":3,"exp":"1 नवंबर 1989 को हरियाणा में एक साथ 4 जिलों—कैथल, पानीपत, रेवाड़ी और यमुनानगर—का गठन किया गया था।","facts":["इस दिन बने चारों जिलों को याद रखने का प्रसिद्ध शॉर्टकट 'KRPY' (Kaithal, Rewari, Panipat, Yamunanagar) है।","अन्य प्रमुख जिला गठन तिथियाँ: भिवानी व सोनीपत (22 दिसंबर 1972), कुरुक्षेत्र (23 जनवरी 1973), सिरसा (26 अगस्त 1975), फरीदाबाद (15 अगस्त 1979), पंचकूला (15 अगस्त 1995), फतेहाबाद व झज्जर (15 जुलाई 1997)।","नवीनतम जिले: नूंह/मेवात (4 अप्रैल 2005), पलवल (15 अगस्त 2008), चरखी दादरी (1 दिसंबर 2016) और 23वाँ जिला हांसी (22 दिसंबर 2025)।","वर्तमान (2026) में हरियाणा में कुल 23 जिले और 6 प्रशासनिक मंडल हैं।","कैथल जिला वर्तमान में करनाल मंडल (करनाल, पानीपत, कैथल) का हिस्सा है।"]},
  {"q":"कैथल के पैरा-तीरंदाज 'हरविंदर सिंह' ने पेरिस 2024 पैरालंपिक से पहले किस पैरालंपिक खेल में भारत के लिए तीरंदाजी का पहला पदक जीता था?","opts":["रियो 2016","टोक्यो 2020","लंदन 2012","बीजिंग 2008"],"a":1,"exp":"हरविंदर सिंह ने टोक्यो 2020 पैरालंपिक (आयोजित सितंबर 2021) में पुरुष व्यक्तिगत रिकर्व तीरंदाजी में कांस्य पदक जीतकर भारत के लिए पैरालंपिक तीरंदाजी का पहला पदक दिलाया था।","facts":["इसके तीन साल बाद सितंबर 2024 में पेरिस पैरालंपिक में उन्होंने स्वर्ण पदक जीतकर भारत को पैरालंपिक तीरंदाजी का पहला स्वर्ण भी दिलाया।","वे भारत के पहले पैरा-तीरंदाज बने जिन्हें जनवरी 2025 में 'पद्म श्री' से सम्मानित किया गया।","उन्हें वर्ष 2021 में भारत सरकार द्वारा 'अर्जुन पुरस्कार' से भी सम्मानित किया गया था।","पेरिस 2024 पैरालंपिक में भारत ने कुल 29 पदक (7 स्वर्ण, 9 रजत, 13 कांस्य) जीतकर अब तक का सर्वश्रेष्ठ प्रदर्शन किया।","हरविंदर सिंह का जन्म 25 फरवरी 1991 को कैथल जिले में हुआ था।"]},
  {"q":"कैथल जिले में कुल कितने विकास खंड (Blocks) और लगभग कितने राजस्व गाँव हैं?","opts":["7 विकास खंड और 278 गाँव","4 विकास खंड और 172 गाँव","6 विकास खंड और 408 गाँव","8 विकास खंड और 300 गाँव"],"a":0,"exp":"जिला प्रशासन के आधिकारिक पोर्टल के अनुसार कैथल जिले में 7 विकास खंड (कैथल, गुहला, कलायत, पूंडरी, राजौंद, सीवन, ढांड) और 278 राजस्व गाँव हैं।","facts":["विकास खंड स्तर पर ग्रामीण विकास योजनाओं का संचालन खंड विकास एवं पंचायत अधिकारी (BDPO) द्वारा किया जाता है।","इन सातों विकास खंडों में पंचायती राज की मध्यवर्ती इकाई के रूप में 7 पंचायत समितियाँ कार्यरत हैं।","हरियाणा में त्रिस्तरीय पंचायती राज व्यवस्था (ग्राम पंचायत, पंचायत समिति, जिला परिषद) 22 अप्रैल 1994 से लागू है।","हरियाणा में पंचायती राज चुनावों में महिलाओं के लिए 50% आरक्षण (सम-विषम नियम) लागू है।","संपूर्ण हरियाणा राज्य में वर्तमान में कुल 142 सामुदायिक विकास खंड हैं।"]},
  {"q":"कैथल शहर में स्थित 'ग्यारह रुद्री शिव मंदिर' के अलावा कौन-सा दूसरा प्राचीन शिव मंदिर पातालेश्वर महादेव के लिए प्रसिद्ध है?","opts":["भूतेश्वर मंदिर","स्थानेश्वर महादेव मंदिर","अम्बेश्वर (अम्बकेश्वर) मंदिर","जोगी वाला मंदिर"],"a":2,"exp":"कैथल शहर में स्थित प्राचीन 'अम्बेश्वर (अम्बकेश्वर महादेव) मंदिर' पातालेश्वर महादेव की प्राचीन प्रतिमा के लिए अत्यंत प्रसिद्ध है।","facts":["अन्य विकल्पों में भूतेश्वर मंदिर जींद में, स्थानेश्वर महादेव मंदिर थानेसर (कुरुक्षेत्र) में और जोगी वाला मंदिर भिवानी शहर में स्थित है।","कैथल में नवग्रह कुंड, ग्यारह रुद्री शिव मंदिर, अम्बेश्वर मंदिर और अंजनी का टीला शहर के सबसे पुराने हिंदू तीर्थ स्थल हैं।","कैथल को महाभारत काल से जुड़े तीर्थों के कारण 48 कोस कुरुक्षेत्र भूमि का प्रमुख केंद्र माना जाता है।","महाशिवरात्रि और सावन के महीने में अम्बेश्वर मंदिर और ग्यारह रुद्री मंदिर में विशाल श्रद्धालु समूह उमड़ता है।","नवग्रह कुंडों की उपस्थिति के कारण ही कैथल को 'छोटी काशी' कहा जाता है।"]},
  {"q":"हरियाणा में 'कृषि उपकरण उद्योग' और 'हथकरघा उद्योग' के साथ कैथल किस फसल की सर्वाधिक किस्मों के लिए प्रसिद्ध है?","opts":["कपास","गन्ना","सरसों","चावल (धान)"],"a":3,"exp":"कैथल जिले में कृषि उपकरण व हथकरघा उद्योग के साथ-साथ प्रदेश में सर्वाधिक चावल (धान) की किस्मों का उत्पादन होता है।","facts":["कैथल, करनाल, कुरुक्षेत्र और जींद को संयुक्त रूप से हरियाणा का 'धान का कटोरा' कहा जाता है।","कैथल के कौल गाँव में स्थित 'चावल अनुसंधान केंद्र' धान की उन्नत किस्मों पर शोध का प्रमुख केंद्र है।","कैथल जिले में सैकड़ों राइस शैलर (चावल मिलें) कार्यरत हैं, जहाँ से बासमती चावल देश-विदेश में निर्यात होता है।","हरियाणा में सर्वाधिक गेहूँ व कपास उत्पादन सिरसा में और सर्वाधिक गन्ना उत्पादन यमुनानगर में होता है।","हरियाणा में 'मेरा पानी-मेरी विरासत' योजना (मई 2020) के तहत धान के स्थान पर कम पानी वाली फसलों को भी प्रोत्साहित किया जाता है।"]},
  {"q":"कैथल में स्थित 'भाई उदय सिंह का किला' किस ऐतिहासिक झील के किनारे बना हुआ है?","opts":["पुंडरीक झील","बिदक्यार झील","चिल्ली झील","बुलबुल झील"],"a":1,"exp":"कैथल रियासत के अंतिम शासक भाई उदय सिंह द्वारा निर्मित ऐतिहासिक किला कैथल शहर की प्रसिद्ध 'बिदक्यार झील' के किनारे स्थित है।","facts":["बिदक्यार झील को वामन पुराण में वर्णित 'वृद्ध केदार तीर्थ' का अपभ्रंश रूप माना जाता है।","भाई उदय सिंह का शासनकाल 1818 ई. से 1843 ई. तक रहा; 14 मई 1843 को उनका निधन हुआ था।","अन्य विकल्पों में पुंडरीक सरोवर पूंडरी (कैथल) में, चिल्ली झील फतेहाबाद में और बुलबुल झील जींद में स्थित हैं।","भाई उदय सिंह के किले में सुंदर झरोखे, बारादरी और पारंपरिक सिख-राजपूताना स्थापत्य शैली की झलक मिलती है।","हरियाणा पुरातत्व विभाग द्वारा इस ऐतिहासिक किले का संरक्षण किया गया है।"]},
  {"q":"कैथल जिले की 2026 की प्रशासनिक संरचना में कुल कितनी नगरपालिकाएँ / नगर परिषदें (शहरी स्थानीय निकाय) कार्यरत हैं?","opts":["नगर परिषद कैथल सहित कुल 6 शहरी निकाय","केवल 1 नगर निगम","केवल 2 नगरपालिकाएँ","कोई शहरी निकाय नहीं"],"a":0,"exp":"कैथल जिले में शहरी स्थानीय निकायों के रूप में 'नगर परिषद कैथल' तथा चीका, कलायत, पूंडरी, राजौंद और सीवन में नगरपालिका समितियाँ कार्यरत हैं।","facts":["वर्तमान (2026) में हरियाणा में कुल 11 नगर निगम हैं, जिनमें कैथल शामिल नहीं है (कैथल नगर परिषद है)।","हरियाणा के 11 नगर निगम: फरीदाबाद (1994), गुरुग्राम (2008), मानेसर (2020—सबसे नया), अंबाला, पंचकूला, यमुनानगर, करनाल, पानीपत, रोहतक, हिसार और सोनीपत।","शहरी स्थानीय निकायों को 74वें संविधान संशोधन अधिनियम, 1992 द्वारा संवैधानिक दर्जा दिया गया था।","2024 की नायब सिंह सैनी सरकार में हरियाणा के शहरी स्थानीय निकाय (ULB) मंत्री विपुल गोयल हैं।","कैथल जिले के सभी प्रमुख कस्बे सड़क नेटवर्क (NH-152 व NH-152D) से जुड़े हैं।"]},
  {"q":"चीनी यात्रियों 'ह्वेनसांग' और 'फाह्यान' ने अपने भारत भ्रमण के दौरान कुरुक्षेत्र के साथ हरियाणा के किस निकटवर्ती प्राचीन नगर का दौरा किया था?","opts":["रोहतक","फरीदाबाद","कैथल (कपिस्थल)","रेवाड़ी"],"a":2,"exp":"प्रसिद्ध चीनी यात्री फाह्यान (गुप्तकाल) और ह्वेनसांग (हर्षवर्धन काल) ने कुरुक्षेत्र (थानेसर) के साथ-साथ निकटवर्ती प्राचीन नगर कैथल (कपिस्थल) क्षेत्र का भी दौरा किया था।","facts":["फाह्यान (399–414 ई.) गुप्त सम्राट चंद्रगुप्त द्वितीय (विक्रमादित्य) के शासनकाल में भारत आया था।","ह्वेनसांग (629–645 ई.) वर्धन वंश के महान सम्राट हर्षवर्धन के समय भारत आया था और उसकी पुस्तक का नाम 'सी-यू-की' है।","हर्षवर्धन की प्रारंभिक राजधानी स्थानेश्वर (थानेसर, कुरुक्षेत्र) थी, जो कैथल की सीमा से सटा हुआ है।","सातवीं शताब्दी में कैथल क्षेत्र पुष्यभूति (वर्धन) साम्राज्य का अभिन्न अंग था।","चीनी यात्रियों के वृत्तांत हरियाणा के प्राचीन इतिहास व बौद्ध स्थलों के अध्ययन के प्रमुख स्रोत हैं।"]},
  {"q":"कैथल जिले के किस प्रसिद्ध स्थान पर 'गीता मंदिर' विशाल चबूतरों के पास निर्मित है?","opts":["कलायत","फरल","मुंदड़ी","पुंडरीक तीर्थ (पूंडरी)"],"a":3,"exp":"कैथल जिले के पूंडरी कस्बे में स्थित 'पुंडरीक तीर्थ / सरोवर' के विशाल चबूतरों के पास भव्य 'गीता मंदिर' निर्मित है।","facts":["पूंडरीक सरोवर का जल सतयुग से लेकर आज तक न सूखने की लोकमान्यता है।","यहाँ शिव मंदिर में संत बाबा ठंडीपुरी की समाधि और 1987 में KDB द्वारा निर्मित नागहृद कुंड भी स्थित हैं।","कैथल जिले के सभी प्रमुख धार्मिक स्थल—नवग्रह कुंड, ग्यारह रुद्री मंदिर, अंजनी टीला, कपिल मुनि आश्रम (कलायत), फल्गु तीर्थ (फरल) और लव-कुश तीर्थ (मुंदड़ी)—48 कोस कुरुक्षेत्र भूमि की अमूल्य धरोहर हैं।","कैथल जिला सार (2026): स्थापना 1 नवंबर 1989, क्षेत्रफल 2,317 वर्ग किमी, 3 उपमंडल, 4 तहसीलें, 3 उप-तहसीलें, 7 ब्लॉक, 4 विधानसभा सीटें, करनाल मंडल व कुरुक्षेत्र लोकसभा क्षेत्र।","हरियाणा अपडेटेड सार (2026): 23 जिले (23वाँ—हांसी), 6 मंडल, 5 पुलिस रेंज, 5 पुलिस कमिश्नरेट, 24 पुलिस जिले और 11 नगर निगम।"]}
];

let order = QUESTIONS.map((_, i) => i), pos = 0, answers = {};
const $ = id => document.getElementById(id);

$('totalPill').textContent = `${QUESTIONS.length} यूनिक प्रश्न`;

function render() {
  const idx = order[pos], q = QUESTIONS[idx], chosen = answers[idx];
  $('counter').textContent = `प्रश्न ${pos + 1} / ${order.length}`;
  $('qno').textContent = `प्रश्न ${idx + 1}`;
  $('question').textContent = q.q;
  $('options').innerHTML = '';

  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'option';
    b.disabled = chosen !== undefined;

    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = 'ABCD'[i];

    const txt = document.createElement('span');
    txt.textContent = o;

    b.append(letter, txt);
    if (chosen !== undefined) {
      if (i === q.a) b.classList.add('correct');
      else if (i === chosen) b.classList.add('wrong');
    }
    b.onclick = () => {
      if (answers[idx] !== undefined) return;
      answers[idx] = i;
      render();
    };
    $('options').appendChild(b);
  });

  const fb = $('feedback');
  if (chosen !== undefined) {
    fb.className = 'feedback ' + (chosen === q.a ? 'good' : 'bad');
    fb.innerHTML = '';

    const status = document.createElement('strong');
    status.textContent = chosen === q.a ? '✓ बिल्कुल सही उत्तर!' : '✗ आपका उत्तर गलत है';

    const ansDiv = document.createElement('div');
    ansDiv.innerHTML = '<b>सही उत्तर: </b>';
    const ansSpan = document.createElement('span');
    ansSpan.textContent = q.opts[q.a];
    ansDiv.appendChild(ansSpan);

    const expDiv = document.createElement('div');
    expDiv.style.marginTop = '7px';
    expDiv.innerHTML = '<b>विस्तृत व्याख्या: </b>';
    const expSpan = document.createElement('span');
    expSpan.textContent = q.exp;
    expDiv.appendChild(expSpan);

    fb.append(status, ansDiv, expDiv);

    if (Array.isArray(q.facts) && q.facts.length > 0) {
      const box = document.createElement('div');
      box.className = 'facts-box';

      const title = document.createElement('div');
      title.className = 'facts-title';
      title.textContent = '📌 परीक्षा उपयोगी अतिरिक्त तथ्य (Updated 2026):';

      const ul = document.createElement('ul');
      ul.className = 'facts-list';
      q.facts.forEach(fact => {
        const li = document.createElement('li');
        li.textContent = fact;
        ul.appendChild(li);
      });

      box.append(title, ul);
      fb.appendChild(box);
    }
  } else {
    fb.className = 'feedback hidden';
    fb.textContent = '';
  }

  $('prev').disabled = pos === 0;
  $('next').textContent = pos === order.length - 1 ? 'परिणाम देखें' : 'अगला प्रश्न';

  const done = Object.keys(answers).length;
  $('answered').textContent = `हल किए: ${done} / ${QUESTIONS.length}`;
  $('bar').style.width = (done / QUESTIONS.length * 100) + '%';
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
}

function showResult() {
  const right = QUESTIONS.filter((q, i) => answers[i] === q.a).length;
  const done = Object.keys(answers).length;
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('score').textContent = `${right} / ${QUESTIONS.length}`;
  $('summary').textContent = `आपने ${done} प्रश्न हल किए। सही: ${right}, गलत: ${done - right}, छोड़े: ${QUESTIONS.length - done}। प्रतिशत: ${(right / QUESTIONS.length * 100).toFixed(1)}%`;
}

$('prev').onclick = () => { if (pos > 0) { pos--; render(); window.scrollTo(0, 0); } };
$('next').onclick = () => { if (pos < order.length - 1) { pos++; render(); window.scrollTo(0, 0); } else showResult(); };
$('restart').onclick = () => { answers = {}; pos = 0; render(); window.scrollTo(0, 0); };
$('review').onclick = () => { pos = 0; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

render();
</script>
</body>
</html>
