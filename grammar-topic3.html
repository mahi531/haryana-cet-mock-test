<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a365d">
<title>Grammar Book | HSSC Mock Test Wala</title>
<style>
:root{
  --paper:#f3ece2;--page:#ffffff;--ink:#1f2328;--muted:#525860;
  --navy:#1a365d;--navy-soft:#eef3f9;--accent:#9a3412;
  --gold-bg:#fffaf0;--gold-border:#c98a2c;
  --ok:#146c43;--ok-bg:#edf7f1;--bad:#a61e22;--bad-bg:#fdf2f2;--line:#d6cfc4;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Noto Serif Devanagari","Mangal","Times New Roman",serif;line-height:1.78;font-size:15.5px}
.book-header{background:var(--page);border-bottom:4px double #222;padding:22px 16px 18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.book-brand{font:bold 11.5px/1 Arial,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.book-header h1{font-size:28px;letter-spacing:.8px;margin:0;color:#111}
.book-header .sub-hi{font-size:16px;color:var(--navy);font-weight:bold;margin:4px 0 2px}
.book-header .sub-meta{font:13px/1.5 Arial,sans-serif;color:var(--muted);margin:4px 0 0}
.top-nav{max-width:880px;margin:14px auto 6px;padding:0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.nav-group{display:flex;flex-wrap:wrap;gap:8px}
.btn,.top-nav a{font:bold 13px Arial,sans-serif;text-decoration:none;color:var(--navy);background:#fff;border:1px solid #b8c2cc;padding:8px 13px;border-radius:6px;cursor:pointer;transition:.15s}
.btn:hover,.top-nav a:hover{background:var(--navy-soft);border-color:var(--navy)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-primary:hover{background:#122744;color:#fff}
main{max-width:880px;margin:0 auto 48px;padding:0 12px}
.book-sheet{background:var(--page);margin:18px 0;padding:28px 34px;border:1px solid var(--line);border-left:5px solid var(--navy);box-shadow:0 4px 18px rgba(30,25,20,.07)}
.sheet-head{display:flex;align-items:flex-start;gap:13px;border-bottom:3px double #222;padding-bottom:10px;margin-bottom:18px}
.sheet-badge{background:#1c2530;color:#fff;padding:4px 12px;font:bold 15px/1.3 Arial,sans-serif;border-radius:3px;white-space:nowrap;margin-top:2px}
.sheet-badge.special{background:var(--accent)}
.sheet-titles h2{font-size:21px;margin:0;line-height:1.3;color:#111}
.sheet-titles .hi-sub{font-size:14.5px;color:var(--navy);font-weight:bold;margin-top:2px}
.def-box{font-size:16px;margin:0 0 14px;padding:11px 15px;background:#f8f6f2;border-left:3px solid #222}
.def-en{display:block;font-size:14px;color:var(--muted);margin-top:4px;font-style:italic}
.trick-box{margin:14px 0;padding:11px 15px;background:var(--navy-soft);border:1px solid #c9d9eb;border-left:4px solid var(--navy);border-radius:4px;font-size:14.5px}
.trick-box .tag{display:inline-block;font:bold 12px Arial,sans-serif;background:var(--navy);color:#fff;padding:2px 8px;border-radius:3px;margin-right:6px;vertical-align:1px}
.sec-h3{font-size:16px;color:#111;margin:20px 0 10px;padding-bottom:4px;border-bottom:1px solid #d9d3c9;font-weight:bold}
.tree-wrap{margin:16px 0;padding:16px;background:#fcfbf9;border:1px solid #ddd5c9;border-radius:6px;text-align:center}
.tree-root{display:inline-block;background:var(--navy);color:#fff;font:bold 15px Arial,sans-serif;padding:6px 22px;border-radius:4px;letter-spacing:1px}
.tree-line-v{width:2px;height:18px;background:#444;margin:0 auto}
.tree-branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:2px solid #444;padding-top:12px}
.tree-node{background:#fff;border:1px solid #bfc8d2;border-radius:5px;padding:9px 8px}
.tree-node b{display:block;color:var(--navy);font-size:14.5px}.tree-node span{font-size:13px;color:var(--muted)}
.sub-div-box{margin-top:14px;padding-top:12px;border-top:1px dashed #999}
.sub-div-title{font:bold 13px Arial,sans-serif;color:var(--accent);margin-bottom:8px;text-transform:uppercase}
.sub-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sub-pill{background:#fff;border:1px solid #d4ccc0;border-radius:4px;padding:7px 6px;font-size:13px}.sub-pill b{display:block;color:#111;font-size:13.5px}
.toc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.toc-link{display:flex;align-items:center;gap:8px;padding:8px 11px;background:#faf8f5;border:1px solid #ddd6ca;border-radius:5px;text-decoration:none;color:#1c2b3a;font-size:14px;transition:.15s}
.toc-link:hover{background:var(--navy-soft);border-color:var(--navy)}
.toc-num{font:bold 12px Arial,sans-serif;background:#222;color:#fff;padding:2px 7px;border-radius:3px;min-width:26px;text-align:center;white-space:nowrap}
.pair-card{padding:9px 13px;margin:8px 0;background:#fffdf9;border:1px solid #e6dcc8;border-left:4px solid var(--gold-border);border-radius:4px}
.pair-title{font-weight:bold;color:var(--navy);font-size:15px}.pair-tip{font-size:14px;color:#333;margin-top:2px}
.use-block{margin:10px 0 14px}.use-label{font-weight:bold;color:#1c2530;margin-bottom:6px;font-size:15px}
.ex-item{margin:6px 0;padding:8px 12px;background:#fafbfc;border:1px solid #e4e8ec;border-radius:4px}
.ex-sub{display:inline-block;font:bold 11.5px Arial,sans-serif;background:#e6edf5;color:var(--navy);padding:1px 7px;border-radius:3px;margin-right:6px}
.ex-en{font-weight:bold;color:#142840;font-size:15px}.ex-hi{color:#444;font-size:14px;margin-top:2px}
.rule-ex{margin:8px 0 6px;padding:9px 12px;background:#fff;border:1px solid #d9d4cb;border-radius:5px}
.rule-wrong{color:#b91c1c;font-weight:bold;font-size:14.5px;margin-bottom:4px}
.rule-right{color:#111111;background:#ffffff;font-weight:bold;font-size:14.5px;margin-bottom:4px}
.rule-hi{font-size:13.5px;color:#444;border-top:1px dotted #ddd;padding-top:4px;margin-top:4px}

.formula-card{margin:10px 0 14px;border:1px solid #cfd8e3;border-radius:5px;overflow:hidden}
.formula-head{background:#edf2f7;padding:7px 12px;font:bold 13.5px Arial,sans-serif;color:var(--navy);border-bottom:1px solid #cfd8e3}
.formula-table{width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px}
.formula-table td{padding:8px 12px;border-bottom:1px dotted #d4dce5;vertical-align:top}
.formula-table tr:last-child td{border-bottom:0}
.formula-table td:first-child{width:155px;font-weight:bold;color:#2b3a4a;background:#f8fafc;white-space:nowrap}
.cmp-card{margin:10px 0;padding:11px 14px;border:1px solid #e0dad0;border-radius:5px;background:#fff}
.cmp-wrong{color:var(--bad);background:var(--bad-bg);padding:5px 9px;border-radius:4px;font-weight:bold;margin-bottom:5px;font-size:14.5px}
.cmp-right{color:var(--ok);background:var(--ok-bg);padding:5px 9px;border-radius:4px;font-weight:bold;margin-bottom:6px;font-size:14.5px}
.cmp-reason{font-size:14px;color:#333;padding-left:2px}
.note-box{margin:10px 0;padding:10px 14px;background:var(--gold-bg);border:1px solid #ebd7b0;border-left:4px solid var(--gold-border);border-radius:4px;font-size:14.5px}
.cat-card{margin:8px 0;padding:9px 13px;background:#faf8f5;border:1px solid #ddd6ca;border-radius:4px}
.cat-name{font-weight:bold;color:var(--navy);font-size:14.5px}.cat-words{font-family:Georgia,serif;color:#111;margin-top:3px;font-size:14.5px}
.diagram-box{margin:14px 0;padding:14px 16px;background:#fcfbf8;border:1px solid #d8d0c3;border-radius:6px}
.diagram-title{font:bold 14px Arial,sans-serif;color:var(--accent);margin-bottom:10px;text-transform:uppercase}
.pp-grid,.fs-grid,.since-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pp-card,.fs-col,.since-tree{background:#fff;border:1px solid #cfd8e3;border-radius:5px;padding:10px 12px;font-size:13.5px}
.pp-card b,.fs-col h4{color:var(--navy)}.fs-col h4{margin:0 0 8px;font-size:15px;border-bottom:2px solid var(--navy);padding-bottom:4px}
.since-tree{margin-top:12px}.since-item{background:#f8fafc;border-left:3px solid var(--navy);padding:7px 10px;font-size:13.5px}
.pill-1{display:inline-block;background:#e6f4ea;color:#146c43;padding:2px 6px;border-radius:3px;font:bold 12.5px Arial,sans-serif}
.pill-2{display:inline-block;background:#eef3f9;color:#1a365d;padding:2px 6px;border-radius:3px;font:bold 12.5px Arial,sans-serif}
.pill-kw{display:inline-block;background:#fff3cd;color:#856404;padding:2px 6px;border-radius:3px;font:bold 12.5px Arial,sans-serif}
.rev-wrap{overflow-x:auto;margin:10px 0}
.rev-table{width:100%;border-collapse:collapse;font-size:13.5px;font-family:Arial,sans-serif}
.rev-table th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;border:1px solid var(--navy)}
.rev-table td{padding:8px 10px;border:1px solid #d5dce4;vertical-align:top}
.rev-table tr:nth-child(even) td{background:#f9fbfd}
.practice-banner{text-align:center;border-top:2px solid #222;border-bottom:2px solid #222;padding:12px;margin-bottom:14px;background:#faf8f5}
.practice-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.qcard{padding:16px 0;border-bottom:1px solid #d6cfc4}
.qtitle{font:bold 15px Arial,sans-serif;color:var(--navy);margin-bottom:6px}
.fullq{font-size:15.5px;background:#faf9f6;padding:11px 13px;margin:8px 0 10px;border:1px solid #e2dcd2;border-radius:4px;line-height:1.7}
.part sup{font:bold 11.5px Arial,sans-serif;color:var(--accent);margin-right:2px}
.option{display:block;padding:8px 11px;border:1px solid #d8dee4;margin:6px 0;border-radius:5px;font-size:14.5px;background:#fff;cursor:pointer}
.option input{margin-right:8px}.option:has(input:checked){background:var(--navy-soft);border-color:var(--navy)}
.explain{display:none;margin-top:11px;padding:12px 14px;border:1px solid #c9d6e2;border-left:4px solid var(--navy);background:#f7fafd;border-radius:4px;font-size:14.5px}
.explain.show{display:block}.right{color:var(--ok);font-weight:bold}.wrong{color:var(--bad);font-weight:bold}
.corr-box{margin:6px 0;padding:6px 10px;background:var(--ok-bg);color:var(--ok);border-radius:4px;font-weight:bold}
.score-bar{position:sticky;bottom:8px;background:#fff;border:2px solid var(--navy);border-radius:8px;padding:10px 14px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
@media(max-width:680px){
  .book-sheet{padding:20px 15px}.book-header h1{font-size:23px}.sheet-titles h2{font-size:18px}
  .toc-grid,.tree-branches,.sub-grid,.pp-grid,.fs-grid,.since-rows{grid-template-columns:1fr}
  .formula-table,.formula-table tbody,.formula-table tr,.formula-table td{display:block;width:100%}.formula-table td:first-child{width:100%;white-space:normal;border-bottom:0;padding-bottom:2px;color:var(--navy)}.formula-table td:last-child{padding-top:2px;padding-bottom:10px;border-bottom:1px solid #d4dce5}
}
@media print{
  body{background:#fff;font-size:13.5px}
  .top-nav,.score-bar,.practice-actions,.reveal{display:none!important}
  .book-sheet{box-shadow:none;border:0;border-left:0;border-bottom:1px solid #ccc;padding:12px 0;margin:0;page-break-inside:avoid}
  .explain{display:block!important}
}
</style>
</head>
<body>
<header class="book-header">
  <div class="book-brand">HSSC Mock Test Wala • English Grammar Book</div>
  <h1 id="topicTitle">GRAMMAR</h1>
  <div class="sub-hi" id="topicHi"></div>
  <p class="sub-meta" id="topicSub">हिंदी और English में सरल, किताब जैसा संपूर्ण अध्याय</p>
</header>
<nav class="top-nav">
  <div class="nav-group">
    <a href="english-grammar.html">← सभी Grammar Topics</a>
    <a href="vocabulary.html">Vocabulary &amp; Grammar</a>
    <a href="#quick-revision">Quick Revision</a>
    <a href="#practice-section">Practice Exercise</a>
  </div>
  <button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button>
</nav>
<main id="app"><section class="book-sheet">अध्याय लोड हो रहा है…</section></main>
<script>
(async()=>{
const app=document.getElementById('app');
const topic=new URLSearchParams(location.search).get('topic')||'tense';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const renderSheet=(id,badge,title,hiSub,body,isSpecial=false)=>`
<section class="book-sheet" ${id?`id="${esc(id)}"`:''}>
  <div class="sheet-head">
    <span class="sheet-badge ${isSpecial?'special':''}">${esc(badge)}</span>
    <div class="sheet-titles"><h2>${esc(title)}</h2>${hiSub?`<div class="hi-sub">${esc(hiSub)}</div>`:''}</div>
  </div>${body}</section>`;

const renderTables=tables=>(tables||[]).map(t=>`
  ${t.heading?`<div class="sec-h3">${esc(t.heading)}</div>`:''}
  <div class="rev-wrap"><table class="rev-table">
    ${t.headers?.length?`<thead><tr>${t.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>`:''}
    <tbody>${(t.rows||[]).map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`).join('');

const renderDiagram=type=>{
  if(type==='past_perfect_formations'){
    return `<div class="diagram-box"><div class="diagram-title">4 महत्वपूर्ण Sentence Formations</div><div class="pp-grid">
      <div class="pp-card"><b>1. Before (बीच में):</b><br><span class="pill-1">1st Action (Past Perfect)</span> + <span class="pill-kw">before</span> + <span class="pill-2">2nd Action (Simple Past)</span></div>
      <div class="pp-card"><b>2. Before (शुरू में):</b><br><span class="pill-kw">Before</span> + <span class="pill-2">2nd Action (Simple Past)</span>, <span class="pill-1">1st Action (Past Perfect)</span></div>
      <div class="pp-card"><b>3. After (बीच में):</b><br><span class="pill-2">2nd Action (Simple Past)</span> + <span class="pill-kw">after</span> + <span class="pill-1">1st Action (Past Perfect)</span></div>
      <div class="pp-card"><b>4. By the time:</b><br><span class="pill-kw">By the time</span> + <span class="pill-2">2nd Action (Simple Past)</span>, <span class="pill-1">1st Action (Past Perfect)</span></div>
    </div></div>`;
  }
  if(type==='by_the_time_compare'){
    return `<div class="diagram-box"><div class="diagram-title">By the time का अंतर (Future बनाम Past)</div><div class="pp-grid">
      <div class="pp-card"><b>Future संदर्भ:</b><br><span class="pill-kw">By the time</span> + <span class="pill-2">Simple Present (reach)</span>, <span class="pill-1">Future Perfect (will have left)</span><br><i>By the time I reach the station, the train will have left.</i></div>
      <div class="pp-card"><b>Past संदर्भ:</b><br><span class="pill-kw">By the time</span> + <span class="pill-2">Simple Past (reached)</span>, <span class="pill-1">Past Perfect (had left)</span><br><i>By the time I reached the station, the train had left.</i></div>
    </div></div>`;
  }
  if(type==='for_since_tree'){
    return `<div class="diagram-box"><div class="diagram-title">For और Since का सही प्रयोग</div><div class="fs-grid">
      <div class="fs-col"><h4>FOR — समय की अवधि (Period of Time)</h4><div>➤ जब समय की कुल अवधि (गिनती) का उल्लेख हो, तब <b>For</b> लगाएँ।</div><div style="margin-top:6px">• For two hours, for last 2 years<br>• For five days, for last 2 months<br>• For 10 years, for last 3 weeks</div></div>
      <div class="fs-col"><h4>SINCE — शुरुआती समय (Point of Time)</h4><div>➤ जब काम शुरू होने के निश्चित बिंदु का उल्लेख हो, तब <b>Since</b> लगाएँ।</div><div style="margin-top:6px">• Since Monday, since the beginning<br>• Since 2008, since time immemorial<br>• Since 7 P.M., since last year</div></div>
    </div><div class="since-tree"><b>SINCE का प्रयोग — कैलेंडर, घड़ी, दिन के पहर एवं जीवन की अवस्थाओं के साथ:</b><div class="since-rows">
      <div class="since-item"><b>Calendar:</b> Days (Monday), Dates (7th May), Years (2005), Months (May), Occasions (Holi, Diwali)</div>
      <div class="since-item"><b>Clock, Life &amp; Day:</b> Clock (7 o'clock), Stages of life (Childhood), Part of day (Morning, last night)</div>
    </div></div></div>`;
  }
  return '';
};

try{
  const res=await fetch(topic+'.json?v='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw Error(topic+'.json फाइल नहीं मिली');
  const d=await res.json();
  document.getElementById('topicTitle').textContent=(d.topic_name||'GRAMMAR').toUpperCase();
  document.getElementById('topicHi').textContent=d.topic_name_hi||'';
  document.getElementById('topicSub').textContent=d.subtitle||'हिंदी और English में सरल व्याख्या • Rules • Practice';
  document.title=(d.topic_name||'Grammar')+' | HSSC Mock Test Wala';

  let html='';
  const ov=d.overview||{},sections=d.sections||[];
  let introBody=`<div class="def-box"><b>परिभाषा:</b> ${esc(ov.definition_hi||'')}${ov.definition_en?`<span class="def-en">${esc(ov.definition_en)}</span>`:''}</div>`;
  if(ov.simple_trick_hi)introBody+=`<div class="trick-box"><span class="tag">आसान भाषा में</span> ${esc(ov.simple_trick_hi)}</div>`;
  if(ov.main_types?.length){
    introBody+=`<div class="tree-wrap"><div class="tree-root">${esc((d.topic_name||'TOPIC').toUpperCase())}</div><div class="tree-line-v"></div>
      <div class="tree-branches">${ov.main_types.map(t=>`<div class="tree-node"><b>${esc(t.en||t)}</b>${t.hi?`<span>${esc(t.hi)}</span>`:''}</div>`).join('')}</div>
      ${ov.sub_types?.length?`<div class="sub-div-box"><div class="sub-div-title">प्रत्येक के 4 उप-विभाजन (Sub-Divisions)</div>
      <div class="sub-grid">${ov.sub_types.map(s=>`<div class="sub-pill"><b>${esc(s.en||s)}</b>${s.hi?`<span>${esc(s.hi)}</span>`:''}</div>`).join('')}</div></div>`:''}</div>`;
  }
  if(ov.tables?.length)introBody+=renderTables(ov.tables);
  if(ov.important_note_hi)introBody+=`<div class="note-box"><b>नोट:</b> ${esc(ov.important_note_hi)}</div>`;
  if(ov.confusing_pairs?.length){
    introBody+=`<div class="sec-h3">CONFUSING PAIRS (भ्रमित करने वाले प्रमुख जोड़े)</div>`+
      ov.confusing_pairs.map((p,idx)=>`<div class="pair-card"><div class="pair-title">(${idx+1}) ${esc(p.pair||(Array.isArray(p)?p[0]+' और '+p[1]:''))}</div>${p.tip_hi?`<div class="pair-tip">➤ ${esc(p.tip_hi)}</div>`:''}</div>`).join('');
  }
  if(sections.length){
    introBody+=`<div class="sec-h3">विषय-सूची (इस अध्याय में क्या पढ़ें)</div><div class="toc-grid">
      ${sections.map(s=>`<a class="toc-link" href="#${esc(s.id)}"><span class="toc-num">${esc(s.badge)}</span><span>${esc(s.title)}</span></a>`).join('')}
      ${d.quick_revision?.length?`<a class="toc-link" href="#quick-revision"><span class="toc-num">REV</span><span>Quick Revision Table</span></a>`:''}
      ${d.practice?.questions?.length?`<a class="toc-link" href="#practice-section"><span class="toc-num">EX</span><span>Spotting the Error (${d.practice.questions.length} प्रश्न)</span></a>`:''}
    </div>`;
  }
  html+=renderSheet('intro','परिचय',(d.topic_name||'TOPIC')+' — परिचय एवं रूपरेखा',d.topic_name_hi||'',introBody);

  sections.forEach(s=>{
    let body='';
    if(s.definition_hi)body+=`<div class="def-box">➤ ${esc(s.definition_hi)}</div>`;
    if(s.simple_trick_hi)body+=`<div class="trick-box"><span class="tag">आसान ट्रिक</span> ${esc(s.simple_trick_hi)}</div>`;
    if(s.tables?.length)body+=renderTables(s.tables);
    if(s.uses?.length){
      body+=`<div class="sec-h3">नियम एवं उदाहरण (Rules &amp; Examples)</div>`+s.uses.map(u=>`<div class="use-block"><div class="use-label">${esc(u.label)}</div>
        ${(u.items||[]).map(it=>`<div class="ex-item"><div>${it.sub?`<span class="ex-sub">${esc(it.sub)}</span>`:''}<span class="ex-en">${esc(it.en)}</span></div>${it.hi?`<div class="ex-hi">${esc(it.hi)}</div>`:''}</div>`).join('')}
        ${(u.examples||[]).map(ex=>`<div class="rule-ex">
          ${ex.wrong?`<div class="rule-wrong">✗ ${esc(ex.wrong)}</div>`:''}
          ${ex.right?`<div class="rule-right">✓ ${esc(ex.right)}</div>`:''}
          ${ex.hi?`<div class="rule-hi">${esc(ex.hi)}</div>`:''}
        </div>`).join('')}
      </div>`).join('');
    }
    if(s.verb_categories?.length){
      body+=`<div class="sec-h3">महत्वपूर्ण शब्दों की सूची</div>`+s.verb_categories.map(c=>`<div class="cat-card"><div class="cat-name">${esc(c.name)}</div><div class="cat-words">${esc(c.words)}</div></div>`).join('');
    }
    if(s.diagram_type)body+=renderDiagram(s.diagram_type);
    if(s.formula_groups?.length){
      body+=`<div class="sec-h3">विस्तृत नियम एवं वाक्य संरचना (Rules &amp; Formulae)</div>`+s.formula_groups.map(fg=>`<div class="formula-card"><div class="formula-head">${esc(fg.heading)}</div>
        <table class="formula-table">${(fg.rows||[]).map(r=>`<tr><td>${esc(r.type)}</td><td>${esc(r.rule)}</td></tr>`).join('')}</table></div>`).join('');
    }
    if(s.examples?.length){
      body+=`<div class="sec-h3">उदाहरण (Examples)</div>`+s.examples.map(e=>{
        const hiText=e.hi||e[1]||'';
        const hiClean=/^(अर्थ:|हिंदी अर्थ:)/.test(hiText.trim())?hiText:`हिंदी अर्थ: ${hiText}`;
        return `<div class="ex-item"><div class="ex-en">➤ ${esc(e.en||e[0])}</div>${hiText?`<div class="ex-hi">${esc(hiClean)}</div>`:''}</div>`;
      }).join('');
    }
    if(s.comparisons?.length){
      body+=`<div class="sec-h3">सही (✓) बनाम गलत (✗) — परीक्षा के महत्वपूर्ण उदाहरण</div>`+s.comparisons.map(c=>`<div class="cmp-card">
        <div class="cmp-wrong">✗ ${esc(c.wrong)}</div><div class="cmp-right">✓ ${esc(c.right)}</div>
        ${c.reason_hi?`<div class="cmp-reason"><b>व्याख्या:</b> ${esc(c.reason_hi)}</div>`:''}</div>`).join('');
    }
    if(s.notes?.length){
      body+=`<div class="sec-h3">महत्वपूर्ण नोट्स (Important Notes)</div>`+s.notes.map(n=>`<div class="note-box">➤ ${esc(n)}</div>`).join('');
    }
    const isSpec=String(s.badge).includes('विशेष');
    html+=renderSheet(s.id,s.badge,s.title,s.title_hi||'',body,isSpec);
  });

  if(d.quick_revision?.length){
    const hdr=d.quick_revision_headers||['नियम / भाग','Formula / Verb','पहचान / Signal Words','Example'];
    const revBody=`<div class="rev-wrap"><table class="rev-table">
      <thead><tr>${hdr.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${d.quick_revision.map(r=>`<tr><td><b>${esc(r.tense)}</b></td><td><b>${esc(r.formula||r.core)}</b></td><td>${esc(r.signal)}</td><td><i>${esc(r.example||'')}</i></td></tr>`).join('')}</tbody>
    </table></div>`;
    html+=renderSheet('quick-revision','REV','QUICK REVISION TABLE',d.quick_revision_title||'एक नज़र में पूरे अध्याय का सार',revBody,true);
  }

  const qs=d.practice?.questions||[];
  if(qs.length){
    let qbody=`<div class="practice-banner"><b>${esc(d.practice.title||'SPOTTING THE ERROR')}</b><br>
      <span>${esc(d.practice.instructions_hi||'प्रत्येक वाक्य में त्रुटि वाला भाग चुनें।')}</span><br>
      <small style="color:#555">कुल प्रश्न: ${qs.length}</small>
      <div class="practice-actions"><button class="btn" id="showAllBtn" type="button">सभी उत्तर एवं व्याख्या देखें</button><button class="btn" id="hideAllBtn" type="button">व्याख्या छिपाएँ</button></div></div>`;
    if(d.practice.omitted_note)qbody+=`<div class="note-box">${esc(d.practice.omitted_note)}</div>`;
    const letters='abcde';
    qbody+=qs.map((q,i)=>{
      const parts=q.parts||[],noErrLetter=letters[parts.length];
      const full=parts.map((x,j)=>`<span class="part"><sup>(${letters[j]})</sup> ${esc(x)}</span>`).join(' / ')+` / <span class="part"><sup>(${noErrLetter})</sup> No error</span>`;
      const options=parts.map((x,j)=>`<label class="option"><input type="radio" name="q${i}" value="${letters[j]}"><b>(${letters[j].toUpperCase()})</b> ${esc(x)}</label>`).join('')+
        `<label class="option"><input type="radio" name="q${i}" value="${noErrLetter}"><b>(${noErrLetter.toUpperCase()})</b> No error — कोई गलती नहीं</label>`;
      return `<div class="qcard" data-answer="${esc(q.answer)}" data-noerr="${noErrLetter}" data-corr="${esc(q.correction||'')}" data-exp="${esc(q.explanation_hi||'')}">
        <div class="qtitle">प्रश्न ${esc(q.number||i+1)}.</div><div class="fullq">${full}.</div>${options}
        <button class="btn reveal" type="button" style="margin-top:8px">उत्तर और व्याख्या देखें</button><div class="explain" aria-live="polite"></div></div>`;
    }).join('');
    qbody+=`<div class="score-bar"><b id="score">अभी तक सही: 0 / 0</b><button class="btn" id="resetBtn" type="button">दोबारा अभ्यास करें</button></div>`;
    html+=renderSheet('practice-section','अभ्यास','PRACTICE EXERCISE — SPOTTING THE ERROR','परीक्षा-स्तरीय अभ्यास प्रश्न (उत्तर एवं हिंदी व्याख्या सहित)',qbody,true);
  }

  app.innerHTML=html;
  let score=0,done=new Set();
  const buildExpHTML=(card,selVal)=>{
    const key=card.dataset.answer,noErr=card.dataset.noerr,corr=card.dataset.corr,exp=card.dataset.exp;
    const correctLabel=key===noErr?`(${key.toUpperCase()}) No error`:`(${key.toUpperCase()})`;
    let status=selVal?`<div class="${selVal===key?'right':'wrong'}">${selVal===key?'✓ आपका उत्तर बिल्कुल सही है!':'✗ आपका उत्तर गलत है।'}</div>`:'';
    return `${status}<div style="margin-top:4px"><b>सही उत्तर:</b> ${correctLabel}</div>${corr?`<div class="corr-box">सही रूप: ${esc(corr)}</div>`:''}<div><b>व्याख्या:</b> ${esc(exp)}</div>`;
  };
  document.querySelectorAll('.reveal').forEach(btn=>btn.addEventListener('click',()=>{
    const card=btn.closest('.qcard'),sel=card.querySelector('input:checked'),box=card.querySelector('.explain');
    if(!sel){box.innerHTML='<span class="wrong">पहले कोई एक विकल्प चुनें।</span>';box.classList.add('show');return}
    const n=card.querySelector('.qtitle').textContent;
    if(!done.has(n)){done.add(n);if(sel.value===card.dataset.answer)score++}
    box.innerHTML=buildExpHTML(card,sel.value);box.classList.add('show');
    document.getElementById('score').textContent=`सही उत्तर: ${score} / ${done.size} हल किए गए`;
  }));
  document.getElementById('showAllBtn')?.addEventListener('click',()=>{
    document.querySelectorAll('.qcard').forEach(card=>{const sel=card.querySelector('input:checked'),box=card.querySelector('.explain');box.innerHTML=buildExpHTML(card,sel?sel.value:null);box.classList.add('show')});
  });
  document.getElementById('hideAllBtn')?.addEventListener('click',()=>document.querySelectorAll('.explain').forEach(b=>b.classList.remove('show')));
  document.getElementById('resetBtn')?.addEventListener('click',()=>{
    document.querySelectorAll('.qcard input').forEach(x=>x.checked=false);
    document.querySelectorAll('.explain').forEach(x=>{x.classList.remove('show');x.innerHTML=''});
    score=0;done.clear();document.getElementById('score').textContent='अभी तक सही: 0 / 0';
  });
}catch(e){
  app.innerHTML=`<section class="book-sheet"><h2>सामग्री लोड नहीं हो सकी</h2><p>${esc(e.message)}</p><p>कृपया सुनिश्चित करें कि <b>${esc(topic)}.json</b> इसी फ़ोल्डर में मौजूद है।</p></section>`;
}
})();
</script>
</body>
</html>
