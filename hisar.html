<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345a">
<title>हिसार जिला GK Quiz (Updated 2026) | HSSC Mock Test Wala</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#142238;--muted:#637083;--blue:#174a82;--line:#dce4ee;--green:#16834a;--red:#c33434}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.58}
.wrap{max-width:850px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#12345a,#2872a8);color:#fff;border-radius:18px;padding:22px 18px;margin:4px 0 14px;text-align:center}
.hero h1{margin:0 0 6px;font-size:25px}
.hero p{margin:0;color:#e6f1ff;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.pill{background:#ffffff20;border:1px solid #ffffff45;padding:6px 10px;border-radius:20px;font-size:12.5px}
.toolbar,.panel,.question{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.progress{height:8px;background:#e6edf5;border-radius:10px;overflow:hidden;flex:1;min-width:120px}
.bar{height:100%;background:#26966a;width:0;transition:width .2s}
.small{font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}
.btn-light{background:#eaf0f7;color:#183654}
button:disabled{opacity:.45;cursor:not-allowed}
.question{padding:17px;box-shadow:0 2px 8px #12345a10}
.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.qtext{font-size:18.5px;font-weight:700;margin:12px 0}
.option{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:8px 0;padding:12px;border-radius:11px;font-weight:500;font-size:15.5px}
.option .letter{flex:0 0 27px;height:27px;border-radius:50%;background:#edf2f8;display:grid;place-items:center;font-weight:700;color:#25496d}
.option.correct{border:2px solid var(--green);background:#eaf8ef}
.option.wrong{border:2px solid var(--red);background:#fff0f0}
.option:disabled{cursor:default;opacity:1}
.feedback{margin-top:13px;padding:14px;border-radius:12px;background:#edf3fa;border-left:4px solid var(--blue)}
.feedback.good{background:#eaf8ef;border-color:var(--green)}
.feedback.bad{background:#fff0f0;border-color:var(--red)}
.feedback strong{display:block;margin-bottom:5px;font-size:16px}
.facts-box{margin-top:12px;padding:11px 13px;background:#ffffffc7;border:1px solid #d5e0ec;border-radius:10px}
.facts-title{font-weight:700;color:var(--blue);font-size:14.5px;margin-bottom:6px}
.facts-list{margin:0;padding-left:18px;font-size:14px;color:#1e293b}
.facts-list li{margin-bottom:5px;line-height:1.55}
.facts-list li:last-child{margin-bottom:0}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.actions button{flex:1}
.hidden{display:none!important}
.result{text-align:center;padding:20px}
.score{font-size:40px;font-weight:800;color:var(--blue)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:520px){
  .wrap{padding:10px}
  .hero h1{font-size:21px}
  .qtext{font-size:17px}
  .question{padding:13px}
  .facts-list{font-size:13.5px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>हिसार जिला — विस्तृत GK Quiz</h1>
    <p>HSSC CET • Group C • Group D • अपडेटेड हरियाणा सामान्य ज्ञान (2026)</p>
    <div class="stats">
      <span class="pill" id="totalPill">90 यूनिक प्रश्न</span>
      <span class="pill">2026 अपडेटेड डेटा</span>
      <span class="pill">तुरंत सही/गलत</span>
      <span class="pill">5 Exam Facts</span>
    </div>
  </header>

  <section class="toolbar">
    <div>
      <b id="counter">प्रश्न 1 / 90</b>
      <div class="small" id="answered">हल किए: 0</div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <button class="btn-light" id="restart">रीस्टार्ट</button>
  </section>

  <section class="question" id="quiz">
    <div class="qtop">
      <span>हिसार जिला GK</span>
      <span id="qno">प्रश्न 1</span>
    </div>
    <div class="qtext" id="question"></div>
    <div id="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="actions">
      <button class="btn-light" id="prev">पिछला प्रश्न</button>
      <button id="next">अगला प्रश्न</button>
    </div>
  </section>

  <section class="panel result hidden" id="result">
    <h2>आपका परिणाम</h2>
    <div class="score" id="score"></div>
    <p id="summary"></p>
    <button id="review">प्रश्नों की समीक्षा करें</button>
  </section>

  <div class="footer">HSSC Mock Test Wala • हिसार जिला GK (2026 Updated)</div>
</main>

<script>
const QUESTIONS = [
  {"q":"हिसार जिले की स्थापना कब हुई थी?","opts":["15 अगस्त 1979","1 नवंबर 1966","22 दिसंबर 1972","15 जुलाई 1997"],"a":1,"exp":"हिसार 1 नवंबर 1966 को हरियाणा राज्य के गठन के समय बने मूल 7 जिलों में शामिल था।","facts":["1 नवंबर 1966 को हरियाणा के गठन के समय बने 7 मूल जिले: हिसार, रोहतक, करनाल, अंबाला, गुरुग्राम, जींद और महेंद्रगढ़।","हिसार से ही अलग करके भिवानी (1972), सिरसा (1975), फतेहाबाद (1997) और हांसी (22 दिसंबर 2025) जिले बनाए गए।","वर्तमान (2026) में हरियाणा में कुल 23 जिले हैं, जिनमें हांसी राज्य का 23वाँ और सबसे नवीनतम जिला है।","हिसार स्वयं एक प्रशासनिक मंडल (Division) और पुलिस रेंज का मुख्यालय है।","हिसार जिले के प्रमुख वाहन पंजीकरण कोड HR-20 (हिसार) और HR-80 (बरवाला) हैं।"]},
  {"q":"1 नवंबर 1966 को हरियाणा के गठन के समय क्षेत्रफल की दृष्टि से सबसे बड़ा जिला कौन-सा था?","opts":["हिसार","रोहतक","करनाल","अंबाला"],"a":0,"exp":"1966 में हरियाणा के गठन के समय बने 7 जिलों में हिसार क्षेत्रफल के हिसाब से सबसे बड़ा जिला था।","facts":["1966 में गठन के समय हरियाणा का सबसे छोटा जिला जींद था।","समय के साथ हिसार से चार नए जिले (भिवानी, सिरसा, फतेहाबाद और हांसी) बनाए जाने के बाद इसका क्षेत्रफल घटकर 2,633.24 वर्ग किमी रह गया।","वर्तमान (2026) में क्षेत्रफल की दृष्टि से हरियाणा का सबसे बड़ा जिला सिरसा (4,277 वर्ग किमी) है।","वर्तमान (2026) में क्षेत्रफल की दृष्टि से हरियाणा का सबसे छोटा जिला फरीदाबाद (741 वर्ग किमी) है।","हरियाणा का कुल क्षेत्रफल 44,212 वर्ग किमी है, जो भारत के कुल क्षेत्रफल का लगभग 1.34% है।"]},
  {"q":"हिसार शहर की स्थापना 1354 ईस्वी में किस सुल्तान ने की थी?","opts":["अलाउद्दीन खिलजी","इब्राहिम लोदी","फिरोजशाह तुगलक","गयासुद्दीन बलबन"],"a":2,"exp":"हिसार शहर की स्थापना 14वीं शताब्दी (1354 ई.) में दिल्ली सल्तनत के सुल्तान फिरोजशाह तुगलक ने की थी।","facts":["फिरोजशाह तुगलक ने इस नगर को 'हिसार-ए-फिरोजा' नाम दिया था, जिसका अर्थ 'फिरोज का किला' होता है।","फिरोजशाह तुगलक ने 1351–52 ई. में अपने पुत्र फतेह खान के नाम पर फतेहाबाद और फिरोजपुर झिरका भी बसाए थे।","सुल्तान ने हिसार क्षेत्र में सिंचाई और पेयजल के लिए यमुना व घग्घर से कई नहरें खुदवाई थीं।","हिसार के पुराने किले में गुजरी महल और लाट की मस्जिद फिरोजशाह तुगलक के प्रमुख निर्माण हैं।","फिरोजशाह तुगलक का शासनकाल दिल्ली सल्तनत में 1351 से 1388 ईस्वी तक रहा।"]},
  {"q":"अरबी और फारसी भाषा में 'हिसार' शब्द का क्या अर्थ होता है?","opts":["व्यापारिक मंडी","नहरों का संगम","सफेद पहाड़ी","किला या घेरा"],"a":3,"exp":"हिसार अरबी व फारसी मूल का शब्द है, जिसका अर्थ 'किला' या 'घेरा' (दुर्ग) होता है।","facts":["फिरोजशाह तुगलक द्वारा बसाया गया हिसार नगर एक मजबूत चारदीवारी से घिरा था, जिसमें चार ऐतिहासिक द्वार थे।","ये चार द्वार नागोरी गेट, मोरी गेट, दिल्ली गेट और तलाकी गेट के नाम से प्रसिद्ध हैं।","अन्य जिलों के नामकरण: फतेहाबाद (फतेह खान), भिवानी (भानी देवी), चरखी दादरी (दादुर/मेंढक) और गुरुग्राम (गुरु द्रोणाचार्य)।","हिसार को 'स्टील सिटी', 'इस्पात नगरी', 'मैग्नेट सिटी' और 'जिंदल नगरी' के उपनामों से जाना जाता है।","हिसार का पिन कोड 125001 है।"]},
  {"q":"महर्षि पाणिनि के प्रसिद्ध संस्कृत ग्रंथ 'अष्टाध्यायी' में हिसार क्षेत्र का उल्लेख किस प्राचीन नाम से मिलता है?","opts":["अग्रोदका","इसुकार","सैरीषक","इकादार"],"a":1,"exp":"महर्षि पाणिनि के ग्रंथ 'अष्टाध्यायी' में 'इसुकार' (सुगंधक) नामक स्थान का उल्लेख है, जिसे इतिहासकार हिसार का प्राचीन नाम मानते हैं।","facts":["अन्य विकल्पों में 'अग्रोदका' अग्रोहा का, 'सैरीषक' सिरसा का और 'इकादार' फतेहाबाद का प्राचीन नाम था।","पाणिनि की अष्टाध्यायी में टोहाना के लिए 'ताशान्या' और यमुनानगर के सुघ के लिए 'श्रुघ्न' नाम का उल्लेख मिलता है।","रोहतक का प्राचीन नाम रोहिताशगढ़, जींद का जयंतपुरी और कैथल का कपिस्थल था।","हांसी (नवगठित 23वाँ जिला) का प्राचीन नाम 'असिका' (असीगढ़) था।","HSSC की परीक्षाओं में हरियाणा के शहरों के प्राचीन नाम नियमित रूप से पूछे जाते हैं।"]},
  {"q":"किस मुगल सम्राट के शासनकाल में 'हिसार-ए-फिरोजा' से 'फिरोजा' शब्द हट गया और यह केवल 'हिसार' कहलाने लगा?","opts":["अकबर","बाबर","शाहजहाँ","औरंगजेब"],"a":0,"exp":"मुगल सम्राट अकबर के शासनकाल में इस नगर के नाम से 'फिरोजा' शब्द हटा दिया गया और यह केवल 'हिसार' के नाम से प्रसिद्ध हुआ।","facts":["मुगल काल में हिसार दिल्ली सूबे की एक प्रमुख 'सरकार' (प्रशासनिक इकाई) थी, जिसका उल्लेख अबुल फजल की 'आइन-ए-अकबरी' में मिलता है।","1526 में पानीपत के प्रथम युद्ध से पहले बाबर के पुत्र हुमायूँ ने हिसार-ए-फिरोजा पर अधिकार किया था।","अकबर के समय हिसार क्षेत्र में कृषि राजस्व व्यवस्था (दहसाला प्रणाली) लागू की गई थी।","हिसार के अग्रोहा व बरवाला क्षेत्र से मुगलकालीन शिव प्रतिमाएँ भी प्राप्त हुई हैं।","मुगल साम्राज्य के पतन के बाद 18वीं सदी में यहाँ मराठों, भट्टी राजपूतों और जॉर्ज थॉमस का प्रभाव रहा।"]},
  {"q":"हरियाणा के किस जिले को 'स्टील सिटी', 'मैग्नेट सिटी' और 'जिंदल नगरी' कहा जाता है?","opts":["फरीदाबाद","भिवानी","हिसार","पानीपत"],"a":2,"exp":"विशाल स्टेनलेस स्टील व लौह उद्योगों के कारण हिसार को 'स्टील सिटी', 'मैग्नेट सिटी' और 'जिंदल नगरी' कहा जाता है।","facts":["ओम प्रकाश जिंदल द्वारा स्थापित जिंदल स्टेनलेस (JSL) के कारण हिसार एशिया के सबसे बड़े स्टेनलेस स्टील केंद्रों में शामिल है।","हिसार भारत का सबसे बड़ा जस्ती लोहा (Galvanized Iron) उत्पादक केंद्र भी है।","हिसार में एशिया की सबसे बड़ी 'ऑटो मार्केट' स्थित है।","अन्य जिलों के उपनाम: गुरुग्राम (साइबर सिटी), फरीदाबाद (औद्योगिक नगरी), अंबाला (साइंटिफिक सिटी) और पानीपत (बुनकर नगरी)।","हिसार शहर में जिंदल समूह द्वारा निर्मित प्रसिद्ध 'जिंदल पार्क' और ऊँचा जिंदल टावर प्रमुख दर्शनीय स्थल हैं।"]},
  {"q":"दिसंबर 2025 में हांसी जिला अलग होने के बाद वर्तमान हिसार जिले का क्षेत्रफल कितना है?","opts":["3,983 वर्ग किमी","1,349.76 वर्ग किमी","4,277 वर्ग किमी","2,633.24 वर्ग किमी"],"a":3,"exp":"22 दिसंबर 2025 को हांसी को 1,349.76 वर्ग किमी क्षेत्रफल देकर 23वाँ जिला बनाए जाने के बाद वर्तमान हिसार जिले का क्षेत्रफल 2,633.24 वर्ग किलोमीटर है।","facts":["विभाजन से पूर्व अविभाजित हिसार का क्षेत्रफल 3,983 वर्ग किमी था।","22 दिसंबर 2025 को अधिसूचित हांसी जिले के पहले उपायुक्त (DC) राहुल नरवाल (IAS) बनाए गए।","वर्तमान (2026) में क्षेत्रफल के अनुसार हरियाणा का सबसे बड़ा जिला सिरसा (4,277 वर्ग किमी) और सबसे छोटा फरीदाबाद (741 वर्ग किमी) है।","हांसी, रोहतक और चरखी दादरी हरियाणा के 3 ऐसे जिले हैं जिनकी सीमा किसी अन्य राज्य से नहीं लगती।","वर्तमान हिसार जिले की पश्चिमी सीमा राजस्थान राज्य से लगती है।"]},
  {"q":"वर्तमान हिसार जिले के पश्चिम में किस राज्य की सीमा लगती है?","opts":["पंजाब","राजस्थान","उत्तर प्रदेश","हिमाचल प्रदेश"],"a":1,"exp":"हिसार हरियाणा के पश्चिमी भाग में स्थित है और इसके पश्चिम में राजस्थान (हनुमानगढ़ व चूरू क्षेत्र) की सीमा लगती है।","facts":["वर्तमान (2026) हिसार जिले की सीमाएँ: उत्तर में फतेहाबाद, पूर्व में जींद व हांसी, दक्षिण में भिवानी व हांसी और पश्चिम में राजस्थान।","हरियाणा के कुल 7 जिले राजस्थान के साथ सीमा साझा करते हैं: सिरसा, फतेहाबाद, हिसार, भिवानी, महेंद्रगढ़, रेवाड़ी और नूंह।","हरियाणा की सर्वाधिक लंबी अंतरराज्यीय सीमा राजस्थान (1,262 किमी) के साथ लगती है।","राजस्थान के थार मरुस्थल के निकट होने के कारण हिसार में शुष्क व अर्ध-शुष्क जलवायु पाई जाती है।","हिसार का आदमपुर व बालसमंद क्षेत्र राजस्थान सीमा के सबसे निकट स्थित हैं।"]},
  {"q":"हरियाणा में सर्वाधिक गर्मी और सर्दियों में सर्वाधिक ठंड मुख्यतः किस जिले में दर्ज की जाती है?","opts":["हिसार","पंचकूला","अंबाला","यमुनानगर"],"a":0,"exp":"समुद्र से अधिक दूरी और थार मरुस्थल के निकट होने के कारण हिसार में गर्मियों में तापमान 48°C तक और सर्दियों में शून्य के निकट पहुँच जाता है।","facts":["हिसार और सिरसा हरियाणा के सबसे कम वर्षा वाले जिलों में शामिल हैं।","जबकि हरियाणा में सर्वाधिक वर्षा उत्तर-पूर्वी जिलों (पंचकूला, यमुनानगर, अंबाला) में होती है—छछरौली (यमुनानगर) को 'हरियाणा का चेरापूंजी' कहते हैं।","डॉ. कोपेन के जलवायु वर्गीकरण के अनुसार हिसार 'अर्ध-शुष्क स्टेपी (BSh)' जलवायु क्षेत्र में आता है।","गर्मियों में यहाँ चलने वाली गर्म व शुष्क हवाओं को 'लू' कहा जाता है।","सर्दियों में पश्चिमी विक्षोभ से होने वाली हल्की वर्षा को 'मावठ' कहते हैं, जो गेहूँ व सरसों के लिए लाभदायक होती है।"]},
  {"q":"1960 के दशक में हरियाणा के किस जिले की प्रति व्यक्ति आय पूरे भारत में सर्वाधिक रही थी?","opts":["गुरुग्राम","फरीदाबाद","हिसार","करनाल"],"a":2,"exp":"हरित क्रांति और विशाल कृषि-पशुधन उत्पादन के दौर में 1960 के दशक में हिसार की प्रति व्यक्ति आय पूरे भारत में सर्वाधिक थी।","facts":["वर्तमान समय में हरियाणा में सर्वाधिक प्रति व्यक्ति आय वाला जिला गुरुग्राम है।","हिसार में हरित क्रांति को गति देने में 1970 में स्थापित चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय (CCS HAU) का ऐतिहासिक योगदान रहा।","हिसार को आधुनिक कृषि, डेयरी, इस्पात उद्योग और ऑटो मार्केट ने मजबूत आर्थिक आधार दिया है।","हिसार को राष्ट्रीय राजधानी क्षेत्र (NCR) पर जनसंख्या का दबाव कम करने हेतु 'काउंटर मैग्नेट सिटी' के रूप में भी चुना गया था।","वर्तमान में महाराजा अग्रसेन हवाई अड्डे के शुरू होने से हिसार में औद्योगिक निवेश तेजी से बढ़ रहा है।"]},
  {"q":"ब्रिटिश शासनकाल में हिसार नगरपालिका का औपचारिक गठन व अध्ययन किस वर्ष किया गया था?","opts":["1843 ई.","1857 ई.","1887 ई.","1867 ई."],"a":3,"exp":"हिसार नगरपालिका का गठन वर्ष 1867 ईस्वी में किया गया था, जिसके विवरण में हिसार के चारों ऐतिहासिक द्वारों का उल्लेख मिलता है।","facts":["बाद में वर्ष 1889–1892 के दौरान पंजाब केसरी लाला लाजपत राय ने हिसार नगरपालिका के सचिव (Secretary) के रूप में भी सेवा दी थी।","मार्च 2010 में हरियाणा सरकार ने हिसार को 'नगर निगम' (Municipal Corporation) का दर्जा प्रदान किया।","वर्तमान (2026) में हरियाणा में कुल 11 नगर निगम हैं: फरीदाबाद (पहला, 1994), गुरुग्राम, मानेसर (11वाँ, 2020), हिसार, रोहतक, करनाल, पानीपत, सोनीपत, अंबाला, पंचकूला और यमुनानगर।","1832 ई. में ब्रिटिश प्रशासन ने हिसार को जिला मुख्यालय बनाया था।","शहरी स्थानीय निकायों को 74वें संविधान संशोधन अधिनियम, 1992 द्वारा संवैधानिक दर्जा मिला।"]},
  {"q":"हांसी जिला अलग होने के बाद वर्तमान (2026) में हिसार जिले में कुल कितनी तहसीलें हैं?","opts":["5","3","4","6"],"a":1,"exp":"हांसी और नारनौंद तहसीलों के नए हांसी जिले में जाने के बाद वर्तमान हिसार जिले में 3 तहसीलें—हिसार, बरवाला और आदमपुर—हैं।","facts":["वर्तमान हिसार जिले में 2 उपमंडल (हिसार और बरवाला) और 2 उप-तहसीलें (उकलाना और बालसमंद) हैं।","तहसील स्तर पर राजस्व कार्यों का प्रमुख अधिकारी तहसीलदार और उपमंडल का प्रमुख SDM होता है।","आदमपुर तहसील पूर्व मुख्यमंत्री चौधरी भजनलाल की राजनीतिक कर्मभूमि रही है।","बरवाला तहसील में 1,200 मेगावाट का राजीव गांधी थर्मल पावर प्लांट (खेदड़) स्थित है।","वर्तमान (2026) में पूरे हरियाणा में लगभग 94 राजस्व तहसीलें और 50 उप-तहसीलें हैं।"]},
  {"q":"निम्नलिखित में से कौन-सी दो उप-तहसीलें वर्तमान (2026) हिसार जिले के अंतर्गत आती हैं?","opts":["उकलाना और बालसमंद","बास और खेड़ी जालब","भूना और जाखल","बहल और कैरू"],"a":0,"exp":"उकलाना और बालसमंद वर्तमान हिसार जिले की दो उप-तहसीलें हैं।","facts":["बास और खेड़ी जालब अब नवगठित 23वें जिले 'हांसी' के अंतर्गत आते हैं।","भूना व जाखल फतेहाबाद जिले में तथा बहल व कैरू भिवानी जिले में स्थित हैं।","उकलाना हिसार जिले की एकमात्र अनुसूचित जाति (SC) आरक्षित विधानसभा सीट भी है।","उकलाना क्षेत्र के फरीदपुर गाँव से ही विश्व प्रसिद्ध पर्वतारोही अनीता कुंडू संबंधित हैं।","उप-तहसील स्तर पर राजस्व व प्रमाण-पत्र कार्यों की देखरेख नायब तहसीलदार करता है।"]},
  {"q":"वर्तमान (2026) में हिसार जिले में कुल कितने विकास खंड (Blocks) हैं?","opts":["9","4","6","8"],"a":2,"exp":"हांसी-I, हांसी-II और नारनौंद ब्लॉक के हांसी जिले में जाने के बाद वर्तमान हिसार में 6 ब्लॉक हैं: हिसार-I, हिसार-II, उकलाना, बरवाला, अग्रोहा और आदमपुर।","facts":["प्रत्येक विकास खंड का प्रशासनिक अधिकारी खंड विकास एवं पंचायत अधिकारी (BDPO) होता है।","इन छहों ब्लॉकों में पंचायती राज की मध्यवर्ती इकाई के रूप में पंचायत समितियाँ कार्य करती हैं।","हरियाणा पंचायती राज अधिनियम 22 अप्रैल 1994 को लागू हुआ था।","हरियाणा में पंचायती राज चुनावों में महिलाओं के लिए 50% आरक्षण का प्रावधान है।","संपूर्ण हरियाणा राज्य में कुल 142 सामुदायिक विकास खंड हैं।"]},
  {"q":"दिसंबर 2025 में 'हांसी' नया जिला बनने के बाद हिसार प्रशासनिक मंडल (Division) में कुल कितने जिले हो गए हैं?","opts":["3","4","6","5"],"a":3,"exp":"22 दिसंबर 2025 को हांसी 23वाँ जिला बनने के बाद अब हिसार मंडल में सर्वाधिक 5 जिले—हिसार, फतेहाबाद, सिरसा, जींद और हांसी—शामिल हैं।","facts":["वर्तमान (2026) में हरियाणा के 6 प्रशासनिक मंडल: हिसार (5), रोहतक (5), अंबाला (4), करनाल (3), गुरुग्राम (3) और फरीदाबाद (3)।","इस प्रकार हिसार और रोहतक—दोनों मंडल 5-5 जिलों के साथ हरियाणा के सबसे बड़े प्रशासनिक मंडल हैं।","हिसार 'हिसार पुलिस रेंज' का मुख्यालय भी है।","वर्तमान (2026) में हरियाणा में 5 पुलिस रेंज, 5 पुलिस कमिश्नरेट (गुरुग्राम, फरीदाबाद, पंचकूला, सोनीपत, झज्जर) और 24 पुलिस जिले (23 राजस्व जिले + डबवाली पुलिस जिला) हैं।","मंडल का सर्वोच्च प्रशासनिक अधिकारी मंडलायुक्त (Divisional Commissioner) होता है।"]},
  {"q":"वर्तमान (2026) में हिसार जिले में कुल कितनी विधानसभा सीटें हैं?","opts":["7","5","6","4"],"a":1,"exp":"हांसी और नारनौंद सीटों के नए हांसी जिले में जाने के बाद वर्तमान हिसार जिले में 5 विधानसभा सीटें—आदमपुर, उकलाना, बरवाला, हिसार और नलवा—हैं।","facts":["इन पाँचों सीटों के क्रमांक हैं: आदमपुर (47), उकलाना SC (48), बरवाला (51), हिसार (52) और नलवा (53)।","हिसार से 2 सीटें अलग होने के बाद 2026 में सर्वाधिक विधानसभा सीटें (6-6) फरीदाबाद और सोनीपत जिलों में हैं।","सबसे कम विधानसभा सीटें (2-2) पंचकूला, चरखी दादरी और नवगठित हांसी जिलों में हैं।","हरियाणा विधानसभा में कुल 90 सीटें हैं, जिनमें 17 अनुसूचित जाति (SC) के लिए आरक्षित हैं।","2024 के 15वें विधानसभा चुनाव में इन 5 सीटों में से 2 भाजपा, 2 कांग्रेस और 1 निर्दलीय ने जीती।"]},
  {"q":"वर्तमान हिसार जिले की कौन-सी विधानसभा सीट अनुसूचित जाति (SC) के लिए आरक्षित है?","opts":["उकलाना","बरवाला","आदमपुर","नलवा"],"a":0,"exp":"उकलाना विधानसभा क्षेत्र (क्रमांक 48) वर्तमान हिसार जिले की एकमात्र अनुसूचित जाति (SC) आरक्षित सीट है।","facts":["2024 के विधानसभा चुनाव में उकलाना (SC) सीट से कांग्रेस (INC) के नरेश सेलवाल विधायक निर्वाचित हुए।","हिसार जिले की अन्य 4 सीटें—आदमपुर, बरवाला, हिसार और नलवा—सामान्य (अनारक्षित) श्रेणी की हैं।","हरियाणा में अनुसूचित जनजाति (ST) के लिए कोई भी विधानसभा या लोकसभा सीट आरक्षित नहीं है।","उकलाना मंडी हिसार जिले की प्रमुख अनाज मंडी और उप-तहसील है।","उकलाना से पहले 2019 में जजपा के अनूप धानक यहाँ से विधायक व राज्य मंत्री थे।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'हिसार' विधानसभा सीट से कौन निर्वाचित हुईं?","opts":["डॉ. कमल गुप्ता","रेणुका बिश्नोई","सावित्री जिंदल","रामनिवास राड़ा"],"a":2,"exp":"2024 के 15वें हरियाणा विधानसभा चुनाव में हिसार सीट से निर्दलीय उम्मीदवार सावित्री जिंदल निर्वाचित हुईं।","facts":["सावित्री जिंदल ने कांग्रेस के रामनिवास राड़ा और भाजपा के पूर्व मंत्री डॉ. कमल गुप्ता को पराजित किया।","वे भारत की सबसे अमीर महिला उद्योगपति हैं और पूर्व में 2005 व 2009 में भी हिसार से विधायक व हरियाणा की मंत्री रह चुकी हैं।","2024 की 15वीं हरियाणा विधानसभा में कुल 3 निर्दलीय विधायक चुने गए (सावित्री जिंदल—हिसार, देवेंद्र कादियान—गन्नौर, राजेश जून—बहादुरगढ़)।","इस विधानसभा में कुल 13 महिला विधायक निर्वाचित हुईं।","2024 में भाजपा ने 48 सीटें जीतकर लगातार तीसरी बार सरकार बनाई और नायब सिंह सैनी मुख्यमंत्री बने।"]},
  {"q":"2024 के विधानसभा चुनाव में 'बरवाला' सीट से कौन निर्वाचित हुए जिन्हें हरियाणा सरकार में कैबिनेट मंत्री बनाया गया?","opts":["वेद नारंग","जोगीराम सिहाग","रामनिवास घोड़ेला","रणबीर सिंह गंगवा"],"a":3,"exp":"2024 के विधानसभा चुनाव में बरवाला सीट से भाजपा के रणबीर सिंह गंगवा निर्वाचित हुए और उन्हें नायब सिंह सैनी सरकार में कैबिनेट मंत्री बनाया गया।","facts":["रणबीर सिंह गंगवा को लोक निर्माण (PWD - B&R) और जनस्वास्थ्य अभियांत्रिकी (PHE) मंत्रालय सौंपे गए।","वे 2019–2024 के दौरान नलवा से विधायक और 14वीं हरियाणा विधानसभा के उपाध्यक्ष (Deputy Speaker) रहे थे।","2024 में उन्होंने कांग्रेस प्रत्याशी रामनिवास घोड़ेला को पराजित किया।","बरवाला हिसार जिले का एक उपमंडल (HR-80), तहसील और विकास खंड है।","15वीं हरियाणा विधानसभा के अध्यक्ष हरविन्द्र कल्याण (घरौंडा) और उपाध्यक्ष कृष्ण लाल मिड्ढा (जींद) हैं।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'आदमपुर' सीट से कौन निर्वाचित हुए?","opts":["भव्य बिश्नोई","चंद्र प्रकाश","कुलदीप बिश्नोई","संपत सिंह"],"a":1,"exp":"2024 के हरियाणा विधानसभा चुनाव में आदमपुर सीट से कांग्रेस (INC) के चंद्र प्रकाश (सेवानिवृत्त IAS) निर्वाचित हुए।","facts":["चंद्र प्रकाश ने भाजपा के भव्य बिश्नोई को 1,268 मतों के करीबी अंतर से हराकर आदमपुर में भजनलाल परिवार के 56 वर्षों के गढ़ को तोड़ा।","आदमपुर पूर्व मुख्यमंत्री चौधरी भजनलाल का पारंपरिक निर्वाचन क्षेत्र रहा है।","2024 के विधानसभा चुनाव में कांग्रेस को पूरे हरियाणा में कुल 37 सीटें मिली थीं।","आदमपुर हिसार जिले की एक प्रमुख तहसील, ब्लॉक और अनाज मंडी है।","प्रसिद्ध मीडिया उद्योगपति सुभाष चंद्रा का जन्म भी आदमपुर (हिसार) में ही हुआ था।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'नलवा' विधानसभा सीट से कौन निर्वाचित हुए?","opts":["रणधीर पनिहार","अनिल मान","रणबीर गंगवा","संपत सिंह"],"a":0,"exp":"2024 के हरियाणा विधानसभा चुनाव में नलवा सीट से भाजपा के रणधीर पनिहार निर्वाचित हुए।","facts":["रणधीर पनिहार ने कांग्रेस प्रत्याशी अनिल मान को 12,144 मतों के अंतर से पराजित किया।","नलवा विधानसभा क्षेत्र का गठन वर्ष 2008 के परिसीमन के बाद हुआ था।","2019 के चुनाव में भाजपा के रणबीर सिंह गंगवा और 2014 में इनेलो के रणबीर गंगवा यहाँ से विधायक चुने गए थे।","नलवा विधानसभा क्षेत्र में हिसार की बालसमंद उप-तहसील का बड़ा ग्रामीण क्षेत्र शामिल है।","मतदान 5 अक्टूबर 2024 को और मतगणना 8 अक्टूबर 2024 को संपन्न हुई थी।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'उकलाना (SC)' सीट से कौन निर्वाचित हुए?","opts":["अनूप धानक","आशा खेदड़","नरेश सेलवाल","सीमा गैबीपुर"],"a":2,"exp":"2024 के हरियाणा विधानसभा चुनाव में उकलाना (SC) सीट से कांग्रेस (INC) के नरेश सेलवाल निर्वाचित हुए।","facts":["नरेश सेलवाल ने भाजपा प्रत्याशी व पूर्व राज्य मंत्री अनूप धानक को 28,092 मतों के बड़े अंतर से पराजित किया।","वे इससे पहले 2009 में भी उकलाना सीट से कांग्रेस के विधायक चुने जा चुके हैं।","2014 में इनेलो और 2019 में जजपा के टिकट पर अनूप धानक यहाँ से विधायक बने थे।","उकलाना वर्तमान हिसार जिले की एकमात्र SC आरक्षित विधानसभा सीट है।","उकलाना क्षेत्र के फरीदपुर गाँव की अनीता कुंडू विश्व प्रसिद्ध पर्वतारोही हैं।"]},
  {"q":"2024 के लोकसभा चुनाव में 'हिसार' संसदीय क्षेत्र से कौन सांसद निर्वाचित हुए?","opts":["रणजीत सिंह चौटाला","बृजेंद्र सिंह","दुष्यंत चौटाला","जय प्रकाश"],"a":3,"exp":"2024 के 18वें लोकसभा चुनाव में कांग्रेस (INC) के जय प्रकाश (जे.पी.) हिसार लोकसभा सीट से सांसद निर्वाचित हुए।","facts":["जय प्रकाश ने भाजपा के रणजीत सिंह चौटाला को पराजित कर चौथी बार हिसार से लोकसभा चुनाव जीता (पूर्व में 1989, 1996, 2004 में भी सांसद रहे)।","हिसार लोकसभा क्षेत्र में कुल 9 विधानसभा सीटें आती हैं: हिसार की 5, हांसी जिले की 2 (हांसी व नारनौंद), जींद की 1 (उचाना कलां) और भिवानी की 1 (बवानी खेड़ा)।","2024 लोकसभा चुनाव में हरियाणा की कुल 10 सीटों में से 5 कांग्रेस और 5 भाजपा ने जीतीं।","इससे पूर्व 2019 में भाजपा के बृजेंद्र सिंह और 2014 में इनेलो के दुष्यंत चौटाला हिसार के सांसद थे।","हरियाणा से राज्यसभा की कुल 5 सीटें हैं।"]},
  {"q":"हिसार जिले में स्थित प्रसिद्ध पूर्व-हड़प्पा पुरातात्विक स्थल 'सीसवाल' किस प्राचीन नहर/नदी के किनारे स्थित है?","opts":["यमुना नदी","चौटांग नहर","साहिबी नदी","मारकंडा नदी"],"a":1,"exp":"सीसवाल (आदमपुर क्षेत्र, हिसार) प्राचीन चौटांग (दृषद्वती) नहर के किनारे स्थित है, जिसके नाम पर हरियाणा की प्रारंभिक कृषक संस्कृति को 'सीसवाल संस्कृति' कहा जाता है।","facts":["सीसवाल का उत्खनन वर्ष 1968 में पंजाब विश्वविद्यालय के पुरातत्वविद् डॉ. सूरजभान ने किया था।","यहाँ से पूर्व-हड़प्पा (ताम्रपाषाण) काल के लाल व काले चित्रित मिट्टी के बर्तन, तांबे के औजार और कच्ची ईंटों के आवास मिले हैं।","सीसवाल गाँव में भगवान शिव का प्रसिद्ध वार्षिक मेला भी आयोजित होता है।","डॉ. सूरजभान ने सीसवाल के अलावा मिताथल (भिवानी) और दौलतपुर (कुरुक्षेत्र) का भी उत्खनन किया था।","फतेहाबाद के बनावली, कुणाल व भिरडाना और हांसी के राखीगढ़ी में भी सीसवाल/प्रारंभिक हड़प्पा चरण के प्रमाण मिले हैं।"]},
  {"q":"हरियाणा में मौर्यकालीन बौद्ध स्तूप और प्राचीन अवशेष किन दो पड़ोसी जिलों से प्रमुख रूप से प्राप्त हुए हैं?","opts":["हिसार और फतेहाबाद","पलवल और नूंह","रेवाड़ी और महेंद्रगढ़","झज्जर और चरखी दादरी"],"a":0,"exp":"हिसार (अग्रोहा टीला व लाट की मस्जिद स्तंभ) और फतेहाबाद (फिरोजशाह की लाट) से मौर्यकालीन स्तूपों व अशोक स्तंभों के प्रमुख अवशेष प्राप्त हुए हैं।","facts":["अग्रोहा टीले के उत्खनन में प्राचीन बौद्ध स्तूप परिसर की खोज एक बड़ी पुरातात्विक उपलब्धि मानी जाती है।","हिसार की लाट की मस्जिद और फतेहाबाद की ईदगाह में खड़े बलुआ पत्थर के स्तंभ मूल रूप से मौर्य सम्राट अशोक के स्तंभों के हिस्से माने जाते हैं।","यमुनानगर के टोपरा कलां से अशोक का प्रसिद्ध 7-अभिलेखों वाला स्तंभ मिला था और चनेटी (यमुनानगर) में भी ईंटों का प्राचीन स्तूप स्थित है।","मौर्य साम्राज्य की स्थापना 322 ई.पू. में चंद्रगुप्त मौर्य ने की थी।","कुरुक्षेत्र के थानेसर में भी चीनी यात्री ह्वेनसांग ने अशोक के स्तूपों का उल्लेख किया था।"]},
  {"q":"हिसार के प्रसिद्ध ऐतिहासिक नगर 'अग्रोहा' का प्राचीन नाम क्या था?","opts":["ताशान्या","इकादार","अग्रोदका","रोहिताशगढ़"],"a":2,"exp":"अग्रोहा का प्राचीन नाम 'अग्रोदका' (Agrodaka) था, जो प्राचीन अग्र गणराज्य की राजधानी थी।","facts":["अग्रोहा NH-9 (दिल्ली–हिसार–फाजिल्का राजमार्ग) पर हिसार शहर से लगभग 22 किमी दूर स्थित है।","अग्रोहा को महाराजा अग्रसेन की राजधानी और वैश्य (अग्रवाल) समाज का उद्गम स्थल माना जाता है।","अग्रोहा के आधुनिक 'अग्रोहा धाम' को अग्रवाल समाज अपना 'पाँचवाँ धाम' मानता है।","अग्रोहा वर्तमान में हिसार जिले का एक विकास खंड (Block) है और यहाँ 'महाराजा अग्रसेन मेडिकल कॉलेज' स्थित है।","अन्य प्राचीन नाम: ताशान्या (टोहाना), इकादार (फतेहाबाद) और रोहिताशगढ़ (रोहतक)।"]},
  {"q":"हिसार जिले के अग्रोहा और बरवाला से प्राप्त प्राचीन सिक्कों से किस गणराज्य के अस्तित्व की पुष्टि होती है?","opts":["यौधेय गणराज्य","कुणिंद गणराज्य","अर्जुनायन गणराज्य","अग्र गणराज्य"],"a":3,"exp":"अग्रोहा और बरवाला से प्राप्त तांबे के प्राचीन सिक्कों से 'अग्र गणराज्य' के अस्तित्व की पुष्टि होती है, जिसकी राजधानी अग्रोहा (अग्रोदका) थी।","facts":["इन सिक्कों पर ब्राह्मी लिपि में 'अगाचा जनपदस' (अग्र जनपद का) उत्कीर्ण मिलता है।","हरियाणा के अन्य प्रमुख प्राचीन गणराज्य: यौधेय गणराज्य (रोहतक व नौरंगाबाद/भिवानी), कुणिंद गणराज्य (अंबाला/यमुनानगर) और अर्जुनायन (महेंद्रगढ़/रेवाड़ी)।","अग्रोहा टीले से इंडो-ग्रीक, कुषाण और गुप्त काल के भी अनेक सिक्के प्राप्त हुए हैं।","सिक्कों के अध्ययन को 'मुद्राशास्त्र' (Numismatics) कहा जाता है।","अग्रोहा से प्राप्त पुरावशेष हिसार के जहाज कोठी क्षेत्रीय संग्रहालय में भी प्रदर्शित किए गए हैं।"]},
  {"q":"अग्रोहा टीले (हिसार) से प्राप्त ईंटों के भवन और बौद्ध स्तूप के अवशेष मुख्यतः किस काल के इतिहास की जानकारी देते हैं?","opts":["सल्तनत से ब्रिटिश काल","कुषाण काल से गुप्तकाल","केवल मुगल काल","केवल उत्तर-वैदिक काल"],"a":1,"exp":"अग्रोहा टीले से प्राप्त पकी ईंटों के सुव्यवस्थित भवन, मूर्तियाँ और बौद्ध स्तूप परिसर कुषाण काल से गुप्तकाल तक के समृद्ध इतिहास की जानकारी देते हैं।","facts":["यह प्राचीन नगर ईसा पूर्व चौथी शताब्दी से लेकर चौथी शताब्दी ईस्वी (और बाद में भी) तक खूब फला-फूला।","यहाँ से गुप्तकालीन 'सूर्य देवता का मंदिर' और भगवान विष्णु व शिव की प्राचीन मूर्तियाँ मिली हैं।","अग्रोहा टीला भारतीय पुरातत्व सर्वेक्षण (ASI) द्वारा संरक्षित राष्ट्रीय महत्व का स्थल है।","जहाज कोठी संग्रहालय (हिसार) में अग्रोहा उत्खनन की अनेक कलाकृतियाँ सुरक्षित हैं।","NH-9 के किनारे स्थित होने के कारण यह इतिहास व पर्यटन प्रेमियों के लिए सहज सुगम स्थल है।"]},
  {"q":"अग्रोहा से प्राप्त 9वीं शताब्दी की प्रसिद्ध ईंट/अभिलेख पर क्या अंकित है?","opts":["संगीत के सात स्वर","अशोक के सात धम्म लेख","गणित के शून्य का सूत्र","महाभारत के श्लोक"],"a":0,"exp":"अग्रोहा से प्राप्त एक अनूठी प्राचीन ईंट/अभिलेख पर भारतीय शास्त्रीय संगीत के सात स्वर (सा, रे, गा, मा, पा, धा, नि) अंकित हैं।","facts":["यह साक्ष्य हरियाणा की प्राचीन संगीत परंपरा और सांस्कृतिक समृद्धि का अद्भुत प्रमाण है।","इसके अलावा यमुनानगर के सुघ (श्रुघ्न) से ब्राह्मी लिपि की 'बारहखड़ी' लिखते बालक की टेराकोटा मूर्ति मिली है।","भिवानी के तोशाम पहाड़ी से गुप्तकालीन ब्राह्मी अभिलेख (भगवान विष्णु स्तुति) प्राप्त हुआ है।","रोहतक के खोखराकोट और भिवानी के नौरंगाबाद से यौधेय सिक्के ढालने के साँचे मिले हैं।","HSSC परीक्षाओं में 'संगीत के सात स्वर वाली ईंट कहाँ से मिली' (अग्रोहा, हिसार) अत्यंत प्रसिद्ध प्रश्न है।"]},
  {"q":"हरियाणा में गुप्तकालीन 'सूर्य देवता का मंदिर' किस ऐतिहासिक स्थान से संबंधित है?","opts":["थानेसर","तोशाम","अग्रोहा","पिहोवा"],"a":2,"exp":"हिसार जिले के अग्रोहा से गुप्तकालीन सूर्य देवता के मंदिर के पुरातात्विक प्रमाण प्राप्त हुए हैं।","facts":["गुप्तकाल (319–550 ई.) को भारतीय इतिहास का 'स्वर्ण युग' कहा जाता है, जब मंदिर निर्माण कला की शुरुआत हुई।","अग्रोहा से सूर्य देव की प्रतिमा के अतिरिक्त मुगलकालीन भगवान शिव की प्रतिमा (अग्रोहा व बरवाला से) भी प्राप्त हुई है।","हरियाणा में सूर्य उपासना से जुड़े अन्य स्थल: सूरजकुंड (फरीदाबाद) और सूर्य कुंड (तोशाम व कुरुक्षेत्र)।","अग्रोहा में वर्तमान में भव्य 'अग्रोहा धाम' मंदिर परिसर बना हुआ है।","गुप्त सम्राट समुद्रगुप्त के सोने के सिक्के भिवानी के मिताथल से प्राप्त हुए हैं।"]},
  {"q":"हिसार जिले में मुगलकालीन भगवान शिव की मूर्तियाँ किन दो स्थानों से प्राप्त हुई हैं?","opts":["आदमपुर और उकलाना","सीसवाल और बालसमंद","खेदड़ और सातरोड","अग्रोहा और बरवाला"],"a":3,"exp":"हिसार जिले के अग्रोहा और बरवाला से मुगलकालीन भगवान शिव की ऐतिहासिक मूर्तियाँ प्राप्त हुई हैं।","facts":["अग्रोहा और बरवाला से ही प्राचीन अग्र गणराज्य के सिक्के भी बड़ी संख्या में मिले हैं।","हिसार के सीसवाल और किरमारा गाँवों में भगवान शिव का प्रसिद्ध वार्षिक मेला लगता है।","बरवाला हिसार जिले का एक प्रमुख उपमंडल, तहसील और विधानसभा क्षेत्र है।","हरियाणा में प्राचीन मूर्तियों के अन्य प्रमुख केंद्र: सुघ (यमुनानगर), खोखराकोट (रोहतक) और नौरंगाबाद (भिवानी)।","इन ऐतिहासिक मूर्तियों का संरक्षण हरियाणा पुरातत्व एवं संग्रहालय विभाग (मुख्यालय: पंचकूला) द्वारा किया जाता है।"]},
  {"q":"प्रसिद्ध प्राचीन जैन विद्वान 'लोहाचार्य' का संबंध हिसार जिले के किस स्थान से था?","opts":["बरवाला","अग्रोहा","सीसवाल","आदमपुर"],"a":1,"exp":"प्रसिद्ध प्राचीन जैन आचार्य एवं विद्वान लोहाचार्य का संबंध हिसार के प्राचीन अग्रोहा नगर से था।","facts":["प्राचीन काल में अग्रोहा जैन धर्म और बौद्ध धर्म—दोनों का एक महत्वपूर्ण शिक्षा व सांस्कृतिक केंद्र था।","वर्तमान अग्रोहा धाम में भगवान महावीर की 90 फुट ऊँची भव्य प्रतिमा भी स्थापित की गई है।","हिसार शहर के नागोरी गेट में 1820 ई. में निर्मित प्राचीन 'श्री दिगंबर जैन मंदिर' स्थित है।","हरियाणा के अन्य प्रमुख जैन स्थल: रणिला जैन मंदिर व जैन छतरी (चरखी दादरी) और हांसी से प्राप्त प्राचीन जैन कांस्य प्रतिमाएँ।","जैन धर्म के 24वें तीर्थंकर भगवान महावीर और प्रथम तीर्थंकर भगवान आदिनाथ (ऋषभदेव) थे।"]},
  {"q":"अग्रोहा टीले पर नगर की सुरक्षा हेतु वर्ष 1777 में 'शिखर दुर्ग अग्रोहा' किसने बनवाया था?","opts":["दीवान नानूमल","जॉर्ज थॉमस","फिरोजशाह तुगलक","पृथ्वीराज चौहान"],"a":0,"exp":"सन 1777 ईस्वी में महाराजा पटियाला के दीवान नानूमल ने अग्रोहा टीले पर नगर की रखवाली व सुरक्षा के लिए 'शिखर दुर्ग अग्रोहा' बनवाया था।","facts":["18वीं शताब्दी में इस क्षेत्र पर पटियाला रियासत, भट्टी शासकों और जॉर्ज थॉमस के बीच राजनीतिक संघर्ष चलते रहे थे।","दीवान नानूमल पटियाला के महाराजा अमर सिंह के अत्यंत योग्य दीवान (प्रधानमंत्री) थे।","अग्रोहा टीले से प्राप्त ईंटों व पत्थरों का उपयोग मध्यकाल में कई स्थानीय संरचनाओं में किया गया था।","हरियाणा के अन्य प्रसिद्ध किले: असीगढ़ किला (हांसी), लोहारू किला (भिवानी), गोपालगिरी किला (गुरुग्राम) और माधोगढ़ किला (महेंद्रगढ़)।","अग्रोहा आज धार्मिक पर्यटन व चिकित्सा शिक्षा (महाराजा अग्रसेन मेडिकल कॉलेज) का बड़ा केंद्र है।"]},
  {"q":"प्रसिद्ध 'अग्रोहा धाम' (हिसार) में किस पर्व पर प्रतिवर्ष सबसे बड़ा मेला लगता है?","opts":["मकर संक्रांति","महाशिवरात्रि","भाद्रपद अमावस्या व अग्रसेन जयंती","रक्षाबंधन"],"a":2,"exp":"अग्रोहा धाम में प्रतिवर्ष भाद्रपद अमावस्या और शरद पूर्णिमा / अग्रसेन जयंती के अवसर पर भव्य मेले का आयोजन होता है।","facts":["अग्रोहा धाम का निर्माण कार्य 1976 में प्रारंभ हुआ था और 1984 में पूर्ण हुआ (पूर्व मुख्यमंत्री बनारसी दास गुप्ता का विशेष योगदान रहा)।","यहाँ कुलदेवी महालक्ष्मी मंदिर, महाराजा अग्रसेन मंदिर, शक्ति शीला माता, मां वैष्णो देवी, वीणा वादिनी सरस्वती, भैरो बाबा, बाबा अमरनाथ गुफा, हिमानी शिवलिंग, तिरुपति मूर्ति व शक्ति सरोवर दर्शनीय हैं।","अग्रोहा धाम में भगवान महावीर की 90 फुट ऊँची प्रतिमा भी स्थापित है।","अग्रवाल (वैश्य) समाज इसे अपना 'पाँचवाँ धाम' मानता है।","हिसार के नए आधुनिक हवाई अड्डे का नाम भी 'महाराजा अग्रसेन हवाई अड्डा' रखा गया है।"]},
  {"q":"दिसंबर 2025 में हिसार से अलग होकर बना 23वाँ जिला 'हांसी' अपने साथ कौन-से प्रमुख ऐतिहासिक स्थल ले गया है?","opts":["गुजरी महल, लाट की मस्जिद और जहाज कोठी","अग्रोहा धाम, सीसवाल और बनभौरी धाम","ब्लू बर्ड झील, हिरण पार्क और खेदड़ प्लांट","असीगढ़ किला, बड़सी गेट, चार कुतुब और राखीगढ़ी"],"a":3,"exp":"22 दिसंबर 2025 को हांसी नया जिला बनने के बाद असीगढ़ का किला, बड़सी गेट, चार कुतुब दरगाह, काली देवी मंदिर और राखीगढ़ी (नारनौंद) अब हांसी जिले का हिस्सा हैं।","facts":["विश्व का सबसे बड़ा हड़प्पा स्थल 'राखीगढ़ी' (नारनौंद तहसील) अब नवगठित हांसी जिले में आता है।","1857 के हांसी के महान क्रांतिकारी लाला हुकमचंद जैन और मिर्जा मुनीर बेग का संबंध भी अब हांसी जिले से है।","प्रसिद्ध पहलवान मास्टर चंदगीराम (सिसाय गाँव) और अभिनेत्री मल्लिका शेरावत (मोठ लुहरी, नारनौंद) के पैतृक गाँव भी अब हांसी जिले के अंतर्गत आते हैं।","हांसी जिले में कुल 2 विधानसभा सीटें (हांसी व नारनौंद) और 1,349.76 वर्ग किमी क्षेत्रफल शामिल है।","पहले हांसी (2016 से) हरियाणा का पहला पुलिस जिला था; अब 2026 में डबवाली (सिरसा) हरियाणा का एकमात्र गैर-राजस्व पुलिस जिला है।"]},
  {"q":"हिसार शहर के प्राचीन चार ऐतिहासिक द्वारों (दरवाजों) का सही समूह कौन-सा है?","opts":["बड़सी, गोसाईं, उमरा, हिसार गेट","नागोरी, मोरी, दिल्ली, तलाकी गेट","अजमेरी, लाहौरी, काबुली, कश्मीरी गेट","सूरजपोल, चांदपोल, हाथीपोल, सांगानेरी गेट"],"a":1,"exp":"फिरोजशाह तुगलक द्वारा बसाए गए हिसार शहर की सुरक्षा दीवार में चार प्रमुख दरवाजे थे: नागोरी गेट, मोरी गेट, दिल्ली गेट और तलाकी गेट।","facts":["नागोरी गेट क्षेत्र में 1820 ई. में बना प्रसिद्ध 'श्री दिगंबर जैन मंदिर' स्थित है।","नागोरी गेट के पास ही सूफी संत 'शेख जुनैद की मजार' स्थित है।","ध्यान दें: प्रसिद्ध 'बड़सी गेट' (1303 ई.) अब नवगठित 'हांसी' जिले में स्थित है।","1867 में स्थापित हिसार नगरपालिका के रिकॉर्ड में इन चारों द्वारों का वर्णन मिलता है।","आज भी ये चारों द्वार हिसार शहर के मुख्य व्यापारिक बाजारों की पहचान हैं।"]},
  {"q":"ऐतिहासिक 'गुजरी महल' का निर्माण हिसार में 14वीं शताब्दी में किसने करवाया था?","opts":["फिरोजशाह तुगलक","जॉर्ज थॉमस","शेरशाह सूरी","पृथ्वीराज चौहान"],"a":0,"exp":"हिसार का प्रसिद्ध गुजरी महल सुल्तान फिरोजशाह तुगलक ने 1354–56 ई. में अपनी प्रेमिका/पत्नी गुजरी के लिए बनवाया था।","facts":["गुजरी महल को स्थानीय रूप से 'बावड़ी' के नाम से भी जाना जाता है।","यह महल काले व लाल बलुआ पत्थर से लगभग दो वर्षों में बनकर तैयार हुआ था।","गुजरी महल परिसर में स्थित एक स्तंभ पर आठ दिशाओं से आने वाले भागवतों की सूचना देने वाले आठ अभिलेख उत्कीर्ण हैं।","गुजरी महल के निकट ही फिरोजशाह पैलेस और लाट की मस्जिद स्थित हैं।","यह भारतीय पुरातत्व सर्वेक्षण (ASI) द्वारा संरक्षित राष्ट्रीय महत्व का स्मारक है।"]},
  {"q":"हिसार के किस स्मारक के एक स्तंभ पर आठ दिशाओं से आने वाले भागवतों (तीर्थयात्रियों) की सूचना देने वाले आठ अभिलेख अंकित हैं?","opts":["जहाज कोठी","प्राचीन गुम्बद","गुजरी महल","शिखर दुर्ग"],"a":2,"exp":"गुजरी महल (हिसार) परिसर में स्थित एक ऐतिहासिक स्तंभ पर आठ अलग-अलग स्थानों से आने वाले भागवतों की सूचना देने वाले आठ अभिलेख उत्कीर्ण हैं।","facts":["यह स्तंभ वैष्णव/भागवत परंपरा और हिसार क्षेत्र के प्राचीन धार्मिक संपर्कों को दर्शाता है।","गुजरी महल के नीचे भूमिगत कक्ष (तहखाने) और जल संचयन हेतु बावड़ी जैसी संरचना बनी हुई है।","तुगलक काल में हिसार एक प्रमुख शिकारगाह और सामरिक किला था।","हरियाणा के अन्य प्रमुख अभिलेख: टोपरा अशोक अभिलेख (यमुनानगर), तोशाम ब्राह्मी अभिलेख (भिवानी) और बिजोलिया/हांसी अभिलेख।","HSSC परीक्षाओं में 'आठ अभिलेखों वाला स्तंभ कहाँ स्थित है' (गुजरी महल, हिसार) कई बार पूछा गया है।"]},
  {"q":"हिसार के किले के अंदर 'लाट की मस्जिद' और 'एल (L) आकार का तालाब' किसने बनवाया था?","opts":["अकबर","शाहजहाँ","हुमायूँ","फिरोजशाह तुगलक"],"a":3,"exp":"हिसार के किले के भीतर स्थित 'लाट की मस्जिद' और इसके साथ बने अनूठे 'L' आकार के तालाब का निर्माण फिरोजशाह तुगलक ने करवाया था।","facts":["मस्जिद के प्रांगण में खड़ी बलुआ पत्थर की 'लाट' (स्तंभ) के कारण इसे 'लाट की मस्जिद' कहा जाता है।","इतिहासकारों के अनुसार यह लाट मूल रूप से मौर्य सम्राट अशोक के किसी स्तंभ का भाग थी, जिसे फिरोजशाह ने यहाँ स्थापित करवाया।","यह मस्जिद तुगलक स्थापत्य शैली का हरियाणा में एक अद्भुत उदाहरण है।","इसी प्रकार की एक अन्य 'फिरोजशाह की लाट' फतेहाबाद की ईदगाह परिसर में भी खड़ी है।","लाट की मस्जिद हिसार के गुजरी महल परिसर के बिल्कुल निकट स्थित है।"]},
  {"q":"हिसार में 14वीं शताब्दी का 'प्राचीन गुम्बद' किस सूफी फकीर से संबंधित है जिन्होंने गयासुद्दीन तुगलक के बादशाह बनने की भविष्यवाणी की थी?","opts":["शेख जुनैद","प्राणपीर बादशाह","संत मीर शाह","शेख फरीद"],"a":1,"exp":"हिसार में स्थित 14वीं शताब्दी का प्राचीन गुम्बद सूफी फकीर प्राणपीर बादशाह (दाना शेर के आध्यात्मिक गुरु) से संबंधित है।","facts":["मान्यता है कि प्राणपीर बादशाह ने भविष्यवाणी की थी कि गयासुद्दीन तुगलक एक दिन दिल्ली का सुल्तान बनेगा।","गयासुद्दीन तुगलक ने 1320 ई. में दिल्ली में तुगलक वंश की स्थापना की थी।","यह प्राचीन गुम्बद हिसार में राजकीय स्नातकोत्तर महाविद्यालय (गवर्नमेंट कॉलेज) के निकट स्थित है।","तुगलक शैली की ढलवाँ दीवारें और गुंबद निर्माण इस स्मारक की प्रमुख विशेषता है।","हिसार में इसके अलावा शेख जुनैद की मजार (नागोरी गेट) और मीठा पीर दरगाह (तलवंडी) भी प्रसिद्ध सूफी स्थल हैं।"]},
  {"q":"हिसार के नागोरी गेट के निकट किस प्रसिद्ध सूफी संत की मजार स्थित है?","opts":["शेख जुनैद","बू-अली शाह कलंदर","पीर मुबारक शाह","शाह चोखा"],"a":0,"exp":"सूफी संत शेख जुनैद की मजार (मकबरा) हिसार शहर के ऐतिहासिक नागोरी गेट क्षेत्र में स्थित है।","facts":["नागोरी गेट में ही 1820 ई. में निर्मित 'श्री दिगंबर जैन मंदिर' भी स्थित है।","अन्य विकल्पों में बू-अली शाह कलंदर पानीपत में, पीर मुबारक शाह चरखी दादरी में और शाह चोखा खोरी (गुरुग्राम) में स्थित हैं।","हिसार जिले के तलवंडी गाँव में 'मीठा पीर की दरगाह' स्थित है।","जबकि प्रसिद्ध 'चार कुतुब दरगाह' अब नवगठित 23वें जिले 'हांसी' में स्थित है।","हिसार शहर मध्यकाल में सूफी संतों और सांस्कृतिक समरसता का प्रमुख केंद्र रहा है।"]},
  {"q":"हिसार के नागोरी गेट में स्थित प्रसिद्ध 'श्री दिगंबर जैन मंदिर' का निर्माण किस वर्ष किया गया था?","opts":["1777 ई.","1867 ई.","1820 ई.","1919 ई."],"a":2,"exp":"हिसार के नागोरी गेट में स्थित प्रसिद्ध श्री दिगंबर जैन मंदिर का निर्माण वर्ष 1820 ईस्वी में किया गया था।","facts":["इसी वर्ष (1820 ई.) में चरखी दादरी की प्रसिद्ध 'जैन छतरी' (चंदर सेन द्वारा) का निर्माण भी हुआ था।","हिसार के अग्रोहा धाम में भगवान महावीर की 90 फुट ऊँची प्रतिमा भी जैन आस्था का प्रमुख केंद्र है।","प्राचीन जैन विद्वान लोहाचार्य का संबंध हिसार के अग्रोहा से रहा है।","हरियाणा का प्रसिद्ध 'रणिला दिगंबर जैन अतिशय क्षेत्र' चरखी दादरी जिले में स्थित है।","नागोरी गेट का यह मंदिर अपनी शांत स्थापत्य कला और प्राचीन प्रतिमाओं के लिए जाना जाता है।"]},
  {"q":"आयरलैंड के निवासी 'जॉर्ज थॉमस' ने वर्ष 1796 में हिसार में अपने निवास के लिए किस इमारत का निर्माण करवाया था?","opts":["गुजरी महल","शीशमहल","व्हाइट पैलेस","जहाज कोठी"],"a":3,"exp":"आयरलैंड के साहसी शासक जॉर्ज थॉमस ने वर्ष 1796 में हिसार में अपने निवास के लिए 'जॉर्ज कोठी' (जॉर्ज गढ़) बनवाई थी, जो बाद में 'जहाज कोठी' के नाम से प्रसिद्ध हुई।","facts":["यह इमारत देखने में समुद्री जहाज जैसी प्रतीत होती है और 'जॉर्ज' शब्द के स्थानीय अपभ्रंश से इसे 'जहाज कोठी' कहा जाने लगा।","वर्तमान में हरियाणा सरकार ने इस ऐतिहासिक स्मारक में 'क्षेत्रीय पुरातात्विक संग्रहालय' (Regional Archaeological Museum) स्थापित किया है (पूर्व में यहाँ जैन मंदिर भी रहा)।","जॉर्ज थॉमस ने सिरसा से रोहतक तक के बड़े क्षेत्र पर शासन किया और 1797 में हांसी को अपनी राजधानी बनाया था।","जॉर्ज थॉमस को हरियाणा के इतिहास में 'जहाज साहिब' के नाम से भी जाना जाता है।","1801–02 में मराठा सेनापति जनरल पेरन ने जॉर्ज थॉमस को पराजित किया था।"]},
  {"q":"1783 ईस्वी के भीषण अकाल के कारण जनहीन हो चुके हिसार को किसने दुर्ग बनाकर पुनः बसाया था?","opts":["फिरोजशाह तुगलक","जॉर्ज थॉमस","लॉर्ड लेक","दीवान नानूमल"],"a":1,"exp":"1783 ईस्वी के प्रसिद्ध 'चालीसा अकाल' से हिसार क्षेत्र लगभग जनहीन हो गया था, जिसे बाद में आयरिश अभियानकर्ता जॉर्ज थॉमस ने पुनः बसाया।","facts":["1783 ई. (विक्रम संवत 1840) में पड़े इस भयंकर अकाल को इतिहास में 'चालीसा अकाल' (Chalisa Famine) कहा जाता है।","जॉर्ज थॉमस ने 1796 में हिसार में जहाज कोठी बनवाई और क्षेत्र में कानून-व्यवस्था व व्यापार को पुनर्जीवित किया।","1803 की सुरजी-अंजनगाँव की संधि के बाद पूरा हरियाणा क्षेत्र मराठों से ब्रिटिश ईस्ट इंडिया कंपनी के अधीन आ गया।","1832 ई. में अंग्रेजों ने हिसार को विधिवत जिला मुख्यालय का दर्जा दिया।","हिसार में 1857 की क्रांति के दौरान शहजादा मोहम्मद आजम ने अंग्रेजों के विरुद्ध विद्रोह का नेतृत्व किया था।"]},
  {"q":"1857 की क्रांति में हिसार क्षेत्र से क्रांतिकारियों का नेतृत्व किसने किया था?","opts":["शहजादा मोहम्मद आजम","राव तुलाराम","राजा नाहर सिंह","धानू सिंह"],"a":0,"exp":"1857 के प्रथम स्वतंत्रता संग्राम में हिसार (व भट्टू/फतेहाबाद) क्षेत्र से विद्रोह का नेतृत्व शहजादा मोहम्मद आजम ने किया था।","facts":["अन्य प्रमुख 1857 नेतृत्वकर्ता: रेवाड़ी से राव तुलाराम, बल्लभगढ़ से राजा नाहर सिंह, फरीदाबाद से धानू सिंह और हांसी से लाला हुकमचंद जैन व मिर्जा मुनीर बेग।","हरियाणा में 1857 की क्रांति की शुरुआत 10 मई 1857 को अंबाला छावनी से हुई थी।","हिसार पर पुनः ब्रिटिश अधिकार स्थापित करने के लिए फिरोजपुर से जनरल वान कोर्टलैंड ने सेना भेजी थी।","1857 की क्रांति के दमन के बाद फरवरी 1858 में हरियाणा क्षेत्र को उत्तर-पश्चिमी प्रांत (आगरा) से हटाकर पंजाब प्रांत में मिला दिया गया।","1 नवंबर 1966 को पंजाब से अलग होकर हरियाणा भारत का 17वाँ राज्य बना।"]},
  {"q":"1857 की क्रांति के दौरान हिसार पर पुनः अधिकार करने के लिए किस ब्रिटिश अधिकारी ने फिरोजपुर से सेना भेजी थी?","opts":["लॉर्ड लेक","विलियम हडसन","जनरल वान कोर्टलैंड","मेजर एडन"],"a":2,"exp":"1857 के विद्रोह को दबाने और हिसार व सिरसा क्षेत्र पर पुनः नियंत्रण करने के लिए जनरल वान कोर्टलैंड ने फिरोजपुर से सेना भेजी थी।","facts":["जनरल वान कोर्टलैंड की सेना और स्थानीय क्रांतिकारियों के बीच हिसार, हांसी व रानियां (सिरसा) क्षेत्र में कई कड़े संघर्ष हुए।","मेजर हडसन ने दिल्ली व रोहतक क्षेत्र में क्रांतिकारियों के दमन में भूमिका निभाई थी।","अंग्रेजों ने विद्रोह के बाद हिसार जिले के अनेक क्रांतिकारियों को मृत्युदंड और संपत्ति जब्ती की सजा दी।","हिसार के स्याहड़वा गाँव के चौधरी कृपाराम और सातरोड के लाला हरदेव सहाय ने भी स्वतंत्रता संग्राम में महत्वपूर्ण भूमिका निभाई।","हिसार के पुराने कोर्ट परिसर के पास शहीदों की स्मृति में स्मारक भी स्थित हैं।"]},
  {"q":"पंजाब केसरी 'लाला लाजपत राय' ने किस अवधि के दौरान हिसार को अपनी कर्मभूमि बनाया था?","opts":["1857 से 1865 ई.","1905 से 1914 ई.","1919 से 1928 ई.","1886 से 1892 ई."],"a":3,"exp":"महान स्वतंत्रता सेनानी लाला लाजपत राय ने 1886 से 1892 ईस्वी तक हिसार में वकालत की और इसे अपनी सामाजिक व राजनीतिक कर्मभूमि बनाया।","facts":["लाला लाजपत राय ने 1886 में हिसार में 'आर्य समाज' की स्थापना की और 1887 में हिसार में कांग्रेस की पहली शाखा खोली।","वे 1889–1892 तक हिसार नगरपालिका के सचिव (Secretary) रहे और जनहित के अनेक कार्य किए।","हिसार में ही उन्होंने वकालत के साथ-साथ गरीबों व किसानों के लिए समाज सुधार आंदोलन चलाया।","उनके सम्मान में 1 दिसंबर 2010 को हिसार में 'लाला लाजपत राय पशु चिकित्सा एवं पशु विज्ञान विश्वविद्यालय' (LUVAS) स्थापित किया गया।","1928 में लाहौर में साइमन कमीशन के विरोध प्रदर्शन के दौरान लाठीचार्ज में घायल होने से 17 नवंबर 1928 को उनका निधन हुआ।"]},
  {"q":"हिसार में वर्ष 1887 में भारतीय राष्ट्रीय कांग्रेस की पहली शाखा किसने स्थापित की थी?","opts":["राय बहादुर मुरलीधर","लाला लाजपत राय","पंडित नेकीराम शर्मा","सर छोटूराम"],"a":1,"exp":"हिसार में सर्वप्रथम कांग्रेस की शाखा वर्ष 1887 में लाला लाजपत राय ने स्थापित की थी।","facts":["हरियाणा में कांग्रेस की सबसे पहली शाखा वर्ष 1886 में अंबाला में 'राय बहादुर लाला मुरलीधर' द्वारा स्थापित की गई थी।","1887 में ही रोहतक में भी कांग्रेस की शाखा (बाबू श्याम लाल व अन्य के प्रयासों से) स्थापित हुई।","भारतीय राष्ट्रीय कांग्रेस की स्थापना 28 दिसंबर 1885 को बंबई में ए.ओ. ह्यूम द्वारा की गई थी (प्रथम अध्यक्ष: व्योमेश चंद्र बनर्जी)।","लाला लाजपत राय ने हिसार में आर्य समाज की भी स्थापना की थी।","स्वतंत्रता संग्राम के दौरान नेताजी सुभाष चंद्र बोस, नेहरू जी, मदन मोहन मालवीय और सरोजिनी नायडू ने भी हिसार में जनसभाएँ की थीं।"]},
  {"q":"कांग्रेस के चौथे अधिवेशन (1888, इलाहाबाद) और लाहौर अधिवेशन में हिसार का प्रतिनिधित्व किसने किया था?","opts":["लाला लाजपत राय","लाला हरदेव सहाय","चौधरी कृपाराम","पंडित श्रीराम शर्मा"],"a":0,"exp":"कांग्रेस के चौथे अधिवेशन (1888, इलाहाबाद — अध्यक्ष: जॉर्ज यूल) और लाहौर अधिवेशन में लाला लाजपत राय ने हिसार के प्रतिनिधि के रूप में भाग लिया था।","facts":["1888 के इलाहाबाद अधिवेशन में लाला लाजपत राय के ओजस्वी हिंदी भाषण ने पूरे देश का ध्यान आकर्षित किया था।","लाला लाजपत राय भारतीय स्वतंत्रता संग्राम की प्रसिद्ध 'लाल-बाल-पाल' (लाला लाजपत राय, बाल गंगाधर तिलक, बिपिन चंद्र पाल) तिकड़ी के प्रमुख स्तंभ थे।","उन्होंने 1920 में कलकत्ता के विशेष कांग्रेस अधिवेशन की अध्यक्षता भी की थी, जहाँ असहयोग आंदोलन का प्रस्ताव पारित हुआ।","उनकी प्रसिद्ध पुस्तकों में 'अनहैप्पी इंडिया' (Unhappy India) और 'यंग इंडिया' शामिल हैं।","हरियाणा में स्वामी दयानंद सरस्वती ने पहली बार 1878 में रेवाड़ी की यात्रा की थी और 1880 में वहाँ हरियाणा की पहली आर्य समाज शाखा खोली।"]},
  {"q":"महात्मा गांधी को 30 जुलाई 1919 को हरियाणा के किस रेलवे स्टेशन से गिरफ्तार किया गया था?","opts":["पलवल","अंबाला","हिसार","रोहतक"],"a":2,"exp":"रौलेट एक्ट विरोधी आंदोलनों के दौरान 30 जुलाई 1919 को महात्मा गांधी को हिसार रेलवे स्टेशन से गिरफ्तार किया गया था।","facts":["इससे पहले 10 अप्रैल 1919 को महात्मा गांधी की भारत में पहली गिरफ्तारी 'पलवल' रेलवे स्टेशन (हरियाणा) से हुई थी।","22 अक्टूबर 1920 को महात्मा गांधी भिवानी आए थे और असहयोग आंदोलन के दौरान उन्होंने ब्रिटिश सरकार को 'शैतानी सरकार' कहा था।","फरवरी 1921 में महात्मा गांधी ने रोहतक में वैश्य हाई स्कूल की आधारशिला रखी थी।","पलवल (10 अप्रैल 1919) और हिसार (30 जुलाई 1919)—दोनों तिथियाँ HSSC परीक्षाओं में बार-बार पूछी जाती हैं।","हिसार रेलवे स्टेशन उत्तर पश्चिम रेलवे के बीकानेर मंडल के अंतर्गत आता है।"]},
  {"q":"हिसार के सातरोड गाँव के किस स्वतंत्रता सेनानी ने वर्ष 1936 में 'सेवक' समाचार पत्र निकाला था?","opts":["पंडित नेकीराम शर्मा","बाबू बालमुकुंद गुप्त","पंडित श्रीराम शर्मा","लाला हरदेव सहाय"],"a":3,"exp":"हिसार जिले के सातरोड गाँव के महान स्वतंत्रता सेनानी और गो-भक्त लाला हरदेव सहाय ने वर्ष 1936 में 'सेवक' समाचार पत्र का प्रकाशन शुरू किया था।","facts":["उन्होंने 1941 में 'ग्राम सेवक' नामक समाचार पत्र भी निकाला और अकाल पीड़ितों व गो-संरक्षण के लिए उल्लेखनीय कार्य किया।","हिसार के ही स्याहड़वा गाँव के 'चौधरी कृपाराम' भी क्षेत्र के प्रमुख स्वतंत्रता सेनानी थे।","अन्य प्रमुख समाचार पत्र: 'संदेश' (1930, पंडित नेकीराम शर्मा—भिवानी), 'हरियाणा तिलक' (1923, पंडित श्रीराम शर्मा—रोहतक) और 'जाट गजट' (1916, सर छोटूराम—रोहतक)।","हिसार से ही वर्ष 1889 में बाबू कन्हैया लाल ने 'जाट समाचार' प्रकाशित किया था।","सातरोड (हिसार) दिल्ली रोड (NH-9) पर हिसार सैन्य छावनी के निकट स्थित बड़ा ऐतिहासिक गाँव है।"]},
  {"q":"चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय (CCS HAU), हिसार की स्थापना किस तिथि को हुई थी?","opts":["20 अक्टूबर 1995","2 फरवरी 1970","1 दिसंबर 2010","1 नवंबर 1966"],"a":1,"exp":"एशिया के सबसे बड़े कृषि विश्वविद्यालयों में शामिल चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय (CCS HAU) की स्थापना 2 फरवरी 1970 को हिसार में हुई थी।","facts":["यह पहले पंजाब कृषि विश्वविद्यालय (लुधियाना) का हिसार कैंपस (वेटरनरी कॉलेज) था, जिसे 1970 में स्वतंत्र विश्वविद्यालय बनाया गया।","इस विश्वविद्यालय के प्रथम कुलपति ए.एल. फ्लेचर (ICS सेवानिवृत्त) थे, जिनका इसकी संरचना में बड़ा योगदान रहा।","इसका नाम भारत के 7वें प्रधानमंत्री व किसान नेता चौधरी चरण सिंह के नाम पर वर्ष 1991 में CCS HAU रखा गया।","हिसार में हरित क्रांति और उन्नत किस्म के बीज विकसित करने में इस विश्वविद्यालय की अग्रणी भूमिका रही है।","इसका परिसर लगभग 8,600+ एकड़ में फैला हुआ है और इसके अधीन राज्य भर में कृषि विज्ञान केंद्र (KVK) कार्य करते हैं।"]},
  {"q":"चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय (CCS HAU) को भारतीय कृषि अनुसंधान परिषद (ICAR) द्वारा सर्वश्रेष्ठ संस्थान पुरस्कार किस वर्ष मिला था?","opts":["1997","1970","1985","2010"],"a":0,"exp":"वर्ष 1997 में CCS HAU (हिसार) को भारतीय कृषि अनुसंधान परिषद (ICAR) द्वारा देश के सर्वश्रेष्ठ कृषि संस्थान पुरस्कार से सम्मानित किया गया था।","facts":["वर्ष 1970 में अपनी स्थापना के साथ ही इस विश्वविद्यालय ने धान व अन्य फसलों पर सघन शोध कार्य प्रारंभ कर दिया था।","इसी विश्वविद्यालय के परिसर में भारतीय खेल प्राधिकरण (SAI) के सहयोग से भारत के सबसे बड़े खेल प्रशिक्षण केंद्रों में से एक (गिरी सेंटर) स्थापित है।","CCS HAU परिसर में ही 26 फरवरी 1986 को हरियाणा अंतरिक्ष अनुप्रयोग केंद्र (HARSAC) की स्थापना की गई।","यहाँ स्थित 'चौधरी चरण सिंह कृषि संग्रहालय' हरियाणा की ग्रामीण व कृषि विरासत को प्रदर्शित करता है।","प्रतिवर्ष यहाँ दो बड़े 'किसान मेले' (रबी व खरीफ) आयोजित किए जाते हैं।"]},
  {"q":"गुरु जंभेश्वर विज्ञान एवं प्रौद्योगिकी विश्वविद्यालय (GJUST), हिसार की स्थापना कब हुई थी?","opts":["2 फरवरी 1970","1 दिसंबर 2010","20 अक्टूबर 1995","17 मार्च 2008"],"a":2,"exp":"गुरु जंभेश्वर विश्वविद्यालय, हिसार की स्थापना 20 अक्टूबर 1995 को हुई थी (औपचारिक उद्घाटन 1 नवंबर 1995 को तत्कालीन मुख्यमंत्री चौधरी भजनलाल द्वारा किया गया)।","facts":["इसका नाम बिश्नोई पंथ के संस्थापक और महान पर्यावरण संत गुरु जंभेश्वर जी महाराज के नाम पर रखा गया है।","मार्च 2006/2008 में इसका नाम विस्तारित कर 'गुरु जंभेश्वर विज्ञान एवं प्रौद्योगिकी विश्वविद्यालय' (GJUST) किया गया।","यह UGC और NAAC द्वारा उच्च 'A+' ग्रेड प्राप्त विश्वविद्यालय है तथा इसे 'हरित परिसर' (Green Campus) का सम्मान प्राप्त है।","यह विज्ञान, अभियांत्रिकी, प्रबंधन, फार्मेसी और जनसंचार की उच्च शिक्षा का हरियाणा में प्रमुख केंद्र है।","हिसार शहर में NH-9 (दिल्ली रोड) पर इसका विशाल परिसर स्थित है।"]},
  {"q":"लाला लाजपत राय पशु चिकित्सा एवं पशु विज्ञान विश्वविद्यालय (LUVAS), हिसार की स्थापना किस तिथि को की गई थी?","opts":["2 फरवरी 1970","20 अक्टूबर 1995","1 फरवरी 1985","1 दिसंबर 2010"],"a":3,"exp":"लाला लाजपत राय पशु चिकित्सा एवं पशु विज्ञान विश्वविद्यालय (LUVAS) की स्थापना 1 दिसंबर 2010 को हिसार में की गई थी।","facts":["इसका नया अत्याधुनिक परिसर हिसार में लगभग 300 एकड़ भूमि पर निर्मित किया गया है।","इस विश्वविद्यालय की स्थापना पहले CCS HAU के अधीन रहे पशु चिकित्सा महाविद्यालय को अलग करके की गई थी।","हिसार में मत्स्य पालन शिक्षा के लिए 'मत्स्य विज्ञान महाविद्यालय' (College of Fisheries Science) भी इसी विश्वविद्यालय के अंतर्गत संचालित है।","इसका नाम पंजाब केसरी लाला लाजपत राय के सम्मान में रखा गया है, जिन्होंने 1886–1892 तक हिसार को अपनी कर्मभूमि बनाया था।","तीन बड़े राजकीय विश्वविद्यालय (CCS HAU, GJUST, LUVAS) होने से हिसार पश्चिमी हरियाणा का सबसे बड़ा शैक्षणिक केंद्र है।"]},
  {"q":"केंद्रीय भैंस अनुसंधान संस्थान (CIRB) की स्थापना हिसार में किस तिथि को हुई थी?","opts":["7 जनवरी 1986","1 फरवरी 1985","26 फरवरी 1986","1 दिसंबर 2010"],"a":1,"exp":"केंद्रीय भैंस अनुसंधान संस्थान (Central Institute for Research on Buffaloes - CIRB) की स्थापना 1 फरवरी 1985 को हिसार में की गई थी।","facts":["यह भारतीय कृषि अनुसंधान परिषद (ICAR) के अधीन भैंसों की नस्ल सुधार, जीव कोशिका संरक्षण, क्लोनिंग, संतुलित आहार व दुग्ध उत्पादन बढ़ाने पर शोध करता है।","हरियाणा की विश्व प्रसिद्ध मुर्राह भैंस को 'काला सोना' (Black Gold) कहा जाता है।","CIRB हिसार ने भैंस के अनेक सफल क्लोन (जैसे हिसार गौरव आदि) तैयार कर विश्व स्तर पर कीर्तिमान बनाए हैं।","हिसार में ही राष्ट्रीय अश्व अनुसंधान केंद्र (1986) और राजकीय भैंस व सूअर प्रजनन केंद्र भी स्थित हैं।","राष्ट्रीय डेयरी अनुसंधान संस्थान (NDRI) करनाल (स्थापना: 1955) में स्थित है।"]},
  {"q":"सातवीं पंचवर्षीय योजना के अंतर्गत हिसार में 'राष्ट्रीय अश्व अनुसंधान केंद्र' (NRCE) की स्थापना कब की गई थी?","opts":["7 जनवरी 1986","1 फरवरी 1985","26 फरवरी 1986","2 फरवरी 1970"],"a":0,"exp":"अश्वों (घोड़ों) के स्वास्थ्य, प्रमुख बीमारियों के उपचार व नस्ल सुधार हेतु राष्ट्रीय अश्व अनुसंधान केंद्र (NRCE) की स्थापना 7 जनवरी 1986 को हिसार में की गई थी।","facts":["यह ICAR के अधीन घोड़ों, खच्चरों व गधों पर शोध करने वाला भारत का एकमात्र राष्ट्रीय अनुसंधान केंद्र है।","यह संस्थान अश्वों की घातक बीमारियों (जैसे ग्लैंडर्स, इक्वाइन इन्फ्लूएंजा) के टीके व निदान किट विकसित करता है।","टोहाना (फतेहाबाद) में भी उन्नत नस्ल के घोड़ों के लिए 'घोड़ों का स्टालिन केंद्र' स्थित है।","सातवीं पंचवर्षीय योजना की अवधि 1985 से 1990 तक थी।","हिसार को हरियाणा के प्रमुख कृषि एवं पशुधन शोध केंद्र के रूप में जाना जाता है।"]},
  {"q":"हरियाणा अंतरिक्ष अनुप्रयोग केंद्र (HARSAC) की स्थापना हिसार में किस तारीख को हुई थी?","opts":["1 फरवरी 1985","7 जनवरी 1986","26 फरवरी 1986","20 अक्टूबर 1995"],"a":2,"exp":"हरसेक (HARSAC) के नाम से विख्यात हरियाणा अंतरिक्ष अनुप्रयोग केंद्र की स्थापना 26 फरवरी 1986 को CCS HAU परिसर, हिसार में की गई थी।","facts":["यह हरियाणा सरकार के विज्ञान एवं प्रौद्योगिकी विभाग की एक स्वायत्त संस्था है।","इसका मुख्य कार्य अंतरिक्ष तकनीक (रिमोट सेंसिंग), GIS (भू-सूचना प्रणाली) और GPS के माध्यम से प्राकृतिक संसाधनों, फसलों व ढाँचागत सुविधाओं का सर्वेक्षण करना है।","HARSAC भारतीय अंतरिक्ष अनुसंधान संगठन (ISRO) के साथ मिलकर राज्य के डिजिटल नक्शे व भूमि उपयोग डेटा तैयार करता है।","इसरो (ISRO) की स्थापना 15 अगस्त 1969 को हुई थी और इसका मुख्यालय बेंगलुरु में है।","हरियाणा में 'आर्यभट्ट क्षेत्रीय विज्ञान केंद्र' अंबाला कैंट में स्थापित किया गया है।"]},
  {"q":"हिसार में 'उत्तरी प्रादेशिक फार्म मशीनरी प्रशिक्षण एवं जांच संस्थान' (NRFMTTI) की स्थापना किस वर्ष हुई थी?","opts":["1970","1985","1974","1963"],"a":3,"exp":"उत्तरी प्रादेशिक फार्म मशीनरी प्रशिक्षण एवं जांच संस्थान (NRFMTTI) की स्थापना वर्ष 1963 में हिसार में हुई थी।","facts":["यह भारत सरकार के कृषि एवं किसान कल्याण मंत्रालय के अधीन कार्य करने वाला प्रमुख कृषि अभियांत्रिकी संस्थान है।","यहाँ डीजल, पेट्रोल व मिट्टी के तेल से चलने वाले छोटे इंजनों, ट्रैक्टरों, सिंचाई पंपों और पौध संरक्षण यंत्रों की BIS प्रमाणित जांच की जाती है।","यह उत्तरी भारत के किसानों व तकनीशियनों को आधुनिक कृषि मशीनरी संचालन का प्रशिक्षण भी देता है।","1963 में ही फतेहाबाद में हरियाणा की पहली कॉटन मिल की स्थापना भी हुई थी।","हरियाणा में कृषि यंत्रों के निर्माण का एक अन्य प्रमुख केंद्र करनाल भी है।"]},
  {"q":"ऑस्ट्रेलिया सरकार के सहयोग से हिसार में 'इंडो-ऑस्ट्रेलियन भेड़ प्रजनन फार्म' (2,000 हेक्टेयर) की स्थापना कब की गई थी?","opts":["1974–75","1969–70","1985–86","1963–64"],"a":1,"exp":"इंडो-ऑस्ट्रेलियन भेड़ प्रजनन फार्म की स्थापना वर्ष 1969–70 में ऑस्ट्रेलिया सरकार के सहयोग से हिसार में लगभग 2,000 हेक्टेयर भूमि पर की गई थी।","facts":["इसका मुख्य उद्देश्य उच्च गुणवत्ता की ऊन व मांस उत्पादन हेतु विदेशी (कोरीडेल/मेरिनो) व देसी भेड़ों की संकर नस्लें तैयार करना था।","हिसार में ही इसके बाद वर्ष 1974–75 में 500 एकड़ भूमि पर 'इंडो-ऑस्ट्रेलियन लाइव स्टॉक (पशुधन) फार्म' स्थापित किया गया।","हिसार में एशिया का सबसे बड़ा 'राजकीय पशुधन फार्म' (GLF) स्थित है।","हरियाणा के अन्य प्रजनन केंद्र: चिंकारा प्रजनन केंद्र (कैरू, भिवानी), बकरी प्रजनन केंद्र (लोहारू, भिवानी) और मगरमच्छ प्रजनन केंद्र (भौर सैदां, कुरुक्षेत्र)।","भिवानी और हिसार हरियाणा में सर्वाधिक भेड़ व पशुधन वाले क्षेत्रों में शामिल हैं।"]},
  {"q":"हिसार में 500 एकड़ भूमि पर 'इंडो-ऑस्ट्रेलियन लाइव स्टॉक (पशुधन) फार्म' की स्थापना किस वर्ष हुई थी?","opts":["1974–75","1969–70","1985–86","1995–96"],"a":0,"exp":"इंडो-ऑस्ट्रेलियन लाइव स्टॉक फार्म की स्थापना वर्ष 1974–75 में ऑस्ट्रेलिया सरकार के सहयोग से हिसार में 500 एकड़ भूमि पर की गई थी।","facts":["इस फार्म में मुख्यतः जर्सी, फ्रीजियन और संकर (क्रॉस) नस्ल के उच्च दुग्ध उत्पादक पशुओं का पालन व नस्ल सुधार किया जाता है।","हिसार अच्छी नस्ल के सांडों (बैल) के उत्पादन के लिए भी पूरे देश में प्रसिद्ध है।","हिसार में सूअर प्रजनन केंद्र और भैंस प्रजनन केंद्र भी संचालित हैं।","हरियाणा में सर्वाधिक पशुधन वाले प्रमुख जिलों में हिसार शीर्ष स्थान पर रहा है।","पशुपालन को बढ़ावा देने हेतु हरियाणा में 'पशुधन किसान क्रेडिट कार्ड योजना' (दिसंबर 2019, भिवानी से) शुरू की गई थी।"]},
  {"q":"एशिया का सबसे बड़ा 'पशु फार्म' (Livestock Farm) और राज्य का प्रमुख 'सूअर प्रजनन केंद्र' किस जिले में स्थित हैं?","opts":["करनाल","भिवानी","हिसार","सिरसा"],"a":2,"exp":"एशिया का सबसे बड़ा राजकीय पशुधन फार्म (Government Livestock Farm - GLF) और सूअर प्रजनन केंद्र हिसार जिले में स्थित हैं।","facts":["हिसार के राजकीय पशुधन फार्म की शुरुआत ब्रिटिश काल में 1809 में (ऊँट व बैल पालन हेतु) हुई थी।","यह फार्म उन्नत हरियाणवी व साहीवाल गाय, मुर्राह भैंस और अच्छी नस्ल के सांडों के प्रजनन के लिए विख्यात है।","हिसार में पशुधन शोध हेतु LUVAS (2010), CIRB (1985) और NRCE (1986) जैसे शीर्ष संस्थान स्थित हैं।","हरियाणा प्रति व्यक्ति दूध उपलब्धता के मामले में देश के अग्रणी राज्यों में शामिल है।","हरियाणा में 'गौ सेवा आयोग' का मुख्यालय पंचकूला में स्थित है।"]},
  {"q":"हिसार–राजगढ़ मार्ग पर स्थित चार मंजिला आधुनिक 'लघु सचिवालय' (Mini Secretariat) भवन का निर्माण किस वर्ष किया गया था?","opts":["1966","1982","1995","1978"],"a":3,"exp":"हिसार–राजगढ़ मार्ग पर स्थित भव्य चार मंजिला लघु सचिवालय भवन का निर्माण वर्ष 1978 में किया गया था।","facts":["इस लघु सचिवालय में उपायुक्त (DC), मंडलायुक्त (Divisional Commissioner), पुलिस अधीक्षक (SP) और जिला राजस्व विभाग के मुख्य कार्यालय स्थित हैं।","हिसार मंडल मुख्यालय होने के कारण यहाँ से 5 जिलों (हिसार, फतेहाबाद, सिरसा, जींद, हांसी) का प्रशासनिक समन्वय किया जाता है।","हिसार पुलिस रेंज का मुख्यालय भी हिसार में स्थित है।","हिसार के जिला न्यायालय परिसर भी लघु सचिवालय के निकट ही स्थित हैं।","1978 के अगले वर्ष (1979 में) फरीदाबाद जिले का गठन और गुरुग्राम में SCERT की स्थापना हुई थी।"]},
  {"q":"हरियाणा का पहला 'मॉडल एम्प्लॉयमेंट गाइडेंस एंड काउंसलिंग सेंटर' कहाँ स्थापित किया गया है?","opts":["गुरुग्राम","हिसार","पंचकूला","रोहतक"],"a":1,"exp":"हरियाणा का पहला मॉडल एम्प्लॉयमेंट गाइडेंस एंड काउंसलिंग सेंटर हिसार में बनाया गया है।","facts":["जबकि देश का पहला 'मॉडल करियर सेंटर' वर्ष 2016 में गुरुग्राम में स्थापित किया गया था।","14 अप्रैल 2016 को 'ग्रामोदय से भारत उदय' अभियान की हरियाणा में शुरुआत भी हिसार से ही की गई थी।","हिसार में तीन राजकीय विश्वविद्यालय होने से यह पश्चिमी हरियाणा के युवाओं के लिए करियर व प्रतियोगी परीक्षाओं का बड़ा केंद्र है।","हरियाणा सरकार युवाओं के कौशल विकास हेतु 'हरियाणा कौशल रोजगार निगम' (HKRN) व पलवल में 'श्री विश्वकर्मा कौशल विश्वविद्यालय' संचालित कर रही है।","हरियाणा लोक सेवा आयोग (HPSC) और HSSC दोनों के मुख्यालय पंचकूला में स्थित हैं।"]},
  {"q":"एशिया की सबसे बड़ी 'ऑटो मार्केट' (ऑटोमोबाइल मरम्मत व स्पेयर पार्ट्स मंडी) किस जिले में स्थित है?","opts":["हिसार","गुरुग्राम","फरीदाबाद","अंबाला"],"a":0,"exp":"हिसार शहर में स्थित ऑटो मार्केट को एशिया की सबसे बड़ी ऑटो मार्केट के रूप में जाना जाता है।","facts":["यहाँ हजारों की संख्या में ऑटोमोबाइल स्पेयर पार्ट्स, ट्रक-ट्रैक्टर बॉडी निर्माण और वाहन मरम्मत की दुकानें व वर्कशॉप हैं।","उत्तर भारत (हरियाणा, पंजाब, राजस्थान, दिल्ली) के व्यापारी व वाहन मालिक बड़ी संख्या में यहाँ आते हैं।","जहाँ गुरुग्राम–मानेसर को वाहन निर्माण का 'ऑटो हब' कहा जाता है, वहीं हिसार 'एशिया की सबसे बड़ी ऑटो मार्केट' के लिए प्रसिद्ध है।","हिसार भारत का सबसे बड़ा जस्ती लोहा (Galvanized Iron) और स्टेनलेस स्टील उत्पादक केंद्र भी है।","हिसार के प्रमुख उद्योगों में जिंदल स्टेनलेस (JSL), पाइप उद्योग और कपास ओटाई मिलें शामिल हैं।"]},
  {"q":"हिसार जिले में औद्योगिक दृष्टि से कौन-सा प्रमुख खनिज पाया जाता है?","opts":["तांबा","संगमरमर","शोरा","हिलना पत्थर"],"a":2,"exp":"हिसार जिले की लवणीय व क्षारीय मृदा वाले क्षेत्रों में औद्योगिक खनिज के रूप में 'शोरा' (Saltpetre / पोटैशियम नाइट्रेट) पाया जाता है।","facts":["शोरे का उपयोग मुख्य रूप से उर्वरक, काँच निर्माण और आतिशबाजी/बारूद उद्योग में किया जाता है।","अन्य जिलों के प्रमुख खनिज: महेंद्रगढ़ (तांबा, लौह अयस्क, संगमरमर, चूना पत्थर—खनिजों का शहर), फरीदाबाद (बजरी), चरखी दादरी के कल्याणा में (हिलना पत्थर) और गुरुग्राम के सिकंदरपुर में (चीनी मिट्टी)।","भिवानी के तोशाम/खानक पहाड़ियों में दुर्लभ 'टिन' और ग्रेनाइट पाया जाता है।","हिसार जिले की प्रमुख कृषि फसलें गेहूँ और कपास (नरमा) हैं।","हिसार, फतेहाबाद और सिरसा को संयुक्त रूप से हरियाणा की 'कॉटन बेल्ट' (कपास पट्टी) कहा जाता है।"]},
  {"q":"हिसार के खेदड़ (बरवाला) में स्थित 'राजीव गांधी तापीय विद्युत परियोजना' का उद्घाटन 24 अगस्त 2010 को किसने किया था?","opts":["नरेंद्र मोदी","भूपेंद्र सिंह हुड्डा","अटल बिहारी वाजपेयी","डॉ. मनमोहन सिंह"],"a":3,"exp":"खेदड़ (बरवाला, हिसार) स्थित 1,200 मेगावाट की राजीव गांधी तापीय विद्युत परियोजना का उद्घाटन 24 अगस्त 2010 को तत्कालीन प्रधानमंत्री डॉ. मनमोहन सिंह ने किया था।","facts":["इस परियोजना में 600-600 मेगावाट की दो इकाइयाँ (कुल 1,200 मेगावाट) हैं और इसे उत्तर भारत की मेगा परियोजना कहा जाता है।","इसका निर्माण रिलायंस एनर्जी द्वारा (लगभग 4,512 करोड़ रुपये की लागत से) किया गया था और इसका संचालन HPGCL द्वारा होता है।","इसके लिए कोयले की आपूर्ति 'महानदी कोलफील्ड्स लिमिटेड' (ओडिशा) से होती है।","हरियाणा के अन्य प्रमुख विद्युत संयंत्र: इंदिरा गांधी सुपर थर्मल प्लांट (झाड़ली, झज्जर—1,500 MW), दीनबंधु छोटूराम प्लांट (यमुनानगर—600 MW) और गोरखपुर परमाणु संयंत्र (फतेहाबाद—2,800 MW)।","हरियाणा विद्युत उत्पादन निगम लिमिटेड (HPGCL) का मुख्यालय पंचकूला में स्थित है।"]},
  {"q":"14 अप्रैल 2025 को प्रधानमंत्री नरेंद्र मोदी ने हरियाणा के किस हवाई अड्डे से पहली वाणिज्यिक उड़ान (हिसार–अयोध्या) का शुभारंभ किया?","opts":["करनाल हवाई अड्डा","महाराजा अग्रसेन हवाई अड्डा","पिंजौर हवाई अड्डा","नारनौल हवाई अड्डा"],"a":1,"exp":"14 अप्रैल 2025 को प्रधानमंत्री नरेंद्र मोदी ने हिसार स्थित महाराजा अग्रसेन हवाई अड्डे से हिसार–अयोध्या पहली वाणिज्यिक उड़ान को हरी झंडी दिखाई।","facts":["महाराजा अग्रसेन हवाई अड्डा (IATA कोड: HSS) लगभग 7,200 एकड़ में विकसित हरियाणा का पहला बड़ा लाइसेंस प्राप्त इंटीग्रेटेड एविएशन हब है।","इसी दिन प्रधानमंत्री ने इसके नए आधुनिक टर्मिनल भवन (लगभग 38,000 वर्ग मीटर) की आधारशिला भी रखी।","इसका रनवे 3,000 मीटर लंबा है और इसे उड़ान (UDAN) योजना के तहत अयोध्या, जयपुर, चंडीगढ़, अहमदाबाद व जम्मू से जोड़ा जा रहा है।","इसका नाम अग्रोहा के महान शासक महाराजा अग्रसेन के सम्मान में रखा गया है।","अंबाला कैंट में भी उत्तरी हरियाणा के लिए नया घरेलू हवाई अड्डा (सिविल एन्क्लेव) विकसित किया गया है।"]},
  {"q":"हिसार जिले से होकर गुजरने वाले दो प्रमुख राष्ट्रीय राजमार्ग (National Highways) कौन-से हैं?","opts":["NH-9 और NH-52","NH-44 और NH-48","NH-19 और NH-152D","NH-709 और NH-344"],"a":0,"exp":"हिसार जिले से होकर राष्ट्रीय राजमार्ग NH-9 (पुराना NH-10) और NH-52 (पुराना NH-65) गुजरते हैं।","facts":["NH-9 दिल्ली से बहादुरगढ़, रोहतक, हांसी, हिसार, फतेहाबाद और सिरसा होते हुए पंजाब (फाजिल्का) तक जाता है।","NH-52 (पुराना NH-65) अंबाला–कैथल–नरवाना–बरवाला–हिसार होते हुए राजस्थान (राजगढ़/चूरू/जयपुर) की ओर जाता है।","हिसार रेलवे जंक्शन उत्तर पश्चिम रेलवे (बीकानेर मंडल) का प्रमुख जंक्शन है, जहाँ से दिल्ली, रेवाड़ी, सिरसा, बठिंडा, लुधियाना और जयपुर के लिए सीधी ट्रेनें चलती हैं।","14 अप्रैल 2025 से वाणिज्यिक उड़ानें शुरू होने के बाद हिसार सड़क, रेल और वायु—तीनों मार्गों से जुड़ गया है।","हरियाणा का सबसे बड़ा व पुराना रेलवे जंक्शन रेवाड़ी (1873) है।"]},
  {"q":"हिसार सैन्य छावनी (Hisar Military Station / Cantt) की स्थापना किस तारीख को हुई थी?","opts":["15 अगस्त 1947","1 नवंबर 1966","15 नवंबर 1982","26 जनवरी 1999"],"a":2,"exp":"हिसार सैन्य छावनी (Hisar Military Station) की स्थापना 15 नवंबर 1982 को की गई थी।","facts":["यह भारतीय थलसेना की पश्चिमी कमान के अंतर्गत '33 आर्म्ड डिवीजन' (डॉट ऑन टार्गेट) का प्रमुख सामरिक केंद्र है।","पश्चिमी सीमा (राजस्थान व पंजाब) के निकट होने के कारण इसका सामरिक महत्व अत्यंत अधिक है।","हरियाणा की सबसे पुरानी व सबसे बड़ी सैन्य छावनी 'अंबाला छावनी' है, जिसकी स्थापना 1843 ई. में हुई थी।","हिसार में हरियाणा सशस्त्र पुलिस (HAP) की तीसरी बटालियन और बीएसएफ (BSF) का भी बड़ा केंद्र स्थित है।","हिसार का 'महावीर स्टेडियम' जिले के खिलाड़ियों और सैन्य भर्ती की तैयारी करने वाले युवाओं का मुख्य केंद्र है।"]},
  {"q":"हिसार में 'आकाशवाणी केंद्र' (All India Radio) की स्थापना किस तिथि को हुई थी?","opts":["8 मई 1976","24 जून 1991","1 नवंबर 2002","26 जनवरी 1999"],"a":3,"exp":"आकाशवाणी केंद्र हिसार की स्थापना 26 जनवरी 1999 को हुई थी।","facts":["हरियाणा में कुल 3 आकाशवाणी केंद्र हैं: पहला रोहतक (8 मई 1976), दूसरा कुरुक्षेत्र (24 जून 1991) और तीसरा हिसार (26 जनवरी 1999)।","आकाशवाणी हिसार से हरियाणवी लोक संगीत, कृषि समाचार (CCS HAU के सहयोग से) और क्षेत्रीय कार्यक्रम प्रसारित होते हैं।","हिसार में 1 नवंबर 2002 को हरियाणा का एकमात्र दूरदर्शन केंद्र भी शुरू हुआ था।","आकाशवाणी (All India Radio) का आधिकारिक आदर्श वाक्य 'बहुजन हिताय, बहुजन सुखाय' है।","प्रसार भारती की स्थापना 23 नवंबर 1997 को हुई थी।"]},
  {"q":"1 नवंबर 2002 को सुषमा स्वराज द्वारा उद्घाटित 'हिसार दूरदर्शन केंद्र' जनवरी 2023 में कहाँ स्थानांतरित कर दिया गया?","opts":["रोहतक","चंडीगढ़","पंचकूला","गुरुग्राम"],"a":1,"exp":"हरियाणा के एकमात्र दूरदर्शन केंद्र (स्थापना: 1 नवंबर 2002, हिसार) को प्रसार भारती द्वारा 15 जनवरी 2023 को चंडीगढ़ (DDK Chandigarh) स्थानांतरित कर दिया गया।","facts":["इसका उद्घाटन 1 नवंबर 2002 को तत्कालीन केंद्रीय सूचना एवं प्रसारण मंत्री स्वर्गीय सुषमा स्वराज ने किया था।","इसने लगभग 20 वर्षों तक हिसार से हरियाणा की कला, संस्कृति और समाचारों का प्रसारण किया।","इसी प्रकार पूर्व में हिसार में स्थापित विशेष पर्यावरण न्यायालय भी बाद में कुरुक्षेत्र स्थानांतरित हो गया (वर्तमान दो पर्यावरण न्यायालय: फरीदाबाद व कुरुक्षेत्र; कैंप कोर्ट हिसार में)।","हिसार का आकाशवाणी केंद्र (26 जनवरी 1999) आज भी हिसार से सक्रिय रूप से प्रसारण कर रहा है।","सुषमा स्वराज का संबंध हरियाणा के अंबाला जिले से था और वे दिल्ली की पहली महिला मुख्यमंत्री व भारत की विदेश मंत्री रहीं।"]},
  {"q":"हरियाणा का एकमात्र 'हिरण पार्क' (Deer Park) और प्रसिद्ध 'ब्लू बर्ड झील' किस जिले में स्थित हैं?","opts":["हिसार","भिवानी","रोहतक","कुरुक्षेत्र"],"a":0,"exp":"हरियाणा का एकमात्र हिरण पार्क (स्थापना: 1970–71, धान्सू रोड) और ब्लू बर्ड झील व पर्यटन स्थल हिसार जिले में स्थित हैं।","facts":["हिसार हिरण पार्क लगभग 42 एकड़ क्षेत्र में फैला है, जहाँ काला हिरण, चीतल और सांभर संरक्षित हैं।","ब्लू बर्ड झील (हिसार) NH-9 के निकट स्थित एक सुंदर पर्यटन व नौकायन केंद्र है, जहाँ सर्दियों में प्रवासी पक्षी आते हैं।","हिसार में ही हरियाणा पर्यटन निगम का प्रसिद्ध 'फ्लेमिंगो' पर्यटन स्थल और 'जिंदल पार्क' स्थित हैं।","हरियाणा में 3 चिड़ियाघर (मिनी जू) हैं: रोहतक, भिवानी और पीपली (कुरुक्षेत्र)।","हरियाणा का राज्य पशु 'काला हिरण' और राज्य पक्षी 'काला तीतर' है।"]},
  {"q":"हरियाणा का पहला 'वाई-फाई' (Wi-Fi) गाँव कौन-सा बना था?","opts":["सुई (भिवानी)","भनकपुर (फरीदाबाद)","जुगलान (हिसार)","बिनौला (गुरुग्राम)"],"a":2,"exp":"हिसार जिले का जुगलान गाँव हरियाणा का पहला पूर्णतः वाई-फाई (Wi-Fi) सुविधा से युक्त गाँव बना था।","facts":["जुगलान गाँव हिसार–बरवाला राष्ट्रीय राजमार्ग (NH-52) पर स्थित है।","हरियाणा के अन्य प्रमुख 'प्रथम गाँव': पहला आदर्श गाँव (सुई, भिवानी), राष्ट्रगान वाला पहला गाँव (भनकपुर, फरीदाबाद), पहला CFL गाँव (बिनौला, गुरुग्राम) और पहला सोलर गाँव (गुरुकुल खेड़ा, जींद)।","हिसार जिले के ही 'स्याहड़वा' गाँव को हरियाणा में स्ट्रॉबेरी की व्यावसायिक खेती के लिए जाना जाता है।","हरियाणा में 'मेरा गाँव-जगमग गाँव' योजना 1 जुलाई 2015 को दयालपुर (कुरुक्षेत्र) से शुरू हुई थी।","29 नवंबर 1970 को हरियाणा सभी गाँवों में बिजली पहुँचाने वाला देश का पहला राज्य बना था।"]},
  {"q":"हिसार जिले के किस गाँव में प्रसिद्ध 'माता बनभौरी धाम' (नवरात्रि मेला) स्थित है?","opts":["सीसवाल","तलवंडी","सातरोड","बनभौरी"],"a":3,"exp":"हिसार जिले के बरवाला क्षेत्र के बनभौरी गाँव में प्राचीन भ्रामरी देवी (माता बनभौरी) का प्रसिद्ध मंदिर है, जहाँ चैत्र व आश्विन नवरात्रि में विशाल मेला लगता है।","facts":["हरियाणा सरकार ने इस ऐतिहासिक मंदिर के प्रबंधन व विकास हेतु 'माता बनभौरी पूजा स्थल बोर्ड' का गठन किया है।","मान्यता है कि इस प्राचीन मंदिर की स्थापना लगभग 400–500 वर्ष पूर्व हुई थी और यहाँ दूर-दूर से श्रद्धालु दर्शन करने आते हैं।","हिसार जिले के अन्य प्रमुख मेले: अग्रसेन जयंती मेला (अग्रोहा) और शिवजी का मेला (सीसवाल व किरमारा)।","ध्यान दें: प्रसिद्ध 'काली देवी का मेला' (हांसी) अब नवगठित 23वें जिले 'हांसी' के अंतर्गत आता है।","हरियाणा के अन्य प्रमुख देवी मंदिर: शीतला माता मंदिर (गुरुग्राम), माता मनसा देवी (पंचकूला), भीमेश्वरी देवी (बेरी, झज्जर) और भवानी अम्बा (अंबाला)।"]},
  {"q":"हिसार जिले के किन दो गाँवों में भगवान शिव का प्रसिद्ध वार्षिक मेला लगता है?","opts":["अग्रोहा और बरवाला","सीसवाल और किरमारा","खेदड़ और जुगलान","सातरोड और तलवंडी"],"a":1,"exp":"हिसार जिले के सीसवाल और किरमारा गाँवों में भगवान शिव का प्रसिद्ध वार्षिक मेला आयोजित होता है।","facts":["सीसवाल गाँव पूर्व-हड़प्पा कालीन 'सीसवाल संस्कृति' के पुरातात्विक स्थल के रूप में भी विश्व प्रसिद्ध है।","अग्रोहा में प्रतिवर्ष भाद्रपद अमावस्या और अग्रसेन जयंती पर विशाल मेला लगता है।","हिसार शहर में प्राचीन 'देवी भवन मंदिर' और नागोरी गेट का 'श्री दिगंबर जैन मंदिर' प्रमुख धार्मिक स्थल हैं।","अन्य जिलों के प्रसिद्ध शिव मेले: स्थानेश्वर महादेव (कुरुक्षेत्र), भूतेश्वर मंदिर (जींद) और किलोई शिव मेला (रोहतक)।","हरियाणा के लोक मेलों में ग्रामीण संस्कृति, कुश्ती दंगल और भजन-रागिनी की झलक देखने को मिलती है।"]},
  {"q":"हिसार जिले के तलवंडी गाँव में कौन-सा प्रसिद्ध धार्मिक स्थल स्थित है?","opts":["मीठा पीर की दरगाह","चार कुतुब दरगाह","बाबा मुंगीपा धाम","लख्नौर साहिब"],"a":0,"exp":"हिसार जिले के तलवंडी गाँव में सूफी संत 'मीठा पीर की दरगाह' स्थित है।","facts":["हिसार जिले के अन्य प्रमुख सूफी व इस्लामी स्मारक: शेख जुनैद की मजार (नागोरी गेट), प्राणपीर बादशाह गुम्बद और लाट की मस्जिद।","प्रसिद्ध 'चार कुतुब दरगाह' अब नवगठित 23वें जिले 'हांसी' में स्थित है।","बाबा मुंगीपा धाम तोशाम (भिवानी) में और लख्नौर साहिब गुरुद्वारा अंबाला जिले में स्थित है।","मीठा पीर की दरगाह पर स्थानीय श्रद्धालु सभी धर्मों से ऊपर उठकर जियारत करने आते हैं।","हिसार की संस्कृति में हिंदू, जैन, सिख और सूफी परंपराओं का सुंदर समन्वय है।"]},
  {"q":"ओलंपिक में बैडमिंटन का पदक जीतने वाली भारत की पहली खिलाड़ी 'साइना नेहवाल' का जन्म 17 मार्च 1990 को किस जिले में हुआ था?","opts":["रोहतक","सोनीपत","हिसार","भिवानी"],"a":2,"exp":"विश्व प्रसिद्ध बैडमिंटन खिलाड़ी साइना नेहवाल का जन्म 17 मार्च 1990 को हिसार (पिता डॉ. हरवीर सिंह नेहवाल, CCS HAU में वैज्ञानिक) में हुआ था।","facts":["साइना नेहवाल ने 2012 के लंदन ओलंपिक में महिला एकल बैडमिंटन में कांस्य पदक जीतकर इतिहास रचा था।","उन्होंने 2010 दिल्ली और 2018 गोल्ड कोस्ट राष्ट्रमंडल खेलों में स्वर्ण पदक जीते तथा 2015 में वे विश्व की नंबर-1 खिलाड़ी बनीं।","भारत सरकार ने उन्हें अर्जुन पुरस्कार (2009), मेजर ध्यानचंद खेल रत्न (2010), पद्म श्री (2010) और पद्म भूषण (2016) से सम्मानित किया।","उन्होंने अपनी प्रारंभिक शिक्षा CCS HAU के कैंपस स्कूल, हिसार से प्राप्त की थी।","हिसार जिले ने भारत को साइना नेहवाल, अनीता कुंडू, गीतिका जाखड़ और कृष्णा पूनिया जैसी अनेक विश्व स्तरीय महिला खिलाड़ी दी हैं।"]},
  {"q":"नेपाल और चीन—दोनों रास्तों से माउंट एवरेस्ट फतह करने वाली भारत की पहली महिला 'अनीता कुंडू' का संबंध हिसार के किस गाँव से है?","opts":["अग्रोहा","सीसवाल","खेदड़","फरीदपुर"],"a":3,"exp":"विश्व प्रसिद्ध पर्वतारोही अनीता कुंडू का संबंध हिसार जिले के उकलाना क्षेत्र के फरीदपुर गाँव से है।","facts":["अनीता कुंडू ने 2013 में नेपाल की तरफ से और 2017 में चीन की तरफ से माउंट एवरेस्ट फतह कर यह कीर्तिमान बनाने वाली पहली भारतीय महिला बनीं।","उन्हें वर्ष 2019 में साहसिक खेलों के सर्वोच्च राष्ट्रीय सम्मान 'तेनजिंग नोर्गे राष्ट्रीय साहसिक पुरस्कार' से सम्मानित किया गया।","वे हरियाणा पुलिस में कार्यरत हैं और सातों महाद्वीपों की सर्वोच्च चोटियों (Seven Summits) के अभियान में भी शामिल रही हैं।","हिसार की ही युवा पर्वतारोही 'शिवांगी पाठक' ने 2018 में मात्र 16 वर्ष की आयु में माउंट एवरेस्ट फतह किया था।","रेवाड़ी की संतोष यादव दो बार एवरेस्ट फतह करने वाली दुनिया की पहली महिला और फतेहाबाद की मनीषा पायल भी एवरेस्ट विजेता हैं।"]},
  {"q":"वर्ष 2006 में अर्जुन पुरस्कार प्राप्त करने वाली भारत की पहली महिला पहलवान 'गीतिका जाखड़' का संबंध हिसार के किस क्षेत्र से है?","opts":["बरवाला","अग्रोहा","आदमपुर","उकलाना"],"a":1,"exp":"प्रसिद्ध अंतर्राष्ट्रीय महिला पहलवान गीतिका जाखड़ का संबंध हिसार जिले के अग्रोहा क्षेत्र से है।","facts":["गीतिका जाखड़ वर्ष 2006 में 'अर्जुन पुरस्कार' प्राप्त करने वाली भारत की पहली महिला पहलवान बनी थीं।","उन्होंने 2006 दोहा एशियाई खेलों में रजत, 2014 इंचियोन एशियाई खेलों में कांस्य और 2014 ग्लासगो राष्ट्रमंडल खेलों (63 किग्रा) में रजत पदक जीता।","उन्हें वर्ष 2005 में प्रतिष्ठित 'भारत केसरी' खिताब से नवाजा गया था।","वे हरियाणा पुलिस में डीएसपी (DSP) के पद पर सेवाएँ दे रही हैं।","हिसार से ही प्रसिद्ध महिला पहलवान ललिता सहरावत (2014 राष्ट्रमंडल रजत पदक) भी संबंधित हैं।"]},
  {"q":"2010 राष्ट्रमंडल खेलों में डिस्कस थ्रो (चक्का फेंक) में स्वर्ण पदक जीतने वाली 'कृष्णा पूनिया' का जन्म हिसार के किस स्थान पर हुआ था?","opts":["अग्रोहा","बरवाला","आदमपुर","बालसमंद"],"a":0,"exp":"ओलंपियन एथलीट कृष्णा पूनिया का जन्म 5 मई 1977 को अग्रोहा (हिसार) में हुआ था (उनका विवाह राजस्थान के चूरू जिले में हुआ)।","facts":["कृष्णा पूनिया 2010 दिल्ली राष्ट्रमंडल खेलों में व्यक्तिगत ट्रैक एंड फील्ड (डिस्कस थ्रो) का स्वर्ण पदक जीतने वाली पहली भारतीय महिला एथलीट बनीं।","उन्होंने 2006 दोहा और 2010 ग्वांगझू एशियाई खेलों में कांस्य पदक जीते तथा 2008 व 2012 ओलंपिक में भारत का प्रतिनिधित्व किया।","उन्हें 2010 में अर्जुन पुरस्कार और 2011 में 'पद्म श्री' से सम्मानित किया गया।","वे राजस्थान के सादुलपुर से विधायक और राजस्थान राज्य क्रीड़ा परिषद की अध्यक्ष भी रहीं।","हिसार के CCS HAU स्थित गिरी सेंटर व महावीर स्टेडियम में अनेक राष्ट्रीय एथलीट प्रशिक्षण लेते हैं।"]},
  {"q":"प्रसिद्ध ओलंपियन मुक्केबाज 'जय भगवान' और महिला पहलवान 'ललिता सहरावत' का संबंध किस जिले से है?","opts":["भिवानी","रोहतक","हिसार","झज्जर"],"a":2,"exp":"ओलंपियन मुक्केबाज जय भगवान और राष्ट्रमंडल पदक विजेता महिला पहलवान ललिता सहरावत हिसार जिले से संबंधित हैं।","facts":["जय भगवान ने 2010 दिल्ली राष्ट्रमंडल खेलों (60 किग्रा) में कांस्य पदक, 2009 एशियाई चैंपियनशिप में रजत पदक जीता और 2012 लंदन ओलंपिक में भाग लिया (अर्जुन पुरस्कार: 2014)।","ललिता सहरावत ने 2014 के ग्लासगो राष्ट्रमंडल खेलों (53 किग्रा महिला कुश्ती) में रजत पदक जीता था।","नोट: पहलवान पूजा ढांडा (बुडाना) और मुक्केबाज विकास कृष्ण यादव (सिंघवा खास) का संबंध अब नवगठित हांसी जिले के निकटवर्ती नारनौंद क्षेत्र से है।","हरियाणा की खेल नीति के तहत ओलंपिक स्वर्ण विजेता को 6 करोड़, रजत को 4 करोड़ और कांस्य विजेता को 2.5 करोड़ रुपये दिए जाते हैं।","हरियाणा का सर्वोच्च खेल पुरस्कार 'भीम पुरस्कार' (5 लाख रुपये) है।"]},
  {"q":"भारत के आम नागरिकों को सम्मानपूर्वक 'तिरंगा फहराने का अधिकार' दिलाने वाले उद्योगपति 'नवीन जिंदल' का जन्म कहाँ हुआ था?","opts":["कुरुक्षेत्र","पानीपत","रोहतक","हिसार"],"a":3,"exp":"प्रसिद्ध उद्योगपति व सांसद नवीन जिंदल का जन्म 9 मार्च 1970 को हिसार में हुआ था।","facts":["नवीन जिंदल के ऐतिहासिक कानूनी संघर्ष के बाद 23 जनवरी 2004 को सर्वोच्च न्यायालय ने हर भारतीय नागरिक को तिरंगा फहराने का मौलिक अधिकार (अनुच्छेद 19(1)(a)) प्रदान किया।","उनकी पत्नी 'शालू जिंदल' विश्व प्रसिद्ध कुचिपुड़ी नृत्यांगना और समाजसेवी हैं।","उनके पिता स्वर्गीय ओम प्रकाश जिंदल हिसार से विधायक, हरियाणा के ऊर्जा मंत्री और जिंदल समूह के संस्थापक थे।","नवीन जिंदल 2004, 2009 के बाद 2024 के लोकसभा चुनाव में कुरुक्षेत्र सीट से भाजपा के सांसद निर्वाचित हुए।","उनकी माता सावित्री जिंदल 2024 में हिसार विधानसभा सीट से विधायक चुनी गई हैं।"]},
  {"q":"एस्सेल ग्रुप और जी-ग्रुप (Zee Group) के संस्थापक व चेयरमैन 'सुभाष चंद्रा' का जन्म हरियाणा के किस जिले में हुआ था?","opts":["रोहतक","हिसार","सिरसा","फतेहाबाद"],"a":1,"exp":"भारत में निजी सैटेलाइट टेलीविजन के जनक सुभाष चंद्रा का जन्म 30 नवंबर 1950 को आदमपुर (हिसार) में हुआ था।","facts":["उन्होंने वर्ष 1992 में भारत का पहला निजी हिंदी सैटेलाइट चैनल 'जी टीवी' (Zee TV) प्रारंभ किया था।","वे वर्ष 2016 से 2022 तक हरियाणा से राज्यसभा सांसद रहे।","उन्हें अंतर्राष्ट्रीय एमी डायरेक्टोरेट अवार्ड (International Emmy Directorate Award) से भी सम्मानित किया गया है।","उनकी आत्मकथा का नाम 'द ज़ेड फैक्टर: माई जर्नी ऐज द रॉन्ग मैन एट द राइट टाइम' है।","आदमपुर (हिसार) से ही पूर्व मुख्यमंत्री चौधरी भजनलाल और कुलदीप बिश्नोई का गहरा राजनीतिक संबंध रहा है।"]},
  {"q":"प्रसिद्ध बॉलीवुड अभिनेता और राष्ट्रीय पुरस्कार विजेता हरियाणवी फिल्म 'दादा लख्मी' के निर्देशक 'यशपाल शर्मा' का जन्म कहाँ हुआ था?","opts":["हिसार","रोहतक","गुरुग्राम","अंबाला"],"a":0,"exp":"प्रसिद्ध फिल्म एवं रंगमंच अभिनेता यशपाल शर्मा का जन्म 9 अगस्त 1967 को हिसार में हुआ था।","facts":["उन्होंने 'लगान', 'गंगाजल', 'अपहरण', 'सिंह इज किंग' और 'राउडी राठौड़' जैसी अनेक चर्चित बॉलीवुड फिल्मों में अभिनय किया।","हरियाणा के सूर्य कवि पंडित लख्मीचंद के जीवन पर उनके द्वारा बनाई गई फिल्म 'दादा लख्मी' को सर्वश्रेष्ठ हरियाणवी फिल्म का राष्ट्रीय फिल्म पुरस्कार मिला।","हिसार से ही प्रसिद्ध लोक व आधुनिक कलाकार सलविंद्र सिंह बिसला का संबंध रहा है।","अन्य जिलों के प्रसिद्ध अभिनेता: राजकुमार राव (गुरुग्राम), रणदीप हुड्डा व सुभाष घई (रोहतक), ओम पुरी (अंबाला) और सतीश कौशिक (महेंद्रगढ़)।","हरियाणा का राज्य प्रदर्शन एवं दृश्य कला विश्वविद्यालय (SUPVA) रोहतक में स्थित है।"]},
