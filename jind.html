<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345a">
<title>जींद जिला GK Quiz (Updated 2026) | HSSC Mock Test Wala</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#142238;--muted:#637083;--blue:#174a82;--line:#dce4ee;--green:#16834a;--red:#c33434}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.58}
.wrap{max-width:850px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#12345a,#2872a8);color:#fff;border-radius:18px;padding:22px 18px;margin:4px 0 14px;text-align:center}
.hero h1{margin:0 0 6px;font-size:25px}
.hero p{margin:0;color:#e6f1ff;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.pill{background:#ffffff20;border:1px solid #ffffff45;padding:6px 10px;border-radius:20px;font-size:12.5px}
.toolbar,.panel,.question{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.progress{height:8px;background:#e6edf5;border-radius:10px;overflow:hidden;flex:1;min-width:120px}
.bar{height:100%;background:#26966a;width:0;transition:width .2s}
.small{font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}
.btn-light{background:#eaf0f7;color:#183654}
button:disabled{opacity:.45;cursor:not-allowed}
.question{padding:17px;box-shadow:0 2px 8px #12345a10}
.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.qtext{font-size:18.5px;font-weight:700;margin:12px 0}
.option{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:8px 0;padding:12px;border-radius:11px;font-weight:500;font-size:15.5px}
.option .letter{flex:0 0 27px;height:27px;border-radius:50%;background:#edf2f8;display:grid;place-items:center;font-weight:700;color:#25496d}
.option.correct{border:2px solid var(--green);background:#eaf8ef}
.option.wrong{border:2px solid var(--red);background:#fff0f0}
.option:disabled{cursor:default;opacity:1}
.feedback{margin-top:13px;padding:14px;border-radius:12px;background:#edf3fa;border-left:4px solid var(--blue)}
.feedback.good{background:#eaf8ef;border-color:var(--green)}
.feedback.bad{background:#fff0f0;border-color:var(--red)}
.feedback strong{display:block;margin-bottom:5px;font-size:16px}
.facts-box{margin-top:12px;padding:11px 13px;background:#ffffffc7;border:1px solid #d5e0ec;border-radius:10px}
.facts-title{font-weight:700;color:var(--blue);font-size:14.5px;margin-bottom:6px}
.facts-list{margin:0;padding-left:18px;font-size:14px;color:#1e293b}
.facts-list li{margin-bottom:5px;line-height:1.55}
.facts-list li:last-child{margin-bottom:0}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.actions button{flex:1}
.hidden{display:none!important}
.result{text-align:center;padding:20px}
.score{font-size:40px;font-weight:800;color:var(--blue)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:520px){
  .wrap{padding:10px}
  .hero h1{font-size:21px}
  .qtext{font-size:17px}
  .question{padding:13px}
  .facts-list{font-size:13.5px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>जींद जिला — विस्तृत GK Quiz</h1>
    <p>HSSC CET • Group C • Group D • अपडेटेड हरियाणा सामान्य ज्ञान (2026)</p>
    <div class="stats">
      <span class="pill" id="totalPill">76 यूनिक प्रश्न</span>
      <span class="pill">2026 अपडेटेड डेटा</span>
      <span class="pill">तुरंत सही/गलत</span>
      <span class="pill">5 Exam Facts</span>
    </div>
  </header>

  <section class="toolbar">
    <div>
      <b id="counter">प्रश्न 1 / 76</b>
      <div class="small" id="answered">हल किए: 0</div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <button class="btn-light" id="restart">रीस्टार्ट</button>
  </section>

  <section class="question" id="quiz">
    <div class="qtop">
      <span>जींद जिला GK</span>
      <span id="qno">प्रश्न 1</span>
    </div>
    <div class="qtext" id="question"></div>
    <div id="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="actions">
      <button class="btn-light" id="prev">पिछला प्रश्न</button>
      <button id="next">अगला प्रश्न</button>
    </div>
  </section>

  <section class="panel result hidden" id="result">
    <h2>आपका परिणाम</h2>
    <div class="score" id="score"></div>
    <p id="summary"></p>
    <button id="review">प्रश्नों की समीक्षा करें</button>
  </section>

  <div class="footer">HSSC Mock Test Wala • जींद जिला GK (2026 Updated)</div>
</main>

<script>
const QUESTIONS = [
  {"q":"जींद जिले की स्थापना किस तिथि को हुई थी?","opts":["22 दिसंबर 1972","1 नवंबर 1966","15 जुलाई 1997","15 अगस्त 1979"],"a":1,"exp":"जींद 1 नवंबर 1966 को हरियाणा राज्य के गठन के समय बने मूल 7 जिलों में शामिल था।","facts":["1 नवंबर 1966 को बने 7 मूल जिले: हिसार, रोहतक, करनाल, अंबाला, गुरुग्राम, महेंद्रगढ़ और जींद।","1966 में पंजाब पुनर्गठन के दौरान संगरूर जिले का विभाजन कर जींद व नरवाना तहसीलों को हरियाणा में शामिल किया गया।","वर्तमान (2026) में हरियाणा में कुल 23 जिले हैं; 22 दिसंबर 2025 को 'हांसी' राज्य का 23वाँ (नवीनतम) जिला अधिसूचित किया गया।","जींद हरियाणा के उन मूल जिलों में से है जिसका 1966 के बाद कोई बड़ा विभाजन होकर नया जिला नहीं बना।","जींद के प्रमुख वाहन कोड HR-31 (जींद), HR-32 (नरवाना), HR-33 (सफीदों) और HR-90 (उचाना) हैं।"]},
  {"q":"महाभारत कालीन मान्यता के अनुसार पांडवों ने किस देवी का मंदिर बनाकर जींद शहर की स्थापना की थी?","opts":["जयंती देवी","शीतला माता","भीमेश्वरी देवी","मनसा देवी"],"a":0,"exp":"मान्यता है कि कौरवों पर विजय पाने हेतु पांडवों ने विजय की देवी 'जयंती देवी' का मंदिर बनवाया, जिसके चारों ओर जयंतीपुरी (जींद) नगर बसा।","facts":["जयंती देवी के नाम पर ही इसका प्राचीन नाम 'जयंतीपुरी' या 'जयंती नगरी' पड़ा, जो समय के साथ बदलकर 'जींद' हो गया।","जींद शहर में जयंती देवी मंदिर के निकट ही 28 जुलाई 2007 को 'जयंती पुरातत्व संग्रहालय' स्थापित किया गया।","अन्य प्रसिद्ध देवी मंदिर: शीतला माता (गुरुग्राम), भीमेश्वरी देवी (बेरी, झज्जर), माता मनसा देवी (पंचकूला) और भवानी अम्बा (अंबाला)।","जींद जिले में महाभारत काल से जुड़े अनेक प्रसिद्ध तीर्थ (पांडु-पिंडारा, ढुंढवा, वराह, रामराय) स्थित हैं।","जींद शहर का पिन कोड 126102 है।"]},
  {"q":"जींद नगर का प्राचीन नाम क्या था?","opts":["सर्पदमन","अग्रोदका","जयंतीपुरी","इकादार"],"a":2,"exp":"जींद का प्राचीन नाम 'जयंतीपुरी' (जयंती नगरी) था।","facts":["अन्य विकल्पों में 'सर्पदमन' सफीदों (जींद) का, 'अग्रोदका' अग्रोहा (हिसार) का और 'इकादार' फतेहाबाद का प्राचीन नाम था।","हरियाणा के अन्य प्रमुख प्राचीन नाम: कपिस्थल (कैथल), रोहिताशगढ़ (रोहतक), असिका (हांसी) और शर्फाबाद (बहादुरगढ़)।","हरियाणा के मध्य में स्थित होने के कारण जींद को 'हरियाणा का हृदय' (Heart of Haryana) कहा जाता है।","मुर्राह भैंसों की सर्वाधिक संख्या के कारण जींद को 'दूध नगरी' भी कहा जाता है।","जींद को 'हरियाणा की राजनैतिक राजधानी' उपनाम से भी जाना जाता है।"]},
  {"q":"निम्नलिखित में से किन उपनामों से जींद जिले को जाना जाता है?","opts":["स्टील सिटी और मैग्नेट सिटी","साइबर सिटी और मेडी सिटी","छोटी काशी और मिनी क्यूबा","हरियाणा का हृदय और दूध नगरी"],"a":3,"exp":"हरियाणा के मध्यवर्ती भाग में स्थित होने और सर्वाधिक मुर्राह भैंसों के कारण जींद को 'हरियाणा का हृदय' और 'दूध नगरी' कहा जाता है।","facts":["जींद को 'हरियाणा की राजनैतिक राजधानी' भी कहा जाता है क्योंकि प्रदेश की बड़ी राजनीतिक रैलियाँ व निर्णायक बदलाव अक्सर जींद से शुरू होते हैं।","हरियाणा में सर्वाधिक भैंसें (विशेषकर मुर्राह नस्ल — 'काला सोना') जींद जिले में पाई जाती हैं।","जींद में ही प्रसिद्ध 'वीटा मिल्क प्लांट', 'पशु चारा प्लांट' और 'हरियाणा कृषि ट्रेनिंग संस्थान' स्थित हैं।","अन्य जिलों के उपनाम: हिसार (स्टील सिटी), गुरुग्राम (साइबर सिटी), भिवानी (छोटी काशी/मिनी क्यूबा) और फतेहाबाद (गुलाबी नगरी)।","हरियाणा प्रति व्यक्ति दूध उपलब्धता के मामले में देश के अग्रणी राज्यों में शामिल है।"]},
  {"q":"जींद जिले का कुल क्षेत्रफल कितना है?","opts":["1,834 वर्ग किमी","2,702 वर्ग किमी","2,538 वर्ग किमी","1,370 वर्ग किमी"],"a":1,"exp":"जींद जिले का कुल क्षेत्रफल 2,702 वर्ग किलोमीटर है।","facts":["हरियाणा का कुल क्षेत्रफल 44,212 वर्ग किमी है; जींद इसका लगभग 6.11% हिस्सा कवर करता है।","वर्तमान (2026) में क्षेत्रफल के अनुसार हरियाणा का सबसे बड़ा जिला सिरसा (4,277 वर्ग किमी) है।","वर्तमान (2026) में क्षेत्रफल के अनुसार हरियाणा का सबसे छोटा जिला फरीदाबाद (741 वर्ग किमी) है।","जींद का संपूर्ण भू-भाग उपजाऊ जलोढ़ मैदानी क्षेत्र है, जहाँ गेहूँ, धान, कपास और गन्ने की प्रमुखता से खेती होती है।","जिले में सिंचाई मुख्यतः भाखड़ा नहर (नरवाना शाखा) और पश्चिमी यमुना नहर प्रणाली से होती है।"]},
  {"q":"दिसंबर 2025 में 'हांसी' नया जिला बनने के बाद वर्तमान (2026) में जींद की सीमा हरियाणा के सर्वाधिक कितने जिलों से लगती है?","opts":["8 जिलों से","7 जिलों से","6 जिलों से","5 जिलों से"],"a":0,"exp":"22 दिसंबर 2025 को हांसी हरियाणा का 23वाँ जिला बनने के बाद अब जींद जिले की सीमा राज्य के सर्वाधिक 8 जिलों को स्पर्श करती है।","facts":["जींद को छूने वाले हरियाणा के 8 जिले हैं: कैथल (उत्तर), करनाल (उत्तर-पूर्व), पानीपत (पूर्व), सोनीपत (दक्षिण-पूर्व), रोहतक (दक्षिण), तथा फतेहाबाद, हिसार और नवगठित हांसी (पश्चिम)।","2025 से पहले जींद की सीमा 7 जिलों से लगती थी; हांसी अलग जिला बनने के बाद यह संख्या 8 हो गई है।","अंतरराज्यीय सीमा के रूप में जींद के उत्तर-पश्चिम में केवल एक राज्य—पंजाब (संगरूर जिला)—लगता है।","हरियाणा के 3 जिले—रोहतक, चरखी दादरी और हांसी—किसी भी अन्य राज्य या UT की सीमा को नहीं छूते।","मध्यवर्ती स्थिति और सर्वाधिक जिलों से जुड़ाव के कारण ही जींद को 'हरियाणा का हृदय' कहते हैं।"]},
  {"q":"जींद जिले की अंतरराज्यीय सीमा किस राज्य के 'संगरूर' जिले के साथ लगती है?","opts":["राजस्थान","हिमाचल प्रदेश","पंजाब","उत्तर प्रदेश"],"a":2,"exp":"जींद जिले के उत्तर-पश्चिमी भाग (नरवाना क्षेत्र) की सीमा पंजाब राज्य के संगरूर जिले से लगती है।","facts":["1966 में हरियाणा बनने से पहले जींद और नरवाना तहसीलें पंजाब के संगरूर जिले का ही हिस्सा थीं।","जींद रियासत की राजधानी भी ऐतिहासिक रूप से संगरूर रही थी।","हरियाणा के कुल 7 जिले पंजाब की सीमा से लगते हैं: पंचकूला, अंबाला, कुरुक्षेत्र, कैथल, जींद, फतेहाबाद और सिरसा।","हरियाणा की सर्वाधिक लंबी अंतरराज्यीय सीमा राजस्थान (1,262 किमी) और सबसे छोटी सीमा उत्तराखंड (लगभग 11 किमी) से लगती है।","नरवाना (जींद) हरियाणा और पंजाब को जोड़ने वाला प्रमुख रेल व सड़क मार्ग (NH-52) है।"]},
  {"q":"1 नवंबर 1966 को हरियाणा के गठन के समय बने मूल 7 जिलों में क्षेत्रफल के अनुसार सबसे छोटा जिला कौन-सा था?","opts":["अंबाला","महेंद्रगढ़","रोहतक","जींद"],"a":3,"exp":"1 नवंबर 1966 को हरियाणा के गठन के समय बने 7 मूल जिलों में जींद क्षेत्रफल में सबसे छोटा और हिसार सबसे बड़ा जिला था।","facts":["1966 के 7 मूल जिले: हिसार, रोहतक, करनाल, अंबाला, गुरुग्राम, महेंद्रगढ़ और जींद।","वर्तमान (2026) में क्षेत्रफल में सबसे छोटा जिला फरीदाबाद (741 वर्ग किमी) और सबसे बड़ा जिला सिरसा (4,277 वर्ग किमी) है।","1966 में हरियाणा भारत का 17वाँ राज्य बना था (शाह आयोग की सिफारिश पर)।","1966 में हरियाणा के प्रथम मुख्यमंत्री पंडित भगवत दयाल शर्मा और प्रथम राज्यपाल श्री धर्मवीर बने।","जींद जिले का मुख्यालय जींद शहर है।"]},
  {"q":"2011 की जनगणना के अनुसार जींद जिले की कुल जनसंख्या और लिंगानुपात क्रमशः कितना था?","opts":["9,42,011 और 902","13,34,152 और 871","18,09,733 और 873","9,58,405 और 862"],"a":1,"exp":"2011 की जनगणना के अनुसार जींद जिले की जनसंख्या 13,34,152 और लिंगानुपात 871 महिलाएँ प्रति 1,000 पुरुष था।","facts":["2011 की जनगणना के अनुसार जींद जिले की साक्षरता दर 71.44% थी (पुरुष: 80.81%, महिला: 60.76%)।","2011 में जींद का जनसंख्या घनत्व 494 व्यक्ति प्रति वर्ग किमी और दशकीय वृद्धि दर (2001–2011) 12.13% थी।","जिले की लगभग 77.1% आबादी ग्रामीण और 22.9% आबादी शहरी क्षेत्रों में निवास करती है।","2011 में संपूर्ण हरियाणा की कुल जनसंख्या 2,53,51,462, साक्षरता दर 75.55% और लिंगानुपात 879 था।","जींद के बीबीपुर गाँव से शुरू हुआ 'सेल्फी विद डॉटर' अभियान लिंगानुपात सुधार का वैश्विक प्रतीक बना।"]},
  {"q":"हरियाणा राज्य में सबसे कम झाड़ियाँ (Scrubs) और सबसे कम पक्की सड़कों का घनत्व किस जिले में पाया जाता है?","opts":["जींद","गुरुग्राम","पंचकूला","अंबाला"],"a":0,"exp":"हरियाणा में सबसे कम झाड़ियाँ और सबसे कम पक्की सड़कों का घनत्व जींद जिले में दर्ज किया जाता है।","facts":["विपरीत तथ्य: हरियाणा में सर्वाधिक झाड़ियाँ गुरुग्राम जिले में और सर्वाधिक पक्की सड़कों का घनत्व अंबाला जिले में है।","हरियाणा में सबसे कम वन प्रतिशत वाला जिला फतेहाबाद और सर्वाधिक वन प्रतिशत वाला जिला पंचकूला है।","जींद से होकर NH-352 (रोहतक–जींद–नरवाना), NH-52 (अंबाला–कैथल–नरवाना–हिसार) और नया NH-152D (ट्रांस-हरियाणा एक्सप्रेसवे) गुजरते हैं।","दिल्ली–अमृतसर–कटरा एक्सप्रेसवे के निर्माण से जींद से दिल्ली व जम्मू की कनेक्टिविटी अत्यंत तेज हो रही है।","जींद रेलवे जंक्शन दिल्ली–बठिंडा–फिरोजपुर और जींद–पानीपत व जींद–सोनीपत रेल लाइनों का प्रमुख केंद्र है।"]},
  {"q":"जींद जिले में कुल कितनी तहसीलें और कितनी उप-तहसीलें हैं?","opts":["3 तहसीलें और 2 उप-तहसीलें","4 तहसीलें और 3 उप-तहसीलें","6 तहसीलें और 1 उप-तहसील","5 तहसीलें और 2 उप-तहसीलें"],"a":2,"exp":"जींद जिले में 6 तहसीलें (जींद, जुलाना, उचाना, सफीदों, नरवाना, अलेवा) और 1 उप-तहसील (पिल्लूखेड़ा) हैं।","facts":["जींद जिले में 4 उपमंडल हैं: जींद, नरवाना, सफीदों और उचाना।","जिले में 8 विकास खंड (Blocks) हैं: जींद, जुलाना, पिल्लूखेड़ा, सफीदों, उचाना, नरवाना, अलेवा और उझाना।","शहरी निकायों में जिले में 'नगर परिषद जींद' व 'नगर परिषद नरवाना' तथा जुलाना, सफीदों व उचाना में नगरपालिका समितियाँ हैं।","वर्तमान (2026) में पूरे हरियाणा में लगभग 94 तहसीलें, 50 उप-तहसीलें और 142 विकास खंड कार्यरत हैं।","तहसील का प्रमुख राजस्व अधिकारी तहसीलदार और उप-तहसील का नायब तहसीलदार होता है।"]},
  {"q":"जींद तहसील का विभाजन कर 'जींद' और 'सफीदों' दो तहसीलें किस वर्ष बनाई गई थीं?","opts":["1966 ई.","1972 ई.","1975 ई.","1967 ई."],"a":3,"exp":"1966 में जींद जिला बनने के ठीक अगले वर्ष 1967 में जींद तहसील का विभाजन कर जींद और सफीदों दो अलग तहसीलें बनाई गईं।","facts":["1966 में पंजाब के संगरूर जिले से जींद और नरवाना—ये दो तहसीलें हरियाणा को आवंटित हुई थीं।","सफीदों का महाभारतकालीन प्राचीन नाम 'सर्पदमन' था, जहाँ राजा जनमेजय ने सर्पदमन यज्ञ किया था।","सफीदों वर्तमान में जींद जिले का एक उपमंडल (HR-33), तहसील, विकास खंड और विधानसभा निर्वाचन क्षेत्र है।","2024 के विधानसभा चुनाव में सफीदों सीट से भाजपा के राम कुमार गौतम विधायक निर्वाचित हुए।","सफीदों क्षेत्र धान, गेहूँ और गन्ने की उपजाऊ खेती के लिए जाना जाता है।"]},
  {"q":"जींद जिला वर्तमान (2026) में किस प्रशासनिक मंडल (Division) और पुलिस रेंज के अंतर्गत आता है?","opts":["रोहतक मंडल","हिसार मंडल","करनाल मंडल","अंबाला मंडल"],"a":1,"exp":"जींद जिला प्रशासनिक रूप से हिसार मंडल और हिसार पुलिस रेंज के अंतर्गत आता है।","facts":["22 दिसंबर 2025 को हांसी 23वाँ जिला बनने के बाद 2026 में हिसार मंडल में सर्वाधिक 5 जिले हो गए हैं: हिसार, फतेहाबाद, सिरसा, जींद और हांसी।","रोहतक मंडल में भी 5 जिले (रोहतक, झज्जर, सोनीपत, भिवानी, चरखी दादरी) शामिल हैं।","वर्तमान (2026) में हरियाणा में 6 प्रशासनिक मंडल, 5 पुलिस रेंज, 5 पुलिस कमिश्नरेट (गुरुग्राम, फरीदाबाद, पंचकूला, सोनीपत, झज्जर) और 24 पुलिस जिले हैं।","हरियाणा में कुल 11 नगर निगम हैं (नवीनतम: मानेसर, 2020)।","मंडल का सर्वोच्च अधिकारी मंडलायुक्त (Divisional Commissioner) होता है।"]},
  {"q":"जींद जिले में कुल कितनी विधानसभा सीटें हैं और इनमें से कौन-सी अनुसूचित जाति (SC) के लिए आरक्षित है?","opts":["5 सीटें — नरवाना (SC)","4 सीटें — जींद (SC)","6 सीटें — जुलाना (SC)","3 सीटें — सफीदों (SC)"],"a":0,"exp":"जींद जिले में कुल 5 विधानसभा सीटें हैं—जुलाना (34), सफीदों (35), जींद (36), उचाना कलां (37) और नरवाना SC (38)।","facts":["नरवाना (क्रमांक 38) जींद जिले की एकमात्र अनुसूचित जाति (SC) आरक्षित विधानसभा सीट है।","हरियाणा विधानसभा में कुल 90 सीटें हैं, जिनमें से 17 सीटें अनुसूचित जाति (SC) के लिए आरक्षित हैं।","2024 के 15वें हरियाणा विधानसभा चुनाव में जींद की 5 सीटों में से 4 भाजपा और 1 कांग्रेस ने जीती।","2026 में हांसी जिला बनने के बाद सर्वाधिक विधानसभा सीटें (6-6) फरीदाबाद और सोनीपत जिलों में हैं।","सबसे कम विधानसभा सीटें (2-2) पंचकूला, चरखी दादरी और नवगठित हांसी जिलों में हैं।"]},
  {"q":"जींद जिले की पाँच विधानसभा सीटें हरियाणा के किन तीन अलग-अलग लोकसभा क्षेत्रों में विभाजित हैं?","opts":["रोहतक, करनाल और कुरुक्षेत्र","अंबाला, कुरुक्षेत्र और करनाल","सोनीपत, हिसार और सिरसा","रोहतक, हिसार और भिवानी-महेंद्रगढ़"],"a":2,"exp":"जींद की 5 विधानसभा सीटें तीन लोकसभा क्षेत्रों में आती हैं: जींद, जुलाना व सफीदों (सोनीपत लोकसभा), उचाना कलां (हिसार लोकसभा) और नरवाना (सिरसा SC लोकसभा)।","facts":["2024 के 18वें लोकसभा चुनाव में इन तीनों लोकसभा सीटों पर कांग्रेस ने जीत दर्ज की: सोनीपत (सतपाल ब्रह्मचारी), हिसार (जय प्रकाश) और सिरसा SC (कुमारी सैलजा)।","2024 लोकसभा चुनाव में हरियाणा की कुल 10 सीटों में से 5 कांग्रेस और 5 भाजपा ने जीतीं।","हरियाणा में केवल 2 लोकसभा सीटें अनुसूचित जाति (SC) के लिए आरक्षित हैं: अंबाला और सिरसा।","हरियाणा से राज्यसभा की कुल 5 सीटें हैं।","तीन अलग-अलग संसदीय क्षेत्रों से जुड़ा होना जींद के केंद्रीय भौगोलिक महत्व को दर्शाता है।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'जींद' सीट से निर्वाचित कौन-से विधायक 15वीं हरियाणा विधानसभा के उपाध्यक्ष (Deputy Speaker) बने?","opts":["राम कुमार गौतम","कृष्ण कुमार बेदी","महावीर गुप्ता","डॉ. कृष्ण लाल मिड्ढा"],"a":3,"exp":"जींद विधानसभा सीट से लगातार तीसरी बार निर्वाचित भाजपा के डॉ. कृष्ण लाल मिड्ढा को 15वीं हरियाणा विधानसभा का उपाध्यक्ष (Deputy Speaker) बनाया गया।","facts":["डॉ. कृष्ण लाल मिड्ढा पूर्व विधायक डॉ. हरिचंद मिड्ढा के पुत्र हैं (2019 उपचुनाव, 2019 आम चुनाव व 2024 में विजयी)।","2024 के चुनाव में उन्होंने कांग्रेस के महावीर गुप्ता को पराजित किया।","15वीं हरियाणा विधानसभा के अध्यक्ष (Speaker) हरविन्द्र कल्याण (घरौंडा) हैं।","2024 में भाजपा ने 48 सीटें जीतकर लगातार तीसरी बार हरियाणा में सरकार बनाई और नायब सिंह सैनी मुख्यमंत्री बने।","14वीं हरियाणा विधानसभा (2019–2024) के उपाध्यक्ष रणबीर सिंह गंगवा थे।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'जुलाना' सीट से कौन प्रसिद्ध अंतर्राष्ट्रीय पहलवान विधायक निर्वाचित हुईं?","opts":["बबीता फोगाट","विनेश फोगाट","अंशु मलिक","साक्षी मलिक"],"a":1,"exp":"2024 के 15वें हरियाणा विधानसभा चुनाव में जुलाना सीट से कांग्रेस (INC) के टिकट पर प्रसिद्ध पहलवान विनेश फोगाट विधायक निर्वाचित हुईं।","facts":["विनेश फोगाट ने भाजपा प्रत्याशी कैप्टन योगेश बैरागी को 6,015 मतों से पराजित किया।","उनका पैतृक गाँव बलाली (चरखी दादरी) और ससुराल बख्ता खेड़ा (जुलाना, जींद) में है।","वे राष्ट्रमंडल खेलों (2014, 2018, 2022) और एशियाई खेलों (2018) दोनों में स्वर्ण पदक जीतने वाली पहली भारतीय महिला पहलवान हैं।","उन्हें वर्ष 2020 में देश का सर्वोच्च खेल सम्मान 'मेजर ध्यानचंद खेल रत्न पुरस्कार' मिला था।","2024 में जींद जिले की 5 सीटों में से केवल जुलाना सीट पर ही कांग्रेस को जीत मिली।"]},
  {"q":"2024 के विधानसभा चुनाव में 'नरवाना (SC)' सीट से निर्वाचित कौन-से विधायक हरियाणा सरकार में कैबिनेट मंत्री बने?","opts":["कृष्ण कुमार बेदी","रामनिवास सुरजाखेड़ा","सतबीर दबलैन","पृथ्वी सिंह"],"a":0,"exp":"2024 के हरियाणा विधानसभा चुनाव में नरवाना (SC) सीट से भाजपा के कृष्ण कुमार बेदी निर्वाचित हुए और नायब सिंह सैनी सरकार में कैबिनेट मंत्री बने।","facts":["उन्हें सामाजिक न्याय, अधिकारिता, अनुसूचित जाति एवं पिछड़ा वर्ग कल्याण तथा अंत्योदय (SEWA), आतिथ्य व वास्तुकला मंत्रालय सौंपे गए।","उन्होंने 2024 में कांग्रेस के सतबीर दबलैन को पराजित किया (2019 में रामनिवास सुरजाखेड़ा यहाँ से विधायक थे)।","इससे पूर्व वे 2014–2019 के दौरान शाहाबाद (कुरुक्षेत्र) से विधायक व राज्य मंत्री भी रह चुके हैं।","नरवाना विधानसभा सीट 'सिरसा (SC) लोकसभा निर्वाचन क्षेत्र' का हिस्सा है।","नरवाना जींद जिले का एक उपमंडल (HR-32), प्रमुख रेलवे जंक्शन और कपास मंडी है।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'उचाना कलां' सीट से मात्र 32 मतों के सबसे कम अंतर से कौन निर्वाचित हुए?","opts":["दुष्यंत चौटाला","बृजेंद्र सिंह","देवेंद्र चतरभुज अत्री","प्रेमलता"],"a":2,"exp":"2024 के विधानसभा चुनाव में उचाना कलां सीट से भाजपा के देवेंद्र चतरभुज अत्री ने कांग्रेस के बृजेंद्र सिंह को मात्र 32 मतों से हराकर जीत दर्ज की।","facts":["यह 2024 के हरियाणा विधानसभा चुनाव में सभी 90 सीटों में सबसे कम अंतर (32 वोट) वाली जीत थी।","2019 में यहाँ से विधायक रहे पूर्व उपमुख्यमंत्री दुष्यंत चौटाला (JJP) 2024 के चुनाव में पाँचवें स्थान पर रहे।","इससे पहले 2014 में भाजपा की प्रेमलता (पूर्व केंद्रीय मंत्री चौधरी बीरेंद्र सिंह की पत्नी) यहाँ से विधायक बनी थीं।","उचाना कलां विधानसभा क्षेत्र हिसार लोकसभा क्षेत्र के अंतर्गत आता है।","उचाना कलां जींद जिले का एक उपमंडल (HR-90) और तहसील है।"]},
  {"q":"2024 के हरियाणा विधानसभा चुनाव में 'सफीदों' विधानसभा सीट से कौन निर्वाचित हुए?","opts":["सुभाष गांगोली","जसबीर देशवाल","बचन सिंह आर्य","राम कुमार गौतम"],"a":3,"exp":"2024 के हरियाणा विधानसभा चुनाव में सफीदों सीट से भाजपा के वरिष्ठ नेता राम कुमार गौतम निर्वाचित हुए।","facts":["राम कुमार गौतम ने कांग्रेस के निवर्तमान विधायक सुभाष गांगोली को पराजित किया।","इससे पूर्व 2019 में वे नारनौंद सीट से जजपा के विधायक चुने गए थे।","सफीदों विधानसभा क्षेत्र सोनीपत लोकसभा निर्वाचन क्षेत्र का हिस्सा है।","सफीदों में प्राचीन 'सर्पदमन' (नागक्षेत्र) तीर्थ और वार्षिक नागक्षेत्र मेला अत्यंत प्रसिद्ध है।","मतदान 5 अक्टूबर 2024 को और मतगणना 8 अक्टूबर 2024 को संपन्न हुई थी।"]},
  {"q":"जींद रियासत की स्थापना वर्ष 1763 में किस शासक द्वारा की गई थी?","opts":["महाराजा रणजीत सिंह","राजा गजपत सिंह","राजा भाग सिंह","राजा रघबीर सिंह"],"a":1,"exp":"फूलकियाँ मिसल के सरदार राजा गजपत सिंह ने वर्ष 1763 ईस्वी में जींद रियासत की स्थापना की थी।","facts":["राजा गजपत सिंह ने जींद और सफीदों सहित बड़े भू-भाग पर अधिकार किया और जींद को अपना मुख्यालय बनाया।","पंजाब की तीन प्रसिद्ध 'फूलकियाँ रियासतें' थीं: पटियाला, नाभा और जींद।","1857 की क्रांति में जींद के राजा सरूप सिंह ने अंग्रेजों का साथ दिया, जिसके इनाम में उन्हें दादरी (चरखी दादरी) की जागीर मिली।","1948 में आजादी के बाद जींद रियासत (अंतिम शासक: महाराजा रणबीर सिंह) का विलय पेप्सू (PEPSU) राज्य में हुआ।","1956 में पेप्सू का पंजाब में विलय हुआ और 1966 में जींद हरियाणा का जिला बना।"]},
  {"q":"मुगल सम्राट शाह आलम द्वितीय ने गजपत सिंह को 'राजा' का खिताब किस वर्ष प्रदान किया था?","opts":["1772 ई.","1763 ई.","1775 ई.","1786 ई."],"a":0,"exp":"मुगल बादशाह शाह आलम द्वितीय ने वर्ष 1772 ईस्वी में गजपत सिंह को 'राजा' की उपाधि प्रदान की थी।","facts":["राजा गजपत सिंह ने 1763 में जींद रियासत की नींव रखी और 1772 में शाही फरमान से 'राजा' की पदवी प्राप्त की।","इसके तीन वर्ष बाद 1775 ई. में उन्होंने जींद में एक विशाल किला ('जींद का किला') बनवाया।","1772 ई. में ही मुगल सम्राट शाह आलम द्वितीय मराठा सरदार महादजी सिंधिया के संरक्षण में दिल्ली की गद्दी पर पुनः बैठे थे।","राजा गजपत सिंह की पुत्री राज कौर का विवाह सुकरचकिया मिसल के महा सिंह से हुआ था—इस प्रकार वे महाराजा रणजीत सिंह के नाना थे।","HSSC परीक्षाओं में जींद रियासत के वर्ष—1763 (स्थापना), 1772 (राजा उपाधि), 1775 (किला) व 1814 (विद्रोह)—अक्सर पूछे जाते हैं।"]},
  {"q":"राजा गजपत सिंह ने जींद में प्रसिद्ध 'जींद का किला' (गजपत का किला) किस वर्ष बनवाया था?","opts":["1763 ई.","1772 ई.","1775 ई.","1798 ई."],"a":2,"exp":"राजा गजपत सिंह ने वर्ष 1775 ईस्वी में जींद में एक विशाल किले (जींद का किला) का निर्माण करवाया था।","facts":["इस किले के भीतर बाद में रियासती प्रशासनिक भवन, कचहरी और महल बनाए गए।","हरियाणा के अन्य प्रसिद्ध ऐतिहासिक किले: असीगढ़ किला (हांसी), लोहारू किला (भिवानी), गोपालगिरी किला (गुरुग्राम) और शिखर दुर्ग (अग्रोहा, 1777)।","जींद का किला शहर के पुराने व ऊँचे क्षेत्र में स्थित था।","1798 ई. में आयरिश शासक जॉर्ज थॉमस ने इस किले की घेराबंदी कर जींद पर अधिकार किया था।","1857 के बाद जींद रियासत ने संगरूर को अपनी प्रमुख राजधानी बनाया।"]},
  {"q":"वर्ष 1786 ईस्वी में राजा गजपत सिंह के निधन के बाद जींद रियासत के शासक कौन बने थे?","opts":["राजा सरूप सिंह","राजा रघबीर सिंह","प्रताप सिंह","राजा भाग सिंह"],"a":3,"exp":"1786 ईस्वी में राजा गजपत सिंह के निधन के बाद उनके पुत्र 'राजा भाग सिंह' जींद रियासत के शासक बने।","facts":["राजा भाग सिंह (शासनकाल: 1786–1819 ई.) सिख साम्राज्य के संस्थापक महाराजा रणजीत सिंह के मामा थे।","उन्होंने 1798–1801 के दौरान जॉर्ज थॉमस के विरुद्ध और 1803 में अंग्रेजों (लॉर्ड लेक) के साथ कूटनीतिक संबंधों में अहम भूमिका निभाई।","राजा भाग सिंह को अंग्रेजों ने गोहाना और खरखौदा के परगने भी जागीर में दिए थे।","उनके अंतिम वर्षों में अस्वस्थ होने पर उत्तराधिकार विवाद को लेकर 1814 ई. में राजकुमार प्रताप सिंह ने प्रसिद्ध 'जींद विद्रोह' किया था।","1819 में राजा भाग सिंह के बाद उनके पुत्र राजा फतेह सिंह गद्दी पर बैठे।"]},
  {"q":"वर्ष 1798 ईस्वी में किस यूरोपीय (आयरिश) साहसी शासक ने जींद पर आक्रमण कर विजय प्राप्त की थी?","opts":["लॉर्ड लेक","जॉर्ज थॉमस","विलियम फ्रेजर","जनरल पेरन"],"a":1,"exp":"आयरलैंड के साहसी शासक जॉर्ज थॉमस ने वर्ष 1798 ईस्वी में जींद पर आक्रमण कर विजय हासिल की थी।","facts":["जॉर्ज थॉमस ने 1797 में हांसी को अपनी राजधानी बनाया था और हिसार (जहाज कोठी), झज्जर (जहाजगढ़) व फतेहाबाद (टोहाना) पर शासन किया।","जींद के राजा भाग सिंह ने पटियाला, नाभा व कैथल के सिख सरदारों के साथ मिलकर जॉर्ज थॉमस का मुकाबला किया।","1801–02 में मराठा सेनापति जनरल पेरन ने जॉर्ज थॉमस को हराया और 1803 की सुरजी-अंजनगाँव संधि के बाद हरियाणा अंग्रेजों के अधीन आ गया।","जॉर्ज थॉमस को हरियाणा के इतिहास में 'जहाज साहिब' भी कहा जाता है।","1809 की अमृतसर संधि के बाद जींद रियासत ब्रिटिश संरक्षण में आ गई थी।"]},
  {"q":"वर्ष 1814 ईस्वी के ऐतिहासिक 'जींद विद्रोह' का नेतृत्व किसने किया था?","opts":["प्रताप सिंह","गजपत सिंह","रघबीर सिंह","सरूप सिंह"],"a":0,"exp":"वर्ष 1814 ईस्वी में अंग्रेजों के हस्तक्षेप के विरुद्ध जींद विद्रोह का नेतृत्व राजकुमार प्रताप सिंह ने किया था।","facts":["राजा भाग सिंह के अस्वस्थ होने पर अंग्रेजों ने प्रताप सिंह के बजाय रानी सौंदराई/फतेह सिंह को समर्थन दिया, जिससे नाराज होकर प्रताप सिंह ने विद्रोह किया।","हरियाणा के अन्य प्रमुख रियासती विद्रोह: छछरौली विद्रोह (1818, जोध सिंह), रानियां विद्रोह (1818, जाबित खान), कैथल विद्रोह (1843, गुलाब सिंह) और लाडवा विद्रोह (1845, अजीत सिंह)।","1814 के इस विद्रोह ने हरियाणा क्षेत्र में ब्रिटिश साम्राज्यवाद के विरुद्ध प्रारंभिक सशस्त्र प्रतिरोध की नींव रखी।","प्रताप सिंह ने जींद के किले पर अधिकार कर लिया था, जिसके बाद अंग्रेजों ने संयुक्त सेना भेजी।","अंततः 1816 में दिल्ली की जेल में प्रताप सिंह का निधन हो गया।"]},
  {"q":"1814 के जींद विद्रोह में प्रताप सिंह का साथ 'फूल सिंह' ने दिया था; हारने के बाद लाहौर जाने पर किस शासक ने प्रताप सिंह को पकड़कर अंग्रेजों को सौंप दिया?","opts":["राजा भाग सिंह","नवाब अहमद अली","महाराजा रणजीत सिंह","महादजी सिंधिया"],"a":2,"exp":"1814 के विद्रोह में पराजित होकर प्रताप सिंह लाहौर चले गए थे, जहाँ से महाराजा रणजीत सिंह ने उन्हें पकड़कर अंग्रेजों को सौंप दिया था।","facts":["इस विद्रोह में प्रताप सिंह के विरुद्ध अंग्रेजों का साथ नाभा, पटियाला और कैथल के शासकों ने दिया था।","1809 की अमृतसर संधि के कारण महाराजा रणजीत सिंह सतलुज के पूर्व में अंग्रेजों से सीधा टकराव नहीं चाहते थे।","इस विद्रोह में स्थानीय लोगों और फूल सिंह ने प्रताप सिंह का भरपूर साथ दिया था।","विद्रोह के दमन के बाद जींद रियासत पर ब्रिटिश रेजिडेंट का नियंत्रण और कड़ा हो गया।","यह घटना हरियाणा के आधुनिक इतिहास में रियासती विद्रोहों का प्रमुख अध्याय है।"]},
  {"q":"ऐतिहासिक विवरणों में चर्चित 'रानी सौंदराई' का संबंध हरियाणा की किस रियासत से था?","opts":["पटियाला रियासत","नाभा रियासत","बल्लभगढ़ रियासत","जींद रियासत"],"a":3,"exp":"रानी सौंदराई का संबंध हरियाणा की ऐतिहासिक 'जींद रियासत' से था।","facts":["राजा भाग सिंह के अस्वस्थ होने के दौरान 1814 के आसपास रानी सौंदराई ने रियासत के प्रशासनिक कार्यों में महत्वपूर्ण भूमिका निभाई थी।","हरियाणा की अन्य चर्चित ऐतिहासिक महिलाएँ: रानी साहिब कौर (कैथल विद्रोह, 1843), बेगम समरू (झाड़सा/सरधना) और रानी किशोरी (भरतपुर-पलवल)।","जींद रियासत 1763 से 1948 तक लगभग 185 वर्षों तक अस्तित्व में रही।","जींद रियासत के राजा रघबीर सिंह ने ही जींद शहर में प्रसिद्ध 'रानी तालाब' (भूतेश्वर मंदिर) बनवाया था।","आजादी के समय जींद के अंतिम शासक महाराजा रणबीर सिंह थे।"]},
  {"q":"ऐतिहासिक 'प्राचीन टीला करसोला' (किरसोली) हरियाणा के किस जिले में स्थित है?","opts":["हिसार","जींद","फतेहाबाद","भिवानी"],"a":1,"exp":"प्राचीन पुरातात्विक टीला 'करसोला' (करसोली) जींद जिले में स्थित है।","facts":["इस प्राचीन टीले से पूर्व-हड़प्पा, हड़प्पा और मध्यकालीन मृद्भांड (मिट्टी के बर्तन) व बसावट के अवशेष प्राप्त हुए हैं।","जींद के अन्य पुरातात्विक स्थलों की सामग्री जींद शहर के 'जयंती पुरातत्व संग्रहालय' में संरक्षित है।", "अन्य जिलों के प्रसिद्ध प्राचीन टीले: अग्रोहा टीला (हिसार), खोखराकोट टीला (रोहतक), नौरंगाबाद व मिताथल टीला (भिवानी) और राखीगढ़ी टीला (हांसी)।","करसोला गाँव जींद जिले के जुलाना क्षेत्र के अंतर्गत आता है।","हरियाणा राज्य पुरातत्व एवं संग्रहालय विभाग का मुख्यालय पंचकूला में स्थित है।"]},
  {"q":"महाभारत युग में 'सर्पदमन' के नाम से प्रसिद्ध जींद का कौन-सा कस्बा है, जहाँ राजा जनमेजय ने सर्पदमन यज्ञ किया था?","opts":["सफीदों","नरवाना","जुलाना","उचाना"],"a":0,"exp":"जींद जिले के सफीदों कस्बे को महाभारत युग में 'सर्पदमन' कहा जाता था, जहाँ राजा जनमेजय ने अपने पिता परीक्षित की सांप काटने से हुई मृत्यु का बदला लेने के लिए सर्पदमन यज्ञ किया था।","facts":["पौराणिक कथा के अनुसार राजा परीक्षित (अर्जुन के पौत्र) को तक्षक नाग ने डस लिया था, जिसके प्रतिशोध में उनके पुत्र जनमेजय ने सर्पयज्ञ किया।","महर्षि आस्तिक के हस्तक्षेप से यह यज्ञ संपन्न हुआ और तक्षक नाग के प्राण बचे।","सफीदों में आज भी प्राचीन 'नागक्षेत्र सरोवर' और मंदिर स्थित हैं।","1967 में जींद तहसील से अलग होकर सफीदों स्वतंत्र तहसील बना था।","सफीदों वर्तमान में जींद जिले का प्रमुख उपमंडल (HR-33) व विधानसभा क्षेत्र है।"]},
  {"q":"प्रसिद्ध 'नागक्षेत्र सरोवर व तीर्थ' तथा वार्षिक 'नागक्षेत्र धार्मिक मेला' जींद जिले के किस स्थान से जुड़ा है?","opts":["जींद शहर","नरवाना","सफीदों","अलेवा"],"a":2,"exp":"प्राचीन नागक्षेत्र सरोवर, तीर्थ और वार्षिक नागक्षेत्र धार्मिक मेला जींद जिले के सफीदों में स्थित व आयोजित होता है।","facts":["नागक्षेत्र तीर्थ का सीधा संबंध राजा जनमेजय के महाभारतकालीन सर्पदमन यज्ञ से है।","जींद के अन्य प्रसिद्ध मेले: हटकेश्वर मेला (हाट), बिलसर मेला (हंसडहर), सच्चा सौदा मेला (सिंहपुरा), धमतान साहिब मेला (नरवाना) और रामराय मेला।","हरियाणा में नाग पूजा से जुड़ा एक अन्य प्रसिद्ध मेला 'नाग पूजा मेला' नांगल मुबारकपुर (गुरुग्राम) में भी लगता है।","सफीदों शहर जींद–पानीपत मार्ग पर स्थित एक प्रमुख कृषि व व्यापारिक केंद्र है।","सफीदों में नगरपालिका समिति शहरी स्थानीय निकाय के रूप में कार्यरत है।"]},
  {"q":"जींद शहर में स्थित 'जयंती पुरातत्व संग्रहालय' का उद्घाटन 28 जुलाई 2007 को किसने किया था?","opts":["भूपेंद्र सिंह हुड्डा","चौधरी बंसीलाल","मनोहर लाल खट्टर","डॉ. ए.आर. किदवई"],"a":3,"exp":"जयंती पुरातत्व संग्रहालय, जींद की स्थापना व उद्घाटन 28 जुलाई 2007 को हरियाणा के तत्कालीन राज्यपाल डॉ. ए.आर. किदवई द्वारा किया गया था।","facts":["यह संग्रहालय जींद शहर में ऐतिहासिक जयंती देवी मंदिर के निकट स्थित है।","यहाँ हड़प्पा कालीन अवशेष, प्राचीन मूर्तियाँ, ताम्रपत्र, सिक्के, हथियार और हरियाणवी लोक संस्कृति की दुर्लभ वस्तुएँ प्रदर्शित हैं।","हरियाणा का सबसे पुराना व सबसे बड़ा पुरातत्व संग्रहालय गुरुकुल झज्जर (1959, स्वामी ओमानंद सरस्वती) में स्थित है।","अन्य प्रमुख संग्रहालय: श्रीकृष्ण संग्रहालय व धरोहर संग्रहालय (कुरुक्षेत्र), जहाज कोठी संग्रहालय (हिसार) और उरुस्वती संग्रहालय (गुरुग्राम)।","इसी वर्ष (2007 में) जींद में 'बीरबारा संरक्षित वन्यजीव क्षेत्र' की स्थापना भी हुई थी।"]},
  {"q":"अमृतसर के स्वर्ण मंदिर की तर्ज पर सरोवर के मध्य बने 'भूतेश्वर मंदिर' (रानी तालाब, जींद) का निर्माण किसने करवाया था?","opts":["राजा गजपत सिंह","राजा रघबीर सिंह","राजा भाग सिंह","राजा सरूप सिंह"],"a":1,"exp":"जींद शहर के मध्य स्थित प्रसिद्ध भूतेश्वर मंदिर (रानी तालाब) का निर्माण जींद रियासत के शासक राजा रघबीर सिंह ने करवाया था।","facts":["यह मंदिर भगवान शिव को समर्पित है और तालाब के मध्य स्थित होने के कारण इसे 'जींद का स्वर्ण मंदिर' भी कहा जाता है।","मान्यता है कि इस तालाब के नीचे गुप्त सुरंग थी जिससे रानी महल से सीधे पूजा व स्नान करने आती थीं, इसलिए इसका नाम 'रानी तालाब' पड़ा।","ध्यान दें: 'भूतेश्वर मंदिर' जींद में है, जबकि 'भूतों का मंदिर' भिवानी शहर में स्थित है।","राजा रघबीर सिंह के ही शासनकाल में 1864 ई. में दादरी क्षेत्र में किसान विद्रोह हुआ था।","महाशिवरात्रि और सावन के महीने में यहाँ भक्तों की भारी भीड़ उमड़ती है।"]},
  {"q":"हरियाणा पर्यटन निगम का प्रसिद्ध 'बुलबुल झील / बुलबुल पर्यटन स्थल' किस शहर में स्थित है?","opts":["जींद","कैथल","रोहतक","पानीपत"],"a":0,"exp":"हरियाणा पर्यटन निगम द्वारा संचालित प्रसिद्ध 'बुलबुल' (Bulbul) पर्यटन स्थल व झील जींद शहर में स्थित हैं।","facts":["हरियाणा पर्यटन निगम अपने अधिकांश पर्यटन केंद्रों के नाम पक्षियों के नाम पर रखता है (स्थापना: 1 सितंबर 1974)।","जींद जिले में ही नरवाना में दूसरा प्रमुख पर्यटन केंद्र 'हरियाल' (Hariyal) स्थित है।","अन्य जिलों के पक्षी-नाम पर्यटन स्थल: कोयल (कैथल), तिल्यार व मैना (रोहतक), स्काईलार्क (पानीपत), गौरैया (बहादुरगढ़) और ब्लू बर्ड (हिसार)।","हरियाणा पर्यटन दिवस प्रतिवर्ष 1 सितंबर को मनाया जाता है।","हरियाणा का राज्य पक्षी 'काला तीतर' (Black Francolin) है।"]},
  {"q":"हरियाणा पर्यटन निगम का प्रसिद्ध 'हरियाल' (Hariyal) पर्यटन स्थल जींद जिले के किस कस्बे में स्थित है?","opts":["सफीदों","जुलाना","नरवाना","उचाना"],"a":2,"exp":"हरियाणा पर्यटन निगम का प्रसिद्ध 'हरियाल' पर्यटन स्थल जींद जिले के नरवाना में स्थित है।","facts":["नरवाना (NH-52 व NH-352 के संगम पर) हरियाणा व पंजाब की सीमा के निकट स्थित प्रमुख नगर है।","नरवाना में ही प्रसिद्ध 'धमतान साहिब गुरुद्वारा', 'हजरत गाबी साहिब की दरगाह' और 'हंसडहर तीर्थ' स्थित हैं।","नरवाना के ही प्रसिद्ध क्रिकेटर राजिंदर गोयल (637 रणजी विकेट) और बॉलीवुड अभिनेता सीताराम पांचाल रहे हैं।","नरवाना वर्तमान में जींद जिले का उपमंडल (HR-32), तहसील, नगर परिषद और एकमात्र SC आरक्षित विधानसभा क्षेत्र है।","2024 में नरवाना के विधायक कृष्ण कुमार बेदी हरियाणा सरकार में कैबिनेट मंत्री बने।"]},
  {"q":"प्रसिद्ध सूफी धार्मिक स्थल 'हजरत गाबी साहिब की दरगाह' जींद जिले के किस नगर में स्थित है?","opts":["जींद शहर","सफीदों","जुलाना","नरवाना"],"a":3,"exp":"प्रसिद्ध सूफी संत 'हजरत गाबी साहिब की दरगाह' जींद जिले के नरवाना में स्थित है।","facts":["यहाँ सभी समुदायों के लोग श्रद्धा के साथ जियारत करने आते हैं और यह क्षेत्र की सांझी सांस्कृतिक विरासत का केंद्र है।","हरियाणा की अन्य प्रमुख दरगाहें: बू-अली शाह कलंदर (पानीपत), नौगजा पीर (अंबाला), संत मीर शाह (फतेहाबाद), पीर मुबारक शाह (चरखी दादरी) और मीठा पीर (तलवंडी, हिसार)।","नरवाना क्षेत्र में ही सिखों का ऐतिहासिक 'धमतान साहिब गुरुद्वारा' (गुरु तेग बहादुर जी) भी स्थित है।","नरवाना रेलवे जंक्शन दिल्ली–बठिंडा–फिरोजपुर मुख्य लाइन और नरवाना–कुरुक्षेत्र लाइन का प्रमुख जंक्शन है।","नरवाना की अनाज व कपास मंडी क्षेत्र के किसानों का सबसे बड़ा व्यापारिक केंद्र है।"]},
  {"q":"जींद जिले में स्थित 'बीरबारा (बीर बाराबान) संरक्षित वन्यजीव क्षेत्र' की स्थापना किस वर्ष हुई थी?","opts":["1985","2007","1991","2014"],"a":1,"exp":"जींद–हांसी मार्ग पर स्थित 'बीर बाराबान (बीरबारा) वन्यजीव संरक्षण आरक्षित क्षेत्र' की स्थापना वर्ष 2007 में की गई थी।","facts":["हरियाणा में कुल 2 वन्यजीव संरक्षण आरक्षित क्षेत्र (Conservation Reserves) हैं: बीर बाराबान (जींद—2007) और सरस्वती वन्यजीव अभयारण्य (कैथल/कुरुक्षेत्र—2007)।","यह लगभग 419 हेक्टेयर (1,036 एकड़) क्षेत्र में फैला है और नीलगाय, गीदड़, लोमड़ी व अनेक पक्षी प्रजातियों का आवास है।","इसी वर्ष (2007) जींद में जयंती पुरातत्व संग्रहालय भी स्थापित हुआ था।","हरियाणा में कुल 2 राष्ट्रीय उद्यान हैं: सुल्तानपुर (गुरुग्राम) और कालेसर (यमुनानगर)।","हरियाणा में 2 रामसर आर्द्रभूमि स्थल हैं: भिंडावास (झज्जर) और सुल्तानपुर (गुरुग्राम)।"]},
  {"q":"जींद के किस तीर्थ को 'हरियाणा का लघु हरिद्वार' कहा जाता है, जहाँ पांडवों ने 12 वर्षों तक सोमवती अमावस्या की प्रतीक्षा की थी?","opts":["पांडु-पिंडारा तीर्थ","हटकेश्वर तीर्थ","रामराय तीर्थ","हंसडहर तीर्थ"],"a":0,"exp":"जींद के निकट स्थित 'पांडु-पिंडारा' तीर्थ को 'हरियाणा का लघु हरिद्वार' कहा जाता है, जहाँ पांडवों ने 12 वर्ष सोमवती अमावस्या की प्रतीक्षा कर पूर्वजों का पिंडदान किया था।","facts":["पौराणिक मान्यता है कि चंद्रमा अपनी पत्नी रोहिणी के साथ यहाँ पधारे थे।","यहाँ प्रत्येक सोमवती अमावस्या पर विशाल स्नान व पिंडदान मेला लगता है, जिसमें लाखों श्रद्धालु आते हैं।","ध्यान दें: 'पांडु-पिंडारा' जींद में है, जबकि 'पांडू तीर्थ' तोशाम (भिवानी) में और 'पेहोवा' (कुरुक्षेत्र) को 'हरियाणा का गया' कहते हैं।","पांडु-पिंडारा जींद–गोहाना मार्ग पर जींद शहर से लगभग 5 किमी दूर स्थित है।","यह तीर्थ 48 कोस कुरुक्षेत्र भूमि के प्रमुख प्राचीन तीर्थों में गिना जाता है।"]},
  {"q":"जींद के 'हाट' गाँव में स्थित किस तीर्थ के पवित्र सरोवर में पृथ्वी के 68 तीर्थों की कांति व शक्ति निहित मानी जाती है?","opts":["वराह तीर्थ","पुष्कर तीर्थ","हटकेश्वर तीर्थ","अश्विनी कुमार तीर्थ"],"a":2,"exp":"जींद जिले के हाट गाँव में स्थित 'हटकेश्वर तीर्थ' (हाटकेश्वर धाम) के पवित्र सरोवर में पृथ्वी के 68 तीर्थों की कांति व शक्ति निहित मानी जाती है।","facts":["लोकमान्यता है कि इस सरोवर में स्नान करने से पृथ्वी के सभी 68 तीर्थों के दर्शन व स्नान का पुण्य मिलता है।","हाट गाँव में प्रतिवर्ष श्रावण मास के अंतिम रविवार को प्रसिद्ध 'हटकेश्वर का मेला' आयोजित होता है।","हाट गाँव जींद जिले के सफीदों/पिल्लूखेड़ा क्षेत्र के अंतर्गत आता है।","यहाँ प्राचीन भगवान शिव (हाटकेश्वर महादेव) का भव्य मंदिर स्थित है।","HSSC परीक्षाओं में '68 तीर्थों की शक्ति किस सरोवर में निहित है' (हटकेश्वर तीर्थ, हाट गाँव) बार-बार पूछा जाता है।"]},
  {"q":"महाभारत की मान्यता के अनुसार भगवान विष्णु ने वराह अवतार कहाँ लिया था, जहाँ आज प्रसिद्ध 'वराह तीर्थ' स्थित है?","opts":["आसन गाँव","दिखनी खेड़ा","पोंकरी खेड़ी","बराह गाँव"],"a":3,"exp":"महाभारत व पुराणों की मान्यता के अनुसार भगवान विष्णु ने जींद जिले के 'बराह' (वराह) गाँव में वराह अवतार लिया था।","facts":["वराह अवतार भगवान विष्णु के दशावतारों में तीसरा अवतार माना जाता है, जिसमें उन्होंने हिरण्याक्ष का वध कर पृथ्वी का उद्धार किया था।","बराह गाँव जींद शहर से लगभग 10 किमी की दूरी पर स्थित है और यहाँ प्राचीन वराह तीर्थ व सरोवर हैं।","यह तीर्थ भी 48 कोस कुरुक्षेत्र परिक्रमा के महत्वपूर्ण तीर्थों में शामिल है।","अन्य विकल्पों में आसन गाँव में अश्विनी कुमार तीर्थ, दिखनी खेड़ा में यक्षिणी तीर्थ और पोंकरी खेड़ी में पुष्कर तीर्थ स्थित हैं।","जींद जिले को हरियाणा में सर्वाधिक महाभारतकालीन तीर्थों वाले जिलों (कुरुक्षेत्र के बाद) में गिना जाता है।"]},
  {"q":"देवताओं के वैद्य 'अश्विनी कुमारों' की कथा से जुड़ा प्रसिद्ध 'अश्विनी कुमार तीर्थ' जींद के किस गाँव में स्थित है?","opts":["बराह गाँव","आसन गाँव","जामनी गाँव","इक्कस गाँव"],"a":1,"exp":"जींद जिले के 'आसन' गाँव में प्रसिद्ध 'अश्विनी कुमार तीर्थ' स्थित है, जिससे देवताओं के वैद्य अश्विनी कुमारों की पौराणिक कथा जुड़ी है।","facts":["वामन पुराण और महाभारत में अश्विनी कुमार तीर्थ का विशेष धार्मिक महत्व वर्णित है।","अश्विनी कुमारों को भारतीय परंपरा में आयुर्वेद और चिकित्सा विज्ञान का आदि देवता माना जाता है।","यहाँ स्थित प्राचीन सरोवर में स्नान करने से रोगों से मुक्ति मिलने की लोकमान्यता है।","आसन गाँव जींद जिले के प्रमुख ऐतिहासिक गाँवों में गिना जाता है।","जींद के इन सभी तीर्थों का जीर्णोद्धार कुरुक्षेत्र विकास बोर्ड (KDB) की 48 कोस परिक्रमा योजना के तहत किया जाता है।"]},
  {"q":"जींद जिले में स्थित प्राचीन 'यक्षिणी तीर्थ' किस गाँव से संबंधित है?","opts":["दिखनी खेड़ा","हाट गाँव","पोंकरी खेड़ी","निरंजन गाँव"],"a":0,"exp":"जींद जिले के 'दिखनी खेड़ा' (दुंखनी खेड़ा) गाँव में प्रसिद्ध पौराणिक 'यक्षिणी तीर्थ' स्थित है।","facts":["यक्षिणी तीर्थ का उल्लेख महाभारत के वन पर्व और वामन पुराण में मिलता है।","यहाँ प्राचीन सरोवर और मंदिर बना हुआ है, जहाँ क्षेत्रीय श्रद्धालु पूजा-अर्चना करते हैं।","अन्य विकल्पों में हाट गाँव में हटकेश्वर तीर्थ, पोंकरी खेड़ी में पुष्कर तीर्थ और निरंजन गाँव में मुजावता तीर्थ स्थित हैं।","जींद के ये ग्रामीण तीर्थ हरियाणा की प्राचीन सनातन और महाभारतकालीन संस्कृति के जीवंत प्रमाण हैं।","HSSC की परीक्षाओं में जींद के तीर्थों और उनके गाँवों का सही मिलान अक्सर पूछा जाता है।"]},
  {"q":"जींद के 'पोंकरी खेड़ी' में स्थित किस तीर्थ की खोज पुराणों के अनुसार महर्षि जमदग्नि के पुत्र भगवान परशुराम ने की थी?","opts":["वराह तीर्थ","हटकेश्वर तीर्थ","पुष्कर तीर्थ","हंसडहर तीर्थ"],"a":2,"exp":"जींद जिले के पोंकरी खेड़ी में स्थित प्राचीन 'पुष्कर तीर्थ' की खोज पुराणों के अनुसार महर्षि जमदग्नि के पुत्र भगवान परशुराम ने की थी।","facts":["पोंकरी खेड़ी का प्राचीन नाम भी 'पुष्कर' ही माना जाता है।","ध्यान दें: भारत का विश्व प्रसिद्ध ब्रह्मा जी का पुष्कर तीर्थ अजमेर (राजस्थान) में है, जबकि हरियाणा का 'पुष्कर तीर्थ' पोंकरी खेड़ी (जींद) में स्थित है।","जींद जिले में भगवान परशुराम व उनके पिता जमदग्नि से जुड़े कई तीर्थ हैं: पुष्कर तीर्थ (पोंकरी खेड़ी), जामनी तीर्थ (जामनी), खांडा मंदिर और रामराय तीर्थ।","पोंकरी खेड़ी में प्राचीन सरोवर और मंदिर परिसर स्थित है।","जींद के प्रमुख तीर्थों में पुष्कर तीर्थ अत्यंत पूजनीय माना जाता है।"]},
  {"q":"जींद जिले के 'जामनी' गाँव में भगवान परशुराम के पिता किस महान ऋषि का प्राचीन मंदिर व तपोस्थली स्थित है?","opts":["महर्षि कपिल मुनि","महर्षि कर्दम","महर्षि वशिष्ठ","महर्षि जमदग्नि"],"a":3,"exp":"जींद जिले के जामनी गाँव (पिल्लूखेड़ा क्षेत्र) में भगवान परशुराम के पिता महर्षि जमदग्नि का प्राचीन मंदिर व प्रसिद्ध 'जामनी तीर्थ' स्थित है।","facts":["पौराणिक मान्यता है कि सप्तर्षियों में से एक महर्षि जमदग्नि ने यहाँ कठोर तपस्या की थी।","जामनी गाँव का नाम भी 'जमदग्नि' शब्द के अपभ्रंश से 'जामनी' पड़ा।","यहाँ स्थित प्राचीन मंदिर में महर्षि जमदग्नि और माता रेणुका की पूजा की जाती है।","महर्षि जमदग्नि के पुत्र भगवान परशुराम को भगवान विष्णु का छठा अवतार माना जाता है।","जामनी के पास ही खांडा गाँव में भगवान परशुराम का प्राचीन मंदिर व तीर्थ स्थित है।"]},
  {"q":"जींद से 18 किमी दूर किस गाँव में प्राचीन भगवान परशुराम मंदिर है, जहाँ माता रेणुका का स्वर्ण कलश चोरों द्वारा चुराए जाने पर मिट्टी का बन गया था?","opts":["जामनी","खांडा","रामराय","बराह"],"a":1,"exp":"जींद के 'खांडा' गाँव में अत्यंत प्राचीन भगवान परशुराम मंदिर व तीर्थ है, जहाँ माता रेणुका के मिट्टी बने स्वर्ण कलश की प्रसिद्ध लोककथा जुड़ी है।","facts":["लोककथा के अनुसार माता रेणुका जामनी (महर्षि जमदग्नि तीर्थ) से प्रतिदिन स्वर्ण कलश में जल लाती थीं; एक दिन चोरों द्वारा चुराए जाने पर वह कलश मिट्टी का बन गया, जो आज भी मंदिर में विद्यमान है।","खांडा गाँव जींद शहर से लगभग 18 किमी की दूरी पर स्थित है।","यहाँ भगवान परशुराम जयंती (अक्षय तृतीया) के अवसर पर विशेष धार्मिक आयोजन व भंडारा होता है।","जींद में इसके अलावा रामराय (रामहृद) में भी भगवान परशुराम का प्रसिद्ध मंदिर स्थित है।","जींद जिले की इन लोककथाओं से जुड़े प्रश्न HSSC की जिलावार GK में पूछे जाते हैं।"]},
  {"q":"जींद जिले के किस गाँव को महाभारत काल के राजा 'इक्ष्वाकु' की नगरी माना जाता है?","opts":["इक्कस","हाट","आसन","निरंजन"],"a":0,"exp":"जींद जिले के 'इक्कस' गाँव को प्राचीन सूर्यवंशी राजा इक्ष्वाकु की नगरी माना जाता है।","facts":["'इक्ष्वाकु' शब्द के अपभ्रंश से ही इस गाँव का नाम 'इक्कस' प्रचलित हुआ।","इक्कस गाँव के पास ही महाभारत काल से जुड़ा प्रसिद्ध 'ढुंढवा तीर्थ' (हंस सरोवर/द्वैपायन हृद) स्थित है।","इक्कस गाँव जींद शहर के पश्चिम में जींद–हांसी मार्ग के निकट स्थित है।","यहाँ प्राचीन तीर्थ सरोवर और मंदिर स्थित हैं।","जींद के अन्य पौराणिक गाँव: बराह, आसन, हाट, जामनी, रामराय और पांडु-पिंडारा।"]},
  {"q":"महाकवि कालिदास के 'अभिज्ञान शाकुंतलम्' में वर्णित जींद का कौन-सा तीर्थ है, जहाँ युद्ध में हारने के बाद दुर्योधन छिप गया था और भीम ने उसका वध किया था?","opts":["पांडु-पिंडारा तीर्थ","हंसडहर तीर्थ","ढुंढवा तीर्थ","मुजावता तीर्थ"],"a":2,"exp":"जींद में इक्कस गाँव के पास स्थित 'ढुंढवा तीर्थ' का वर्णन कालिदास के 'अभिज्ञान शाकुंतलम्' में है; मान्यता है कि युद्ध में हारकर दुर्योधन यहाँ छिपा था और भीम ने उसे ढूँढ़कर वध किया।","facts":["दुर्योधन को ढूँढ़े जाने के कारण ही इस तीर्थ का नाम 'ढुंढवा तीर्थ' (द्वैपायन हृद) पड़ा।","यहीं महाभारत युद्ध के अंतिम दिन भीम और दुर्योधन के बीच प्रसिद्ध गदा युद्ध हुआ था।","महाकवि कालिदास गुप्त सम्राट चंद्रगुप्त द्वितीय (विक्रमादित्य) के नवरत्नों में सर्वश्रेष्ठ कवि थे।","ढुंढवा तीर्थ जींद शहर के निकट इक्कस गाँव क्षेत्र में स्थित है।","HSSC परीक्षाओं में 'अभिज्ञान शाकुंतलम् में जींद के किस तीर्थ का वर्णन है' (ढुंढवा तीर्थ) महत्वपूर्ण प्रश्न है।"]},
  {"q":"नरवाना (जींद) में स्थित किस तीर्थ पर कपिल मुनि का जन्म व उनके पिता महर्षि कर्दम ने तपस्या की थी और ब्रह्मा जी हंस की सवारी कर आए थे?","opts":["रामराय तीर्थ","हटकेश्वर तीर्थ","पुष्कर तीर्थ","हंसडहर तीर्थ"],"a":3,"exp":"नरवाना (जींद) के हंसडहर गाँव में स्थित 'हंसडहर तीर्थ' पर महर्षि कर्दम ने तपस्या की थी, कपिल मुनि का जन्म हुआ था और ब्रह्मा जी हंस की सवारी करते हुए पधारे थे।","facts":["ब्रह्मा जी के हंस वाहन पर आगमन के कारण ही इस स्थान का नाम 'हंसडहर' पड़ा।","कपिल मुनि भारतीय दर्शन के सबसे प्राचीन 'सांख्य दर्शन' के प्रणेता माने जाते हैं।","हंसडहर गाँव में प्रतिवर्ष प्रसिद्ध 'बिलसर का मेला' आयोजित होता है।","ध्यान दें: कपिल मुनि से जुड़ा एक अन्य प्रमुख मंदिर व ईंटों का प्राचीन मंदिर 'कलायत' (कैथल जिला) में भी स्थित है।","हंसडहर गाँव नरवाना क्षेत्र में स्थित प्रमुख पौराणिक तीर्थ है।"]},
  {"q":"जींद के किस तीर्थ के बारे में जनश्रुति है कि वनवास के समय भगवान राम, सीता और लक्ष्मण यहाँ आए थे तथा भगवान परशुराम ने यज्ञ किया था?","opts":["पांडु-पिंडारा","रामराय (रामहृद)","हटकेश्वर","इक्कस"],"a":1,"exp":"जींद जिले के रामराय गाँव में स्थित 'रामराय / रामहृद तीर्थ' पर भगवान राम, सीता व लक्ष्मण के आगमन और भगवान परशुराम के यज्ञ की मान्यता जुड़ी है।","facts":["यहाँ भगवान परशुराम का प्रसिद्ध प्राचीन मंदिर और पवित्र रामहृद सरोवर स्थित है।","प्रतिवर्ष वैशाख व कार्तिक पूर्णिमा को यहाँ प्रसिद्ध 'रामराय हृद का मेला' लगता है, जिसमें महर्षि परशुराम की पूजा की जाती है।","रामराय गाँव जींद शहर से लगभग 8 किमी पश्चिम में जींद–हांसी मार्ग पर स्थित है।","वामन पुराण और महाभारत में रामहृद तीर्थ को कुरुक्षेत्र की दक्षिणी-पश्चिमी सीमा का प्रमुख तीर्थ बताया गया है।","HSSC परीक्षाओं में 'रामराय हृद का मेला कहाँ लगता है' (रामराय, जींद) बार-बार पूछा जाता है।"]},
  {"q":"वामन पुराण में वर्णित जींद के निरंजन गाँव का कौन-सा तीर्थ भगवान महादेव से जुड़ा है, जहाँ एक रात उपवास रखने से भगवान गणेश का आवास (गणपत्य) मिलता है?","opts":["मुजावता तीर्थ","ढुंढवा तीर्थ","वराह तीर्थ","अश्विनी कुमार तीर्थ"],"a":0,"exp":"जींद जिले के निरंजन गाँव में स्थित 'मुजावता तीर्थ' (मुंजवता) से भगवान महादेव की कथा जुड़ी है; वामन पुराण के अनुसार यहाँ एक रात उपवास रखने से गणपत्य पद प्राप्त होता है।","facts":["निरंजन गाँव जींद–सफीदों मार्ग के निकट स्थित एक प्राचीन व ऐतिहासिक गाँव है।","वामन पुराण में हरियाणा (विशेषकर कुरुक्षेत्र, कैथल और जींद) के प्राचीन तीर्थों, वनों और नदियों का विस्तृत वर्णन मिलता है।","हरियाणा की प्राचीन सात पवित्र नदियों और सात वनों का उल्लेख भी वामन पुराण में है।","जींद के अन्य प्रसिद्ध शिव तीर्थों में भूतेश्वर मंदिर (रानी तालाब) और हटकेश्वर धाम (हाट गाँव) शामिल हैं।","निरंजन गाँव के इस तीर्थ पर शिवरात्रि व सावन माह में श्रद्धालु पूजा-अर्चना करते हैं।"]},
  {"q":"नरवाना (जींद) में स्थित ऐतिहासिक 'धमतान साहिब गुरुद्वारा' किस सिख गुरु को समर्पित है, जिसका मेला हिंदू-सिख एकता का प्रतीक है?","opts":["गुरु गोबिंद सिंह जी","गुरु हरकृष्ण साहिब जी","गुरु तेग बहादुर जी","गुरु नानक देव जी"],"a":2,"exp":"नरवाना (जींद) स्थित प्रसिद्ध 'धमतान साहिब गुरुद्वारा' सिखों के नौवें गुरु श्री गुरु तेग बहादुर जी को समर्पित है।","facts":["औरंगजेब के दरबार (दिल्ली) में अपनी शहादत के लिए जाते समय गुरु तेग बहादुर जी यहाँ रुके थे।","धमतान साहिब में प्रतिवर्ष लगने वाला विशाल मेला पूरे उत्तर भारत में 'हिंदू-सिख एकता' के महान प्रतीक के रूप में प्रसिद्ध है।","गुरु तेग बहादुर जी को 'हिंद की चादर' कहा जाता है; उन्होंने कश्मीरी पंडितों व धर्म की रक्षा हेतु 1675 ई. में दिल्ली (चांदनी चौक, शीशगंज) में शहादत दी थी।","धमतान गाँव नरवाना–टोहाना मार्ग पर स्थित है।","हरियाणा सिख गुरुद्वारा प्रबंधन कमेटी (HSGMC) राज्य के ऐतिहासिक गुरुद्वारों का प्रबंधन करती है।"]},
  {"q":"जींद जिले के किस गाँव में गुरु तेग बहादुर जी को समर्पित 'सिंहपुरा साहिब गुरुद्वारा' और प्रसिद्ध 'सच्चा सौदा मेला' आयोजित होता है?","opts":["धमतान","हंसडहर","हाट","सिंहपुरा"],"a":3,"exp":"जींद जिले के सिंहपुरा गाँव में गुरु तेग बहादुर जी को समर्पित 'सिंहपुरा साहिब गुरुद्वारा' स्थित है और यहीं प्रतिवर्ष प्रसिद्ध 'सच्चा सौदा मेला' लगता है।","facts":["मान्यता है कि गुरु तेग बहादुर जी की यात्रा के दौरान यहाँ श्रद्धालुओं ने उनकी निष्काम सेवा की थी, जिसकी स्मृति में सच्चा सौदा मेला आयोजित होता है।","ध्यान दें: प्रसिद्ध 'डेरा सच्चा सौदा' आश्रम सिरसा जिले में है, जबकि 'सच्चा सौदा मेला' जींद (सिंहपुरा) में लगता है।","सिंहपुरा गाँव जींद जिले के सफीदों क्षेत्र के अंतर्गत आता है।","जींद जिले में गुरु तेग बहादुर जी से जुड़े तीन प्रमुख गुरुद्वारे हैं: धमतान साहिब (नरवाना), सिंहपुरा साहिब (सिंहपुरा) और मंजी साहिब (जींद)।","अंबाला जिले में पंजोखरा साहिब, लख्नौर साहिब और बादशाही बाग गुरुद्वारे प्रसिद्ध हैं।"]},
  {"q":"जींद शहर में स्थित 'मंजी साहिब गुरुद्वारा' किस सिख गुरु को समर्पित है?","opts":["गुरु हरगोबिंद साहिब जी","गुरु तेग बहादुर जी","गुरु गोबिंद सिंह जी","गुरु अर्जुन देव जी"],"a":1,"exp":"जींद शहर में स्थित ऐतिहासिक 'मंजी साहिब गुरुद्वारा' नौवें सिख गुरु श्री गुरु तेग बहादुर जी को समर्पित है।","facts":["ध्यान दें: हरियाणा में 'मंजी साहिब गुरुद्वारा' कई स्थानों पर प्रसिद्ध हैं—अंबाला (कैथ माजरी, गुरु हरगोबिंद जी), कैथल (गुरु तेग बहादुर जी), लाखन माजरा/रोहतक (गुरु तेग बहादुर जी) और जींद (गुरु तेग बहादुर जी)।","जींद जिले में सिख श्रद्धालुओं की बड़ी आबादी है और यहाँ गुरुपर्व व बैसाखी धूमधाम से मनाए जाते हैं।","हरियाणा में अन्य प्रसिद्ध गुरुद्वारे: नाडा साहिब (पंचकूला—गुरु गोबिंद सिंह जी) और कपाल मोचन (यमुनानगर)।","जींद का यह गुरुद्वारा शहर के मुख्य ऐतिहासिक क्षेत्र में स्थित है।","HSSC की परीक्षाओं में विभिन्न जिलों के मंजी साहिब गुरुद्वारों व उनसे जुड़े गुरुओं के नाम पूछे जाते हैं।"]},
  {"q":"जींद जिले के हंसडहर गाँव में प्रतिवर्ष कौन-सा प्रसिद्ध लोक मेला आयोजित होता है?","opts":["बिलसर का मेला","सच्चा सौदा मेला","हटकेश्वर का मेला","नागक्षेत्र का मेला"],"a":0,"exp":"जींद जिले के नरवाना क्षेत्र के हंसडहर गाँव में प्रतिवर्ष प्रसिद्ध 'बिलसर का मेला' आयोजित होता है।","facts":["हंसडहर गाँव में ही कपिल मुनि के पिता महर्षि कर्दम की तपोस्थली 'हंसडहर तीर्थ' स्थित है।","अन्य प्रमुख मेलों का मिलान: हटकेश्वर का मेला (हाट गाँव), सच्चा सौदा मेला (सिंहपुरा), नागक्षेत्र मेला (सफीदों), धमतान साहिब मेला (नरवाना) और रामराय हृद मेला (रामराय)।","जींद में ही प्रसिद्ध 'मल्लिनाथ पशु मेला' और 'भल्लूनाथ का मेला' भी आयोजित होते हैं।","हरियाणा में पशुओं का सबसे बड़ा वार्षिक मेला जहाजगढ़ (झज्जर) में लगता है।","ग्रामीण मेलों में हरियाणवी कुश्ती दंगल, रागिनी और पशु प्रदर्शनियाँ प्रमुख आकर्षण होती हैं।"]},
  {"q":"प्रसिद्ध 'मल्लिनाथ पशु मेला' और 'भल्लूनाथ का मेला' हरियाणा के किस जिले में आयोजित होते हैं?","opts":["झज्जर","भिवानी","जींद","हिसार"],"a":2,"exp":"मल्लिनाथ पशु मेला और भल्लूनाथ का मेला जींद जिले के प्रमुख पारंपरिक मेलों में शामिल हैं।","facts":["जींद 'दूध नगरी' होने के कारण यहाँ उन्नत मुर्राह भैंसों और दुधारू पशुओं के व्यापार हेतु मल्लिनाथ पशु मेला विशेष महत्व रखता है।","जबकि हरियाणा में सबसे बड़ा पशु मेला जहाजगढ़ (झज्जर) में लगता है।","जींद के अन्य प्रसिद्ध मेले: पांडु-पिंडारा (सोमवती अमावस्या मेला), धमतान साहिब मेला, हटकेश्वर मेला, बिलसर मेला और रामराय मेला।","हरियाणा में सर्वाधिक मेले सिरसा, कुरुक्षेत्र और मथुरा सीमा से लगे जिलों में लगते हैं।","HSSC परीक्षाओं में मल्लिनाथ पशु मेला और भल्लूनाथ मेला जींद से संबंधित कर पूछे जाते हैं।"]},
  {"q":"चौधरी रणबीर सिंह विश्वविद्यालय (CRSU), जींद की स्थापना किस वर्ष की गई थी?","opts":["2007","2010","2017","2014"],"a":3,"exp":"चौधरी रणबीर सिंह विश्वविद्यालय (CRSU), जींद की स्थापना वर्ष 2014 (जुलाई 2014) में की गई थी।","facts":["यह पहले कुरुक्षेत्र विश्वविद्यालय का पीजी रीजनल सेंटर (जींद) था, जिसे 2014 में पूर्ण राज्य विश्वविद्यालय का दर्जा दिया गया।","इसका नाम संविधान सभा के सदस्य व स्वतंत्रता सेनानी चौधरी रणबीर सिंह हुड्डा के नाम पर रखा गया है।","वर्ष 2014 में ही भिवानी में 'चौधरी बंसीलाल विश्वविद्यालय' (CBLU) की स्थापना भी हुई थी।","जींद के हैबतपुर गाँव में नया राजकीय मेडिकल कॉलेज (संत शिरोमणि गुरु रविदास राजकीय मेडिकल कॉलेज) विकसित किया गया है।","हरियाणा का पहला विश्वविद्यालय कुरुक्षेत्र विवि (1956) और एकमात्र केंद्रीय विश्वविद्यालय जांट-पाली (महेंद्रगढ़, 2009) में है।"]},
  {"q":"जींद जिले का 'जवाहर नवोदय विद्यालय' (JNV) किस स्थान पर स्थित है?","opts":["हैबतपुर","खुंगा कोठी","बीबीपुर","निडानी"],"a":1,"exp":"जींद जिले का जवाहर नवोदय विद्यालय 'खुंगा कोठी' (Khunga Kothi) में स्थित है।","facts":["जवाहर नवोदय विद्यालय (JNV) केंद्रीय शिक्षा मंत्रालय के अधीन ग्रामीण क्षेत्र के मेधावी बच्चों के लिए पूर्णतः आवासीय विद्यालय हैं।","भारत के पहले दो जवाहर नवोदय विद्यालयों में से एक हरियाणा के झज्जर जिले के कलोई गाँव (1985–86) में खोला गया था।","अन्य विकल्पों में हैबतपुर में प्रथम ग्राम सचिवालय, बीबीपुर में सेल्फी विद डॉटर अभियान और निडानी में स्पोर्ट्स स्कूल प्रसिद्ध हैं।","जींद शहर में प्रसिद्ध 'राजकीय स्नातकोत्तर महाविद्यालय' और 'सी.आर. किसान कॉलेज' भी उच्च शिक्षा के प्रमुख केंद्र हैं।","खुंगा कोठी जींद–सफीदों मार्ग के निकट स्थित है।"]},
  {"q":"हरियाणा के किस जिले में 'अर्जुन स्टेडियम' और 'एकलव्य स्टेडियम' स्थित हैं?","opts":["जींद","भिवानी","हिसार","कुरुक्षेत्र"],"a":0,"exp":"अर्जुन स्टेडियम और एकलव्य स्टेडियम जींद जिले के प्रमुख खेल एवं एथलेटिक्स स्टेडियम हैं।","facts":["इन स्टेडियमों में कुश्ती, एथलेटिक्स, बास्केटबॉल, कबड्डी और जिला स्तरीय समारोह आयोजित होते हैं।","अन्य जिलों के प्रसिद्ध स्टेडियम: महावीर स्टेडियम (हिसार), भीम स्टेडियम (भिवानी), बलिदान स्टेडियम (चरखी दादरी), महर्षि दयानंद सरस्वती स्टेडियम (झज्जर) और नेहरू स्टेडियम (गुरुग्राम)।","हरियाणा का सर्वोच्च खेल पुरस्कार 'भीम पुरस्कार' (5 लाख रुपये) है।","देश का पहला खेल विश्वविद्यालय 'हरियाणा खेल विश्वविद्यालय' राई (सोनीपत) में स्थापित है।","जींद के निडानी गाँव में स्थित 'चौधरी भरत सिंह मेमोरियल स्पोर्ट्स स्कूल' ने अंशु मलिक जैसी विश्व स्तरीय खिलाड़ी तैयार की हैं।"]},
  {"q":"हरियाणा प्रदेश का प्रथम 'ग्राम सचिवालय' (Gram Sachivalaya) जींद के किस गाँव में बनाया गया था?","opts":["बीबीपुर","गुरुकुल खेड़ा","हैबतपुर","मालवी"],"a":2,"exp":"हरियाणा का पहला ग्राम सचिवालय जींद जिले के 'हैबतपुर' गाँव में स्थापित किया गया था।","facts":["ग्राम सचिवालय की पहल ग्रामीण जनता को पटवारी, ग्राम सचिव, कृषि व ई-दिशा सेवाएँ गाँव में ही एक छत के नीचे देने के लिए शुरू की गई।","हैबतपुर गाँव में ही जींद जिले का विशाल राजकीय मेडिकल कॉलेज (संत शिरोमणि गुरु रविदास मेडिकल कॉलेज) निर्मित किया गया है।","अन्य 'हरियाणा में प्रथम गाँव': पहला वाई-फाई गाँव (जुगलान, हिसार), पहला आदर्श गाँव (सुई, भिवानी), राष्ट्रगान वाला पहला गाँव (भनकपुर, फरीदाबाद) और पहला CFL गाँव (बिनौला, गुरुग्राम)।","हरियाणा में त्रिस्तरीय पंचायती राज व्यवस्था 22 अप्रैल 1994 से लागू है।","HSSC परीक्षाओं में 'प्रदेश का प्रथम ग्राम सचिवालय कहाँ बना' (हैबतपुर, जींद) अत्यंत लोकप्रिय प्रश्न है।"]},
  {"q":"हरियाणा का पहला पूर्णतः सौर ऊर्जा संचालित 'सोलर विलेज' (Solar Village) जींद जिले का कौन-सा गाँव बना था?","opts":["हैबतपुर","बीबीपुर","निडानी","गुरुकुल खेड़ा"],"a":3,"exp":"जींद जिले का 'गुरुकुल खेड़ा' गाँव हरियाणा का पहला पूर्णतः सौर ऊर्जा संचालित (सोलर) गाँव बना था।","facts":["सौर ऊर्जा को बढ़ावा देने के लिए अंतर्राष्ट्रीय सौर गठबंधन (ISA) का वैश्विक मुख्यालय हरियाणा के गुरुग्राम में (30 नवंबर 2015) स्थापित है।","हरियाणा का पहला पॉलिथीन-मुक्त जिला फतेहाबाद, पहला केरोसिन-मुक्त जिला कुरुक्षेत्र और पहला धूम्रपान-मुक्त शहर पंचकूला बना था।","29 नवंबर 1970 को हरियाणा सभी गाँवों में बिजली पहुँचाने वाला भारत का पहला राज्य बना था।","'मेरा गाँव-जगमग गाँव' योजना 1 जुलाई 2015 को दयालपुर (कुरुक्षेत्र) से शुरू हुई थी।","जींद जिले ने ग्राम सचिवालय (हैबतपुर), सोलर विलेज (गुरुकुल खेड़ा) और सेल्फी विद डॉटर (बीबीपुर) के जरिए राज्य में अनेक मॉडल स्थापित किए हैं।"]},
  {"q":"हरियाणा राज्य में सर्वाधिक भैंसें (विशेषकर मुर्राह नस्ल) किस जिले में पाई जाती हैं?","opts":["हिसार","जींद","भिवानी","करनाल"],"a":1,"exp":"हरियाणा में सर्वाधिक भैंसें (विशेषकर विश्व प्रसिद्ध मुर्राह नस्ल) जींद जिले में पाई जाती हैं, जिसके कारण इसे 'दूध नगरी' कहा जाता है।","facts":["हरियाणा की मुर्राह भैंस को अधिक दुग्ध उत्पादन के कारण 'काला सोना' (Black Gold) कहा जाता है।","जींद में डेयरी विकास के लिए प्रसिद्ध 'वीटा मिल्क प्लांट' (हरियाणा डेयरी विकास सहकारी प्रसंघ) स्थित है।","हरियाणा में केंद्रीय भैंस अनुसंधान संस्थान (CIRB, 1985) हिसार में और राष्ट्रीय डेयरी अनुसंधान संस्थान (NDRI, 1955) करनाल में स्थित है।","हरियाणा में सर्वाधिक पशुधन वाले शीर्ष जिलों में हिसार, सिरसा, भिवानी और जींद शामिल हैं।","पशुपालन को बढ़ावा देने हेतु हरियाणा में पशुधन बीमा योजना (झज्जर, 2016) और पशुधन किसान क्रेडिट कार्ड योजना (भिवानी, 2019) लागू हैं।"]},
  {"q":"हरियाणा में 'चमड़े की सफाई' (Leather Cleaning) का कार्य मुख्य रूप से किस जिले में होता है?","opts":["जींद","पानीपत","अंबाला","करनाल"],"a":0,"exp":"हरियाणा राज्य में चमड़े की सफाई का पारंपरिक औद्योगिक कार्य मुख्य रूप से जींद जिले में होता है।","facts":["जींद जिले के अन्य प्रमुख उद्योगों में चीनी उद्योग (जींद सहकारी चीनी मिल) और साइकिल उद्योग शामिल हैं।","जबकि चमड़े के जूते (फुटवियर) निर्माण के प्रमुख केंद्र बहादुरगढ़ (झज्जर—फुटवियर पार्क), फरीदाबाद (बाटा) और करनाल (लिबर्टी) हैं।","अंबाला वैज्ञानिक उपकरणों व मिक्सी उद्योग के लिए, पानीपत बुनकर/हैंडलूम उद्योग के लिए और रेवाड़ी पीतल उद्योग के लिए प्रसिद्ध है।","जींद में पशुधन आधारित डेयरी, चारा व चमड़ा प्रसंस्करण उद्योग ग्रामीण अर्थव्यवस्था को बल देते हैं।","HSSC की परीक्षाओं में 'चमड़े की सफाई का कार्य मुख्यतः कहाँ होता है' (जींद) सीधे पूछा जाता है।"]},
  {"q":"जींद जिले में कृषि एवं पशुपालन आधारित कौन-से तीन प्रमुख संस्थान/संयंत्र स्थित हैं?","opts":["NDRI, CSSRI और NBAGR","CIRB, NRCE और HARSAC","वीटा मिल्क प्लांट, पशु चारा प्लांट और हरियाणा कृषि ट्रेनिंग संस्थान","NCIPM, AJNIFM और बाटा प्लांट"],"a":2,"exp":"जींद जिले में वीटा मिल्क प्लांट, पशु चारा प्लांट और हरियाणा कृषि ट्रेनिंग संस्थान स्थित हैं।","facts":["अन्य विकल्पों में NDRI व CSSRI करनाल में, CIRB, NRCE व HARSAC हिसार में और NCIPM व AJNIFM फरीदाबाद में स्थित हैं।","जींद में 'हरियाणा डेयरी विकास सहकारी प्रसंघ' (HDDCF — ब्रांड नाम: VITA) का प्रमुख मिल्क प्लांट कार्यरत है।","पशु चारा प्लांट द्वारा जिले व प्रदेश के पशुपालकों को संतुलित पशु आहार (वीटा पशु आहार) उपलब्ध कराया जाता है।","हरियाणा कृषि विश्वविद्यालय (CCS HAU) हिसार में स्थित है, जिसकी स्थापना 2 फरवरी 1970 को हुई थी।","जींद की कृषि आधारित अर्थव्यवस्था में गेहूँ, धान (बासमती), कपास और गन्ना प्रमुख फसलें हैं।"]},
  {"q":"जींद जिले के प्रमुख पारंपरिक उद्योगों में निम्न में से कौन-सा जोड़ा शामिल है?","opts":["जहाज निर्माण व चाय उद्योग","वैज्ञानिक उपकरण व मिक्सी उद्योग","सीमेंट व हीरा उद्योग","चीनी उद्योग व साइकिल उद्योग"],"a":3,"exp":"जींद जिले में सहकारी चीनी मिल (चीनी उद्योग), साइकिल उद्योग और चमड़ा सफाई उद्योग प्रमुख पारंपरिक उद्योग रहे हैं।","facts":["जींद सहकारी चीनी मिल (स्थापना: 1985) जिले के गन्ना किसानों के लिए प्रमुख केंद्र है।","हरियाणा में सबसे बड़ी व पहली चीनी मिल 'सरस्वती शुगर मिल' (1933) यमुनानगर जिले में है।","हरियाणा में ऐतिहासिक साइकिल उद्योग का सबसे बड़ा केंद्र सोनीपत (एटलस साइकिल, 1951—अब बंद) रहा है, जबकि जींद में भी साइकिल व पुर्जे बनाने की इकाइयाँ रही हैं।","केंद्र सरकार की ODOP योजना के तहत जींद जिले में पोल्ट्री व डेयरी प्रसंस्करण उत्पादों को प्रोत्साहन मिला है।","जींद में कपास ओटाई (जिनिंग), राइस मिल और कृषि उपकरण बनाने के अनेक लघु उद्योग कार्यरत हैं।"]},
  {"q":"विश्व प्रसिद्ध 'सेल्फी विद डॉटर' अभियान की शुरुआत जून 2015 में जींद के बीबीपुर गाँव से किसने की थी?","opts":["महाबीर गुड्डू","सुनील जागलान","पंडित अमीलाल","चौधरी बीरेंद्र सिंह"],"a":1,"exp":"बीबीपुर गाँव (जींद) के तत्कालीन सरपंच सुनील जागलान ने 9 जून 2015 को 'सेल्फी विद डॉटर' अभियान की शुरुआत की थी।","facts":["प्रधानमंत्री नरेंद्र मोदी ने अपने 'मन की बात' कार्यक्रम में इस अभियान की प्रशंसा की, जिसके बाद यह विश्वव्यापी अभियान बन गया।","सुनील जागलान ने बीबीपुर में 'लाडो स्वाभिमान उत्सव', 'गाली बंद घर' और 'बेटियों के नाम घर की नेमप्लेट' जैसे सामाजिक सुधार अभियान चलाए।","उनके कार्यों पर आधारित डॉक्यूमेंट्री फिल्म 'सनराइज' (Sunrise) को राष्ट्रीय फिल्म पुरस्कार प्राप्त हुआ।","बीबीपुर गाँव में ही हरियाणा की पहली 'महिला ग्राम सभा' का आयोजन हुआ था।","हरियाणा में 'बेटी बचाओ, बेटी पढ़ाओ' अभियान 22 जनवरी 2015 को पानीपत से शुरू किया गया था।"]},
  {"q":"हरियाणा के किस प्रसिद्ध लोक गायक ('बम लहरी') को वर्ष 2024 में 'पद्म श्री' से सम्मानित किया गया?","opts":["महाबीर गुड्डू","गजेंद्र फोगाट","मुंशी राम","मनकीरत औलख"],"a":0,"exp":"जींद जिले के प्रसिद्ध हरियाणवी लोक गायक व सांस्कृतिक कलाकार महाबीर गुड्डू ('बम लहरी') को वर्ष 2024 में भारत सरकार द्वारा 'पद्म श्री' से सम्मानित किया गया।","facts":["महाबीर गुड्डू का जन्म जींद जिले के गांगोली गाँव में हुआ था और उन्होंने हरियाणवी लोक संगीत, रागिनी व शिव भजनों को अंतर्राष्ट्रीय मंच दिया।","उन्हें इससे पहले हरियाणा सरकार का 'पंडित लख्मीचंद पुरस्कार' और 'संगीत नाटक अकादमी पुरस्कार' भी मिल चुके हैं।","2024 में हरियाणा से पद्म श्री पाने वाले अन्य प्रमुख नाम: डॉ. राम चंदर सिहाग (विज्ञान, हिसार), गुरविंदर सिंह (समाज सेवा, सिरसा) और हरि ओम (प्राकृतिक कृषि, कुरुक्षेत्र)।","पद्म श्री भारत का चौथा सर्वोच्च नागरिक सम्मान है (शुरुआत: 1954)।","हरियाणा में अन्य प्रसिद्ध गायक: पंडित जसराज (फतेहाबाद), सोनू निगम (फरीदाबाद) और जोहराबाई अंबालेवाली (अंबाला)।"]},
  {"q":"भारत की पहली WWE महिला रेसलर 'कविता दलाल' (जिन्हें ग्रेट खली ने 'हार्ड लेडी / लेडी खली' नाम दिया) जींद के किस गाँव से हैं?","opts":["निडानी","कालवा","मालवी","डूमरखां"],"a":2,"exp":"भारत की पहली WWE महिला पहलवान कविता दलाल (कविता देवी) का संबंध जींद जिले के जुलाना क्षेत्र के 'मालवी' गाँव से है।","facts":["कविता दलाल ने 2017 में WWE के 'मे यंग क्लासिक' टूर्नामेंट में भगवा सलवार-सूट पहनकर रिंग में उतरकर विश्वभर में सुर्खियाँ बटोरीं।","उन्होंने द ग्रेट खली (दलीप सिंह राणा) की अकादमी में प्रशिक्षण लिया और 2016 दक्षिण एशियाई खेलों (वेटलिफ्टिंग, 75 किग्रा) में स्वर्ण पदक जीता था।","भारत सरकार ने उन्हें देश की प्रेरणादायक महिलाओं की 'फर्स्ट लेडीज' सूची में सम्मानित किया था।","वे सशस्त्र सीमा बल (SSB) में सब-इंस्पेक्टर के पद पर भी सेवा दे चुकी हैं।","मालवी गाँव जुलाना विधानसभा क्षेत्र के अंतर्गत आता है।"]},
  {"q":"विश्व कुश्ती चैंपियनशिप (2021) में रजत पदक जीतने वाली भारत की पहली महिला पहलवान 'अंशु मलिक' जींद के किस गाँव से हैं?","opts":["मालवी","कालवा","बीबीपुर","निडानी"],"a":3,"exp":"अंतर्राष्ट्रीय महिला पहलवान अंशु मलिक का संबंध जींद जिले के 'निडानी' गाँव से है।","facts":["अक्टूबर 2021 में ओस्लो (नॉर्वे) विश्व कुश्ती चैंपियनशिप के फाइनल में पहुँचकर रजत पदक जीतने वाली वे भारत की पहली महिला पहलवान बनीं।","उन्होंने 2022 के बर्मिंघम राष्ट्रमंडल खेलों (57 किग्रा) में रजत पदक और 2021 एशियाई कुश्ती चैंपियनशिप (अल्माटी) में स्वर्ण पदक जीता।","उन्होंने टोक्यो 2020 और पेरिस 2024—लगातार दो ओलंपिक खेलों में भारत का प्रतिनिधित्व किया।","उन्हें वर्ष 2022 में भारत सरकार द्वारा 'अर्जुन पुरस्कार' से सम्मानित किया गया।","उन्होंने निडानी गाँव स्थित 'चौधरी भरत सिंह मेमोरियल स्पोर्ट्स स्कूल' से कुश्ती का प्रशिक्षण लिया।"]},
  {"q":"2018 जकार्ता एशियाई खेलों में 800 मीटर दौड़ का स्वर्ण पदक जीतने वाले एथलीट 'मंजीत सिंह चहल' जींद के किस स्थान से हैं?","opts":["नरवाना","उचाना","सफीदों","जुलाना"],"a":1,"exp":"भारतीय मध्यम दूरी के धावक मंजीत सिंह चहल का जन्म जींद जिले के 'उचाना' (उचाना कलां) में हुआ था।","facts":["उन्होंने अगस्त 2018 में जकार्ता (इंडोनेशिया) एशियाई खेलों में पुरुषों की 800 मीटर दौड़ (1:46.15 समय) में शानदार स्वर्ण पदक जीता था।","1982 के बाद यह पहला अवसर था जब भारत ने एशियाई खेलों में पुरुषों की 800 मीटर दौड़ में स्वर्ण पदक जीता।","उचाना कलां जींद जिले का एक प्रमुख उपमंडल, तहसील और विधानसभा क्षेत्र है।","जींद के अन्य प्रसिद्ध एथलीट/खिलाड़ी: युजवेंद्र चहल (क्रिकेट/शतरंज), अंशु मलिक (कुश्ती), सुमन कुंडू (कुश्ती), हरदीप सिंह (कुश्ती) और ओम प्रकाश (बास्केटबॉल)।","हरियाणा में एथलेटिक्स के अन्य बड़े नाम: नीरज चोपड़ा (पानीपत—ओलंपिक स्वर्ण व रजत), भीम सिंह (भिवानी) और कृष्णा पूनिया (हिसार)।"]},
  {"q":"शतरंज और क्रिकेट—दोनों खेलों में अंतर्राष्ट्रीय स्तर पर भारत का प्रतिनिधित्व करने वाले हरियाणा के एकमात्र खिलाड़ी कौन हैं?","opts":["युजवेंद्र चहल","वीरेंद्र सहवाग","राजिंदर गोयल","कपिल देव"],"a":0,"exp":"जींद शहर में जन्मे भारतीय लेग स्पिनर युजवेंद्र चहल (जन्म: 23 जुलाई 1990) शतरंज और क्रिकेट—दोनों खेलों में अंतर्राष्ट्रीय स्तर पर भारत का प्रतिनिधित्व करने वाले हरियाणा के एकमात्र खिलाड़ी हैं।","facts":["क्रिकेट में आने से पहले वे अंडर-12 राष्ट्रीय शतरंज चैंपियन रहे और वर्ल्ड यूथ चेस चैंपियनशिप (ग्रीस) में भारत का प्रतिनिधित्व किया।","वे अंतर्राष्ट्रीय टी-20 क्रिकेट (T20I) में 6 विकेट (6/25 इंग्लैंड के खिलाफ, 2017) लेने वाले पहले भारतीय गेंदबाज बने।","वे IPL के इतिहास में 200+ विकेट लेने वाले पहले और सर्वाधिक विकेट लेने वाले गेंदबाज हैं।","वे 2024 टी-20 विश्व कप विजेता भारतीय क्रिकेट टीम के सदस्य रहे हैं।","वे आयकर विभाग (Income Tax Department) में इंस्पेक्टर के पद पर भी कार्यरत हैं।"]},
  {"q":"रणजी ट्रॉफी के इतिहास में सर्वाधिक 637 विकेट लेने वाले महान स्पिनर 'राजिंदर गोयल' जींद के किस नगर से थे?","opts":["जींद शहर","सफीदों","नरवाना","जुलाना"],"a":2,"exp":"भारत के महान घरेलू बाएँ हाथ के स्पिन गेंदबाज राजिंदर गोयल (1942–2020) का जन्म जींद जिले के 'नरवाना' में हुआ था।","facts":["राजिंदर गोयल ने प्रथम श्रेणी क्रिकेट में कुल 750 विकेट और रणजी ट्रॉफी में रिकॉर्ड 637 विकेट लिए (वे हरियाणा रणजी टीम के दिग्गज गेंदबाज रहे)।","उन्हें BCCI द्वारा प्रतिष्ठित 'सी.के. नायडू लाइफटाइम अचीवमेंट अवार्ड' (2017) से सम्मानित किया गया था।","उन्हें भारतीय क्रिकेट में उन महान खिलाड़ियों में गिना जाता है जिन्हें शानदार घरेलू रिकॉर्ड के बावजूद टेस्ट क्रिकेट खेलने का अवसर नहीं मिला।","उनका निधन 21 जून 2020 को रोहतक में हुआ था।","हरियाणा ने कपिल देव की कप्तानी में 1990–91 में पहली बार रणजी ट्रॉफी खिताब जीता था।"]},
  {"q":"प्रसिद्ध बॉलीवुड एवं रंगमंच अभिनेता 'सीताराम पांचाल' (पान सिंह तोमर व पीपली लाइव फेम) का जन्म जींद के किस नगर में हुआ था?","opts":["उचाना","जुलाना","सफीदों","नरवाना"],"a":3,"exp":"चर्चित बॉलीवुड अभिनेता सीताराम पांचाल (1963–2017) का जन्म जींद जिले के 'नरवाना' में हुआ था।","facts":["उन्होंने नई दिल्ली के राष्ट्रीय नाट्य विद्यालय (NSD) से अभिनय का प्रशिक्षण लिया था।","उनकी प्रमुख फिल्में: 'बैंडिट क्वीन', 'पीपली लाइव', 'पान सिंह तोमर', 'द लीजेंड ऑफ भगत सिंह', 'स्लमडॉग मिलियनेयर' और 'जॉली एलएलबी 2'।","उनका निधन 10 अगस्त 2017 को मुंबई में कैंसर के कारण हुआ था।","अन्य जिलों के प्रसिद्ध बॉलीवुड अभिनेता: राजकुमार राव (गुरुग्राम), यशपाल शर्मा (हिसार), रणदीप हुड्डा व सुभाष घई (रोहतक), ओम पुरी (अंबाला) और सतीश कौशिक (महेंद्रगढ़)।","हरियाणा सरकार ने फिल्म निर्माण को बढ़ावा देने हेतु 'हरियाणा फिल्म एवं मनोरंजन नीति' लागू की है।"]},
  {"q":"2010 नई दिल्ली राष्ट्रमंडल खेलों में कांस्य पदक जीतने वाली महिला पहलवान 'सुमन कुंडू' जींद के किस गाँव से हैं?","opts":["निडानी","कालवा","मालवी","डूमरखां"],"a":1,"exp":"अंतर्राष्ट्रीय महिला पहलवान सुमन कुंडू का संबंध जींद जिले के सफीदों क्षेत्र के 'कालवा' गाँव से है।","facts":["सुमन कुंडू ने 2010 के नई दिल्ली राष्ट्रमंडल खेलों में महिलाओं के 63 किग्रा फ्रीस्टाइल कुश्ती वर्ग में कांस्य पदक जीता था।","2010 दिल्ली राष्ट्रमंडल खेलों में हरियाणा की महिला पहलवानों (गीता फोगाट—स्वर्ण, बबीता फोगाट—रजत, सुमन कुंडू—कांस्य, अलका तोमर—स्वर्ण) ने ऐतिहासिक प्रदर्शन किया था।","जींद की अन्य प्रसिद्ध महिला पहलवानों में अंशु मलिक (निडानी) और कविता दलाल (मालवी) शामिल हैं।","कालवा गाँव जींद जिले के सफीदों उपमंडल के अंतर्गत आता है।","हरियाणा की खेल नीति के तहत राष्ट्रमंडल खेलों के स्वर्ण पर 1.5 करोड़, रजत पर 75 लाख और कांस्य पदक पर 50 लाख रुपये दिए जाते हैं।"]},
  {"q":"रियो 2016 ओलंपियन ग्रीको-रोमन पहलवान 'हरदीप सिंह' (डहोला गाँव) और प्रसिद्ध बास्केटबॉल खिलाड़ी 'ओम प्रकाश' किस जिले से हैं?","opts":["जींद","रोहतक","भिवानी","सोनीपत"],"a":0,"exp":"ग्रीको-रोमन पहलवान हरदीप सिंह (डहोला गाँव, जींद) और प्रसिद्ध बास्केटबॉल खिलाड़ी ओम प्रकाश—दोनों जींद जिले से संबंधित हैं।","facts":["हरदीप सिंह ने 2016 के रियो ओलंपिक में 98 किग्रा ग्रीको-रोमन कुश्ती वर्ग में भारत का प्रतिनिधित्व किया था और 2016 एशियाई चैंपियनशिप (बैंकॉक) में रजत पदक जीता।","2016 रियो ओलंपिक में हरियाणा से दो ग्रीको-रोमन पहलवान—हरदीप सिंह (जींद, 98 किग्रा) और रविंद्र खत्री (झज्जर, 85 किग्रा)—शामिल हुए थे।","जींद के ओम प्रकाश ने राष्ट्रीय व अंतर्राष्ट्रीय स्तर पर बास्केटबॉल में हरियाणा का प्रतिनिधित्व किया।","जींद जिले में खेल प्रशिक्षण के लिए अर्जुन स्टेडियम, एकलव्य स्टेडियम और निडानी स्पोर्ट्स स्कूल प्रमुख केंद्र हैं।","देश के कुल ओलंपिक व राष्ट्रमंडल पदकों में हरियाणा के खिलाड़ियों की हिस्सेदारी लगभग 30% से अधिक रहती है।"]},
  {"q":"'बांगर के शेर' के नाम से प्रसिद्ध दिग्गज राजनेता व पूर्व केंद्रीय मंत्री 'चौधरी बीरेंद्र सिंह' जींद के किस गाँव से हैं?","opts":["बीबीपुर","हैबतपुर","डूमरखां","माखड़ी"],"a":2,"exp":"पूर्व केंद्रीय इस्पात व ग्रामीण विकास मंत्री चौधरी बीरेंद्र सिंह का जन्म जींद जिले के 'डूमरखां' (उचाना क्षेत्र) गाँव में हुआ था।","facts":["चौधरी बीरेंद्र सिंह महान किसान नेता 'दीनबंधु सर छोटूराम' के नाती (दोहते) हैं और उन्हें 'बांगर के शेर' के नाम से जाना जाता है।","वे उचाना कलां से पाँच बार विधायक, हरियाणा के वित्त व राजस्व मंत्री, लोकसभा सांसद (हिसार, 1984) और राज्यसभा सांसद व केंद्रीय कैबिनेट मंत्री (2014–2019) रहे।","उनकी पत्नी प्रेमलता (पूर्व विधायक, उचाना) और पुत्र बृजेंद्र सिंह (पूर्व सांसद, हिसार व पूर्व IAS) भी सक्रिय राजनीति में हैं।","जींद, कैथल और हिसार के मध्यवर्ती क्षेत्र को पारंपरिक रूप से 'बांगर क्षेत्र' कहा जाता है।","सर छोटूराम का जन्मस्थान गढ़ी सांपला (रोहतक) है।"]},
  {"q":"हरियाणा में 'महात्मा गांधी के सेवक' के रूप में प्रसिद्ध स्वतंत्रता सेनानी 'पंडित अमीलाल' का संबंध जींद के किस गाँव से था?","opts":["डूमरखां","हैबतपुर","बीबीपुर","माखड़ी (माखड़)"],"a":3,"exp":"स्वतंत्रता सेनानी पंडित अमीलाल का संबंध जींद जिले के 'माखड़ी' (माखड़) गाँव से था, जिन्हें हरियाणा में 'महात्मा गांधी का सेवक' कहा जाता है।","facts":["पंडित अमीलाल ने महात्मा गांधी के असहयोग, सविनय अवज्ञा और खादी प्रचार आंदोलनों में जींद क्षेत्र में सक्रिय भूमिका निभाई।","हरियाणा के अन्य उपनाम वाले स्वतंत्रता सेनानी: पंडित नेकीराम शर्मा ('हरियाणा केसरी'), पंडित श्रीराम शर्मा ('ओल्ड मैन ऑफ हरियाणा') और राय बहादुर लाला मुरलीधर ('ग्रैंड ओल्ड मैन ऑफ पंजाब')।","जींद जिला सार (2026): स्थापना 1 नवंबर 1966, क्षेत्रफल 2,702 वर्ग किमी, 4 उपमंडल, 6 तहसीलें, 1 उप-तहसील (पिल्लूखेड़ा), 8 ब्लॉक, 5 विधानसभा सीटें और सर्वाधिक 8 जिलों से सीमा।","हरियाणा अपडेटेड सार (2026): 23 जिले (23वाँ—हांसी, 22 दिसंबर 2025), 6 प्रशासनिक मंडल (हिसार व रोहतक मंडल में 5-5 जिले), 5 पुलिस रेंज, 5 पुलिस कमिश्नरेट (गुरुग्राम, फरीदाबाद, पंचकूला, सोनीपत, झज्जर) और 24 पुलिस जिले।","हरियाणा में कुल 11 नगर निगम, 90 विधानसभा सीटें (17 SC), 10 लोकसभा सीटें (2 SC: अंबाला व सिरसा) और 5 राज्यसभा सीटें हैं।"]}

let order = QUESTIONS.map((_, i) => i), pos = 0, answers = {};
const $ = id => document.getElementById(id);

$('totalPill').textContent = `${QUESTIONS.length} यूनिक प्रश्न`;

function render() {
  const idx = order[pos], q = QUESTIONS[idx], chosen = answers[idx];
  $('counter').textContent = `प्रश्न ${pos + 1} / ${order.length}`;
  $('qno').textContent = `प्रश्न ${idx + 1}`;
  $('question').textContent = q.q;
  $('options').innerHTML = '';

  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'option';
    b.disabled = chosen !== undefined;

    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = 'ABCD'[i];

    const txt = document.createElement('span');
    txt.textContent = o;

    b.append(letter, txt);
    if (chosen !== undefined) {
      if (i === q.a) b.classList.add('correct');
      else if (i === chosen) b.classList.add('wrong');
    }
    b.onclick = () => {
      if (answers[idx] !== undefined) return;
      answers[idx] = i;
      render();
    };
    $('options').appendChild(b);
  });

  const fb = $('feedback');
  if (chosen !== undefined) {
    fb.className = 'feedback ' + (chosen === q.a ? 'good' : 'bad');
    fb.innerHTML = '';

    const status = document.createElement('strong');
    status.textContent = chosen === q.a ? '✓ बिल्कुल सही उत्तर!' : '✗ आपका उत्तर गलत है';

    const ansDiv = document.createElement('div');
    ansDiv.innerHTML = '<b>सही उत्तर: </b>';
    const ansSpan = document.createElement('span');
    ansSpan.textContent = q.opts[q.a];
    ansDiv.appendChild(ansSpan);

    const expDiv = document.createElement('div');
    expDiv.style.marginTop = '7px';
    expDiv.innerHTML = '<b>विस्तृत व्याख्या: </b>';
    const expSpan = document.createElement('span');
    expSpan.textContent = q.exp;
    expDiv.appendChild(expSpan);

    fb.append(status, ansDiv, expDiv);

    if (Array.isArray(q.facts) && q.facts.length > 0) {
      const box = document.createElement('div');
      box.className = 'facts-box';

      const title = document.createElement('div');
      title.className = 'facts-title';
      title.textContent = '📌 परीक्षा उपयोगी अतिरिक्त तथ्य (Updated 2026):';

      const ul = document.createElement('ul');
      ul.className = 'facts-list';
      q.facts.forEach(fact => {
        const li = document.createElement('li');
        li.textContent = fact;
        ul.appendChild(li);
      });

      box.append(title, ul);
      fb.appendChild(box);
    }
  } else {
    fb.className = 'feedback hidden';
    fb.textContent = '';
  }

  $('prev').disabled = pos === 0;
  $('next').textContent = pos === order.length - 1 ? 'परिणाम देखें' : 'अगला प्रश्न';

  const done = Object.keys(answers).length;
  $('answered').textContent = `हल किए: ${done} / ${QUESTIONS.length}`;
  $('bar').style.width = (done / QUESTIONS.length * 100) + '%';
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
}

function showResult() {
  const right = QUESTIONS.filter((q, i) => answers[i] === q.a).length;
  const done = Object.keys(answers).length;
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('score').textContent = `${right} / ${QUESTIONS.length}`;
  $('summary').textContent = `आपने ${done} प्रश्न हल किए। सही: ${right}, गलत: ${done - right}, छोड़े: ${QUESTIONS.length - done}। प्रतिशत: ${(right / QUESTIONS.length * 100).toFixed(1)}%`;
}

$('prev').onclick = () => { if (pos > 0) { pos--; render(); window.scrollTo(0, 0); } };
$('next').onclick = () => { if (pos < order.length - 1) { pos++; render(); window.scrollTo(0, 0); } else showResult(); };
$('restart').onclick = () => { answers = {}; pos = 0; render(); window.scrollTo(0, 0); };
$('review').onclick = () => { pos = 0; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

render();
</script>
