<!doctype html>
<html lang="hi">
<head>

<title>करनाल जिला GK Quiz (Updated 2026) | HSSC Mock Test Wala</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#142238;--muted:#637083;--blue:#174a82;--line:#dce4ee;--green:#16834a;--red:#c33434}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;line-height:1.58}
.wrap{max-width:850px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#12345a,#2872a8);color:#fff;border-radius:18px;padding:22px 18px;margin:4px 0 14px;text-align:center}
.hero h1{margin:0 0 6px;font-size:25px}
.hero p{margin:0;color:#e6f1ff;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.pill{background:#ffffff20;border:1px solid #ffffff45;padding:6px 10px;border-radius:20px;font-size:12.5px}
.toolbar,.panel,.question{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.progress{height:8px;background:#e6edf5;border-radius:10px;overflow:hidden;flex:1;min-width:120px}
.bar{height:100%;background:#26966a;width:0;transition:width .2s}
.small{font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}
.btn-light{background:#eaf0f7;color:#183654}
button:disabled{opacity:.45;cursor:not-allowed}
.question{padding:17px;box-shadow:0 2px 8px #12345a10}
.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.qtext{font-size:18.5px;font-weight:700;margin:12px 0}
.option{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:8px 0;padding:12px;border-radius:11px;font-weight:500;font-size:15.5px}
.option .letter{flex:0 0 27px;height:27px;border-radius:50%;background:#edf2f8;display:grid;place-items:center;font-weight:700;color:#25496d}
.option.correct{border:2px solid var(--green);background:#eaf8ef}
.option.wrong{border:2px solid var(--red);background:#fff0f0}
.option:disabled{cursor:default;opacity:1}
.feedback{margin-top:13px;padding:14px;border-radius:12px;background:#edf3fa;border-left:4px solid var(--blue)}
.feedback.good{background:#eaf8ef;border-color:var(--green)}
.feedback.bad{background:#fff0f0;border-color:var(--red)}
.feedback strong{display:block;margin-bottom:5px;font-size:16px}
.facts-box{margin-top:12px;padding:11px 13px;background:#ffffffc7;border:1px solid #d5e0ec;border-radius:10px}
.facts-title{font-weight:700;color:var(--blue);font-size:14.5px;margin-bottom:6px}
.facts-list{margin:0;padding-left:18px;font-size:14px;color:#1e293b}
.facts-list li{margin-bottom:5px;line-height:1.55}
.facts-list li:last-child{margin-bottom:0}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.actions button{flex:1}
.hidden{display:none!important}
.result{text-align:center;padding:20px}
.score{font-size:40px;font-weight:800;color:var(--blue)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:520px){
  .wrap{padding:10px}
  .hero h1{font-size:21px}
  .qtext{font-size:17px}
  .question{padding:13px}
  .facts-list{font-size:13.5px}
}
</style>
</head>

    <div class="stats">
      <span class="pill" id="totalPill">76 यूनिक प्रश्न</span>
      <span class="pill">2026 अपडेटेड डेटा</span>

  <section class="panel result hidden" id="result">
    <h2>आपका परिणाम</h2>
    <div class="score" id="score"></div>

    <button id="review">प्रश्नों की समीक्षा करें</button>

  <div class="footer">HSSC Mock Test Wala • करनाल जिला GK (2026 Updated)</div>
</main>

<script>
const QUESTIONS = [
  {"q":"करनाल जिले की स्थापना कब हुई थी?","opts":["23 जनवरी 1973","1 नवंबर 1966","1 नवंबर 1989","15 जुलाई 1997"],"a":1,"exp":"करनाल 1 नवंबर 1966 को हरियाणा राज्य के गठन के समय बने मूल 7 जिलों में से एक है।","facts":["1 नवंबर 1966 को बने 7 मूल जिले: करनाल, हिसार, रोहतक, अंबाला, गुरुग्राम, जींद और महेंद्रगढ़।","करनाल से ही अलग करके कुरुक्षेत्र (1973), कैथल (1989) और पानीपत (1989) जिले बनाए गए।","वर्तमान (2026) में हरियाणा में कुल 23 जिले हैं; 22 दिसंबर 2025 को 'हांसी' राज्य का 23वाँ जिला अधिसूचित किया गया।","करनाल स्वयं एक प्रशासनिक मंडल (फरवरी 2017 में गठित) और पुलिस रेंज का मुख्यालय है।","करनाल के प्रमुख वाहन पंजीकरण कोड HR-05 (करनाल), HR-40 (असंध), HR-75 (इंद्री) और HR-91 (घरौंडा) हैं।"]},
  {"q":"महाभारत कालीन मान्यता के अनुसार करनाल शहर की स्थापना किसने की थी?","opts":["दानवीर कर्ण","राजा युधिष्ठिर","राजा परीक्षित","गुरु द्रोणाचार्य"],"a":0,"exp":"पौराणिक मान्यता के अनुसार करनाल शहर की स्थापना महाभारत के महान योद्धा दानवीर राजा कर्ण ने की थी।","facts":["राजा कर्ण के नाम पर ही इसका प्राचीन नाम 'कर्ण नगरी' (कर्णालय) पड़ा, जो बाद में करनाल हो गया।","करनाल से दानवीर कर्ण व भगवान सूर्य की प्राचीन मूर्तियाँ भी प्राप्त हुई हैं।","करनाल शहर के निकट उचाना में प्रसिद्ध 'कर्ण झील' तथा शहर में 'कर्ण स्टेडियम' व 'कर्ण पार्क' स्थित हैं।","अन्य जिलों के संस्थापक: कैथल (राजा युधिष्ठिर), जींद (पांडव/जयंती देवी) और गुरुग्राम (गुरु द्रोणाचार्य)।","करनाल शहर का पिन कोड 132001 है।"]},
  {"q":"निम्नलिखित में से किस जिले को 'पेरिस ऑफ हरियाणा', 'धान का कटोरा' और 'एग्रो हब' कहा जाता है?","opts":["कुरुक्षेत्र","कैथल","करनाल","पानीपत"],"a":2,"exp":"स्वच्छ व योजनाबद्ध शहरीकरण, विशाल बासमती उत्पादन और कृषि शोध संस्थानों के कारण करनाल को 'पेरिस ऑफ हरियाणा', 'धान का कटोरा', 'एग्रो हब' और 'आधुनिक नगरी' कहा जाता है।","facts":["करनाल को हरियाणा का 'नवीनतम पद्धति से बसाया गया शहर' भी कहा जाता है।","संयुक्त रूप से हरियाणा के चार जिलों—करनाल, कैथल, कुरुक्षेत्र और जींद—को 'धान का कटोरा' कहा जाता है।","भारत सरकार के स्मार्ट सिटी मिशन में शामिल हरियाणा के दो शहरों में 'करनाल' और 'फरीदाबाद' शामिल हैं।","अन्य जिलों के उपनाम: गुरुग्राम (साइबर सिटी), हिसार (स्टील सिटी), पानीपत (बुनकर नगरी) और अंबाला (साइंटिफिक सिटी)।","करनाल में राष्ट्रीय स्तर के कृषि व डेयरी शोध संस्थान (NDRI, CSSRI, IIWBR, NBAGR) स्थित हैं।"]},
  {"q":"करनाल जिले का कुल क्षेत्रफल कितना है?","opts":["2,317 वर्ग किमी","2,702 वर्ग किमी","1,834 वर्ग किमी","2,520 वर्ग किमी"],"a":3,"exp":"आधिकारिक जिला रिकॉर्ड के अनुसार करनाल जिले का कुल क्षेत्रफल 2,520 वर्ग किलोमीटर है।","facts":["हरियाणा का कुल क्षेत्रफल 44,212 वर्ग किमी है; करनाल इसका लगभग 5.70% हिस्सा कवर करता है।","वर्तमान (2026) में क्षेत्रफल के अनुसार हरियाणा का सबसे बड़ा जिला सिरसा (4,277 वर्ग किमी) और सबसे छोटा फरीदाबाद (741 वर्ग किमी) है।","करनाल हरियाणा के मध्य-पूर्वी भाग में उपजाऊ जलोढ़ (खादर व बांगर) मैदानी क्षेत्र में स्थित है।","जिले की पूर्वी सीमा पर राज्य की एकमात्र बारहमासी नदी 'यमुना' प्रवाहित होती है।","करनाल की जलवायु उपोष्ण मानसूनी है और यहाँ गेहूँ, बासमती धान व गन्ने की बंपर पैदावार होती है।"]},
  {"q":"भौगोलिक स्थिति के अनुसार करनाल जिले के पूर्व में किस राज्य की सीमा लगती है?","opts":["पंजाब","उत्तर प्रदेश","उत्तराखंड","हिमाचल प्रदेश"],"a":1,"exp":"करनाल जिले की पूर्वी सीमा यमुना नदी के पार उत्तर प्रदेश (शामली व सहारनपुर जिलों) से लगती है।","facts":["करनाल की भौगोलिक सीमाएँ: पूर्व में उत्तर प्रदेश, उत्तर में कुरुक्षेत्र, उत्तर-पूर्व में यमुनानगर, पश्चिम में कैथल और दक्षिण में जींद व पानीपत जिले हैं।","हरियाणा के कुल 7 जिले उत्तर प्रदेश की सीमा को स्पर्श करते हैं: यमुनानगर, करनाल, पानीपत, सोनीपत, फरीदाबाद, पलवल और नूंह।","यमुना नदी हरियाणा और उत्तर प्रदेश के बीच लगभग 320 किमी की प्राकृतिक पूर्वी सीमा बनाती है।","करनाल जिले से होकर देश का प्रमुख राष्ट्रीय राजमार्ग NH-44 (पुराना NH-1 / ग्रैंड ट्रंक रोड) गुजरता है।","करनाल रेलवे स्टेशन उत्तर रेलवे (दिल्ली मंडल) की व्यस्ततम दिल्ली–अंबाला–अमृतसर मुख्य रेल लाइन पर स्थित है।"]},
  {"q":"2011 की जनगणना के अनुसार करनाल जिले की जनसंख्या और लिंगानुपात क्रमशः कितना था?","opts":["15,05,324 और 887","10,72,861 और 881","13,34,152 और 871","18,09,733 और 873"],"a":0,"exp":"2011 की जनगणना के आधिकारिक आंकड़ों के अनुसार करनाल जिले की जनसंख्या 15,05,324 और लिंगानुपात 887 महिलाएँ प्रति 1,000 पुरुष था।","facts":["2011 की जनगणना के अनुसार करनाल जिले की साक्षरता दर 74.73% थी (पुरुष: 81.82%, महिला: 66.82%)।","2011 में करनाल का जनसंख्या घनत्व 597 व्यक्ति प्रति वर्ग किमी और दशकीय वृद्धि दर (2001–2011) 18.14% थी।","जिले की लगभग 69.8% आबादी ग्रामीण और 30.2% आबादी शहरी क्षेत्रों में निवास करती है।","2011 में संपूर्ण हरियाणा का औसत लिंगानुपात 879 और औसत साक्षरता दर 75.55% थी।","करनाल शहर में वर्ष 2010 में स्थापित 'नगर निगम करनाल' कार्यरत है।"]},
  {"q":"करनाल जिले में कुल कितनी तहसीलें और कितनी उप-तहसीलें हैं?","opts":["4 तहसीलें और 2 उप-तहसीलें","6 तहसीलें और 1 उप-तहसील","5 तहसीलें और 3 उप-तहसीलें","3 तहसीलें और 4 उप-तहसीलें"],"a":2,"exp":"जिला प्रशासन के अनुसार करनाल जिले में 5 तहसीलें (करनाल, इंद्री, असंध, घरौंडा, नीलोखेड़ी) और 3 उप-तहसीलें (निसिंग, निगदू, बल्ला) हैं।","facts":["करनाल जिले में 4 उपमंडल हैं: करनाल, असंध, घरौंडा और इंद्री।","जिले में 8 विकास खंड (Blocks) हैं: करनाल, इंद्री, नीलोखेड़ी, निसिंग, घरौंडा, असंध, कुंजपुरा और मुनक।","करनाल जिला प्रशासनिक रूप से 'करनाल मंडल' (करनाल, पानीपत और कैथल—3 जिले) का मुख्यालय है।","फरवरी 2017 में करनाल और फरीदाबाद को दो नए प्रशासनिक मंडल बनाए जाने से हरियाणा में मंडलों की संख्या 6 हो गई थी।","करनाल 'करनाल पुलिस रेंज' (करनाल, पानीपत और कैथल) का मुख्यालय भी है।"]},
  {"q":"निम्नलिखित में से कौन-सा विकल्प करनाल जिले की तीन उप-तहसीलों को दर्शाता है?","opts":["राजौंद, सीवन, ढांड","पिल्लूखेड़ा, उकलाना, बालसमंद","साहा, शहजादपुर, मुलाना","निसिंग, निगदू, बल्ला"],"a":3,"exp":"निसिंग, निगदू और बल्ला—ये तीनों करनाल जिले की उप-तहसीलें हैं।","facts":["अन्य विकल्पों में राजौंद, सीवन व ढांड कैथल में; साहा, शहजादपुर व मुलाना अंबाला में; और उकलाना व बालसमंद हिसार जिले में हैं।","करनाल जिले के प्रमुख नगर व कस्बे: करनाल, नीलोखेड़ी, तरावड़ी, इंद्री, असंध, घरौंडा और निसिंग हैं।","शहरी निकायों में 'नगर निगम करनाल' तथा तरावड़ी, नीलोखेड़ी, घरौंडा, इंद्री, असंध और निसिंग में नगरपालिका समितियाँ कार्यरत हैं।","वर्तमान (2026) में पूरे हरियाणा में कुल 11 नगर निगम हैं।","उप-तहसील स्तर पर राजस्व कार्यों की देखरेख नायब तहसीलदार करता है।"]},
  {"q":"करनाल जिले में कुल कितनी विधानसभा सीटें हैं और इनमें से कौन-सी अनुसूचित जाति (SC) के लिए आरक्षित है?","opts":["4 सीटें — इंद्री (SC)","5 सीटें — नीलोखेड़ी (SC)","6 सीटें — घरौंडा (SC)","3 सीटें — असंध (SC)"],"a":1,"exp":"करनाल जिले में कुल 5 विधानसभा सीटें हैं—नीलोखेड़ी SC (19), इंद्री (20), करनाल (21), घरौंडा (22) और असंध (23)।","facts":["नीलोखेड़ी (क्रमांक 19) करनाल जिले की एकमात्र अनुसूचित जाति (SC) आरक्षित विधानसभा सीट है।","2024 के 15वें हरियाणा विधानसभा चुनाव में करनाल जिले की सभी 5 सीटों पर भारतीय जनता पार्टी (BJP) ने क्लीन स्वीप कर जीत दर्ज की।","करनाल की पाँचों विधानसभा सीटें और पानीपत की 4 सीटें मिलकर कुल 9 सीटें 'करनाल लोकसभा निर्वाचन क्षेत्र' बनाती हैं।","हरियाणा विधानसभा में कुल 90 सीटें हैं, जिनमें से 17 सीटें अनुसूचित जाति (SC) के लिए आरक्षित हैं।","2026 में सर्वाधिक विधानसभा सीटें (6-6) फरीदाबाद और सोनीपत जिलों में हैं।"]},
  {"q":"2024 के विधानसभा चुनाव में करनाल जिले की किस सीट से निर्वाचित विधायक 'हरविन्द्र कल्याण' 15वीं हरियाणा विधानसभा के अध्यक्ष (Speaker) बने?","opts":["घरौंडा","करनाल","इंद्री","असंध"],"a":0,"exp":"घरौंडा विधानसभा सीट से लगातार तीसरी बार (2014, 2019, 2024) निर्वाचित भाजपा के हरविन्द्र कल्याण को 15वीं हरियाणा विधानसभा का अध्यक्ष (Speaker) चुना गया।","facts":["अक्टूबर 2024 में सर्वसम्मति से चुने गए हरविन्द्र कल्याण के साथ जींद के विधायक डॉ. कृष्ण लाल मिड्ढा को उपाध्यक्ष (Deputy Speaker) बनाया गया।", "2024 में करनाल जिले की अन्य 4 सीटों के निर्वाचित भाजपा विधायक: करनाल (जगमोहन आनंद), नीलोखेड़ी SC (भगवान दास कबीरपंथी), इंद्री (राम कुमार कश्यप) और असंध (योगेंद्र सिंह राणा)।","मई 2024 के करनाल विधानसभा उपचुनाव में मुख्यमंत्री नायब सिंह सैनी करनाल से विधायक चुने गए थे (अक्टूबर 2024 में वे लाडवा से विधायक बने)।","इससे पूर्व मनोहर लाल खट्टर 2014 व 2019 में करनाल से विधायक और 9.5 वर्ष तक हरियाणा के मुख्यमंत्री रहे।","2024 में भाजपा ने 48 सीटें जीतकर लगातार तीसरी बार हरियाणा में सरकार बनाई।"]},
  {"q":"2024 के लोकसभा चुनाव में 'करनाल' संसदीय क्षेत्र से कौन सांसद निर्वाचित हुए जिन्हें केंद्र में कैबिनेट मंत्री बनाया गया?","opts":["संजय भाटिया","दिव्यांशु बुद्धिराजा","मनोहर लाल खट्टर","नायब सिंह सैनी"],"a":2,"exp":"2024 के 18वें लोकसभा चुनाव में हरियाणा के पूर्व मुख्यमंत्री मनोहर लाल खट्टर (BJP) करनाल लोकसभा सीट से सांसद निर्वाचित हुए।","facts":["मनोहर लाल खट्टर ने कांग्रेस के दिव्यांशु बुद्धिराजा को 2.32 लाख से अधिक मतों से पराजित किया।","जून 2024 में गठित केंद्रीय मंत्रिमंडल (मोदी 3.0) में उन्हें भारत का 'ऊर्जा मंत्री' (Power) तथा 'आवास एवं शहरी कार्य मंत्री' (Housing & Urban Affairs) बनाया गया।","इससे पूर्व 2019 के लोकसभा चुनाव में भाजपा के संजय भाटिया करनाल से सांसद चुने गए थे।","2024 में हरियाणा की कुल 10 लोकसभा सीटों में से 5 भाजपा और 5 कांग्रेस ने जीतीं।","हरियाणा से मोदी 3.0 मंत्रिमंडल में 3 मंत्री शामिल हुए: मनोहर लाल (कैबिनेट), राव इंद्रजीत सिंह (गुरुग्राम) और कृष्ण पाल गुर्जर (फरीदाबाद)।"]},
  {"q":"करनाल के तरावड़ी (तराइन) के मैदान में 1191 और 1192 ईस्वी में किन दो शासकों के बीच ऐतिहासिक युद्ध हुए थे?","opts":["बाबर और इब्राहिम लोदी","अकबर और हेमू","नादिरशाह और मुहम्मद शाह","पृथ्वीराज चौहान और मोहम्मद गौरी"],"a":3,"exp":"करनाल के तरावड़ी (प्राचीन तराइन) में 1191 ई. में तराइन का प्रथम युद्ध (पृथ्वीराज चौहान विजयी) और 1192 ई. में तराइन का द्वितीय युद्ध (मोहम्मद गौरी विजयी) हुआ था।","facts":["तराइन के द्वितीय युद्ध (1192 ई.) को भारतीय इतिहास का निर्णायक मोड़ माना जाता है, जिसके बाद भारत में तुर्की (दिल्ली सल्तनत) शासन की नींव पड़ी।","तरावड़ी का नामकरण मुगल बादशाह औरंगजेब के पुत्र 'आजम' के जन्म के कारण पहले 'आजमाबाद' रखा गया था, जो बदलते-बदलते 'तरावड़ी' हो गया।","तरावड़ी में ही प्रसिद्ध 'परासर का मेला' लगता है और यह विश्व की सर्वोत्तम गुणवत्ता वाले 'तरावड़ी बासमती चावल' के लिए विख्यात है।","भारतीय तेज गेंदबाज नवदीप सैनी ('तरावड़ी/करनाल एक्सप्रेस') का संबंध भी तरावड़ी से है।","पानीपत के तीनों युद्ध (1526, 1556, 1761) पड़ोसी पानीपत जिले में लड़े गए थे।"]},
  {"q":"24 फरवरी 1739 को लड़े गए प्रसिद्ध 'करनाल के युद्ध' में ईरान के शासक नादिरशाह ने किस मुगल बादशाह को पराजित किया था?","opts":["औरंगजेब","मुहम्मद शाह (रंगीला)","शाह आलम द्वितीय","बहादुरशाह जफर"],"a":1,"exp":"24 फरवरी 1739 को हुए करनाल के युद्ध में ईरान के शासक नादिरशाह ने मुगल बादशाह मुहम्मद शाह (रंगीला) को पराजित किया था।","facts":["इस युद्ध में नादिरशाह के विरुद्ध रेवाड़ी के राव बालकिशन ने मुगल बादशाह मुहम्मद शाह की ओर से वीरतापूर्वक लड़ते हुए प्राण न्योछावर किए थे।","विजय के बाद नादिरशाह दिल्ली से शाहजहाँ द्वारा बनवाया गया 'मयूर सिंहासन' (तख्त-ए-ताऊस) और विश्व प्रसिद्ध 'कोहिनूर हीरा' लूटकर ईरान ले गया।","मुहम्मद शाह (रंगीला) मयूर सिंहासन पर बैठने वाला अंतिम मुगल बादशाह था।","नादिरशाह को इतिहास में 'ईरान का नेपोलियन' भी कहा जाता है।","इस युद्ध ने मुगल साम्राज्य की जड़ें पूरी तरह हिला दी थीं।"]},
  {"q":"करनाल के ऐतिहासिक 'करनाल किले' का निर्माण वर्ष 1764 ईस्वी में किस शासक ने करवाया था?","opts":["राजा गजपत सिंह","निजाबत खान","जॉर्ज थॉमस","फिरोजशाह तुगलक"],"a":0,"exp":"जींद रियासत के संस्थापक राजा गजपत सिंह ने 1763 में करनाल पर अधिकार करने के बाद वर्ष 1764 ईस्वी में करनाल के किले का निर्माण करवाया था।","facts":["1785 में मराठों ने करनाल पर अधिकार किया, 1795 में जॉर्ज थॉमस को यह क्षेत्र मिला और बीच में लाडवा के राजा गुरदित सिंह ने भी इस पर कब्जा किया था।","1805 में अंग्रेजों ने करनाल पर अधिकार कर इसे ब्रिटिश छावनी में बदल दिया और इस किले में काबुल के पूर्व अमीर 'दोस्त मोहम्मद खान' को कुछ समय के लिए रखा गया था।","राजा गजपत सिंह ने बाद में 1775 ई. में जींद का किला भी बनवाया था।","करनाल जिले की 'कुंजपुरा रियासत' की स्थापना 1729 ई. में पठान शासक निजाबत खान ने की थी।","हरियाणा में अन्य प्रसिद्ध किले: असीगढ़ किला (हांसी), लोहारू किला (भिवानी) और भाई उदय सिंह का किला (कैथल)।"]},
  {"q":"करनाल जिले की ऐतिहासिक 'कुंजपुरा रियासत' की स्थापना 1729 ईस्वी में किस पठान शासक ने की थी?","opts":["अहमद शाह अब्दाली","दोस्त मोहम्मद खान","निजाबत खान","फौजदार खान"],"a":2,"exp":"कुंजपुरा रियासत (करनाल) की स्थापना वर्ष 1729 ईस्वी में पठान सरदार निजाबत खान द्वारा की गई थी।","facts":["कुंजपुरा निजाबत खान की राजधानी रहा; 1760 में पानीपत के तीसरे युद्ध से पहले मराठा सेनापति सदाशिवराव भाऊ ने कुंजपुरा किले पर अधिकार किया था।","वर्ष 1961 में इसी ऐतिहासिक कुंजपुरा गाँव में हरियाणा का पहला 'सैनिक स्कूल' (Sainik School Kunjpura) स्थापित किया गया।","वर्तमान में कुंजपुरा करनाल जिले का एक विकास खंड (Block) है।","अन्य रियासतों के संस्थापक: जींद (राजा गजपत सिंह, 1763), कैथल (भाई गुरबख्श सिंह) और बल्लभगढ़ (गोपाल सिंह)।","कुंजपुरा करनाल शहर से लगभग 10 किमी पूर्व में यमुना नदी की ओर स्थित है।"]},
  {"q":"महाभारत काल में अभिमन्यु के पुत्र राजा 'परीक्षित' ने करनाल जिले के किस ऐतिहासिक कस्बे को अपनी राजधानी बनाया था?","opts":["इंद्री","घरौंडा","नीलोखेड़ी","असंध"],"a":3,"exp":"पौराणिक एवं ऐतिहासिक विवरणों के अनुसार पांडव वंशज राजा परीक्षित (अभिमन्यु के पुत्र) ने करनाल जिले के 'असंध' (प्राचीन असंदिवत) को अपनी राजधानी बनाया था।","facts":["असंध में ही हरियाणा का प्रसिद्ध 'कुषाणकालीन बौद्ध स्तूप' स्थित है, जिसे स्थानीय रूप से 'जरासंध का टीला' कहा जाता है।","असंध का यह कुषाण स्तूप भारतीय पुरातत्व सर्वेक्षण (ASI) द्वारा संरक्षित है।","राजा परीक्षित की मृत्यु के बाद उनके पुत्र जनमेजय ने पड़ोसी सफीदों (सर्पदमन, जींद) में सर्पयज्ञ किया था।","असंध वर्तमान में करनाल जिले का एक उपमंडल (HR-40), तहसील, ब्लॉक और विधानसभा क्षेत्र है।","असंध क्षेत्र के पपहाना गाँव में प्रतिवर्ष प्रसिद्ध 'पांडु मेला' लगता है।"]},
  {"q":"हरियाणा में प्रसिद्ध 'कुषाणकालीन बौद्ध स्तूप' करनाल जिले के किस स्थान पर स्थित है?","opts":["तरावड़ी","असंध","कुंजपुरा","घरौंडा"],"a":1,"exp":"करनाल जिले के असंध में पकी ईंटों से निर्मित प्रसिद्ध कुषाणकालीन बौद्ध स्तूप (जरासंध का टीला) स्थित है।","facts":["यह हरियाणा के सबसे बड़े सुरक्षित प्राचीन बौद्ध स्तूपों में गिना जाता है, जिसकी ऊँचाई लगभग 25 मीटर के आसपास रही है।","इसके अलावा यमुनानगर के चनेटी में मौर्य/शुंगकालीन स्तूप और हिसार के अग्रोहा व कुरुक्षेत्र के थानेसर में प्राचीन बौद्ध स्तूपों के अवशेष मिले हैं।","करनाल जिले से प्राचीन 'खरोष्ठी लिपि' में अंकित अभिलेख तथा दानवीर कर्ण व सूर्य देव की मूर्तियाँ भी प्राप्त हुई हैं।","खरोष्ठी लिपि दाएँ से बाएँ की ओर लिखी जाती थी और इसका प्रयोग प्राचीन उत्तर-पश्चिम भारत में होता था।","असंध से 2024 के विधानसभा चुनाव में भाजपा के योगेंद्र सिंह राणा विधायक चुने गए।"]},
  {"q":"अंग्रेजों द्वारा हरियाणा में पहली ब्रिटिश सैन्य छावनी करनाल में स्थापित की गई थी, जिसे मलेरिया महामारी के कारण 1843 में कहाँ स्थानांतरित किया गया?","opts":["अंबाला कैंट","हिसार कैंट","रोहतक","रेवाड़ी"],"a":0,"exp":"अंग्रेजों ने करनाल को 1805–1841 के दौर में प्रमुख सैन्य छावनी बनाया था, लेकिन भयंकर मलेरिया महामारी फैलने के कारण वर्ष 1843 में इसे 'अंबाला छावनी' स्थानांतरित कर दिया गया।","facts":["करनाल में उस ब्रिटिश छावनी काल के अवशेष आज भी 'सेंट जेम्स चर्च टॉवर' (छावनी चर्च), 'यूरोपीय कब्रिस्तान', 'ऑक्टरलोनी हाउस' और 'एडम हाउस' के रूप में मौजूद हैं।","अंबाला छावनी से ही 10 मई 1857 को हरियाणा में 1857 की क्रांति की शुरुआत हुई थी।","करनाल में स्थित 'छावनी चर्च' (सेंट जेम्स चर्च) लगभग 100 फीट ऊँचा है, जिसके शीर्ष पर धातु का क्रॉस लगा है।","हिसार सैन्य छावनी की स्थापना आजादी के बाद 15 नवंबर 1982 को हुई थी।","करनाल के विक्टोरिया मेमोरियल हॉल का नाम महात्मा गांधी की हत्या के बाद शोक सभा होने पर 'गांधी मेमोरियल हॉल' कर दिया गया था।"]},
  {"q":"करनाल के किस ऐतिहासिक हॉल में महात्मा गांधी की हत्या के बाद विशाल शोक सभा हुई थी, जिसके कारण उसका नाम 'गांधी मेमोरियल हॉल' रखा गया?","opts":["ऑक्टरलोनी हाउस","एडम हाउस","विक्टोरिया मेमोरियल हॉल","कर्ण महल"],"a":2,"exp":"करनाल में स्थित औपनिवेशिक कालीन 'विक्टोरिया मेमोरियल हॉल' में 1948 में महात्मा गांधी की शहादत पर शोक सभा आयोजित की गई थी, जिसके बाद इसका नाम 'गांधी मेमोरियल हॉल' हो गया।","facts":["यह भव्य ऐतिहासिक भवन ब्रिटिश काल में महारानी विक्टोरिया की स्मृति में बनवाया गया था।","करनाल में ब्रिटिश काल के अन्य प्रमुख भवन: ऑक्टरलोनी हाउस, एडम हाउस, सेंट जेम्स चर्च (छावनी चर्च टॉवर) और यूरोपीय कब्रिस्तान।","महात्मा गांधी को हरियाणा में दो बार गिरफ्तार किया गया था—10 अप्रैल 1919 को पलवल से और 30 जुलाई 1919 को हिसार से।","करनाल शहर के मध्य स्थित यह हॉल आज भी शहर की ऐतिहासिक पहचान है।","हरियाणा में 'यूरोपियन सेमेट्री' अंबाला कैंट (बोअर युद्धबंदियों से जुड़ी) और करनाल—दोनों स्थानों पर स्थित हैं।"]},
  {"q":"करनाल के घरौंडा में स्थित ऐतिहासिक 'मामा-भांजा सराय' का निर्माण किस मुगल बादशाह के शासनकाल में हुआ था?","opts":["अकबर","जहाँगीर","औरंगजेब","शाहजहाँ"],"a":3,"exp":"करनाल जिले के घरौंडा कस्बे में जीटी रोड पर स्थित प्रसिद्ध 'मामा-भांजा सराय' (घरौंडा की सराय) का निर्माण मुगल सम्राट शाहजहाँ के शासनकाल में हुआ था।","facts":["मुगल काल में शाही यात्रियों, सैनिकों और व्यापारियों के ठहरने हेतु ग्रैंड ट्रंक रोड (NH-44) पर सराय और कोस मीनारें बनवाई गई थीं।","करनाल में इसके अतिरिक्त मुगलकालीन 'बादशाही पुल' और 'मुगल पुल' (मधुबन/घरौंडा के निकट) भी प्रमुख ऐतिहासिक निर्माण हैं।","फरीदाबाद में मुगलकालीन 'सराय ख्वाजा' और गुरुग्राम में 'सराय अलीवर्दी' प्रसिद्ध हैं।","घरौंडा की सराय के दो विशाल प्रवेश द्वार (उत्तरी व दक्षिणी गेट) आज भी ASI द्वारा संरक्षित हैं।","घरौंडा में ही इंडो-इज़राइल सहयोग से 2011 में स्थापित 'सब्जी उत्कृष्टता केंद्र' स्थित है।"]},
  {"q":"करनाल के उचाना के पास 17 एकड़ में फैली 'कर्ण झील' (जिसे चक्रवर्ती झील भी कहते हैं) का पुनर्निर्माण हरियाणा सरकार ने किस वर्ष करवाया था?","opts":["1966","1972","1980","1991"],"a":1,"exp":"करनाल के उचाना (NH-44 पर) के निकट स्थित 17 एकड़ की प्रसिद्ध कर्ण झील (चक्रवर्ती झील) का निर्माण/पुनर्निर्माण हरियाणा सरकार द्वारा वर्ष 1972 में करवाया गया था।","facts":["पौराणिक मान्यता है कि दानवीर कर्ण प्रतिदिन इसी स्थान पर स्नान कर सवा मन सोना दान करते थे।","इसका नाम हरियाणा के तत्कालीन राज्यपाल बी.एन. चक्रवर्ती के सम्मान में 'चक्रवर्ती झील' भी रखा गया।","इसी झील के किनारे हरियाणा पर्यटन निगम का प्रसिद्ध 'ओएसिस' (Oasis) पर्यटन स्थल स्थित है।","अन्य जिलों की प्रसिद्ध झीलें: दमदमा व सुल्तानपुर (गुरुग्राम), बड़खल व सूरजकुंड (फरीदाबाद), भिंडावास (झज्जर) और बिदक्यार झील (कैथल)।","कर्ण झील दिल्ली से चंडीगढ़ जाने वाले यात्रियों के लिए एक अत्यंत लोकप्रिय विश्राम व नौकायन केंद्र है।"]},
  {"q":"संभवतः भारत में देवी सीता को समर्पित एकमात्र प्राचीन 'सीता माई मंदिर' करनाल जिले के किस गाँव में स्थित है?","opts":["सीतामाई गाँव","गोंदर गाँव","बस्तली गाँव","बड़ा गाँव"],"a":0,"exp":"प्रसिद्ध 'सीता माई मंदिर' करनाल जिले के नीलोखेड़ी क्षेत्र के 'सीतामाई' गाँव में स्थित है।","facts":["किंवदंती के अनुसार यही वह पवित्र स्थान है जहाँ माता सीता ने अपनी पवित्रता की परीक्षा देते हुए धरती माता की गोद में समाधि ली थी।","यह प्राचीन मंदिर लाखौरी ईंटों और सुंदर नक्काशी से निर्मित है और भारतीय पुरातत्व सर्वेक्षण (ASI) के संरक्षण में है।","मान्यता है कि मध्यकाल में कुछ आक्रमणकारियों ने इस मंदिर को क्षति पहुँचाई थी, जिसे बाद में स्थानीय लोगों ने संरक्षित किया।","सीतामाई गाँव के निकट ही महर्षि वेदव्यास की तपोस्थली 'बस्तली' और गौतम ऋषि की तपोस्थली 'गोंदर' स्थित हैं।","HSSC परीक्षाओं में 'भारत का एकमात्र सीता माई मंदिर कहाँ है' (करनाल) बार-बार पूछा जाता है।"]},
  {"q":"करनाल जिले के किस गाँव में महर्षि 'वेदव्यास की तपोस्थली' (बस्तली तीर्थ) और किस गाँव में 'गौतम ऋषि की तपोस्थली' स्थित है?","opts":["सालवन और पपहाना","इंद्री और अमूपुर","बस्तली और गोंदर","बहलोलपुर और तरावड़ी"],"a":2,"exp":"करनाल जिले के बस्तली (बस्तलोक) गाँव में महर्षि वेदव्यास की तपोस्थली (बस्तली तीर्थ) और गोंदर गाँव में महर्षि गौतम की तपोस्थली (गोंदर तीर्थ) स्थित है।","facts":["इसके अतिरिक्त करनाल जिले के ही 'बहलोलपुर' गाँव में महर्षि वेदव्यास के पिता 'परासर ऋषि की तपोस्थली' स्थित है।","तरावड़ी (करनाल) में प्रतिवर्ष प्रसिद्ध 'परासर का मेला' आयोजित होता है।","ये सभी प्राचीन ऋषि आश्रम 48 कोस कुरुक्षेत्र भूमि के पवित्र तीर्थों में शामिल हैं।","महर्षि वेदव्यास ने महाभारत महाकाव्य की रचना की थी और वेदों का संकलन किया था।","महर्षि गौतम भारतीय दर्शन के 'न्याय दर्शन' के प्रणेता माने जाते हैं।"]},
  {"q":"करनाल जिले के किस गाँव को अधिक मेलों के आयोजन के कारण 'मेलों का गाँव' कहा जाता है?","opts":["अमूपुर","पपहाना","खेड़ा","सालवन"],"a":3,"exp":"करनाल जिले के असंध क्षेत्र के 'सालवन' गाँव को यहाँ लगने वाले अनेक पारंपरिक मेलों के कारण 'मेलों का गाँव' कहा जाता है।","facts":["सालवन गाँव में प्रसिद्ध प्राचीन 'देवी मंदिर' भी स्थित है।","ध्यान दें: 'मंदिरों का गाँव' बेरी (झज्जर) को, 'मंदिरों का शहर' भिवानी को और 'मेलों का गाँव' सालवन (करनाल) को कहा जाता है।","करनाल जिले के 'बड़ा गाँव' में प्रसिद्ध 'माता बाला सुंदरी मंदिर' स्थित है।","करनाल जिले के अन्य प्रमुख मेले: पांडु मेला (पपहाना), बाबा सिमरन दास मेला (इंद्री), छड़ियों का मेला (अमूपुर), परासर मेला (तरावड़ी) और गोगा पीर मेला (खेड़ा)।","HSSC परीक्षाओं में सालवन गाँव (मेलों का गाँव) एक अत्यंत महत्वपूर्ण तथ्य है।"]},
  {"q":"करनाल जिले में 'छड़ियों का मेला' और 'बाबा सिमरन दास का मेला' क्रमशः किन स्थानों पर लगते हैं?","opts":["पपहाना और तरावड़ी","अमूपुर और इंद्री","खेड़ा और मधुबन","सालवन और कुंजपुरा"],"a":1,"exp":"करनाल जिले में प्रसिद्ध 'छड़ियों का मेला' अमूपुर गाँव में और 'बाबा सिमरन दास जी का मेला' इंद्री में आयोजित होता है।","facts":["असंध क्षेत्र के पपहाना गाँव में प्रसिद्ध 'पांडु मेला' और तरावड़ी में 'परासर का मेला' लगता है।","करनाल के खेड़ा गाँव में 'गोगा पीर का मेला' लगता है (जबकि सबसे बड़ा गोगा पीर मेला इस्लामपुर, गुरुग्राम में लगता है)।","मधुबन (करनाल) में 'पाँच पीरों की मजार' और नेवल गाँव में 'शाह अल्लामा नूर मोहम्मद (नूरी) दरगाह' स्थित हैं।","इंद्री करनाल जिले का एक प्रमुख उपमंडल (HR-75), तहसील, ब्लॉक और विधानसभा क्षेत्र है।","2024 के विधानसभा चुनाव में इंद्री से भाजपा के राम कुमार कश्यप विधायक चुने गए।"]},
  {"q":"संगमरमर से बनी व नक्काशीदार 'कलंदर शाह की दरगाह' (बू-अली शाह कलंदर की स्मृति में) करनाल में किस सुल्तान द्वारा बनवाई गई थी?","opts":["गयासुद्दीन तुगलक","अलाउद्दीन खिलजी","फिरोजशाह तुगलक","शेरशाह सूरी"],"a":0,"exp":"करनाल में संगमरमर से बनी नक्काशीदार 'कलंदर शाह की दरगाह' दिल्ली के सुल्तान गयासुद्दीन तुगलक द्वारा सूफी संत बू-अली शाह कलंदर की याद में बनवाई गई थी।","facts":["ध्यान दें: सूफी संत बू-अली शाह कलंदर का मुख्य मकबरा/दरगाह 'पानीपत' में स्थित है, जबकि उनकी स्मृति में कलंदर शाह की दरगाह करनाल में है।","करनाल में ही संत सैयद मोहम्मद उर्फ मीरां साहिब की स्मृति में 'मीरां साहिब का मकबरा' भी स्थित है।","करनाल के मधुबन में 'पाँच पीरों की मजार' और नेवल गाँव में 'शाह अल्लामा नूर मोहम्मद की दरगाह (नूरी दरगाह)' स्थित हैं।","करनाल शहर में सिख परंपरा का ऐतिहासिक 'मंजी साहिब गुरुद्वारा' भी स्थित है।","गयासुद्दीन तुगलक ने 1320 ई. में दिल्ली में तुगलक वंश की स्थापना की थी।"]},
  {"q":"करनाल के 'नेवल' गाँव में नूरी दरगाह के साथ-साथ हरियाणा पुलिस का कौन-सा प्रमुख प्रशिक्षण केंद्र स्थित है?","opts":["फोरेंसिक साइंस लैब","हरियाणा पुलिस मुख्यालय","हरियाणा कमांडो पुलिस ट्रेनिंग सेंटर","आकाशवाणी केंद्र"],"a":2,"exp":"करनाल जिले के नेवल (Newal) गाँव में 'हरियाणा कमांडो पुलिस ट्रेनिंग सेंटर' और शाह अल्लामा नूर मोहम्मद की दरगाह (नूरी दरगाह) स्थित हैं।","facts":["करनाल के ही 'मधुबन' में राज्य का सर्वोच्च पुलिस प्रशिक्षण संस्थान 'हरियाणा पुलिस अकादमी' (HPA — स्थापना: 1973/1976) स्थित है।","मधुबन (करनाल) में ही हरियाणा की प्रमुख 'फोरेंसिक साइंस लैबोरेटरी' (FSL) भी स्थित है।","जबकि केंद्र सरकार का राष्ट्रीय स्तर का NSG (ब्लैक कैट कमांडो) प्रशिक्षण केंद्र मानेसर (गुरुग्राम, 1984) में स्थित है।","हरियाणा पुलिस का राज्य मुख्यालय सेक्टर-6, पंचकूला में स्थित है।","हरियाणा में 2026 में कुल 5 पुलिस रेंज, 5 पुलिस कमिश्नरेट और 24 पुलिस जिले हैं।"]},
  {"q":"हरियाणा की प्रमुख 'फोरेंसिक साइंस लैबोरेटरी' (FSL) वर्ष 1976 में रोहतक से स्थानांतरित कर करनाल के किस स्थान पर स्थापित की गई?","opts":["नीलोखेड़ी","कुंजपुरा","घरौंडा","मधुबन"],"a":3,"exp":"हरियाणा की फोरेंसिक साइंस लैबोरेटरी (FSL) की स्थापना 1973 में रोहतक में हुई थी, जिसे वर्ष 1976 में मधुबन (करनाल) स्थानांतरित कर दिया गया।","facts":["मधुबन (NH-44 पर स्थित) में ही 'हरियाणा पुलिस अकादमी' (HPA) और 'पाँच पीरों की मजार' स्थित हैं।","FSL मधुबन अपराध जाँच में डीएनए, बैलिस्टिक, टॉक्सिकोलॉजी और साइबर फोरेंसिक विश्लेषण का राज्य का सर्वोच्च केंद्र है।","इसके अतिरिक्त अब राज्य में क्षेत्रीय फोरेंसिक लैब (RFSL) गुरुग्राम (भोंडसी), रोहतक (सुनारिया), हिसार और पंचकूला में भी कार्यरत हैं।","1976 में ही रोहतक में महर्षि दयानंद विश्वविद्यालय (MDU) और हरियाणा के पहले आकाशवाणी केंद्र (8 मई 1976) की स्थापना भी हुई थी।","HSSC परीक्षाओं में FSL मधुबन के स्थापना वर्ष (1973 रोहतक / 1976 मधुबन) अक्सर पूछे जाते हैं।"]},
  {"q":"राष्ट्रीय डेयरी अनुसंधान संस्थान (NDRI) की स्थापना करनाल में किस वर्ष हुई थी?","opts":["1923","1955","1969","1978"],"a":1,"exp":"विश्व प्रसिद्ध राष्ट्रीय डेयरी अनुसंधान संस्थान (NDRI) की स्थापना वर्ष 1955 में करनाल में हुई थी (मूल रूप से 1923 में बेंगलुरु में स्थापित)।","facts":["NDRI को वर्ष 1989 में 'डीम्ड विश्वविद्यालय' (Deemed University) का दर्जा प्रदान किया गया।","यह संस्थान देश में दुग्ध क्रांति, डेयरी तकनीक और क्लोनिंग शोध के लिए विख्यात है—यहाँ विश्व की पहली क्लोन भैंस 'गरिमा' और 'महिमा' तैयार की गई थीं।","करनाल में ही भारतीय कृषि अनुसंधान परिषद (ICAR) के अन्य 3 बड़े राष्ट्रीय संस्थान स्थित हैं: CSSRI (1969), IIWBR (1978) और NBAGR (1984/85)।","हरियाणा में केंद्रीय भैंस अनुसंधान संस्थान (CIRB, 1985) और राष्ट्रीय अश्व अनुसंधान केंद्र (NRCE, 1986) हिसार में स्थित हैं।","इतने बड़े कृषि व डेयरी शोध संस्थानों के कारण ही करनाल को 'एग्रो हब' कहा जाता है।"]},
  {"q":"केंद्रीय मिट्टी लवणता अनुसंधान संस्थान (CSSRI) की स्थापना वर्ष 1969 में कहाँ की गई थी, जिसे बाद में करनाल स्थानांतरित किया गया?","opts":["हिसार","रोहतक","अंबाला","गुरुग्राम"],"a":0,"exp":"केंद्रीय मिट्टी लवणता अनुसंधान संस्थान (Central Soil Salinity Research Institute - CSSRI) की स्थापना मार्च 1969 में हिसार में हुई थी, जिसे अक्टूबर 1969 में करनाल स्थानांतरित कर दिया गया।","facts":["यह ICAR के अंतर्गत क्षारीय, लवणीय व जलमग्न मृदा के सुधार और कृषि योग्य बनाने पर शोध करने वाला देश का सर्वोच्च संस्थान है।","1969 में ही हरियाणा विद्यालय शिक्षा बोर्ड (HBSE) का गठन और फरीदाबाद में YMCA संस्थान की स्थापना भी हुई थी।","करनाल में मिट्टी के अलावा गेहूँ, जौ, डेयरी और पशु आनुवंशिकी के राष्ट्रीय अनुसंधान केंद्र भी स्थित हैं।","CSSRI द्वारा विकसित नमक-सहिष्णु गेहूँ व धान की किस्में पूरे भारत के किसानों के लिए वरदान साबित हुई हैं।","HSSC की परीक्षाओं में करनाल के चारों ICAR संस्थानों (NDRI 1955, CSSRI 1969, IIWBR 1978, NBAGR 1984/85) के वर्ष बार-बार पूछे जाते हैं।"]},
  {"q":"भारतीय गेहूँ एवं जौ अनुसंधान संस्थान (पूर्व नाम: गेहूँ अनुसंधान निदेशालय — DWR) की स्थापना करनाल में किस वर्ष हुई थी?","opts":["1955","1969","1978","1984"],"a":2,"exp":"गेहूँ अनुसंधान निदेशालय (DWR — वर्तमान नाम: भारतीय गेहूँ एवं जौ अनुसंधान संस्थान / IIWBR) की स्थापना वर्ष 1978 में करनाल में हुई थी।","facts":["करनाल में ही देश का प्रमुख 'गेहूँ का जीन बैंक' (Wheat Gene Bank) स्थित है।","यह संस्थान भारत में गेहूँ व जौ की उच्च उपज देने वाली और रोग-प्रतिरोधी किस्मों के विकास का राष्ट्रीय समन्वय केंद्र है।","करनाल में ही 'गन्ना प्रजनन संस्थान' (Sugarcane Breeding Institute — कोयंबटूर का क्षेत्रीय केंद्र, स्थापना: 1932) भी स्थित है।","1978 में ही हिसार का चार मंजिला लघु सचिवालय भवन भी बनकर तैयार हुआ था।","हरियाणा में सर्वाधिक गेहूँ उत्पादन सिरसा जिले में होता है, जबकि शोध केंद्र करनाल में है।"]},
  {"q":"राष्ट्रीय पशु आनुवंशिकी संस्थान (NIAG) व राष्ट्रीय पशु आनुवंशिकी संसाधन ब्यूरो (NBAGR) की स्थापना करनाल में क्रमशः किस वर्ष हुई थी?","opts":["1955 और 1969","1978 और 1980","1990 और 1995","1984 और 1985"],"a":3,"exp":"राष्ट्रीय पशु आनुवंशिकी संस्थान (1984) और राष्ट्रीय पशु आनुवंशिकी संसाधन ब्यूरो (NBAGR, 1985) की स्थापना करनाल में हुई थी (1995 में दोनों का विलय कर NBAGR बना)।","facts":["NBAGR भारत के सभी स्वदेशी पशुधन व कुक्कुट नस्लों (गाय, भैंस, भेड़, बकरी, ऊँट, घोड़ा आदि) के पंजीकरण, पहचान और संरक्षण की सर्वोच्च राष्ट्रीय संस्था है।","इस संस्थान द्वारा पंजीकृत हरियाणा की प्रमुख नस्लें: मुर्राह भैंस और हरियाणवी गाय।","करनाल के नीलोखेड़ी में ही 'पोल्ट्री प्रशिक्षण केंद्र' (मुर्गी पालन प्रशिक्षण) भी स्थित है।","हिसार में 1985 में CIRB और 1986 में NRCE स्थापित हुए थे।","ये सभी संस्थान भारतीय कृषि अनुसंधान परिषद (ICAR, नई दिल्ली) के अधीन कार्य करते हैं।"]},
  {"q":"हरियाणा का प्रथम 'सैनिक स्कूल' वर्ष 1961 में करनाल जिले के किस गाँव में स्थापित किया गया था?","opts":["नीलोखेड़ी","कुंजपुरा","अंजनथली","घरौंडा"],"a":1,"exp":"हरियाणा प्रदेश का प्रथम सैनिक स्कूल (Sainik School Kunjpura) 24 जुलाई 1961 को करनाल जिले के कुंजपुरा गाँव में स्थापित किया गया था।","facts":["यह भारत के पहले 5 सैनिक स्कूलों (सतारा, कुंजपुरा, बालाचडी, कपूरथला, चित्तौड़गढ़) में से एक था।","हरियाणा का दूसरा सैनिक स्कूल वर्ष 2008 में रेवाड़ी (गोठड़ा टप्पा खोरी) में खोला गया और तीसरा सैनिक स्कूल मातनहेल (झज्जर) में स्वीकृत है।","कुंजपुरा रियासत की स्थापना 1729 में पठान शासक निजाबत खान ने की थी।","करनाल जिले के ही अराईपुरा गाँव (घरौंडा) में 'एनसीसी (NCC) अकादमी' और सागा गाँव में 'जवाहर नवोदय विद्यालय' स्थित हैं।","सैनिक स्कूलों का संचालन रक्षा मंत्रालय की सैनिक स्कूल सोसाइटी द्वारा किया जाता है।"]},
  {"q":"हरियाणा का पहला 'बागवानी विश्वविद्यालय' (महाराणा प्रताप बागवानी विश्वविद्यालय — MHU) वर्ष 2016 में करनाल में कहाँ स्थापित किया गया?","opts":["अंजनथली","कुटैल","कुंजपुरा","तरावड़ी"],"a":0,"exp":"हरियाणा का पहला बागवानी विश्वविद्यालय 'महाराणा प्रताप बागवानी विश्वविद्यालय' (MHU) वर्ष 2016 में करनाल जिले के 'अंजनथली' (नीलोखेड़ी क्षेत्र) में स्थापित किया गया।","facts":["इसकी आधारशिला अप्रैल 2016 में रखी गई थी और यह हरियाणा में फल, सब्जी, फूल व मसाला बागवानी को समर्पित पहला राजकीय विश्वविद्यालय है।","इसके क्षेत्रीय अनुसंधान केंद्र झज्जर (रिया), भिवानी (खरकड़ी), जींद (बुरडैहर) व अंबाला (चांदसौली) में बनाए गए हैं।","करनाल के ही 'कुटैल' गाँव में भव्य 'पंडित दीनदयाल उपाध्याय स्वास्थ्य विज्ञान विश्वविद्यालय' (चिकित्सा विश्वविद्यालय) स्थापित किया गया है।","करनाल शहर में 'कल्पना चावला राजकीय मेडिकल कॉलेज' (KCGMC) भी स्थित है।","हरियाणा का पहला कृषि विश्वविद्यालय CCS HAU (1970) हिसार में स्थित है।"]},
  {"q":"करनाल जिले के 'कुटैल' गाँव में कौन-सा प्रमुख राजकीय विश्वविद्यालय स्थापित किया गया है?","opts":["महाराणा प्रताप बागवानी विश्वविद्यालय","इंदिरा गांधी राष्ट्रीय मुक्त विश्वविद्यालय","पंडित दीनदयाल उपाध्याय स्वास्थ्य विज्ञान विश्वविद्यालय","महर्षि वाल्मीकि संस्कृत विश्वविद्यालय"],"a":2,"exp":"करनाल जिले के कुटैल गाँव (घरौंडा क्षेत्र) में 'पंडित दीनदयाल उपाध्याय स्वास्थ्य विज्ञान विश्वविद्यालय' (मेडिकल यूनिवर्सिटी) स्थापित किया गया है।","facts":["इससे पूर्व हरियाणा का पहला राजकीय स्वास्थ्य विज्ञान विश्वविद्यालय 'पंडित भगवत दयाल शर्मा स्वास्थ्य विज्ञान विश्वविद्यालय' (PGIMS) रोहतक में स्थित है।","करनाल शहर में अंतरिक्ष यात्री कल्पना चावला के नाम पर 'कल्पना चावला राजकीय मेडिकल कॉलेज' भी संचालित है।","करनाल में ही वर्ष 1991 में 'इंदिरा गांधी राष्ट्रीय मुक्त विश्वविद्यालय (IGNOU) का क्षेत्रीय केंद्र' स्थापित हुआ था।","करनाल में ही 'माता प्रकाश कौर बधिर एवं वाणी विकलांग केंद्र / आवासीय विद्यालय' भी स्थित है।","स्वास्थ्य व कृषि शिक्षा के इतने बड़े केंद्रों से करनाल उत्तर हरियाणा का प्रमुख एजुकेशन हब बन चुका है।"]},
  {"q":"हरियाणा का प्रथम पॉलिटेक्निक कॉलेज ('गुरु ब्रह्मानंद राजकीय पॉलिटेक्निक') तथा 'हरियाणा ग्रामीण विकास संस्थान' (HIRD, 1990) कहाँ स्थित हैं?","opts":["असंध","इंद्री","घरौंडा","नीलोखेड़ी"],"a":3,"exp":"हरियाणा का पहला पॉलिटेक्निक कॉलेज (गुरु ब्रह्मानंद राजकीय पॉलिटेक्निक) और हरियाणा ग्रामीण विकास संस्थान (HIRD, 1990)—दोनों करनाल के नीलोखेड़ी में स्थित हैं।","facts":["नीलोखेड़ी को आजादी के बाद 1947–48 में शरणार्थियों के पुनर्वास हेतु 'मजदूर मंजिल' परियोजना (एस.के. डे द्वारा) के तहत बसाया गया था।","नीलोखेड़ी में ही राज्य का प्रसिद्ध 'पोल्ट्री प्रशिक्षण केंद्र' (मुर्गी पालन प्रशिक्षण) भी स्थित है।","नीलोखेड़ी करनाल जिले की एकमात्र अनुसूचित जाति (SC) आरक्षित विधानसभा सीट (क्रमांक 19) है।","2024 के चुनाव में नीलोखेड़ी (SC) से भाजपा के भगवान दास कबीरपंथी विधायक निर्वाचित हुए।","नीलोखेड़ी NH-44 पर करनाल और कुरुक्षेत्र के मध्य स्थित है।"]},
  {"q":"इज़राइल के सहयोग से वर्ष 2011 में स्थापित हरियाणा का प्रसिद्ध 'सब्जी उत्कृष्टता केंद्र' (Centre of Excellence for Vegetables) कहाँ स्थित है?","opts":["नीलोखेड़ी","घरौंडा","इंद्री","असंध"],"a":1,"exp":"इंडो-इज़राइल कृषि परियोजना के तहत जनवरी 2011 में भारत का पहला 'सब्जी उत्कृष्टता केंद्र' करनाल जिले के 'घरौंडा' में स्थापित किया गया था।","facts":["यहाँ किसानों को पॉलीहाउस, ड्रिप सिंचाई और बिना मिट्टी की आधुनिक नर्सरी तकनीक से रोग-रहित सब्जी पौध तैयार करने का प्रशिक्षण दिया जाता है।","हरियाणा के अन्य प्रमुख बागवानी उत्कृष्टता केंद्र: फल उत्कृष्टता केंद्र (मंगियाना, सिरसा), अमरूद केंद्र (भूना, फतेहाबाद), अर्ध-शुष्क बागवानी केंद्र (गिगनाऊ, भिवानी) और उपोष्णकटिबंधीय फल केंद्र (लाडवा, कुरुक्षेत्र)।","घरौंडा के ही अराईपुरा गाँव में 'एनसीसी (NCC) अकादमी' स्थापित की गई है।","घरौंडा के विधायक हरविन्द्र कल्याण (BJP) 15वीं हरियाणा विधानसभा के अध्यक्ष (Speaker) हैं।","करनाल जिले में अमरूद और लहसुन का भी बड़े पैमाने पर उत्पादन होता है।"]},
  {"q":"करनाल जिले के 'सागा' गाँव में जवाहर नवोदय विद्यालय तथा 'अराईपुरा' गाँव में कौन-सी प्रमुख अकादमी स्थित है?","opts":["एनसीसी (NCC) अकादमी","हरियाणा पुलिस अकादमी","आईएएस प्रशिक्षण अकादमी","राष्ट्रीय खेल अकादमी"],"a":0,"exp":"करनाल जिले के सागा गाँव में जवाहर नवोदय विद्यालय (JNV) और घरौंडा क्षेत्र के अराईपुरा गाँव में 'एनसीसी (NCC) अकादमी' स्थित है।","facts":["हरियाणा पुलिस अकादमी (HPA) करनाल के ही मधुबन में स्थित है।","अधिकारियों का राज्य स्तरीय प्रशिक्षण संस्थान 'हिपा' (HIPA, 1983) गुरुग्राम में स्थित है।","भारत के पहले दो जवाहर नवोदय विद्यालयों में से एक हरियाणा के झज्जर जिले के कलोई गाँव (1985–86) में खोला गया था।","करनाल में ही वर्ष 1991 में स्थापित 'IGNOU क्षेत्रीय केंद्र' दूरस्थ शिक्षा का बड़ा माध्यम है।","करनाल में 'हरियाणा का पहला साइंस उद्यान / विज्ञान पार्क' भी स्थापित किया गया है।"]},
  {"q":"विश्व प्रसिद्ध 'लिबर्टी जूता उद्योग' (Liberty Shoes) की स्थापना वर्ष 1954 में हरियाणा के किस शहर में हुई थी?","opts":["फरीदाबाद","बहादुरगढ़","करनाल","पानीपत"],"a":2,"exp":"अंतर्राष्ट्रीय फुटवियर ब्रांड 'लिबर्टी शूज' की स्थापना वर्ष 1954 में करनाल में हुई थी, जहाँ से निर्मित जूते विश्व के अनेक देशों में निर्यात होते हैं।","facts":["करनाल में लिबर्टी जूतों के अलावा एग्रो-बेस्ड कृषि उपकरण उद्योग, कारपेट उद्योग और राइस शैलर (चावल मिलें) प्रमुख हैं।","हरियाणा के अन्य प्रमुख फुटवियर केंद्र: बहादुरगढ़ (झज्जर—फुटवियर पार्क) और फरीदाबाद (बाटा नगरी, 1951)।","करनाल जिले में औद्योगिक खनिज के रूप में 'शोरा' (Saltpetre) भी पाया जाता है।","केंद्र सरकार की ODOP (एक जिला, एक उत्पाद) योजना के तहत करनाल को 'फार्मास्युटिकल / कृषि व डेयरी उत्पादों' के लिए चिह्नित किया गया है।","तरावड़ी (करनाल) का बासमती चावल दुनिया भर में अपनी खुशबू और गुणवत्ता के लिए प्रसिद्ध है।"]},
  {"q":"हरियाणा का पहला 'लाल डोरा मुक्त गाँव' (जिससे केंद्र की स्वामित्व योजना को प्रेरणा मिली) करनाल जिले का कौन-सा गाँव बना था?","opts":["उचानी कलां","अंजनथली","कुंजपुरा","सिरसी"],"a":3,"exp":"करनाल जिले का 'सिरसी' गाँव 26 जनवरी 2020 को हरियाणा का पहला 'लाल डोरा मुक्त गाँव' बना था।","facts":["सिरसी गाँव के इसी सफल मॉडल से प्रेरित होकर केंद्र सरकार ने 24 अप्रैल 2020 को पूरे देश में 'स्वामित्व योजना' (SVAMITVA Scheme) लागू की, जिसमें ड्रोन मैपिंग से ग्रामीणों को संपत्ति के मालिकाना हक (प्रॉपर्टी कार्ड) दिए जाते हैं।","करनाल देश का पहला जिला बना जहाँ ड्रोन तकनीक से फसलों में स्प्रे की शुरुआत की गई।","हरियाणा में सबसे पहले 'सीएम विंडो' (CM Window) की शुरुआत और 'ऑनलाइन जमाबंदी' करने वाला पहला जिला भी करनाल है।","हरियाणा में 'महिला पुलिस स्वयंसेवक' (Mahila Police Volunteer) पहल सबसे पहले करनाल और महेंद्रगढ़ जिलों में शुरू हुई थी।","हरियाणा का पहला 'वन स्टॉप सेंटर—सखी' (महिला सहायता केंद्र) भी करनाल में खोला गया।"]},
  {"q":"29 नवंबर 1970 को हरियाणा के सभी गाँवों में बिजली पहुँचाने का ऐतिहासिक कार्य (सीएम बंसीलाल के समय) करनाल के किस गाँव से पूर्ण हुआ था?","opts":["सिरसी","उचानी कलां","गगसीना","अराईपुरा"],"a":1,"exp":"तत्कालीन मुख्यमंत्री चौधरी बंसीलाल के नेतृत्व में 29 नवंबर 1970 को करनाल के 'उचानी कलां' गाँव में बिजली पहुँचने के साथ ही हरियाणा भारत का पहला शत-प्रतिशत विद्युतीकृत राज्य बना था।","facts":["इस ऐतिहासिक अवसर पर देश की तत्कालीन प्रधानमंत्री इंदिरा गांधी स्वयं उचानी कलां (करनाल) आई थीं।","हरियाणा में 24 घंटे बिजली आपूर्ति हेतु 'मेरा गाँव-जगमग गाँव' योजना 1 जुलाई 2015 को दयालपुर (कुरुक्षेत्र) से शुरू हुई थी।","उचानी/उचाना (करनाल) में ही प्रसिद्ध 'कर्ण झील' और 'ओएसिस पर्यटन स्थल' स्थित हैं।","करनाल से ही हरियाणा का पहला 'फ्लाइंग क्लब' (एविएशन क्लब / करनाल हवाई पट्टी) शुरू किया गया था।","करनाल जिले ने स्वच्छ भारत मिशन (स्वच्छ सर्वेक्षण) में भी लगातार शीर्ष रैंकिंग हासिल की है।"]},
  {"q":"हरियाणा सरकार की प्रसिद्ध 'भावांतर भरपाई योजना' की शुरुआत 31 दिसंबर 2017 को करनाल के किस गाँव से की गई थी?","opts":["गांगर (गागर)","सिरसी","कुटैल","सागा"],"a":0,"exp":"बागवानी किसानों को बाजार भाव गिरने के नुकसान से बचाने हेतु 'भावांतर भरपाई योजना' की शुरुआत 31 दिसंबर 2017 (प्रभावी: 1 जनवरी 2018) को करनाल के गांगर (गागर) गाँव से की गई थी।","facts":["प्रारंभ में इसमें 4 सब्जियों (टमाटर, प्याज, आलू, फूलगोभी) को शामिल किया गया था, जिसे बाद में बढ़ाकर 21+ बागवानी फसलों व बाजरे तक विस्तारित कर दिया गया।","इसी प्रकार 'ऑक्सीवन योजना' (Oxyvan — शहरी वन निर्माण) की शुरुआत भी 5 जून 2021 (विश्व पर्यावरण दिवस) को करनाल व पंचकूला से की गई थी।","हरियाणा की अन्य प्रमुख योजनाओं की शुरुआत: बेटी बचाओ, बेटी पढ़ाओ (पानीपत, 2015), पशुधन बीमा योजना (झज्जर, 2016) और पशुधन किसान क्रेडिट कार्ड (भिवानी, 2019)।","करनाल में ही वर्ष 1998 से जनता की सुविधा के लिए विशेष पर्यावरण न्यायालय का कैंप कोर्ट भी लगाया जाता रहा है।","करनाल 'एग्रो हब' होने के कारण कृषि नवाचार योजनाओं का प्रमुख केंद्र रहा है।"]},
  {"q":"अंतरिक्ष में जाने वाली भारतीय मूल की प्रथम महिला 'कल्पना चावला' ('अंतरिक्ष की रानी') का जन्म किस जिले में हुआ था?","opts":["अंबाला","पानीपत","करनाल","कुरुक्षेत्र"],"a":2,"exp":"महान अंतरिक्ष यात्री डॉ. कल्पना चावला का जन्म 17 मार्च 1962 (आधिकारिक रिकॉर्ड: 1 जुलाई 1961) को करनाल में हुआ था।","facts":["उन्होंने अपनी प्रारंभिक शिक्षा करनाल के 'टैगोर बाल निकेतन स्कूल' और एयरोनॉटिकल इंजीनियरिंग की पढ़ाई पंजाब इंजीनियरिंग कॉलेज (चंडीगढ़) से की थी।","उनकी पहली अंतरिक्ष यात्रा नवंबर 1997 में 'कोलंबिया स्पेस शटल (STS-87)' से हुई थी।","अपनी दूसरी अंतरिक्ष यात्रा (STS-107) से लौटते समय 1 फरवरी 2003 को कोलंबिया यान दुर्घटनाग्रस्त होने से वे अमर हो गईं।","उनकी स्मृति में करनाल में 'कल्पना चावला राजकीय मेडिकल कॉलेज' और कुरुक्षेत्र (पिहोवा रोड) में 'कल्पना चावला तारामंडल' (प्लेनेटोरियम, 2007) बनाया गया है।","हरियाणा की महिलाओं को साहस के लिए राज्य सरकार द्वारा 'कल्पना चावला शौर्य पुरस्कार' प्रदान किया जाता है।"]},
  {"q":"अंतर्राष्ट्रीय बास्केटबॉल मैच में रेफरी की भूमिका निभाने वाली भारत की प्रथम महिला 'शीबा मग्गोन' ('क्वीन ऑफ बास्केटबॉल') किस जिले से हैं?","opts":["रोहतक","गुरुग्राम","हिसार","करनाल"],"a":3,"exp":"भारतीय महिला बास्केटबॉल टीम की पूर्व कप्तान और अंतर्राष्ट्रीय रेफरी शीबा मग्गोन (जिन्हें 'क्वीन ऑफ बास्केटबॉल' कहा जाता है) करनाल से संबंधित हैं।","facts":["शीबा मग्गोन ने 1989 से 2002 तक भारतीय महिला बास्केटबॉल टीम का प्रतिनिधित्व किया और FIBA की पहली भारतीय महिला अंतर्राष्ट्रीय रेफरी बनीं।","करनाल जिले से ही अर्जुन पुरस्कार विजेता दिग्गज पुरुष बास्केटबॉल खिलाड़ी 'अजमेर सिंह चोपड़ा' (1980 मास्को ओलंपियन) भी संबंधित हैं।","करनाल ने भारतीय निशानेबाजी को दो बड़े राष्ट्रमंडल स्वर्ण विजेता—अनीश भनवाला (2018 स्वर्ण) और हरप्रीत सिंह (2010 स्वर्ण)—दिए हैं।","करनाल शहर का प्रमुख खेल मैदान 'कर्ण स्टेडियम' है।","हरियाणा की खेल नीति में ओलंपिक स्वर्ण पर 6 करोड़, रजत पर 4 करोड़ और कांस्य पदक पर 2.5 करोड़ रुपये दिए जाते हैं।"]},
  {"q":"2018 के गोल्ड कोस्ट राष्ट्रमंडल खेलों में मात्र 15 वर्ष की आयु में स्वर्ण पदक जीतकर इतिहास रचने वाले निशानेबाज 'अनीश भनवाला' किस जिले से हैं?","opts":["झज्जर","करनाल","फरीदाबाद","सोनीपत"],"a":1,"exp":"अंतर्राष्ट्रीय निशानेबाज अनीश भनवाला (जन्म: 26 सितंबर 2002, मूल सोनीपत/निवास व कर्मक्षेत्र करनाल) करनाल से संबंधित हैं।","facts":["उन्होंने अप्रैल 2018 में गोल्ड कोस्ट राष्ट्रमंडल खेलों (25 मीटर रैपिड फायर पिस्टल) में मात्र 15 वर्ष की उम्र में स्वर्ण पदक जीतकर राष्ट्रमंडल खेलों में स्वर्ण जीतने वाले सबसे कम उम्र के भारतीय का कीर्तिमान बनाया।","उन्होंने पेरिस 2024 ओलंपिक और 2023 हांगझू एशियाई खेलों (कांस्य पदक—टीम) में भी भारत का प्रतिनिधित्व किया।","करनाल के ही दूसरे प्रसिद्ध निशानेबाज 'हरप्रीत सिंह' ने 2010 नई दिल्ली राष्ट्रमंडल खेलों (25 मीटर सेंटर फायर पिस्टल) में दो स्वर्ण पदक जीते थे।","हरियाणा की अन्य विश्व प्रसिद्ध निशानेबाजों में मनु भाकर (गोरिया, झज्जर—पेरिस 2024 में 2 कांस्य) और सरबजोत सिंह (अंबाला—पेरिस 2024 में कांस्य) शामिल हैं।","अनीश भनवाला ने 2023 ISSF विश्व कप फाइनल में भी ऐतिहासिक कांस्य पदक जीता था।"]},
  {"q":"भारतीय तेज गेंदबाज 'नवदीप सैनी' (जिन्हें 'करनाल एक्सप्रेस / तरावड़ी एक्सप्रेस' कहा जाता है) करनाल के किस कस्बे से हैं?","opts":["तरावड़ी","नीलोखेड़ी","इंद्री","असंध"],"a":0,"exp":"भारतीय अंतर्राष्ट्रीय तेज गेंदबाज नवदीप सैनी (जन्म: 23 नवंबर 1992) का संबंध करनाल जिले के 'तरावड़ी' से है।","facts":["अपनी तेज गति (150 किमी/घंटा तक) के कारण उन्हें 'करनाल एक्सप्रेस' या 'तरावड़ी एक्सप्रेस' कहा जाता है।","उन्होंने भारत के लिए टेस्ट, एकदिवसीय (ODI) और टी-20—तीनों प्रारूपों में अंतर्राष्ट्रीय क्रिकेट खेला है और 2020–21 की ऐतिहासिक ऑस्ट्रेलिया टेस्ट सीरीज जीत के सदस्य रहे।","वे घरेलू क्रिकेट में दिल्ली और IPL में रॉयल चैलेंजर्स बैंगलोर व राजस्थान रॉयल्स की ओर से खेल चुके हैं।","हरियाणा के अन्य प्रमुख क्रिकेटर: कपिल देव, वीरेंद्र सहवाग (झज्जर मूल), युजवेंद्र चहल (जींद), शैफाली वर्मा (रोहतक), मोहित शर्मा व राहुल तेवतिया (फरीदाबाद)।","तरावड़ी उच्च गुणवत्ता के बासमती चावल और 1191–1192 के तराइन युद्धों के लिए भी विश्व प्रसिद्ध है।"]},
  {"q":"'गूगल बॉय' के नाम से विश्व प्रसिद्ध अद्भुत स्मरण शक्ति वाले बालक 'कौटिल्य पंडित' करनाल जिले के किस गाँव से हैं?","opts":["सिरसी","कुंजपुरा","कोहंड","सागा"],"a":2,"exp":"असाधारण सामान्य ज्ञान व स्मरण शक्ति के कारण 'गूगल बॉय' कहे जाने वाले कौटिल्य पंडित का जन्म 24 दिसंबर 2007 को करनाल जिले के 'कोहंड' (घरौंडा क्षेत्र) गाँव में हुआ था।","facts":["मात्र 5 वर्ष की आयु में दुनिया के देशों की राजधानियाँ, भौगोलिक आँकड़े और विज्ञान के कठिन प्रश्नों के सटीक उत्तर देकर वे देशभर में चर्चित हो गए थे।","उन्होंने अमिताभ बच्चन के प्रसिद्ध शो 'कौन बनेगा करोड़पति' (KBC) में विशेष अतिथि के रूप में भाग लिया था।","हरियाणा सरकार ने उन्हें 10 लाख रुपये के पुरस्कार व प्रशस्ति-पत्र से सम्मानित किया था।","कोहंड गाँव करनाल–पानीपत राष्ट्रीय राजमार्ग (NH-44) पर घरौंडा के निकट स्थित है।","HSSC परीक्षाओं में 'गूगल बॉय कौटिल्य पंडित का गाँव' (कोहंड, करनाल) कई बार पूछा जा चुका है।"]},
  {"q":"पाकिस्तान के प्रथम प्रधानमंत्री 'लियाकत अली खान' का जन्म 1 अक्टूबर 1895 को हरियाणा के किस जिले में हुआ था?","opts":["रोहतक","अंबाला","हिसार","करनाल"],"a":3,"exp":"पाकिस्तान के पहले प्रधानमंत्री नवाबजादा लियाकत अली खान का जन्म 1 अक्टूबर 1895 को करनाल में हुआ था।","facts":["लियाकत अली खान के पिता नवाब रुस्तम अली खान करनाल के बड़े जमींदार थे।","1946 की भारत की अंतरिम सरकार में लियाकत अली खान वित्त मंत्री थे और अगस्त 1947 में वे पाकिस्तान के प्रथम प्रधानमंत्री बने (1951 में रावलपिंडी में उनकी हत्या हुई)।","करनाल में ही आजादी के समय पाकिस्तान से आए शरणार्थियों के पुनर्वास के लिए नीलोखेड़ी ('मजदूर मंजिल') नगर बसाया गया था।","हरियाणा के प्रसिद्ध ऐतिहासिक व्यक्तित्वों में करनाल से कल्पना चावला, लियाकत अली खान, कौटिल्य पंडित और नवदीप सैनी के नाम परीक्षाओं में पूछे जाते हैं।","करनाल जिले से होकर दिल्ली–अंबाला–अमृतसर ऐतिहासिक ग्रैंड ट्रंक रोड (NH-44) गुजरती है।"]},
  {"q":"हरियाणा का पहला 'वन स्टॉप सेंटर—सखी' और राज्य का प्रथम 'फ्लाइंग क्लब' (एविएशन क्लब) किस जिले में शुरू हुए थे?","opts":["गुरुग्राम","करनाल","पंचकूला","हिसार"],"a":1,"exp":"संकटग्रस्त महिलाओं की सहायता हेतु हरियाणा का पहला वन स्टॉप सेंटर 'सखी' और राज्य का पहला फ्लाइंग (एविएशन) क्लब करनाल में स्थापित किए गए थे।","facts":["करनाल एविएशन क्लब (करनाल हवाई पट्टी) 1967 में स्थापित हरियाणा के सबसे पुराने पायलट प्रशिक्षण केंद्रों में है (अन्य केंद्र पिंजौर व हिसार में हैं)।","केंद्र सरकार की 'सखी' वन स्टॉप सेंटर योजना के तहत हिंसा पीड़ित महिलाओं को एक ही छत के नीचे चिकित्सा, पुलिस, कानूनी व परामर्श सहायता दी जाती है।","हरियाणा में 'महिला पुलिस स्वयंसेवक' (Mahila Police Volunteer) पहल भी सबसे पहले करनाल व महेंद्रगढ़ जिलों में शुरू हुई थी।","हरियाणा का पहला महिला पुलिस थाना 29 अगस्त 2015 (रक्षाबंधन के दिन) को पंचकूला में खोला गया था।","करनाल में 'ऑनलाइन जमाबंदी' और 'सीएम विंडो' जैसी डिजिटल प्रशासनिक पहलें भी सबसे पहले प्रारंभ हुई थीं।"]},
  {"q":"करनाल जिले में वर्ष 1991 में किस राष्ट्रीय मुक्त विश्वविद्यालय का हरियाणा का प्रमुख क्षेत्रीय केंद्र स्थापित किया गया था?","opts":["इंदिरा गांधी राष्ट्रीय मुक्त विश्वविद्यालय (IGNOU)","नालंदा खुला विश्वविद्यालय","नेताजी सुभाष खुला विश्वविद्यालय","उत्तराखंड मुक्त विश्वविद्यालय"],"a":0,"exp":"इंदिरा गांधी राष्ट्रीय मुक्त विश्वविद्यालय (IGNOU) का प्रमुख क्षेत्रीय केंद्र वर्ष 1991 में करनाल में स्थापित किया गया था।","facts":["IGNOU की स्थापना सितंबर 1985 में संसद के अधिनियम द्वारा हुई थी और यह छात्रों की संख्या के हिसाब से विश्व का सबसे बड़ा विश्वविद्यालय है।","करनाल में स्थित अन्य प्रमुख शिक्षण संस्थान: सैनिक स्कूल कुंजपुरा (1961), महाराणा प्रताप बागवानी विवि (2016), पं. दीनदयाल उपाध्याय स्वास्थ्य विज्ञान विवि (कुटैल) और कल्पना चावला मेडिकल कॉलेज।","करनाल में ही हरियाणा का पहला पॉलिटेक्निक कॉलेज (नीलोखेड़ी) और HIRD (नीलोखेड़ी, 1990) स्थित हैं।","करनाल के 'माता प्रकाश कौर बधिर एवं वाणी विकलांग केंद्र' में विशेष आवश्यकता वाले बच्चों को आवासीय शिक्षा दी जाती है।","हरियाणा का पहला राज्य विश्वविद्यालय 'कुरुक्षेत्र विश्वविद्यालय' (1956) करनाल के पड़ोसी जिले कुरुक्षेत्र में स्थित है।"]},
  {"q":"करनाल में स्थित 'अटल पार्क', 'कर्ण पार्क' और 'कर्ण स्टेडियम' के साथ-साथ किस ऐतिहासिक पुल को मुगलकालीन विरासत माना जाता है?","opts":["हावड़ा पुल","ताजेवाला पुल","बादशाही पुल व मुगल पुल","ओखला पुल"],"a":2,"exp":"करनाल में मुगलकालीन 'बादशाही पुल' और 'मुगल पुल' प्रमुख ऐतिहासिक विरासत हैं, जबकि अटल पार्क, कर्ण पार्क व कर्ण स्टेडियम शहर के आधुनिक आकर्षण हैं।","facts":["बादशाही पुल (करनाल के निकट पुराने जीटी रोड मार्ग पर) मुगल काल में शाहजहाँ/जहाँगीर के समय शाही काफिलों के आवागमन हेतु बनवाया गया था।","इसी मुगल मार्ग पर घरौंडा में 'मामा-भांजा सराय' और अनेक कोस मीनारें आज भी संरक्षित हैं।","करनाल में ब्रिटिश कालीन 'ऑक्टरलोनी हाउस', 'एडम हाउस' और 100 फीट ऊँचा 'छावनी चर्च टॉवर' (सेंट जेम्स चर्च) भी ऐतिहासिक धरोहर हैं।","करनाल को भारत सरकार के स्मार्ट सिटी मिशन के तहत आधुनिक पार्कों (जैसे अटल पार्क) व स्वच्छ बुनियादी ढाँचे से सुसज्जित किया गया है।","स्वच्छ सर्वेक्षण में करनाल लगातार हरियाणा के सबसे स्वच्छ शहरों में शीर्ष पर रहा है।"]},
  {"q":"देश में सबसे पहले 'ड्रोन से फसलों में स्प्रे' करने वाला और 'ऑनलाइन जमाबंदी' शुरू करने वाला हरियाणा का पहला जिला कौन-सा है?","opts":["हिसार","सिरसा","कुरुक्षेत्र","करनाल"],"a":3,"exp":"करनाल देश में सबसे पहले ड्रोन से फसलों में स्प्रे की पहल करने वाला और हरियाणा में ऑनलाइन जमाबंदी तथा सीएम विंडो शुरू करने वाला पहला जिला है।","facts":["करनाल के ही 'सिरसी' गाँव को 26 जनवरी 2020 को हरियाणा का पहला 'लाल डोरा मुक्त गाँव' घोषित किया गया था।","हरियाणा के अन्य प्रमुख डिजिटल व प्रथम पहलें: पहला वाई-फाई गाँव (जुगलान, हिसार), पहला ग्राम सचिवालय (हैबतपुर, जींद) और देश का पहला अनाज एटीएम (फर्रुखनगर, गुरुग्राम)।","करनाल में स्थित चार बड़े राष्ट्रीय कृषि शोध संस्थान (NDRI, CSSRI, IIWBR, NBAGR) इसे देश के सबसे आधुनिक कृषि जिलों में शामिल करते हैं।","हरियाणा सरकार ने भूमि रिकॉर्ड के डिजिटलीकरण हेतु 'जमाबंदी पोर्टल' (Jamabandi Haryana) संचालित किया है।","किसानों को ड्रोन तकनीक से जोड़ने हेतु सरकार द्वारा कस्टम हायरिंग सेंटर व 'नमो ड्रोन दीदी' योजना को बढ़ावा दिया जा रहा है।"]},
  {"q":"करनाल के किस क्षेत्र में 'गन्ना प्रजनन संस्थान' (Sugarcane Breeding Institute) का क्षेत्रीय अनुसंधान केंद्र स्थित है?","opts":["नीलोखेड़ी","करनाल शहर","असंध","इंद्री"],"a":1,"exp":"भारतीय कृषि अनुसंधान परिषद (ICAR) के अधीन कोयंबटूर स्थित 'गन्ना प्रजनन संस्थान' का उत्तरी क्षेत्रीय अनुसंधान केंद्र वर्ष 1932 से करनाल में कार्यरत है।","facts":["यह केंद्र उपोष्णकटिबंधीय उत्तर भारत (हरियाणा, पंजाब, उत्तर प्रदेश) के लिए गन्ने की उच्च शर्करा व रोग-प्रतिरोधी किस्में (जैसे Co 0238 आदि) विकसित करता है।","प्रसिद्ध गन्ना किस्म 'Co 0238' (करनाल द्वारा विकसित) ने पूरे उत्तर भारत के गन्ना किसानों की आय में क्रांतिकारी वृद्धि की है।","करनाल में ही 'करनाल सहकारी चीनी मिल' स्थित है, जबकि हरियाणा की सबसे बड़ी व पहली चीनी मिल 'सरस्वती शुगर मिल' (1933) यमुनानगर में है।","हरियाणा में सर्वाधिक गन्ने का उत्पादन यमुनानगर जिले में होता है।","करनाल में गन्ने के अतिरिक्त गेहूँ, बासमती धान, अमरूद और लहसुन की भी प्रमुखता से खेती होती है।"]},
  {"q":"करनाल जिले के किस गाँव में 'माता बाला सुंदरी मंदिर' स्थित है?","opts":["बड़ा गाँव","सीतामाई गाँव","सालवन गाँव","पपहाना गाँव"],"a":0,"exp":"करनाल जिले के 'बड़ा गाँव' में प्रसिद्ध 'माता बाला सुंदरी मंदिर' स्थित है।","facts":["ध्यान दें: हिमाचल प्रदेश के त्रिलोकपुर (सिरमौर, अंबाला के निकट) में भी प्रसिद्ध महामाया बाला सुंदरी मंदिर है, जबकि हरियाणा के करनाल जिले के बड़ा गाँव में माता बाला सुंदरी मंदिर स्थित है।","करनाल के अन्य प्रमुख मंदिर: सीता माई मंदिर (सीतामाई गाँव), देवी मंदिर (सालवन), परासर तीर्थ (बहलोलपुर), गोंदर तीर्थ (गोंदर) और बस्तली तीर्थ (बस्तली)।","हरियाणा के अन्य प्रमुख शक्तिपीठ/देवी मंदिर: शीतला माता मंदिर (गुरुग्राम), माता मनसा देवी (पंचकूला), भीमेश्वरी देवी (बेरी, झज्जर) और भवानी अम्बा (अंबाला)।","नवरात्रि के अवसर पर बड़ा गाँव स्थित माता बाला सुंदरी मंदिर में श्रद्धालुओं की भारी भीड़ उमड़ती है।","बड़ा गाँव करनाल जिले के इंद्री/करनाल क्षेत्र के अंतर्गत आता है।"]},
  {"q":"हरियाणा में 'ऑक्सीवन योजना' (Oxyvan — शहरी वन विकास) की शुरुआत 5 जून 2021 को किन दो जिलों से की गई थी?","opts":["हिसार और सिरसा","रोहतक और झज्जर","करनाल और पंचकूला","रेवाड़ी और महेंद्रगढ़"],"a":2,"exp":"विश्व पर्यावरण दिवस (5 जून 2021) के अवसर पर हरियाणा सरकार ने करनाल (मुगल कैनाल क्षेत्र में 80 एकड़) और पंचकूला से 'ऑक्सीवन योजना' की शुरुआत की थी।","facts":["ऑक्सीवन का उद्देश्य शहरी क्षेत्रों में प्राकृतिक ऑक्सीजन हब तैयार करना और लगभग 3 करोड़ पौधे लगाने का लक्ष्य पूरा करना था।","इसी दिन (5 जून 2021) हरियाणा सरकार ने 75 वर्ष से अधिक पुराने पेड़ों के संरक्षण हेतु 'प्राण वायु देवता पेंशन योजना' भी प्रारंभ की।","ISFR 2023 के अनुसार हरियाणा में सर्वाधिक वन प्रतिशत पंचकूला में और सबसे कम वन प्रतिशत फतेहाबाद में है।","हरियाणा वन विकास निगम (HFDC) की स्थापना दिसंबर 1989 में हुई थी।","करनाल में 'अटल पार्क' और 'ऑक्सीवन' शहर के प्रमुख हरित फेफड़े (Green Lungs) के रूप में विकसित किए गए हैं।"]},
  {"q":"1739 के करनाल युद्ध में ईरानी आक्रमणकारी नादिरशाह के विरुद्ध मुगल सम्राट मुहम्मद शाह का साथ देते हुए किस वीर ने बलिदान दिया था?","opts":["राजा नाहर सिंह","मोहन सिंह मंडार","भाई उदय सिंह","राव बालकिशन"],"a":3,"exp":"24 फरवरी 1739 के करनाल युद्ध में रेवाड़ी के शासक राव बालकिशन ने मुगल बादशाह मुहम्मद शाह की ओर से नादिरशाह के विरुद्ध लड़ते हुए वीरगति प्राप्त की थी।","facts":["राव बालकिशन की वीरता से प्रभावित होकर बादशाह मुहम्मद शाह ने उनके भाई राव गुजरमल को 'राव बहादुर' की उपाधि व रेवाड़ी की जागीर प्रदान की थी।","राव बालकिशन महान स्वतंत्रता सेनानी राव तुलाराम के पूर्वज थे।","नादिरशाह ने इस युद्ध में विजय के बाद दिल्ली में कत्लेआम मचाया और मयूर सिंहासन व कोहिनूर हीरा लेकर ईरान लौट गया।","करनाल का युद्ध भारत के मध्यकालीन इतिहास के सबसे निर्णायक युद्धों में गिना जाता है।","HSSC परीक्षाओं में 'करनाल युद्ध में मुहम्मद शाह का साथ किसने दिया' (बालकिशन) प्रश्न पूछा जाता है।"]},
  {"q":"करनाल में स्थित 'छावनी चर्च' (सेंट जेम्स चर्च टॉवर) की ऊँचाई लगभग कितनी है और इसके शीर्ष पर क्या लगा है?","opts":["50 फीट — स्वर्ण कलश","100 फीट — धातु का क्रॉस","200 फीट — तांबे का गुंबद","75 फीट — संगमरमर की मीनार"],"a":1,"exp":"करनाल में ब्रिटिश काल में निर्मित ऐतिहासिक सेंट जेम्स चर्च (छावनी चर्च टॉवर) लगभग 100 फीट ऊँचा है, जिसके शीर्ष पर धातु का क्रॉस लगा है और इसे मीलों दूर से देखा जा सकता है।","facts":["इसका निर्माण 1806–1811 के बीच करनाल ब्रिटिश छावनी के दौरान किया गया था।","1843 में जब ब्रिटिश छावनी मलेरिया के कारण अंबाला शिफ्ट हुई, तो चर्च के मुख्य ढाँचे को अंबाला (सेंट पॉल चर्च) ले जाया गया, लेकिन यह भव्य 100 फीट ऊँचा टॉवर करनाल में ही सुरक्षित रहा।","यह टॉवर भारतीय पुरातत्व सर्वेक्षण (ASI) द्वारा संरक्षित राष्ट्रीय महत्व का स्मारक है।","अंबाला कैंट का सेंट पॉल चर्च (1857) भी हरियाणा का दूसरा प्रमुख ऐतिहासिक ब्रिटिश कालीन चर्च है।","करनाल में ब्रिटिश काल के अन्य स्मारक: विक्टोरिया/गांधी मेमोरियल हॉल, ऑक्टरलोनी हाउस, एडम हाउस और यूरोपीय कब्रिस्तान।"]},
  {"q":"हरियाणा के किन दो प्रमुख जिलों में 'अमरूद' और 'लहसुन' के साथ-साथ 'तरावड़ी बासमती' के उत्पादन हेतु करनाल अग्रणी रहा है?","opts":["करनाल (अमरूद, लहसुन व बासमती चावल)","सिरसा (केवल चाय व कॉफी)","नूंह (केवल सेब व केसर)","महेंद्रगढ़ (केवल जूट व रबर)"],"a":0,"exp":"करनाल जिला हरियाणा में अमरूद, लहसुन और विश्व प्रसिद्ध तरावड़ी बासमती चावल के उत्पादन में अग्रणी रहा है।","facts":["करनाल के घरौंडा में इंडो-इज़राइल सहयोग से 'सब्जी उत्कृष्टता केंद्र' (2011) और अंजनथली में 'महाराणा प्रताप बागवानी विश्वविद्यालय' (2016) स्थित हैं।","फतेहाबाद के भूना में भी राज्य का प्रमुख 'अमरूद प्रदर्शन एवं अनुसंधान केंद्र' स्थित है।","कैथल के प्राचीन हड़प्पा स्थल 'बालू' से भारत में लहसुन का प्राचीनतम पुरातात्विक साक्ष्य मिला था।","करनाल की अनाज मंडी और तरावड़ी की बासमती मिलें भारत के कुल बासमती निर्यात में बड़ा योगदान देती हैं।","हरियाणा में सर्वाधिक खुम्बी (मशरूम) का उत्पादन सोनीपत जिले में होता है।"]},
  {"q":"करनाल के 'अर्जुन अवार्डी' दिग्गज बास्केटबॉल खिलाड़ी कौन हैं जिन्होंने 1980 के मास्को ओलंपिक में भारत का प्रतिनिधित्व किया था?","opts":["ओम प्रकाश","बलवंत सिंह","अजमेर सिंह चोपड़ा","मंजीत सिंह चहल"],"a":2,"exp":"करनाल से संबंधित अर्जुन पुरस्कार विजेता अजमेर सिंह चोपड़ा भारत के महान बास्केटबॉल खिलाड़ी थे, जिन्होंने 1980 के मास्को ओलंपिक में भारत का प्रतिनिधित्व किया।","facts":["1980 के मास्को ओलंपिक में वे भारत की ओर से सर्वाधिक स्कोर करने वाले बास्केटबॉल खिलाड़ियों में शामिल थे।","उन्हें वर्ष 1982 में भारत सरकार द्वारा 'अर्जुन पुरस्कार' से सम्मानित किया गया।","करनाल की ही महिला बास्केटबॉल खिलाड़ी 'शीबा मग्गोन' को 'क्वीन ऑफ बास्केटबॉल' कहा जाता है और वे पहली भारतीय महिला अंतर्राष्ट्रीय रेफरी बनीं।","अन्य विकल्पों में बलवंत सिंह (कैथल—वॉलीबॉल), मंजीत सिंह चहल (जींद—800 मी. दौड़) और ओम प्रकाश (जींद—बास्केटबॉल) हैं।","करनाल में खेल प्रशिक्षण हेतु 'कर्ण स्टेडियम' प्रमुख केंद्र है।"]},
  {"q":"हरियाणा के किस जिले में मूक-बधिर (वाक् एवं श्रवण बाधित) विद्यार्थियों के लिए 'माता प्रकाश कौर केंद्र' तथा राज्य का विशेष विश्वविद्यालय प्रस्तावित/स्थापित किया गया है?","opts":["रोहतक","फरीदाबाद","गुरुग्राम","करनाल"],"a":3,"exp":"करनाल जिले में 'माता प्रकाश कौर बधिर एवं वाणी विकलांग केंद्र / आवासीय विद्यालय' स्थित है और यहीं मूक-बधिर विद्यार्थियों के लिए विशेष उच्च शिक्षा संस्थान/विश्वविद्यालय प्रस्तावित किया गया।","facts":["यह केंद्र हरियाणा राज्य बाल कल्याण परिषद द्वारा संचालित है और विशेष आवश्यकता वाले बच्चों को कौशल व शिक्षा प्रदान करता है।","करनाल में ही 2016 में हरियाणा का पहला बागवानी विश्वविद्यालय (अंजनथली) और कुटैल में पंडित दीनदयाल उपाध्याय स्वास्थ्य विज्ञान विश्वविद्यालय स्थापित हुए।","करनाल के नीलोखेड़ी में हरियाणा का पहला पॉलिटेक्निक कॉलेज (गुरु ब्रह्मानंद पॉलिटेक्निक) स्थित है।","करनाल में ही वर्ष 1991 में IGNOU का क्षेत्रीय केंद्र स्थापित हुआ था।","शिक्षा व चिकित्सा संस्थानों के व्यापक विस्तार ने करनाल को उत्तर हरियाणा का अग्रणी ज्ञान केंद्र बना दिया है।"]},
  {"q":"करनाल के किस गाँव में 'पांडु मेला' और किस गाँव में 'गोगा पीर का मेला' आयोजित होता है?","opts":["अमूपुर और इंद्री","पपहाना और खेड़ा","बड़ा गाँव और सालवन","सीतामाई और गोंदर"],"a":1,"exp":"करनाल जिले के असंध क्षेत्र के 'पपहाना' गाँव में प्रसिद्ध 'पांडु मेला' और 'खेड़ा' गाँव में 'गोगा पीर का मेला' आयोजित होता है।","facts":["करनाल के अन्य प्रमुख मेले: बाबा सिमरन दास का मेला (इंद्री), छड़ियों का मेला (अमूपुर) और परासर का मेला (तरावड़ी)।","ध्यान दें: हरियाणा में सबसे बड़ा गोगा पीर (गोगा नवमी) का मेला इस्लामपुर (गुरुग्राम) में और बादली (झज्जर) में लगता है।","पपहाना गाँव महाभारतकालीन पांडवों से जुड़ा ऐतिहासिक स्थल माना जाता है।","करनाल के सालवन गाँव को अनेक मेलों के कारण 'मेलों का गाँव' कहा जाता है।","इन ग्रामीण मेलों में पारंपरिक कुश्ती, कबड्डी और लोक संगीत के आयोजन होते हैं।"]},
  {"q":"करनाल के किस स्थान पर 'हरियाणा ग्रामीण विकास संस्थान' (HIRD) की स्थापना वर्ष 1990 में हुई थी?","opts":["नीलोखेड़ी","कुंजपुरा","असंध","घरौंडा"],"a":0,"exp":"हरियाणा ग्रामीण विकास संस्थान (Haryana Institute of Rural Development - HIRD) की स्थापना वर्ष 1990 में नीलोखेड़ी (करनाल) में हुई थी।","facts":["HIRD पंचायती राज प्रतिनिधियों (सरपंचों, पंचों, पंचायत समिति व जिला परिषद सदस्यों) तथा ग्रामीण विकास अधिकारियों को प्रशिक्षण देने वाला राज्य का सर्वोच्च संस्थान है।","नीलोखेड़ी में ही हरियाणा का पहला पॉलिटेक्निक कॉलेज और राज्य का प्रसिद्ध 'पोल्ट्री प्रशिक्षण केंद्र' भी स्थित है।","राज्य के सिविल सेवकों (IAS/HCS) का प्रशिक्षण संस्थान 'हिपा' (HIPA, 1983) गुरुग्राम में स्थित है।","हरियाणा पंचायती राज अधिनियम 22 अप्रैल 1994 को लागू हुआ था।","नीलोखेड़ी आजादी के बाद शरणार्थी पुनर्वास के आदर्श मॉडल ('मजदूर मंजिल') के रूप में भी इतिहास में प्रसिद्ध है।"]},
  {"q":"करनाल जिले के प्रसिद्ध निशानेबाज 'हरप्रीत सिंह' ने 2010 के नई दिल्ली राष्ट्रमंडल खेलों में कौन-सा पदक जीता था?","opts":["रजत पदक","कांस्य पदक","स्वर्ण पदक","कोई पदक नहीं"],"a":2,"exp":"करनाल के प्रसिद्ध भारतीय निशानेबाज हरप्रीत सिंह ने 2010 के नई दिल्ली राष्ट्रमंडल खेलों (25 मीटर सेंटर फायर पिस्टल—व्यक्तिगत व जोड़ी वर्ग) में दो स्वर्ण पदक जीते थे।","facts":["उन्होंने 2014 के ग्लासगो राष्ट्रमंडल खेलों में भी 25 मीटर रैपिड फायर पिस्टल वर्ग में रजत पदक हासिल किया था।","करनाल के ही युवा निशानेबाज अनीश भनवाला ने 2018 गोल्ड कोस्ट राष्ट्रमंडल खेलों में मात्र 15 वर्ष की उम्र में स्वर्ण पदक जीता।","करनाल के अन्य प्रमुख खिलाड़ी: नवदीप सैनी (क्रिकेट), शीबा मग्गोन (बास्केटबॉल) और अजमेर सिंह चोपड़ा (बास्केटबॉल, अर्जुन अवार्ड)।","2010 नई दिल्ली राष्ट्रमंडल खेलों में भारत ने कुल 101 पदक (38 स्वर्ण) जीते थे, जिनमें हरियाणा के खिलाड़ियों की बड़ी हिस्सेदारी थी।","हरियाणा की खेल नीति में राष्ट्रमंडल स्वर्ण विजेता को 1.5 करोड़ रुपये की पुरस्कार राशि दी जाती है।"]},
  {"q":"करनाल जिले के 'मधुबन' में निम्न में से कौन-से दो प्रमुख संस्थान/स्थल एक साथ स्थित हैं?","opts":["सैनिक स्कूल और बागवानी विश्वविद्यालय","NDRI और CSSRI","सब्जी उत्कृष्टता केंद्र और NCC अकादमी","हरियाणा पुलिस अकादमी (HPA) और फोरेंसिक साइंस लैब (FSL)"],"a":3,"exp":"करनाल जिले के मधुबन (NH-44 पर स्थित) में 'हरियाणा पुलिस अकादमी' (HPA) और राज्य की प्रमुख 'फोरेंसिक साइंस लैबोरेटरी' (FSL) स्थित हैं।","facts":["मधुबन में ही सूफी परंपरा की प्रसिद्ध 'पाँच पीरों की मजार' भी स्थित है।","यहाँ हरियाणा पुलिस के नए भर्ती हुए कांस्टेबल, सब-इंस्पेक्टर और डीएसपी (DSP) अधिकारियों को प्रशिक्षण दिया जाता है।","मधुबन में हरियाणा सशस्त्र पुलिस (HAP) की पहली, दूसरी व चौथी बटालियनों के मुख्यालय भी स्थित हैं।","करनाल के ही 'नेवल' गाँव में 'हरियाणा कमांडो पुलिस ट्रेनिंग सेंटर' कार्यरत है।","FSL की स्थापना 1973 में रोहतक में हुई थी और 1976 में इसे मधुबन स्थानांतरित किया गया।"]},
  {"q":"करनाल शहर में स्थित 'खरोष्ठी लिपि में अंकित अभिलेख' और 'सूर्य भगवान व दानवीर कर्ण की मूर्तियाँ' किस बात का प्रमाण हैं?","opts":["केवल ब्रिटिश शासन का","करनाल के प्राचीन ऐतिहासिक व सांस्कृतिक महत्व का","केवल 19वीं सदी के उद्योगों का","केवल आधुनिक स्मार्ट सिटी का"],"a":1,"exp":"करनाल से प्राप्त खरोष्ठी लिपि का अभिलेख, असंध का कुषाण स्तूप और सूर्य देव व कर्ण की प्राचीन मूर्तियाँ करनाल के प्राचीन काल (महाभारत से कुषाण-गुप्तकाल) के समृद्ध इतिहास का प्रमाण हैं।","facts":["खरोष्ठी लिपि प्राचीन उत्तर-पश्चिम भारत (मौर्य व कुषाण काल) में दाएँ से बाएँ लिखी जाती थी।","असंध को पांडव वंशज राजा परीक्षित ने अपनी राजधानी बनाया था और यहाँ विशाल कुषाणकालीन बौद्ध स्तूप स्थित है।","करनाल के बस्तली (महर्षि वेदव्यास), बहलोलपुर (परासर ऋषि) और गोंदर (गौतम ऋषि) वैदिक व महाभारतकालीन ऋषि परंपरा के केंद्र रहे हैं।","करनाल का 'तरावड़ी' 1191–1192 के तराइन युद्धों का साक्षी रहा है।","करनाल में ही 24 फरवरी 1739 को मुगल साम्राज्य और नादिरशाह के बीच ऐतिहासिक करनाल का युद्ध लड़ा गया था।"]},
  {"q":"करनाल जिले की 'करनाल मंडी' व 'तरावड़ी' के साथ-साथ जिले में स्थित चार बड़े ICAR राष्ट्रीय शोध संस्थानों का सही समूह कौन-सा है?","opts":["NDRI, CSSRI, IIWBR और NBAGR","CIRB, NRCE, HARSAC और LUVAS","NBRC, NISE, IIPM और NHB","NCIPM, AJNIFM, YMCA और TITS"],"a":0,"exp":"करनाल में भारतीय कृषि अनुसंधान परिषद (ICAR) के चार प्रमुख राष्ट्रीय संस्थान स्थित हैं: NDRI (1955), CSSRI (1969), IIWBR/DWR (1978) और NBAGR (1984/85)।","facts":["अन्य विकल्पों में CIRB, NRCE व HARSAC हिसार में; NBRC, NISE, IIPM व NHB गुरुग्राम में; और NCIPM व AJNIFM फरीदाबाद में स्थित हैं।","करनाल में इसके अतिरिक्त 'गन्ना प्रजनन संस्थान' (क्षेत्रीय केंद्र, 1932) और 'गेहूँ का जीन बैंक' भी स्थित हैं।","घरौंडा (करनाल) में 2011 में स्थापित 'सब्जी उत्कृष्टता केंद्र' और अंजनथली में 'महाराणा प्रताप बागवानी विश्वविद्यालय' (2016) स्थित हैं।","इसी वैज्ञानिक कृषि पारिस्थितिकी के कारण करनाल को हरियाणा का 'एग्रो हब' कहा जाता है।","HSSC की परीक्षाओं में इन चारों शोध संस्थानों के स्थान (करनाल) और स्थापना वर्ष बार-बार पूछे जाते हैं।"]},
  {"q":"करनाल जिले के वर्तमान (2026) प्रशासनिक व हरियाणा के अपडेटेड ढाँचे के संबंध में कौन-सा कथन पूर्णतः सही है?","opts":["करनाल अंबाला मंडल में है और हरियाणा में 22 जिले हैं","करनाल में कोई नगर निगम नहीं है और हरियाणा में 4 कमिश्नरेट हैं","करनाल मंडल में 3 जिले (करनाल, पानीपत, कैथल) हैं और 2026 में हरियाणा में 23 जिले हैं","करनाल के विधायक हरविन्द्र कल्याण मुख्यमंत्री हैं और हरियाणा में 10 नगर निगम हैं"],"a":2,"exp":"करनाल स्वयं एक प्रशासनिक मंडल है जिसमें 3 जिले (करनाल, पानीपत, कैथल) आते हैं, और 22 दिसंबर 2025 को हांसी 23वाँ जिला बनने के बाद 2026 में हरियाणा में कुल 23 जिले हैं।","facts":["करनाल जिला सार (2026): स्थापना 1 नवंबर 1966, क्षेत्रफल 2,520 वर्ग किमी, 4 उपमंडल, 5 तहसीलें, 3 उप-तहसीलें, 8 ब्लॉक, 5 विधानसभा सीटें, नगर निगम करनाल और स्मार्ट सिटी।","2024–2026 राजनीतिक सार: करनाल लोकसभा सांसद मनोहर लाल खट्टर (केंद्रीय मंत्री) और घरौंडा विधायक हरविन्द्र कल्याण (15वीं हरियाणा विधानसभा के अध्यक्ष/Speaker)।","हरियाणा अपडेटेड सार (2026): 23 जिले (23वाँ—हांसी, 22 दिसंबर 2025), 6 प्रशासनिक मंडल (हिसार व रोहतक मंडल में 5-5 जिले), 5 पुलिस रेंज, 5 पुलिस कमिश्नरेट (गुरुग्राम, फरीदाबाद, पंचकूला, सोनीपत, झज्जर) और 24 पुलिस जिले।","हरियाणा में कुल 11 नगर निगम, 90 विधानसभा सीटें (17 SC), 10 लोकसभा सीटें (2 SC: अंबाला व सिरसा) और 5 राज्यसभा सीटें हैं।","हरियाणा के 3 जिले—रोहतक, चरखी दादरी और हांसी—किसी भी अन्य राज्य या केंद्रशासित प्रदेश की सीमा को स्पर्श नहीं करते।"]}
];

let order = QUESTIONS.map((_, i) => i), pos = 0, answers = {};
const $ = id => document.getElementById(id);

$('totalPill').textContent = `${QUESTIONS.length} यूनिक प्रश्न`;

function render() {
  const idx = order[pos], q = QUESTIONS[idx], chosen = answers[idx];
  $('counter').textContent = `प्रश्न ${pos + 1} / ${order.length}`;
  $('qno').textContent = `प्रश्न ${idx + 1}`;
  $('question').textContent = q.q;
  $('options').innerHTML = '';

  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'option';
    b.disabled = chosen !== undefined;

    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = 'ABCD'[i];

    const txt = document.createElement('span');
    txt.textContent = o;

    b.append(letter, txt);
    if (chosen !== undefined) {
      if (i === q.a) b.classList.add('correct');
      else if (i === chosen) b.classList.add('wrong');
    }
    b.onclick = () => {
      if (answers[idx] !== undefined) return;
      answers[idx] = i;
      render();
    };
    $('options').appendChild(b);
  });

  const fb = $('feedback');
  if (chosen !== undefined) {
    fb.className = 'feedback ' + (chosen === q.a ? 'good' : 'bad');
    fb.innerHTML = '';

    const status = document.createElement('strong');
    status.textContent = chosen === q.a ? '✓ बिल्कुल सही उत्तर!' : '✗ आपका उत्तर गलत है';

    const ansDiv = document.createElement('div');
    ansDiv.innerHTML = '<b>सही उत्तर: </b>';
    const ansSpan = document.createElement('span');
    ansSpan.textContent = q.opts[q.a];
    ansDiv.appendChild(ansSpan);

    const expDiv = document.createElement('div');
    expDiv.style.marginTop = '7px';
    expDiv.innerHTML = '<b>विस्तृत व्याख्या: </b>';
    const expSpan = document.createElement('span');
    expSpan.textContent = q.exp;
    expDiv.appendChild(expSpan);

    fb.append(status, ansDiv, expDiv);

    if (Array.isArray(q.facts) && q.facts.length > 0) {
      const box = document.createElement('div');
      box.className = 'facts-box';

      const title = document.createElement('div');
      title.className = 'facts-title';
      title.textContent = '📌 परीक्षा उपयोगी अतिरिक्त तथ्य (Updated 2026):';

      const ul = document.createElement('ul');
      ul.className = 'facts-list';
      q.facts.forEach(fact => {
        const li = document.createElement('li');
        li.textContent = fact;
        ul.appendChild(li);
      });

      box.append(title, ul);
      fb.appendChild(box);
    }
  } else {
    fb.className = 'feedback hidden';
    fb.textContent = '';
  }

  $('prev').disabled = pos === 0;
  $('next').textContent = pos === order.length - 1 ? 'परिणाम देखें' : 'अगला प्रश्न';

  const done = Object.keys(answers).length;
  $('answered').textContent = `हल किए: ${done} / ${QUESTIONS.length}`;
  $('bar').style.width = (done / QUESTIONS.length * 100) + '%';
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
}

function showResult() {
  const right = QUESTIONS.filter((q, i) => answers[i] === q.a).length;
  const done = Object.keys(answers).length;
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('score').textContent = `${right} / ${QUESTIONS.length}`;
  $('summary').textContent = `आपने ${done} प्रश्न हल किए। सही: ${right}, गलत: ${done - right}, छोड़े: ${QUESTIONS.length - done}। प्रतिशत: ${(right / QUESTIONS.length * 100).toFixed(1)}%`;
}

$('prev').onclick = () => { if (pos > 0) { pos--; render(); window.scrollTo(0, 0); } };
$('next').onclick = () => { if (pos < order.length - 1) { pos++; render(); window.scrollTo(0, 0); } else showResult(); };
$('restart').onclick = () => { answers = {}; pos = 0; render(); window.scrollTo(0, 0); };
$('review').onclick = () => { pos = 0; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

render();
</script>
</body>
</html>
