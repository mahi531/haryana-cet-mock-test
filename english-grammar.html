<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a365d">
<title>English Grammar Book | HSSC Mock Test Wala</title>
<style>
:root{
  --paper:#f3ece2;--page:#ffffff;--ink:#1f2328;--muted:#5a626a;
  --navy:#1a365d;--navy-soft:#eef3f9;--accent:#9a3412;
  --ok:#146c43;--ok-bg:#e8f5ee;--wait:#8a5a00;--wait-bg:#fff5db;
  --line:#d8d0c4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Noto Serif Devanagari","Mangal",Arial,sans-serif;line-height:1.6}
.hero{background:var(--page);border-bottom:4px double #222;padding:24px 16px 20px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.brand{font:bold 11.5px/1 Arial,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.hero h1{margin:0;font-size:28px;color:#111;letter-spacing:.6px}
.hero .sub-hi{margin:5px 0 3px;font-size:15.5px;font-weight:bold;color:var(--navy)}
.hero .sub-meta{margin:0;font:13px/1.5 Arial,sans-serif;color:var(--muted)}
main{max-width:1020px;margin:18px auto 48px;padding:0 14px}
.top-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.back-btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:#fff;color:var(--navy);border:1px solid #b8c2cc;padding:9px 14px;border-radius:7px;font:bold 13px Arial,sans-serif;transition:.15s}
.back-btn:hover{background:var(--navy-soft);border-color:var(--navy)}
.stats-pill{font:bold 13px Arial,sans-serif;background:var(--navy);color:#fff;padding:8px 14px;border-radius:20px}
.controls{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 3px 12px rgba(30,25,20,.05)}
.search-box{flex:1 1 240px;padding:10px 13px;border:1px solid #c6cdd5;border-radius:7px;font:14px Arial,"Noto Sans Devanagari",sans-serif;outline:none}
.search-box:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,54,93,.1)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filter-btn{font:bold 12.5px Arial,sans-serif;padding:8px 12px;border-radius:6px;border:1px solid #c5cdd6;background:#fff;color:#334155;cursor:pointer;transition:.15s}
.filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}
.topic-card{background:var(--page);border:1px solid var(--line);border-left:5px solid #9aa5b1;border-radius:10px;padding:18px 18px 16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 14px rgba(30,25,20,.06);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.topic-card.is-ready{border-left-color:var(--navy)}
.topic-card.is-ready:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(26,54,93,.13)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ch-num{font:bold 12px Arial,sans-serif;background:#1f2937;color:#fff;padding:3px 9px;border-radius:4px;letter-spacing:.5px}
.topic-card.is-ready .ch-num{background:var(--navy)}
.badge{font:bold 11.5px Arial,sans-serif;padding:4px 9px;border-radius:14px}
.badge-ready{background:var(--ok-bg);color:var(--ok)}
.badge-soon{background:var(--wait-bg);color:var(--wait)}
.topic-card h2{margin:0 0 4px;font-size:18.5px;color:#111;line-height:1.3}
.meaning-hi{font-size:14px;font-weight:bold;color:var(--navy);margin-bottom:7px}
.desc{font:13.5px/1.55 Arial,"Noto Sans Devanagari",sans-serif;color:var(--muted);margin:0 0 15px}
.open-btn{display:block;text-align:center;text-decoration:none;background:var(--navy);color:#fff;padding:10px 14px;border-radius:7px;font:bold 13.5px Arial,sans-serif;transition:.15s}
.open-btn:hover{background:#122744}
.soon-bar{display:block;text-align:center;background:#f5f2ec;color:#7a7267;border:1px dashed #ccc3b5;padding:9px 12px;border-radius:7px;font:bold 12.5px Arial,sans-serif}
.empty-box{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted);font:14.5px Arial,sans-serif}
@media(max-width:560px){.hero h1{font-size:23px}.grid{grid-template-columns:1fr}.topic-card{padding:16px}}
</style>
</head>
<body>
<header class="hero">
  <div class="brand">HSSC Mock Test Wala • English Grammar Book</div>
  <h1>ENGLISH GRAMMAR</h1>
  <div class="sub-hi">संपूर्ण अंग्रेजी व्याकरण — किताब जैसा सरल अध्ययन</div>
  <p class="sub-meta">14 प्रमुख अध्याय • हिंदी व English में व्याख्या • Rules • Quick Revision • Practice Exercise</p>
</header>
<main>
  <div class="top-bar">
    <a class="back-btn" href="vocabulary.html">← Vocabulary &amp; Grammar</a>
    <span class="stats-pill" id="statsPill">जाँच हो रही है…</span>
  </div>
  <div class="controls">
    <input type="search" id="searchInput" class="search-box" placeholder="अध्याय खोजें (जैसे: Subject, Tense, Noun, Voice)…">
    <div class="filters">
      <button class="filter-btn active" data-filter="all" type="button">सभी (14)</button>
      <button class="filter-btn" data-filter="ready" type="button">उपलब्ध</button>
      <button class="filter-btn" data-filter="soon" type="button">जल्द आ रहे हैं</button>
    </div>
  </div>
  <div class="grid" id="topicGrid">
    <div class="empty-box">Grammar Topics लोड हो रहे हैं…</div>
  </div>
</main>
<script>
(async function(){
  const TOPICS = [
    {id:"subject-verb-agreement",title:"Subject Verb Agreement",meaning_hi:"कर्ता और क्रिया का मेल",description:"Singular और Plural Subject के अनुसार सही Verb के सभी 27 नियम व अभ्यास।"},
    {id:"tense",title:"Tense",meaning_hi:"काल (समय एवं अवस्था)",description:"Present, Past और Future के 12 Tenses, Formulae, Confusing Pairs व अभ्यास।"},
    {id:"question-tag",title:"Question Tag",meaning_hi:"प्रश्न टैग",description:"Positive और Negative वाक्यों के Question Tag बनाने के नियम व अपवाद।"},
    {id:"conditional-sentence",title:"Conditional Sentence",meaning_hi:"शर्त वाले वाक्य",description:"Zero, First, Second और Third Conditional वाक्यों के नियम व उदाहरण।"},
    {id:"noun",title:"Noun",meaning_hi:"संज्ञा",description:"Noun के प्रकार, Number, Gender, Possessive Case और महत्वपूर्ण नियम।"},
    {id:"pronoun",title:"Pronoun",meaning_hi:"सर्वनाम",description:"Personal, Relative, Reflexive, Indefinite और Distributive Pronouns।"},
    {id:"adjective",title:"Adjective",meaning_hi:"विशेषण",description:"Degrees of Comparison, Correct Usage और महत्वपूर्ण Adjectives के नियम।"},
    {id:"conjunction",title:"Conjunction",meaning_hi:"समुच्चयबोधक अव्यय",description:"Correlative Pairs (No sooner...than, Hardly...when) और प्रमुख नियम।"},
    {id:"article",title:"Article",meaning_hi:"उपपद (A, An, The)",description:"Definite व Indefinite Articles का सही प्रयोग और Omission of Articles।"},
    {id:"preposition",title:"Preposition",meaning_hi:"संबंधबोधक अव्यय",description:"Time, Place, Direction और परीक्षा में पूछे जाने वाले Fixed Prepositions।"},
    {id:"adverb",title:"Adverb",meaning_hi:"क्रिया-विशेषण",description:"Adverb के प्रकार, सही स्थान, Too/Enough और Inversion के नियम।"},
    {id:"words-often-confused",title:"Words Often Confused & Misused",meaning_hi:"समान दिखने वाले भ्रमित शब्द",description:"अर्थ और प्रयोग में भ्रमित करने वाले प्रमुख अंग्रेजी शब्दों का अंतर।"},
    {id:"passive-voice",title:"Passive Voice",meaning_hi:"वाच्य (Active & Passive)",description:"सभी Tenses, Modals, Imperative और Interrogative वाक्यों का Passive Voice।"},
    {id:"narration",title:"Narration",meaning_hi:"कथन (Direct & Indirect)",description:"Direct से Indirect Speech बदलने के Tense, Pronoun और सभी विशेष नियम।"}
  ];

  const grid = document.getElementById('topicGrid');
  const statsPill = document.getElementById('statsPill');
  const searchInput = document.getElementById('searchInput');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let allTopics = [];
  let currentFilter = 'all';

  async function checkJsonExists(id){
    try{
      const r = await fetch(encodeURIComponent(id) + '.json?v=' + Date.now(), { cache:'no-store' });
      return r.ok;
    }catch{
      return false;
    }
  }

  function render(){
    const q = (searchInput.value || '').trim().toLowerCase();
    const list = allTopics.filter(t => {
      if(currentFilter === 'ready' && !t.isReady) return false;
      if(currentFilter === 'soon' && t.isReady) return false;
      if(!q) return true;
      const hay = (t.title + ' ' + (t.meaning_hi||'') + ' ' + (t.description||'')).toLowerCase();
      return hay.includes(q);
    });

    if(!list.length){
      grid.innerHTML = '<div class="empty-box">इस खोज या फ़िल्टर के लिए कोई अध्याय नहीं मिला।</div>';
      return;
    }

    grid.innerHTML = list.map(t => `
      <article class="topic-card ${t.isReady ? 'is-ready' : ''}">
        <div>
          <div class="card-top">
            <span class="ch-num">अध्याय ${String(t.num).padStart(2,'0')}</span>
            <span class="badge ${t.isReady ? 'badge-ready' : 'badge-soon'}">${t.isReady ? '✓ उपलब्ध' : 'जल्द आ रहा है'}</span>
          </div>
          <h2>${esc(t.title)}</h2>
          ${t.meaning_hi ? `<div class="meaning-hi">${esc(t.meaning_hi)}</div>` : ''}
          ${t.description ? `<p class="desc">${esc(t.description)}</p>` : ''}
        </div>
        ${t.isReady
          ? `<a class="open-btn" href="grammar-topic.html?topic=${encodeURIComponent(t.id)}">अध्याय पढ़ें व अभ्यास करें →</a>`
          : `<span class="soon-bar">सामग्री तैयार की जा रही है</span>`
        }
      </article>
    `).join('');
  }

  allTopics = await Promise.all(TOPICS.map(async (t, i) => {
    const exists = await checkJsonExists(t.id);
    return { ...t, num: i + 1, isReady: exists };
  }));

  const readyCount = allTopics.filter(t => t.isReady).length;
  statsPill.textContent = `${readyCount} / ${allTopics.length} अध्याय उपलब्ध`;
  document.querySelector('[data-filter="all"]').textContent = `सभी (${allTopics.length})`;
  document.querySelector('[data-filter="ready"]').textContent = `उपलब्ध (${readyCount})`;
  document.querySelector('[data-filter="soon"]').textContent = `जल्द आ रहे हैं (${allTopics.length - readyCount})`;

  render();

  searchInput.addEventListener('input', render);
  filterBtns.forEach(btn => btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  }));
})();
</script>
</body>
</html>
