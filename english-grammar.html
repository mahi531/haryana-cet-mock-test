<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1769e0"><title>English Grammar Topics | HSSC Mock Test Wala</title>
<style>
:root{--bg:#f3f6fb;--ink:#172033;--muted:#64748b;--line:#dce4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Devanagari",sans-serif}header{background:linear-gradient(120deg,#153d70,#1684c7);color:#fff;padding:23px 15px;text-align:center}header h1{margin:0 0 7px;font-size:24px}header p{margin:0;font-size:14px}main{max-width:1000px;margin:20px auto;padding:0 14px 40px}.back{display:inline-block;text-decoration:none;background:#e5edf9;color:#174477;padding:10px 14px;border-radius:10px;font-weight:700}.intro{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin:14px 0;color:#475569;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.topic{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 4px 14px #18385b0b}.topic h2{font-size:17px;margin:0 0 7px;color:#174477}.topic p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 12px}.open-topic{display:inline-block;text-decoration:none;background:#1769e0;color:#fff;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:700}.status{display:inline-block;border-radius:18px;padding:6px 10px;font-size:11px;font-weight:800;background:#fff3d6;color:#946200}@media(max-width:520px){header h1{font-size:21px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topic{padding:13px}.topic h2{font-size:15px}}
</style></head><body><header><h1>📝 English Grammar</h1><p>14 महत्वपूर्ण टॉपिक • हिंदी में व्याख्या • PDF • MCQ Practice</p></header>
<main><a class="back" href="vocabulary.html">← Vocabulary & Grammar</a><div class="intro">नीचे दिए गए 14 टॉपिक आपकी भेजी हुई Contents सूची के अनुसार हैं। जिन टॉपिक की सामग्री अभी अपलोड नहीं हुई है, उन पर <b>जल्द आ रहा है</b> दिखाया जाएगा।</div><div class="grid" id="topicGrid"><div class="intro">Grammar Topics लोड हो रहे हैं…</div></div></main>
<script>
(async function(){const grid=document.getElementById('topicGrid');try{const r=await fetch('grammar-topics.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();grid.innerHTML=(d.topics||[]).map((t,i)=>`<article class="topic"><h2>${i+1}. ${esc(t.title)}</h2><p>${esc(t.meaning_hi||'')}<br>${esc(t.description||'')}</p>${t.status==='ready'?`<a class="open-topic" href="grammar-topic.html?topic=${encodeURIComponent(t.id)}">टॉपिक पढ़ें और Practice करें →</a>`:`<span class="status">जल्द आ रहा है</span>`}</article>`).join('')}catch(e){grid.innerHTML='<div class="intro">टॉपिक लोड नहीं हो पाए। grammar-topics.json को इसी फ़ोल्डर में अपलोड करें।</div>'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();
</script></body></html>
