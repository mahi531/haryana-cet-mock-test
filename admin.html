<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Registered Users</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            display: none; /* पहले पेज छिपा रहेगा जब तक सही पासवर्ड न डले */
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .download-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4a90e2;
            color: white;
        }
        tr:nth-child(even) {background-color: #f2f2f2;}
        tr:hover {background-color: #e9f5ff;}
        #loading {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>HSSC Mock Wala - Registered Users</h2>
        
        <div class="header-section">
            <p>Total Users: <span id="userCount" style="font-weight: bold; color: #4a90e2;">0</span></p>
            <button class="download-btn" onclick="downloadCSV()">📥 Download as Excel (CSV)</button>
        </div>

        <p id="loading">Loading data from Firebase...</p>

        <table id="usersTable">
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Full Name</th>
                    <th>Mobile Number</th>
                    <th>Email ID</th>
                    <th>Password</th>
                    <th>Registration Date</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- User data will appear here automatically -->
            </tbody>
        </table>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // ==========================================
        // एडमिन पासवर्ड यहाँ सेट करें (आप अपनी मर्जी का पासवर्ड रख सकते हैं)
        // ==========================================
        const ADMIN_PASSWORD = "Admin@123"; // <-- इस पासवर्ड को आप बदल भी सकते हैं

        // पासवर्ड चेक करने का कोड
        let enteredPassword = prompt("🔒 Enter Admin Password to Access Panel:");
        if (enteredPassword === ADMIN_PASSWORD) {
            document.body.style.display = "block"; // सही पासवर्ड होने पर पेज दिखेगा
        } else {
            alert("❌ Incorrect Password! Access Denied.");
            window.location.href = "index.html"; // गलत पासवर्ड होने पर होम पेज पर भेज देगा
        }

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDAt-Ck6dQwo0EQ8Ila_my9aGt8giLfdV8",
            authDomain: "hssc-mock-test-wala.firebaseapp.com",
            projectId: "hssc-mock-test-wala",
            storageBucket: "hssc-mock-test-wala.firebasestorage.app",
            messagingSenderId: "1082414054403",
            appId: "1:1002414054403:web:de1593aae9a733344e2236",
            measurementId: "G-LGHVK5RYE9"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Fetch Data from Firestore
        db.collection("Users").orderBy("registeredAt", "desc").get().then((querySnapshot) => {
            let tbody = document.getElementById("tableBody");
            let count = 0;
            
            document.getElementById("loading").style.display = "none"; 
            
            querySnapshot.forEach((doc) => {
                count++;
                let data = doc.data();
                
                // Format Date
                let dateStr = "N/A";
                if (data.registeredAt) {
                    let dateObj = data.registeredAt.toDate();
                    dateStr = dateObj.toLocaleDateString("en-IN") + " " + dateObj.toLocaleTimeString("en-IN");
                }

                // Create Row
                let row = `<tr>
                    <td>${count}</td>
                    <td>${data.fullName || '-'}</td>
                    <td>${data.mobileNumber || '-'}</td>
                    <td>${data.email || '-'}</td>
                    <td style="color: #d63031; font-weight: bold;">${data.password || 'Hidden'}</td>
                    <td>${dateStr}</td>
                </tr>`;
                
                tbody.innerHTML += row;
            });
            
            document.getElementById("userCount").innerText = count;
        }).catch((error) => {
            console.error("Error getting users: ", error);
            document.getElementById("loading").innerText = "Error loading data. Check console.";
            document.getElementById("loading").style.color = "red";
        });

        // Function to Download Table as CSV (Excel)
        function downloadCSV() {
            let csv = [];
            let rows = document.querySelectorAll("table tr");
            
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                
                for (let j = 0; j < cols.length; j++) {
                    let text = cols[j].innerText.replace(/"/g, '""'); 
                    row.push('"' + text + '"');
                }
                csv.push(row.join(","));
            }

            let csvFile = new Blob([csv.join("\n")], {type: "text/csv"});
            let downloadLink = document.createElement("a");
            downloadLink.download = "Registered_Users_HSSC.csv";
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
