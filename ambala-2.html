<script>const QUESTIONS=[{"q":"अंबाला जिले की स्थापना/उत्पत्ति के संबंध में जिला प्रशासन किस मान्यता का उल्लेख करता है?","opts":["14वीं शताब्दी में अम्बा राजपूत द्वारा","महाराजा रणजीत सिंह द्वारा","अकबर द्वारा","मौर्य सम्राट अशोक द्वारा"],"a":0,"exp":"जिला प्रशासन के अनुसार एक मान्यता है कि अंबाला की स्थापना 14वीं शताब्दी में अम्बा राजपूत ने की थी। यह ऐतिहासिक मान्यता है, निर्विवाद तिथि नहीं।"},{"q":"अंबाला नाम की उत्पत्ति के संबंध में कौन-सा विकल्प एक प्रचलित मत है?","opts":["पाँच नदियों का नगर","सैनिकों का गाँव","नीले पहाड़ों का नगर","अम्बा वाला/आमों का गाँव"],"a":3,"exp":"एक मत के अनुसार आसपास आम के बाग होने के कारण नाम अम्बा वाला अर्थात आमों का गाँव पड़ा।"},{"q":"अंबाला नाम का एक अन्य संबंध किस देवी के मंदिर से जोड़ा जाता है?","opts":["मनसा देवी","भवानी अम्बा","शाकंभरी देवी","नैना देवी"],"a":1,"exp":"अंबाला शहर के प्राचीन भवानी अम्बा/अम्बिका माता मंदिर से भी नगर के नाम की उत्पत्ति जोड़ी जाती है।"},{"q":"अंबाला क्षेत्र का प्राचीन नाम/पहचान किससे जोड़ी गई है?","opts":["श्रुघ्न/सुघ","अहिच्छत्र","कपिलवस्तु","इंद्रप्रस्थ"],"a":0,"exp":"जिला प्रशासन के इतिहास विवरण में तैत्तिरीय आरण्यक के तुरघ्न और पाणिनि के श्रुघ्न/सुघ संदर्भ का उल्लेख है।"},{"q":"अंबाला क्षेत्र में प्राचीन पत्थर के औजार किस काल से संबंधित बताए गए हैं?","opts":["मुगल काल","मध्यकाल","गुप्त काल","निम्न पुरापाषाण काल"],"a":3,"exp":"जिला इतिहास विवरण में तर्लोकपुर आदि स्थानों से निम्न पुरापाषाण काल के पत्थर के औजार मिलने का उल्लेख है।"},{"q":"अंबाला जिले के इतिहास के अध्ययन/पुरातात्विक अन्वेषण से जुड़े ब्रिटिश कालीन विद्वानों में कौन शामिल थे?","opts":["आर्यभट्ट","ए.सी. कनिंघम","कालिदास","बाणभट्ट"],"a":1,"exp":"जिला प्रशासन के इतिहास पृष्ठ में ए.सी. कनिंघम और सी. रॉजर्स सहित पुरातत्वविदों के अन्वेषण का उल्लेख है।"},{"q":"अंबाला क्षेत्र में मौर्य काल से संबंधित किस प्रकार का साक्ष्य प्रसिद्ध है?","opts":["सांची तोरण","टोपरा अशोक स्तंभ/अभिलेख","कुतुब मीनार","अजंता चित्र"],"a":1,"exp":"टोपरा के अशोक स्तंभ/अभिलेख का संबंध इस क्षेत्र के मौर्यकालीन इतिहास से जोड़ा जाता है।"},{"q":"अंबाला क्षेत्र सातवीं शताब्दी
